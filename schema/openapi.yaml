# SPDX-License-Identifier: LicenseRef-PolyForm-Noncommercial-1.0.0
# Single source of record for the slim-m wire protocol.
#
# What CI actually enforces, so this file is not trusted for more than it is
# worth:
#
# - The route surface. crates/slimm-server/tests/openapi_contract.rs parses the
#   methods and paths axum really serves and fails if either side has one the
#   other does not, so a route cannot be added, removed, or renamed without the
#   matching edit here.
# - Response bodies, against the server that sends them.
#   crates/slimm-server/tests/response_contract/ drives the operationIds below
#   for real and validates the answer against the response schema written here:
#   status code, content type, fields, types, enums and nullability. Both
#   directions fail - a field promised here that the server omits, and a field
#   the server sends that nothing here documents - and an operation the test
#   never drives fails too, so coverage cannot quietly lapse. A few operations
#   are exempt by name in that test's UNCOVERED list, each with its reason;
#   a stale entry there fails in both directions, so the exemptions cannot
#   quietly grow either.
# - The WebSocket frame set, by crates/slimm-server/tests/ws_frame_contract.rs,
#   which compares ServerFrame.oneOf and ClientFrame.oneOf against the frames
#   ws/frames.rs really serialises and accepts and fails on drift in either
#   direction. Frame *bodies* are not checked against a live socket the way
#   response bodies are; connectWebSocket is one of the response contract's
#   exemptions.
# - Additive-only evolution, by the oasdiff breaking-change gate in schema-ci.
# - Valid OpenAPI, by redocly lint.
#
# What it does NOT enforce: REQUEST bodies, and the Dart models in
# client/packages/api. No types are generated from this file; the Rust DTOs and
# the Dart models are both hand-written, and only the Rust side is compared
# against what is written here.
openapi: 3.1.0
info:
  title: slim-m API
  version: 0.82.0 # x-release-please-version
  description: >
    The server surface: liveness, auth with opaque rotating tokens, channel
    management, text messaging with reactions, polls, deletion, and full-text
    search, user profiles and the member list, devices, blocking, report
    intake and triage, invite codes, read state, bundled catch-up sync,
    account deletion, admin-issued password reset, role management and
    channel permission overwrites, presence and typing indicators, and the
    WebSocket event envelope.

    Identity and ordering are separate concerns. A message's identity is a
    client-generated UUIDv7, which also makes sending idempotent; its order is a
    per-channel monotonic `seq` assigned by the server, which is the
    authoritative cursor for pagination and sync.

    Authentication is a bearer access token. Access tokens are short-lived and
    exchanged at `/auth/refresh`, which rotates the refresh token. Opening a
    WebSocket uses a single-use ticket from `/auth/ws-ticket`, because an
    upgrade request cannot reliably carry an Authorization header.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://{host}
    variables:
      host:
        default: localhost:8080

tags:
  - name: system
    description: Liveness, version, and the event socket.
  - name: auth
    description: Registration, sessions, tokens, and account deletion.
  - name: users
    description: Public profiles, the caller's own account, and the member list.
  - name: safety
    description: Devices, blocking, private notes, and report intake.
  - name: moderation
    description: Report triage. Requires MANAGE_MESSAGES.
  - name: roles
    description: >
      Role management and channel permission overwrites. Requires
      MANAGE_ROLES.
  - name: admin
    description: Administrator-only account recovery.
  - name: bots
    description: >
      Provisioning bot accounts. Requires MANAGE_SERVER, and the caller must
      not itself be a bot.
  - name: webhooks
    description: >
      Delivering an incoming webhook post, unauthenticated by anything but
      the token in the URL, and the MANAGE_SERVER admin surface that mints,
      lists, renames and revokes one; see
      docs/decisions/0030-incoming-webhooks.md.
  - name: invites
    description: Creating, listing, checking, and redeeming invite codes.
  - name: channels
    description: Channel listing and creation.
  - name: dms
    description: >
      Direct-message conversations between two users on the same deployment.
      A DM is a channel under the hood, so once opened it is read, sent to,
      searched, and synced through the ordinary channel and message routes.
  - name: messages
    description: Sending, reading, editing, and reacting to messages.
  - name: attachments
    description: >
      Uploading and fetching file attachments. Upload first, then reference
      the returned id when sending a message.
  - name: push
    description: Device push registration and lifecycle reporting.
  - name: sync
    description: Read state and reconnect catch-up.
  - name: presence
    description: >
      Who is online, away, do-not-disturb, or has chosen to appear offline,
      and typing indicators over the WebSocket.
  - name: canvas
    description: >
      The Voice Canvas: reading the objects in a region of a channel's
      canvas, the delta a client receives as it pans, and the ordered op
      stream a client catches up from after a reconnect.

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness probe.
      security: []
      responses:
        "200":
          description: The server is serving and the database answers.
          content:
            text/plain:
              schema:
                type: string
                example: ok
        "503":
          description: The server is not ready.
          content:
            text/plain:
              schema:
                type: string

  /version:
    get:
      operationId: getVersion
      tags: [system]
      summary: Build and wire-protocol version.
      security: []
      responses:
        "200":
          description: Version information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /metrics:
    get:
      operationId: getMetrics
      tags: [system]
      summary: Process and traffic health, as Prometheus text exposition format.
      description: >
        Gated on MANAGE_SERVER, the same bit as `/space/analytics`: this
        discloses traffic volume by class and connection counts, more than
        `/version`'s deployment-wide facts are meant to reveal to an
        unauthenticated caller. Resident memory, a requests-admitted and a
        requests-refused counter per rate-limit class since process start,
        an HTTP request-latency histogram labelled by method and matched
        route template (never a raw path, to keep the label set bounded),
        the SQLite pool's configured, open, and in-use connection counts,
        currently open WebSocket connections, the memory-admission guard's
        own discovered ceiling and usage (both absent when no cgroup limit
        is found) plus a refusal counter, and whether an SFU is configured.
        `slimm_livekit_reachable` is present only when one is: the server's
        own live check of whether LiveKit answers, closing the gap where
        `voice enabled` in `/version` only reports this server's own config.
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account and open a session.
      description: >
        The first account to register on an unclaimed deployment also claims it,
        seeding the @everyone role, an admin role granted to that account, and a
        general channel.


        After that claim, joining is by invitation: `invite_code` is required,
        and is spent in the same transaction that creates the account, so a
        rejected signup neither takes the username nor burns the code. A 400
        with `an invite code is required to join this server` means none was
        sent; `that invite cannot be used` covers expired, spent, revoked, and
        never-existed alike, so registration cannot be used to mine codes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Open a session with a username and password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      description: >
        An account with two-factor authentication on answers 202 with a
        challenge instead of 200 with a token pair: the password was accepted
        and the sign-in is not finished. Complete it at /auth/totp/verify.
        Usernames match in any letter case. Every credential that cannot
        sign in, including one too short or malformed to ever have been
        registered, answers the same 401.
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "202":
          description: >
            The password was accepted and a second factor is still owed. The
            challenge is single-use and short-lived, and it carries the device
            fields from this request, so the follow-up call does not resend
            them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"

  /auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      summary: Exchange a refresh token for a new pair.
      description: >
        Rotation is single-use: the presented token is spent and a new pair
        issued. Replaying a long-spent token is treated as a leak and revokes
        the whole family and its session. A replay moments after a successful
        rotation is treated as the client racing itself and is denied without
        revoking anything.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/ws-ticket:
    post:
      operationId: createWsTicket
      tags: [auth]
      summary: Mint a single-use WebSocket connect ticket.
      responses:
        "200":
          description: A short-lived, single-use ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the calling session.
      description: >
        Revocation is immediate: the session's bearer token stops resolving on
        the next request and any live WebSocket on that session is closed.
      responses:
        "204":
          description: The session was revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /account:
    delete:
      operationId: deleteAccount
      tags: [auth]
      summary: Delete the calling account.
      description: >
        Purges personal data, clears authorship from content left in shared
        channels, frees the username, and revokes every session. Irreversible.
        A session token alone is refused: the body carries the account
        password, and a current code while two-factor is on.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: The account was deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Spend a reset code to set a new password.
      description: >
        Unauthenticated, since the point is recovering an account that cannot
        currently sign in. Single-use, and revokes every live session on the
        account, since the account may be compromised rather than just
        locked out.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetRequest"
      responses:
        "204":
          description: The password was changed and every session revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/totp:
    get:
      operationId: getTotpStatus
      tags: [auth]
      summary: Whether the caller has a second factor, and what this server asks for.
      responses:
        "200":
          description: The caller's own factor state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/totp/enrol:
    post:
      operationId: beginTotpEnrolment
      tags: [auth]
      summary: Start enrolling a TOTP second factor.
      description: >
        Returns a fresh secret once, as text for manual entry and as an
        otpauth URI to render as a QR code. Nothing is enforced yet: the factor
        goes live only once /auth/totp/confirm verifies a code from it, so a
        mis-scanned code or an unsynchronised clock cannot lock anybody out.
        Calling this again replaces an unconfirmed enrolment; an already-enabled
        factor is a 409 and has to be disabled first. Needs the account
        password, so a session token alone cannot turn the factor on.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpEnrolRequest"
      responses:
        "200":
          description: The new secret and its provisioning URI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrolment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/totp/confirm:
    post:
      operationId: confirmTotpEnrolment
      tags: [auth]
      summary: Switch the factor on with a code from the authenticator.
      description: >
        Returns the recovery codes for this factor, once. They are stored
        hashed and are not retrievable later; each is usable once. Needs the
        account password as well as the code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpConfirmRequest"
      responses:
        "200":
          description: The factor is on, and these are its recovery codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpRecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/totp/recovery-codes:
    post:
      operationId: reissueTotpRecoveryCodes
      tags: [auth]
      summary: Replace the recovery codes, against a current code.
      description: >
        The previous set stops working. Accepts either an authenticator code or
        one of the current recovery codes, and spends whichever was presented.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: The new recovery codes, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpRecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/totp/disable:
    post:
      operationId: disableTotp
      tags: [auth]
      summary: Turn the factor off, against a current code or a recovery code.
      description: >
        Live sessions are deliberately left alone: the caller has just proved
        both factors, so signing their other devices out would penalise
        housekeeping. Clearing somebody else's factor (the administrator path)
        does revoke, because it has no such proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "204":
          description: The factor and its recovery codes are gone.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/totp/verify:
    post:
      operationId: verifyTotpChallenge
      tags: [auth]
      summary: Finish a sign-in that /auth/login answered with a challenge.
      description: >
        Unauthenticated, like /auth/reset: the caller has no session yet. The
        code may be an authenticator code or one of the recovery codes; the
        server tries both and spends a recovery code if that is what was
        presented. A wrong code leaves the challenge live so it can be retyped,
        while still counting against the account's failure budget. A code is
        accepted within one 30-second step either side of now, and never twice.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpVerifyRequest"
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"

  /admin/users/{userId}/totp:
    parameters:
      - name: userId
        in: path
        required: true
        description: The account whose second factor is to be cleared.
        schema:
          type: string
          format: uuid
    delete:
      operationId: clearTotpFactor
      tags: [admin]
      summary: Clear a member's second factor. Requires ADMINISTRATOR.
      description: >
        For a member who has lost both their authenticator and their recovery
        codes. Deliberately a separate act from issuing a password reset code,
        which does not touch the factor: one answers "I forgot my password" and
        this answers "I lost my authenticator". It revokes every live session on
        the account and writes a totp_cleared entry to the moderation audit log,
        so it cannot be done quietly.
      responses:
        "204":
          description: The factor is cleared and the account's sessions are revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /admin/users/{userId}/reset-code:
    parameters:
      - name: userId
        in: path
        required: true
        description: The account to issue a reset code for.
        schema:
          type: string
          format: uuid
    post:
      operationId: issueResetCode
      tags: [admin]
      summary: Issue a one-time password reset code. Requires ADMINISTRATOR.
      description: >
        The self-hosted account recovery path chosen in place of email. The
        plaintext code is returned once; only its hash is stored, and it
        expires on its own even if nobody redeems it. Issuing one is written to
        the moderation audit log as `reset_code_issue`.
      responses:
        "200":
          description: The issued code and its expiry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetCodeIssued"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /me:
    get:
      operationId: getMe
      tags: [users]
      summary: The caller's own profile plus their effective base permissions.
      description: >
        Base permissions are the deployment-level set (the @everyone role
        plus every role the caller holds), ignoring any per-channel
        overwrite. A client uses them to decide which actions to show, but
        that is a UI nicety only: every write is re-authorized server-side
        from scratch regardless of what a client chooses to display.
      responses:
        "200":
          description: The caller's profile and base permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update the caller's own display name and/or status line.
      description: >
        Username is not editable here: it backs the live per-account
        uniqueness index, so changing it needs a dedicated flow that can
        handle the resulting collision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Batch-fetch public profiles by id.
      description: >
        An id with nothing live to report (never existed, or deleted) is
        simply absent from the result, so the response may be shorter than
        the request; match by id rather than by position.
      parameters:
        - name: ids
          in: query
          description: Comma-separated user UUIDs. Omit or leave empty for none.
          schema:
            type: string
      responses:
        "200":
          description: Public profiles for the ids that are live.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: The user's UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: getUser
      tags: [users]
      summary: A single public profile.
      description: >
        A deleted or anonymized account answers 404, exactly like an id that
        was never used, so this cannot confirm someone deleted their account.
      responses:
        "200":
          description: The user's public profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /members:
    get:
      operationId: listMembers
      tags: [users]
      summary: The deployment's members, for a member list.
      description: >
        Deployment-wide rather than scoped to a channel, so any authenticated
        caller may read it. Keyset paginated on id (UUIDv7 sorts
        chronologically, so id order is creation order); pass the last id
        seen as `after` for the next page.
      parameters:
        - name: after
          in: query
          description: Return only members with an id greater than this one.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Page size; the server clamps it.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: channel
          in: query
          description: >
            Narrow the page to members who can view this channel, for a member
            list shown beside it. A display filter, not a confidentiality
            boundary - the unfiltered roster stays readable from this route.
            Paging is unchanged: a page shorter than `limit` is still the last.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of members, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /presence:
    get:
      operationId: listPresence
      tags: [presence]
      summary: Batch presence lookup.
      description: >
        Deployment-wide, like the member list: any authenticated caller may
        ask about any user id. A user who set `hidden` reads as `offline`
        here to everyone except themselves; asking about your own id always
        returns your true state. An id with nothing live to report (never
        existed, or deleted) is simply absent from the result, the same
        contract `GET /users` has.
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated user UUIDs, at most 100.
          schema:
            type: string
      responses:
        "200":
          description: Presence for the ids that resolved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PresenceStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: setPresenceVisibility
      tags: [presence]
      summary: Set the caller's visibility preference.
      description: >
        The one persistent piece of presence; everything else (whether a
        socket is actually open) is derived at runtime and never stored.
        Taking effect updates every live viewer over the WebSocket at once,
        not on their next reconnect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetVisibilityRequest"
      responses:
        "200":
          description: The visibility now in effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetVisibilityRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /presence/activity:
    put:
      operationId: setPresenceActivity
      tags: [presence]
      summary: Say what the caller is listening to or playing.
      description: >
        Ephemeral and opt-in on the client: held in memory against the
        caller's live socket, cleared when the last socket closes, never
        stored. It reaches exactly the viewers who can already see the
        caller's presence, through the same rule, so a `hidden` user's
        activity is invisible to everyone else. Title and subtitle are at
        most 128 characters and free of control and direction characters.
        Rate limited more tightly than an ordinary write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceActivity"
      responses:
        "204":
          description: Accepted, or ignored when the caller has no live socket.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: clearPresenceActivity
      tags: [presence]
      summary: Clear the caller's activity.
      description: Idempotent; clearing nothing is still a 204.
      responses:
        "204":
          description: Cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /me/avatar:
    post:
      operationId: uploadAvatar
      tags: [users]
      summary: Upload (or replace) the caller's avatar.
      description: >
        Deliberately not an attachment: one mutable image per user, replaced
        wholesale, not content addressed and not something a channel
        permission gates. Content type is sniffed from the bytes the same
        way an attachment's is, restricted to the allowlist's image entries
        (a document is a valid attachment but not a valid avatar).
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The caller's updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deleteAvatar
      tags: [users]
      summary: Remove the caller's avatar.
      responses:
        "204":
          description: The avatar was removed (or there was none).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users/{userId}/avatar:
    parameters:
      - name: userId
        in: path
        required: true
        description: The user's UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: getAvatar
      tags: [users]
      summary: Fetch a user's avatar bytes.
      description: >
        Gated on authentication only, the same as the rest of a
        `UserProfile`: an avatar is a public profile picture, not a message
        attachment, so no channel permission applies. 404 for a user with no
        avatar set, and for a deleted or anonymized account exactly like
        `getUser`.
      responses:
        "200":
          description: >-
            The avatar's raw bytes, served as the type sniffed from the stored
            bytes rather than anything the uploader claimed.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users/{userId}/note:
    parameters:
      - name: userId
        in: path
        required: true
        description: The note's subject.
        schema:
          type: string
          format: uuid
    get:
      operationId: getUserNote
      tags: [safety]
      summary: The caller's own private note about another account.
      description: >
        Caller-private, always: this can only ever answer for the caller's
        own note, never anyone else's, and a note is never shown to its
        subject or to any other member. There is no moderation surface for
        these.


        A subject with nothing live to answer for - never registered, since
        deleted, or anonymized - refuses exactly like one the caller has
        simply never left a note about, per decision 0011's masking rule, so
        this can never confirm whether a subject id names a real,
        currently-visible account. Refuses the same way for the caller's own
        id: there is no note about yourself.
      responses:
        "200":
          description: >-
            The caller's note, or a body of all nulls if they have not left
            one about this subject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      operationId: putUserNote
      tags: [safety]
      summary: Set or clear the caller's private note about another account.
      description: >
        An empty or whitespace-only body clears the note rather than storing
        a blank one, the same convention the caller's own status text
        follows. Masked identically to `getUserNote` for a subject with
        nothing live to answer for, and refused the same way for the
        caller's own id.


        Survives the subject being renamed, since it keys on their id; purged
        only when the author's own account is deleted, never the subject's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  description: At most 500 characters after trimming.
      responses:
        "200":
          description: The note as stored, after trimming and the empty-clears rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /devices:
    get:
      operationId: listDevices
      tags: [safety]
      summary: List the caller's own signed-in devices.
      responses:
        "200":
          description: The caller's devices, including which one is the current session.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        description: The device's UUID.
        schema:
          type: string
          format: uuid
    delete:
      operationId: removeDevice
      tags: [safety]
      summary: Sign a device out.
      description: >
        Only ever the caller's own device: a device id on someone else's
        account is reported as missing, so this cannot be used to probe for or
        evict others. Closes any live WebSocket on the revoked sessions.
      responses:
        "204":
          description: The device was signed out.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /blocks:
    get:
      operationId: listBlocks
      tags: [safety]
      summary: List the users the caller has blocked.
      responses:
        "200":
          description: User ids the caller has blocked.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /blocks/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: The blocked (or to-be-blocked) user's UUID.
        schema:
          type: string
          format: uuid
    post:
      operationId: blockUser
      tags: [safety]
      summary: Block a user.
      description: >
        Idempotent, and silent by design: the blocked user is never notified,
        because telling them turns blocking into a provocation.
      responses:
        "204":
          description: The user is blocked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: unblockUser
      tags: [safety]
      summary: Unblock a user.
      responses:
        "204":
          description: The user is no longer blocked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /reports:
    get:
      operationId: listOpenReports
      tags: [moderation]
      summary: One page of the open moderation queue, oldest first. Requires MANAGE_MESSAGES.
      description: >
        Carries each report's content snapshot, so this must never answer to
        anyone below the MANAGE_MESSAGES bar.


        Bounded, and paged forward on `created_at`. Visibility is re-checked per
        channel after the page is read, so a page can come back holding fewer
        entries than `limit`, or none, while more remain: keep paging while a
        full page arrives rather than stopping at the first short one.
      parameters:
        - name: after
          in: query
          description: Return only reports filed strictly after this `created_at`.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          description: Page size, 50 when omitted; the server clamps it into 1..200 rather than rejecting it.
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: One page of open reports.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: fileReport
      tags: [safety]
      summary: File a report on a message or a user for human review.
      description: >
        Nothing here inspects content automatically; a person decides.
        Reporting a message requires being able to see it, so this cannot be
        used to confirm a message exists in a channel the caller cannot read.
        Idempotent by the optional client-supplied `id`: a retry with the same
        id from the same reporter about the same subject returns the report
        already filed. You cannot report yourself or your own message; both
        are 400. The same id naming a different reporter or subject is a
        conflict, as is a second open report about the same subject under any
        id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "200":
          description: The report was filed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportFiled"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /reports/history:
    get:
      operationId: moderationHistory
      tags: [moderation]
      summary: >
        One page of the moderation-history feed: resolved reports and
        moderation_audit_log entries, newest first. Requires
        MANAGE_MESSAGES or VIEW_MODERATION_HISTORY.
      description: >
        Resolved reports and audit-log entries (a removal, a restore, a
        timeout, a timeout lift, a bulk message delete, or a bot lifecycle
        act) merged into one time-ordered feed. An open (unresolved) report
        never appears here; see `listOpenReports` for those.


        A resolved report still carries the reported content snapshot, so
        the resolved-report side of the feed is filtered per channel exactly
        as `listOpenReports` filters the open queue, for a caller admitted by
        MANAGE_MESSAGES. An audit-log entry has no channel at all - member
        moderation is deployment-wide - so nothing is filtered from that side
        beyond the route's own gate.


        A caller admitted only by VIEW_MODERATION_HISTORY (a read-only bit
        with none of MANAGE_MESSAGES's power to act on a report or delete a
        message) skips the per-channel filter on the resolved-report side
        entirely: that filter is keyed to MANAGE_MESSAGES, and a caller
        holding only the read-only bit would otherwise see almost nothing.
        See the server's own doc on `Permissions::VIEW_MODERATION_HISTORY`
        and docs/decisions/0028-bot-accounts.md.


        Paged backward from `after` by event time (a resolved report's
        `resolved_at`, an audit entry's `created_at`), newest first.
        `after`, `after_kind` and `after_id` go together or not at all:
        `after_kind` is `resolved_report` or `audit_log`, matching the
        `kind` of the last item on the previous page, and `after_id` is that
        item's own id (a UUID for a resolved report, an integer for an
        audit-log entry's row id). Building the next page's cursor from the
        last item's own `kind`/`id`/event-time fields is the intended use.
      parameters:
        - name: after
          in: query
          description: >
            The event time (`resolved_at` or `created_at`) of the last item
            already held, exclusive. Goes with `after_kind` and `after_id`.
          schema:
            type: integer
            format: int64
        - name: after_kind
          in: query
          description: Which kind `after_id` is. Goes with `after` and `after_id`.
          schema:
            type: string
            enum: [resolved_report, audit_log]
        - name: after_id
          in: query
          description: >
            The last item's own id: a UUID for `resolved_report`, an integer
            for `audit_log`. Goes with `after` and `after_kind`.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size, 50 when omitted; the server clamps it into 1..200 rather than rejecting it.
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: One page of the merged moderation-history feed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModerationHistoryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /reports/{reportId}:
    parameters:
      - name: reportId
        in: path
        required: true
        description: The report's UUID.
        schema:
          type: string
          format: uuid
    patch:
      operationId: resolveReport
      tags: [moderation]
      summary: Resolve or dismiss a report. Requires MANAGE_MESSAGES.
      description: >
        The close is a conditional update, so two moderators racing the same
        report cannot both win it. A report that is already resolved or
        dismissed answers 409; one that never existed answers 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveReportRequest"
      responses:
        "204":
          description: The report was closed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /reports/mine/{reportId}:
    parameters:
      - name: reportId
        in: path
        required: true
        description: The report's UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: myReportStatus
      tags: [safety]
      summary: A reporter's own view of a report they filed - whether it is still open.
      description: >
        Scoped hard to reports the caller themselves filed: the query itself
        filters on the caller's own id, not a check applied after the row is
        fetched. A report id that exists but was filed by someone else
        answers identically to one that never existed at all - both a plain
        404 - per docs/decisions/0011-per-channel-permissions.md's
        status-code masking rule.


        Carries only what the reporter already gave when they filed it (what
        they reported, and when) plus whether it has since been closed.
        Nothing about which moderator looked at it, what action was taken, or
        any other reporter's report is ever in this response; see
        `listOpenReports` and `moderationHistory` for that, both gated on
        MANAGE_MESSAGES.
      responses:
        "200":
          description: The reporter's own view of the report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyReportStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /invites:
    get:
      operationId: listInvites
      tags: [invites]
      summary: List every invite. Requires CREATE_INVITE.
      responses:
        "200":
          description: All invites.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createInvite
      tags: [invites]
      summary: Create an invite. Requires CREATE_INVITE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "200":
          description: The created invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /invites/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: The invite code.
        schema:
          type: string
    delete:
      operationId: revokeInvite
      tags: [invites]
      summary: Revoke an invite. Requires CREATE_INVITE.
      description: >
        An unknown code, and a code the caller may not revoke, both answer 404,
        so the route cannot be used to probe for codes. Revoking an invite of
        the caller's own that is already revoked answers 204.
      responses:
        "204":
          description: The invite was revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /invites/{code}/check:
    parameters:
      - name: code
        in: path
        required: true
        description: The invite code.
        schema:
          type: string
    get:
      operationId: checkInvite
      tags: [invites]
      summary: Check whether an invite code is usable, before signing up.
      description: >
        Unauthenticated, since the caller does not have an account yet, and
        rate limited because of that. An unusable code answers with exactly
        `{"usable": false}`, byte for byte identical whether the code is
        expired, already spent, revoked, or was never issued at all: this
        cannot be used to mine valid codes. A usable code additionally
        discloses community metadata (name, member count, who invited the
        caller, uses remaining, and expiry). That is a deliberate, narrower
        guarantee than the endpoint used to make: reaching the usable branch
        already proves the caller holds a working code, so it discloses
        nothing they had not already demonstrated.
      security: []
      responses:
        "200":
          description: Whether the code can be redeemed right now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInviteResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /invites/{code}/redeem:
    parameters:
      - name: code
        in: path
        required: true
        description: The invite code.
        schema:
          type: string
    post:
      operationId: redeemInvite
      tags: [invites]
      summary: Redeem an invite for the calling account.
      responses:
        "204":
          description: The invite was redeemed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: List the channels the caller can view.
      description: >
        A plain array, unchanged since before channel categories: the wire is
        additive-only, and a live deployment auto-updating from `latest`
        while its phones update on their own TestFlight/Play schedule means
        reshaping this response would break every client that has not
        updated yet. `category_id` is a new field on each channel (additive);
        the category list itself is `listCategories` instead.
      responses:
        "200":
          description: The visible channels.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createChannel
      tags: [channels]
      summary: Create a channel.
      description: >
        Requires the MANAGE_CHANNELS permission, and, only when `restricted`
        is set, MANAGE_ROLES as well - see `restricted` on
        `CreateChannelRequest`. Idempotent by the optional client-supplied
        `id`: a retry with the same id returns the channel already stored
        under it. `channels` also holds DM channels and threads under the
        same id namespace, so an id already used by either is a conflict
        rather than a wrong-typed 200. The id of a channel that has since been
        deleted is a conflict too: it is not a retry, and nothing is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "200":
          description: The created channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    patch:
      operationId: updateChannel
      tags: [channels]
      summary: Rename a channel and/or replace its topic.
      description: >
        Requires MANAGE_CHANNELS at the deployment level, the same check
        `createChannel` uses - the topic half of this route is gated
        identically, not a separate permission. Checked at the deployment
        level rather than per-channel so it stays well defined for a channel
        that is being (or has been) deleted; a caller without
        MANAGE_CHANNELS anywhere cannot tell a real channel id from a fake
        one either way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRequest"
      responses:
        "200":
          description: The updated channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deleteChannel
      tags: [channels]
      summary: Soft-delete a channel.
      description: >
        Requires MANAGE_CHANNELS at the deployment level. Refuses to delete
        the deployment's last live channel, since a deployment with zero
        channels has nowhere for anyone to land. Deleting an
        already-deleted channel is not an error; a channel id that was
        never real is a 404.
      responses:
        "204":
          description: The channel was deleted (or was already gone).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/permissions:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: getChannelPermissions
      tags: [channels]
      summary: The caller's effective permission bitmask in this one channel.
      description: >
        The per-channel sibling of `Me.permissions`: calls the same
        evaluator `permissions_in_channel` does, so a thread resolves to its
        parent, a DM answers through the DM-specific rule, and a timeout is
        already subtracted. Masked to an all-zero bitmask whenever the
        caller lacks VIEW_CHANNEL, so a channel the caller cannot view
        answers exactly like one that does not exist - see
        `docs/decisions/0011-per-channel-permissions.md` for why a raw
        pass-through would leak channel existence. There is accordingly no
        403 or 404 here: an unreachable channel is a 200 of all zeros, the
        same "refuse identically" precedent `setOverwrite` already
        documents for this API.
      responses:
        "200":
          description: The caller's effective bitmask in this channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelPermissions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/bot-commands:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: listChannelBotCommands
      tags: [channels]
      summary: Bot commands the caller may currently be offered in this channel.
      description: >-
        The composer's own discovery list, across every bot: a command is
        listed only while its bot's token is live and it is still a member of
        the Space (so a revoked or Space-removed bot's commands vanish here
        immediately, with no separate cleanup step) and the bot itself
        currently holds VIEW_CHANNEL in this channel - a bot with no access to
        a channel never advertises itself there. A command that declares a
        `permission` is left out on its own, not the whole bot, when the
        caller lacks that bit here; this is a composer hint only, never
        enforced against the plain message a bot goes on to receive. Masked
        to an empty list whenever the caller itself lacks VIEW_CHANNEL, the
        same "refuse identically" rule `getChannelPermissions` documents, so
        this can never become a channel-existence oracle.
      responses:
        "200":
          description: The bot commands currently on offer here, possibly empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelBotCommand"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/thread-parent:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: getThreadParent
      tags: [channels]
      summary: Whether this channel is a thread, and if so, what it hangs off.
      description: >
        A thread panel opened cold - a deep link, a reload, or a
        notification - never appears in `listChannels`/`listDirectMessages`
        and so never learns its own parent channel or the message it hangs
        off any other way. This is that lookup, keyed only on the thread's
        own channel id. `parent_channel_id`, `parent_channel_name` and
        `parent_message_id` answer together: either all three are set, or
        all three are null, whenever `channelId` does not exist, is not a
        thread, or the caller lacks VIEW_CHANNEL there (which already
        resolves through the thread-to-parent rule) - the same masking
        `getChannelPermissions` uses, so this cannot become a second
        channel-existence oracle. There is accordingly no 403 or 404 here.
        The remaining fields describe the parent message itself and are
        null (with `parent_deleted: false`) alongside the same masking, or
        once it exists, `parent_content` is null and `parent_deleted` is
        true exactly when the parent has been soft-deleted - the thread
        itself stays open either way.
      responses:
        "200":
          description: The thread's parent, or all-null if this is not one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadParent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/threads:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: listThreads
      tags: [channels]
      summary: Every live thread hanging off a message in this channel.
      description: >
        Before this, the only way to find a thread was from the message it
        hangs off (`Message.thread_channel_id`). Newest activity first: a
        thread with a reply sorts on that reply, one with none yet sorts on
        when it was opened. Each row carries the parent message's own
        content and author, so a listing can show what a thread is about
        without a second fetch, and how many of the thread's own messages
        the caller has not yet read.


        Requires only VIEW_CHANNEL on `channelId`, checked once: a thread's
        visibility always resolves to its parent's, the same rule
        `getChannelPermissions` and every other channel-scoped check in this
        API already applies, so a caller who can view the parent can see
        every thread it lists and one who cannot gets the same 403
        `listMessages` would give for the same channel.


        A channel holds at most 500 live threads, refused at `openThread`
        rather than paged at this read, the same shape `listPinnedMessages`
        already uses for its own 200-pin ceiling.
      responses:
        "200":
          description: The channel's live threads, newest activity first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ThreadListItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/order:
    put:
      operationId: reorderChannels
      tags: [channels]
      summary: Set the deployment's channel order, and optionally its category placement.
      description: >
        Requires MANAGE_CHANNELS at the deployment level, the same check
        `createChannel` uses. Deployment-wide, not a per-device preference:
        one deployment is one community, and everyone seeing the same order
        is the point. Takes exactly one of `channel_ids` (the flat,
        pre-category shape: reorders positions and leaves every channel's
        `category_id` untouched) or `categories` (the whole rail grouped by
        category, applied atomically - a channel of any kind may be placed
        in any category, since a category only decides placement, never
        behaviour). Sending neither, or both, is a 400. The channel ids
        named - flattened, for the grouped shape - must add up to exactly
        the live, non-DM, non-thread channels - no more, no fewer, no
        repeats - and every named category id must be a live category, or
        the request is refused with a 400 naming what was wrong; a partial
        list is never applied. Submitting the arrangement already in effect
        is not an error and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderChannelsRequest"
      responses:
        "200":
          description: Every live, non-DM channel, in its new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /categories:
    get:
      operationId: listCategories
      tags: [channels]
      summary: List every live channel category.
      description: >
        Unfiltered by any permission: a category carries none of its own
        (see docs/IMPLIED-GAPS.md), so its name and position are not
        privileged for any authenticated caller. Split out of
        `listChannels`'s own response, which used to embed this list until
        that reshaped an existing response the wire's additive-only rule
        does not allow; a new route is additive.
      responses:
        "200":
          description: Every live category.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelCategory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createCategory
      tags: [channels]
      summary: Create a channel category.
      description: >
        Requires MANAGE_CHANNELS at the deployment level, the same check
        `createChannel` uses. Appended after every live category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "200":
          description: The created category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelCategory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateCategory
      tags: [channels]
      summary: Rename and/or reposition a category.
      description: >
        Requires MANAGE_CHANNELS at the deployment level, the same check
        `updateChannel` uses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: The updated category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelCategory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deleteCategory
      tags: [channels]
      summary: Soft-delete a category.
      description: >
        Requires MANAGE_CHANNELS at the deployment level. Its channels are
        never deleted with it - they fall back to uncategorised. Deleting an
        already-deleted category is not an error.
      responses:
        "204":
          description: The category was deleted (or was already gone).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /dms:
    get:
      operationId: listDirectMessages
      tags: [dms]
      summary: List the caller's direct-message conversations.
      description: >
        Each entry is a DM channel: its id (used with the ordinary
        `/channels/{channelId}/messages`, search, and `/sync` routes exactly
        like any other channel), the other participant's public profile, and
        the caller's unread count in it. Most recently active first.
      responses:
        "200":
          description: The caller's DM conversations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DmConversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /dms/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: >
          The other participant's UUID, or the caller's own to open their
          personal space.
        schema:
          type: string
          format: uuid
    post:
      operationId: openDirectMessage
      tags: [dms]
      summary: Open (or return) the DM channel with another user, or yourself.
      description: >
        Idempotent and race-safe: opening the same pair twice, even
        concurrently, converges on one channel. Membership of the pair is the
        only thing that grants access to it; the deployment's role and
        channel-overwrite system, ADMINISTRATOR included, does not apply.
        Refused if either party has blocked the other (both directions
        checked), or if the target does not exist. Passing the caller's own
        id opens their personal space instead of being refused.
      responses:
        "200":
          description: The DM conversation, existing or newly opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmConversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: hideDirectMessage
      tags: [dms]
      summary: Close a DM out of the caller's own sidebar.
      description: >
        A per-viewer hide, never a delete: no message is touched, and the
        other participant's own list is unaffected. Reversed automatically -
        the conversation reappears once the other person sends something
        new, and re-opening or re-messaging them (`POST` this same route)
        also brings it back right away. Independent of mute and of blocking.
        Idempotent, and a no-op rather than a 404 if the pair has no DM
        channel yet: that already means it is not in the caller's list.
      responses:
        "204":
          description: The DM is no longer in the caller's list.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List every role. Requires MANAGE_ROLES.
      responses:
        "200":
          description: All roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a role. Requires MANAGE_ROLES.
      description: >
        The requested permissions must already be a subset of the caller's
        own effective permissions, or this is refused: MANAGE_ROLES alone is
        never enough to hand out a permission the caller does not hold.
        Never creates `@everyone`; that role is seeded once, by bootstrap.
        Idempotent by the optional client-supplied `id`: a retry with the
        same id returns the role already stored under it. An id already used
        by the `@everyone` role is a conflict rather than a wrong-typed 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "200":
          description: The created role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /roles/reorder:
    patch:
      operationId: reorderRoles
      tags: [roles]
      summary: Set the deployment's role order. Requires MANAGE_ROLES.
      description: >
        `role_ids` must name exactly the live non-`@everyone` roles, top to
        bottom - no id missing, repeated, unknown, or naming `@everyone`
        itself, which never reorders. The first id gets the highest
        position and the last gets 1, so a reordered role always outranks
        `@everyone`'s bootstrap default of 0.


        A second guard beyond MANAGE_ROLES: a caller may only touch a role
        whose old or new position sits strictly below the highest position
        among roles they themselves hold - the position-hierarchy sibling of
        the bit-based escalation check every other role route already
        applies. An administrator bypasses it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRolesRequest"
      responses:
        "200":
          description: Every role, in its new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /roles/{roleId}:
    parameters:
      - name: roleId
        in: path
        required: true
        description: The role's UUID.
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateRole
      tags: [roles]
      summary: Rename a role or change its permissions. Requires MANAGE_ROLES.
      description: >
        Both fields are optional; a field left out is unchanged. A
        permissions change is checked the same way `createRole` checks one,
        and is refused if it would leave the deployment with no
        administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: The updated role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deleteRole
      tags: [roles]
      summary: Delete a role. Requires MANAGE_ROLES.
      description: >
        Refuses to delete `@everyone` (exactly one always exists) and refuses
        if this role is the deployment's only remaining source of
        ADMINISTRATOR.
      responses:
        "204":
          description: The role was deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /roles/module-permissions:
    get:
      operationId: listModulePermissions
      tags: [roles]
      summary: >
        List every module-scoped permission any installed module currently
        declares. Requires MANAGE_ROLES.
      description: >
        The dynamic half of the permission model (docs/decisions/0021): the
        grantable rows a role editor lists alongside core permissions,
        namespaced by `module_id`.
      responses:
        "200":
          description: The catalog of grantable module permissions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModulePermission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /roles/{roleId}/module-permissions:
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listRoleModulePermissions
      tags: [roles]
      summary: List the module permissions a role currently holds. Requires MANAGE_ROLES.
      responses:
        "200":
          description: The role's module-permission grants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GrantedModulePermission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /roles/{roleId}/module-permissions/{moduleId}/{permKey}:
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: moduleId
        in: path
        required: true
        schema:
          type: string
      - name: permKey
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: grantModulePermission
      tags: [roles]
      summary: Grant a module permission to a role. Requires MANAGE_ROLES.
      description: >
        Idempotent. Refused with 404 if no installed module currently
        declares `(moduleId, permKey)`.
      responses:
        "204":
          description: The role now holds the permission.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: revokeModulePermission
      tags: [roles]
      summary: Revoke a module permission from a role. Requires MANAGE_ROLES.
      description: Idempotent - revoking one not held still succeeds.
      responses:
        "204":
          description: The role no longer holds the permission.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /members/{userId}/roles/{roleId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: The member's UUID.
        schema:
          type: string
          format: uuid
      - name: roleId
        in: path
        required: true
        description: The role's UUID.
        schema:
          type: string
          format: uuid
    put:
      operationId: assignRole
      tags: [roles]
      summary: Grant a role to a member. Requires MANAGE_ROLES.
      description: >
        Idempotent: granting a role the member already holds changes nothing
        and publishes nothing. Refused if the role carries a permission the
        caller does not themselves hold, since granting a role is granting
        whatever it carries. A bot is a role holder like any other, ADMINISTRATOR
        included; see docs/decisions/0028-bot-accounts.md.
      responses:
        "204":
          description: The role is assigned.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: unassignRole
      tags: [roles]
      summary: Revoke a role from a member. Requires MANAGE_ROLES.
      description: >
        Idempotent: revoking a role the member does not hold changes nothing
        and publishes nothing. Refused if it would leave the deployment with no
        administrator.
      responses:
        "204":
          description: The role is no longer assigned (or never was).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /members/bulk-removal:
    post:
      operationId: bulkRemoveMembers
      tags: [members]
      summary: Remove several members in one act.
      description: >
        Requires BAN_MEMBERS, and refuses any target whose granted permissions
        the caller's do not contain - the same containment `removeMember`
        applies, checked once per target before anything is written. Nothing is
        removed unless every target passes, so a refused batch leaves the
        deployment untouched; that includes the refusal to remove the last
        administrator, which rolls the whole batch back. Repeated ids collapse
        to one act with one audit row. Each removal publishes its own
        `member.removed`, and every session it revoked its own
        `session.revoked`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  description: >
                    The members to remove. At most 64, sized against the
                    WebSocket fan-out a removal causes rather than against
                    politeness - see MAX_BULK_MEMBER_IDS.
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 64
                reason:
                  type: string
                  description: >
                    Recorded against every member in the batch. Control and
                    invisible characters are refused, as for every reason;
                    line breaks and tabs are ordinary text.
      responses:
        "204":
          description: Every named member has been removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /members/bulk-timeout:
    post:
      operationId: bulkTimeoutMembers
      tags: [members]
      summary: Time several members out in one act.
      description: >
        Requires KICK_MEMBERS, with the same per-target containment as
        `timeoutMember`. The deadline is computed once for the batch, so every
        member in it comes back at the same moment. Replaces any timeout
        already in force on a named member, as the single verb does. Nothing is
        applied unless every target passes; an id that is not a member answers
        404 for the whole batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids, duration_seconds]
              properties:
                user_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 64
                duration_seconds:
                  type: integer
                  format: int64
                  minimum: 1
                  description: >
                    From now. The deadline is computed server-side, so a skewed
                    client clock cannot ask for one already past. At most 28
                    days (2,419,200 seconds); more answers 400.
                reason:
                  type: string
      responses:
        "204":
          description: Every named member is timed out.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /members/removed:
    get:
      operationId: listRemovedMembers
      tags: [moderation]
      summary: Every member removed from the Space. Requires BAN_MEMBERS.
      description: >
        The only place a removed member is still nameable: `GET /members`
        drops them, which is the point of a removal.
      responses:
        "200":
          description: The removals in force, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpaceRemoval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /members/{userId}/nickname:
    parameters:
      - name: userId
        in: path
        required: true
        description: The member's or bot's UUID.
        schema:
          type: string
          format: uuid
    put:
      operationId: setMemberNickname
      tags: [moderation]
      summary: Give a member or bot a space-local name. Requires KICK_MEMBERS.
      description: >
        Every reader then sees the nickname as the account's `display_name`;
        the account keeps its own name (`account_display_name`) and still sees
        it in its own profile. Replaces any nickname already set. Refused on
        yourself, on an account whose granted permissions the caller's own do
        not contain, and for a blank, hidden-character or over-64-character
        name. Audited as nickname_set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname:
                  type: string
      responses:
        "204":
          description: The nickname is in force.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: clearMemberNickname
      tags: [moderation]
      summary: Remove a space-local name. Requires KICK_MEMBERS.
      description: >
        Idempotent. The account's own name shows again. Audited as
        nickname_clear when there was one to remove.
      responses:
        "204":
          description: No nickname is in force.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /members/{userId}/timeout:
    parameters:
      - name: userId
        in: path
        required: true
        description: The member's UUID.
        schema:
          type: string
          format: uuid
    put:
      operationId: timeOutMember
      tags: [moderation]
      summary: Time a member out. Requires KICK_MEMBERS.
      description: >
        A timeout takes away sending, reacting, attaching, and joining or
        speaking in voice, and takes away nothing else: the member keeps
        reading. It lapses on its own at `until` with nothing needing to run.
        Re-issuing replaces any timeout already in force, which is also how
        one is shortened. Refused on yourself, and on a member whose granted
        permissions the caller's own do not contain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duration_seconds]
              properties:
                duration_seconds:
                  type: integer
                  format: int64
                  description: >
                    How long from now. The deadline is computed server-side,
                    so a skewed client clock cannot ask for one already past.
                    At most 28 days; past that the honest tool is a removal.
                reason:
                  type: string
                  nullable: true
      responses:
        "200":
          description: The timeout is in force.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, until]
                properties:
                  user_id:
                    type: string
                    format: uuid
                  until:
                    type: integer
                    format: int64
                    description: Unix milliseconds.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: liftMemberTimeout
      tags: [moderation]
      summary: Lift a member's timeout. Requires KICK_MEMBERS.
      description: >
        Idempotent: lifting a timeout that already expired, or one that never
        existed, still leaves the member able to speak, which is what was
        asked for.
      responses:
        "204":
          description: The member is no longer timed out.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /members/{userId}/account:
    parameters:
      - name: userId
        in: path
        required: true
        description: The member's UUID.
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteMemberAccount
      tags: [moderation]
      summary: Delete a member's account outright. Requires ADMINISTRATOR.
      description: >
        Written to the moderation audit log as `account_delete`. Does to
        somebody else's account exactly what `deleteAccount` does to
        your own: purges their personal data, anonymizes what they wrote,
        tombstones the user, revokes every session, and frees the username
        for reuse.

        ADMINISTRATOR rather than BAN_MEMBERS, deliberately. A removal takes
        access away and `restoreMember` undoes it; nothing undoes this, so
        the two are not the same power and do not share a permission.

        A removed member stops being listed by `listRemovedMembers` once
        deleted, because that list skips tombstoned users. The removal row
        itself is kept, so the moderation record outlives the account.

        Refused on yourself - delete your own account with `deleteAccount`,
        so that an administrator can leave without needing another one to do
        it for them - and on the last administrator. An account that is
        already deleted, or never existed, answers 404.
      responses:
        "204":
          description: The account is deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /members/{userId}/removal:
    parameters:
      - name: userId
        in: path
        required: true
        description: The member's UUID.
        schema:
          type: string
          format: uuid
    put:
      operationId: removeMember
      tags: [moderation]
      summary: Remove a member from the Space. Requires BAN_MEMBERS.
      description: >
        Revokes every live session, refuses future sign-in, revokes invites
        they created, and drops them from the member list. Everything they
        wrote stays, still attributed to them: anonymizing content is what
        deleting an account does, and this is deliberately not that.

        Durable rather than a one-off session revocation, because signing in
        again would otherwise undo it. It is therefore a ban in behaviour,
        and it does not stop the same person registering a fresh account on
        a Space whose join policy is open.

        Refused on yourself, on a member whose granted permissions the
        caller's own do not contain, and on the last administrator.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  nullable: true
      responses:
        "204":
          description: The member is removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: restoreMember
      tags: [moderation]
      summary: Let a removed member back in. Requires BAN_MEMBERS.
      description: >
        Restores the right to sign in. Their sessions stay revoked, so every
        device signs in again rather than resuming.
      responses:
        "204":
          description: The member may sign in again.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/overwrites:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: getChannelOverwrites
      tags: [roles]
      summary: List every permission overwrite set on a channel.
      description: >
        The read a blind editor never had: the current allow/deny pair for
        every role and member overwritten on this channel, so a change can see
        what it is replacing rather than silently re-granting a deliberate
        denial. Requires MANAGE_ROLES in this channel specifically - the same
        gate setChannelOverwrite uses - and refuses a channel the caller
        cannot manage identically to one that does not exist.
      responses:
        "200":
          description: The channel's overwrites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelOverwrites"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      operationId: batchSetChannelOverwrites
      tags: [roles]
      summary: Apply several channel permission overwrites in one request.
      description: >
        The permissions grid's save: several targets' allow/deny pairs
        applied atomically, rather than one setChannelOverwrite call per
        changed column. Every entry is checked the same way setChannelOverwrite
        checks its one - unknown bits, target existence, and the escalation
        math on what the write actually grants - before any of them writes,
        so one entry failing refuses the whole request rather than partially
        applying it. An entry that allows and denies the same bit, and a
        request that names one role or member twice, are refused with 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchSetOverwritesRequest"
      responses:
        "200":
          description: Every overwrite now set on the channel, after the batch applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelOverwrites"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/overwrites/{kind}/{id}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
      - name: kind
        in: path
        required: true
        description: Which kind of target `id` names.
        schema:
          type: string
          enum: [role, member]
      - name: id
        in: path
        required: true
        description: The role's or member's UUID, matching `kind`.
        schema:
          type: string
          format: uuid
    put:
      operationId: setChannelOverwrite
      tags: [roles]
      summary: Set (or replace) a channel permission overwrite.
      description: >
        Requires MANAGE_ROLES in this channel specifically, evaluated the
        same way any other channel permission is: a channel overwrite can
        itself grant or deny MANAGE_ROLES there. `allow` is checked against
        the caller's own effective permissions in this channel and refused
        if it would force on a bit the caller does not hold; `deny` is a
        restriction, not a grant, and carries no such check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOverwriteRequest"
      responses:
        "204":
          description: The overwrite was stored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deleteChannelOverwrite
      tags: [roles]
      summary: Clear a channel permission overwrite.
      description: >
        Requires MANAGE_ROLES in this channel. Idempotent: clearing one that
        was never set still succeeds.
      responses:
        "204":
          description: The overwrite is cleared (or never existed).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/messages:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: listMessages
      tags: [messages]
      summary: Read a channel's history, newest first.
      description: >
        Keyset paginated on `seq`. Pass the smallest `seq` already seen as
        `before` to page backwards.
      parameters:
        - name: before
          in: query
          description: Return only messages with a `seq` strictly below this.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          description: Page size; the server clamps it.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of messages, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message.
      description: >
        Idempotent by the client-supplied `id` within its channel and author, so
        a retry after an uncertain failure never duplicates. A retry replays
        the message first stored under that id verbatim, whatever body the
        retry carried, so never vary the body between attempts. Reusing an id
        from a different channel or author is a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: The stored message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
      - name: messageId
        in: path
        required: true
        description: The message's UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: getMessage
      tags: [messages]
      summary: Fetch one message.
      description: >-
        The same enriched shape `listMessages` returns for a page - embeds,
        attachments, reactions, thread info - just over a single id, for a
        caller that only saw a reaction or a reply for a message it never
        cached. Authorized like listing this channel, but answers 404 rather
        than 403 when the caller cannot view it: naming one specific id makes
        a 403 an existence oracle in a way a page listing never is, so
        `no such channel`, `not permitted here` and `no such message` all
        answer identically.
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: editMessage
      tags: [messages]
      summary: Edit a message.
      description: Allowed for the author, or a member with MANAGE_MESSAGES.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditMessageRequest"
      responses:
        "200":
          description: The updated message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deleteMessage
      tags: [messages]
      summary: Soft-delete a message.
      description: >
        Allowed for the author, or a member with MANAGE_MESSAGES. Deleting an
        already-deleted message is not an error. Live connections are told
        over the WebSocket (`message.deleted`) so they can drop it from view.
      responses:
        "204":
          description: The message was deleted (or was already gone).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/messages/{messageId}/history:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
      - name: messageId
        in: path
        required: true
        description: The message's UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: getMessageHistory
      tags: [messages]
      summary: A message's edit history.
      description: >
        Every version the message has held, oldest first, ending with its
        current content. Gated on VIEW_CHANNEL, the same as reading the
        message; a message that does not exist, is not in this channel, or is
        deleted answers 404. A never-edited message returns a single element,
        its original content.
      responses:
        "200":
          description: The message's versions, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [content, at]
                  properties:
                    content:
                      type: string
                      description: This version's message content.
                    at:
                      type: integer
                      format: int64
                      description: >-
                        Unix milliseconds when this version became the message's
                        content: the message's created_at for the original, and
                        the edit time for each later one.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/messages/bulk-delete:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: bulkDeleteMessages
      tags: [messages]
      summary: Soft-delete several messages in one act.
      description: >
        Requires MANAGE_MESSAGES in the channel, and reaches every message
        there including an administrator's - the same reach `deleteMessage`
        has, and deliberately not a ranked one (see decision 0016). Ids already
        deleted are not an error and are simply skipped. Nothing is deleted
        unless every id resolves and passes, so a refused batch leaves the
        channel untouched. Each message actually deleted publishes its own
        `message.deleted` over the WebSocket, one per message rather than one
        per batch, because clients apply the op stream strictly in sequence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_ids]
              properties:
                message_ids:
                  type: array
                  description: >
                    The messages to delete, all in this channel. At most 64 -
                    the same bound the canvas uses for ids in one op, chosen
                    against the WebSocket frame ceiling and the op-stream gap
                    past which a catching-up client is told to reset instead.
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 64
      responses:
        "204":
          description: Every id that was still live has been deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/messages/bulk-delete-by-author:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: bulkDeleteMessagesByAuthor
      tags: [messages]
      summary: Soft-delete one author's recent messages in a channel.
      description: >
        The sibling of bulkDeleteMessages for the shape a moderator actually
        reaches for during a raid: naming an author and a time window instead
        of up to 64 explicit ids. Requires MANAGE_MESSAGES in the channel and
        reaches every message including an administrator's, the same reach
        bulkDeleteMessages has and deliberately not a ranked one (see decision
        0016). Resolves to an id list and then behaves exactly like
        bulkDeleteMessages from there: nothing is deleted unless the match
        count is within the cap, one moderation-audit row is written for the
        author, and each message actually deleted publishes its own
        `message.deleted` over the WebSocket. window_minutes must be between 1
        and 1440 (24 hours); a raid is a matter of minutes, and this route is
        not sized for a longer sweep. If more than 64 messages match, the
        whole request is refused rather than truncated to the first 64 - narrow
        the window and try again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [author_id, window_minutes]
              properties:
                author_id:
                  type: string
                  format: uuid
                  description: Whose messages to delete, in this channel only.
                window_minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                  description: >
                    How far back to look, in minutes, from now. At most 1440
                    (24 hours).
      responses:
        "204":
          description: >
            Every live message from this author in this channel and window
            has been deleted. A window matching nothing still answers 204.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /attachments:
    post:
      operationId: uploadAttachment
      tags: [attachments]
      summary: Upload an attachment's bytes.
      description: >
        The first of two steps: upload here, then reference the returned id
        in `attachment_ids` on `sendMessage`. Content type is decided by
        sniffing the uploaded bytes against a fixed server-side allowlist,
        never from a client-declared Content-Type header or a filename
        extension - an unrecognized type is refused outright. The allowlist
        covers images, PDF, mp4 and webm video, mpeg/ogg/wav audio, zip and
        gzip archives, and a last-resort `text/plain` match for bytes that
        are plausibly readable text (valid UTF-8, no control characters
        other than tab/newline/CR) - reference material such as source
        files, logs, csv, json and yaml has no magic bytes of its own, so
        this is the only way to admit it. Every type past the four inline
        image types is always served as a forced download; see getAttachment.
        Idempotent by content: uploading bytes that already exist returns the
        existing id rather than storing a second copy. An id that is never
        referenced by a message is reclaimed automatically after a day.
      parameters:
        - name: filename
          in: query
          description: >
            Original filename, for display and the Content-Disposition of a
            later fetch. Sanitized server-side; a control character, quote,
            or path separator cannot reach either the response header or the
            storage path (which never uses this value at all - storage is
            keyed by content hash).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The stored attachment's metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "507":
          $ref: "#/components/responses/InsufficientStorage"

  /attachments/{attachmentId}:
    parameters:
      - name: attachmentId
        in: path
        required: true
        description: Hex sha256 of the stored bytes, as returned by uploadAttachment.
        schema:
          type: string
    get:
      operationId: getAttachment
      tags: [attachments]
      summary: Fetch an attachment's bytes.
      description: >
        Readable by whoever uploaded it, so a file staged in the composer
        previews before it is sent, and by anyone with VIEW_CHANNEL in a
        channel that has a live message or a canvas object attaching it,
        including a canvas object that was erased and can still be restored -
        the same permission reading that message already requires, not a
        bare "the id is hard to guess". An id nothing attaches (or already
        reclaimed) answers 404 for everyone but its uploader. The response always carries
        `X-Content-Type-Options: nosniff` and a Content-Disposition that
        forces a download for every content type except the handful of
        image types the allowlist marks safe to render inline.


        Every response advertises `Accept-Ranges: bytes`. A `Range` request
        header carrying a single `bytes=` range is honoured with a 206 and a
        `Content-Range`; an unsatisfiable range answers 416; a multi-range or
        malformed value is ignored and the whole body is returned. This is what
        lets a large download resume and a video or audio file seek.
      parameters:
        - name: Range
          in: header
          required: false
          description: An optional single `bytes=` byte range (RFC 9110).
          schema:
            type: string
      responses:
        "200":
          description: >-
            The attachment's raw bytes, served as the type sniffed from the
            stored bytes rather than anything the uploader claimed.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
            application/gzip:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
        "206":
          description: >-
            The requested byte range, returned when the client sent a single
            satisfiable `Range`. Carries `Content-Range: bytes start-end/total`
            and the same sniffed content type as the 200.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: >-
            The `Range` header named a byte range no part of the attachment can
            satisfy. Carries `Content-Range: bytes */total`.
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /gifs/search:
    get:
      operationId: searchGifs
      tags: [gifs]
      summary: Search the deployment's configured GIF provider.
      description: >
        Requires deployment-wide ATTACH_FILES, the same bit an ordinary
        `uploadAttachment` needs - this feature exists to end in an
        attachment, so someone who could not attach one anyway gets nothing
        to browse either. Proxied end to end: this server calls the
        configured provider (Tenor or Klipy) on the caller's behalf, so a
        member's own IP address and search terms never reach it directly.


        Each result's `id` is an opaque token minted by this request, never
        the provider's own id or CDN URL. It is redeemable at
        `getGifPreview` and `selectGif` for a short time and then expires;
        an expired or unknown token answers 503 rather than 404, the same
        "try again" a provider hiccup gets, since a client's only remedy
        either way is to search again.


        A 501 means this deployment has no GIF provider configured at all
        (see `/version`'s `gif_search_enabled`), which a client is expected
        to check before ever showing a GIF picker.
      parameters:
        - name: q
          in: query
          required: true
          description: The search query. Refused with 400 if empty or all whitespace.
          schema:
            type: string
        - name: limit
          in: query
          description: Most results to return. Defaults to 20, capped at 50.
          schema:
            type: integer
      responses:
        "200":
          description: Search results, newest-relevance-first as the provider ordered them.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/GifResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          description: This deployment has no GIF provider configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"

  /gifs/trending:
    get:
      operationId: getTrendingGifs
      tags: [gifs]
      summary: The deployment's configured GIF provider's current trending results.
      description: >
        The picker's own default content before a member ever types a query -
        same proxying, tokenizing and permission model as `searchGifs`
        (requires deployment-wide ATTACH_FILES; a member's own IP address
        never reaches the provider directly), against the provider's
        dedicated trending endpoint rather than an empty search.


        Each result's `id` is an opaque token minted by this request, never
        the provider's own id or CDN URL. It is redeemable at
        `getGifPreview` and `selectGif` for a short time and then expires,
        exactly like a `searchGifs` result's.


        A 501 means this deployment has no GIF provider configured at all
        (see `/version`'s `gif_search_enabled`), which a client is expected
        to check before ever showing a GIF picker.
      parameters:
        - name: limit
          in: query
          description: Most results to return. Defaults to 20, capped at 50.
          schema:
            type: integer
      responses:
        "200":
          description: Trending results, as the provider ordered them.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/GifResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          description: This deployment has no GIF provider configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"

  /gifs/preview/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: An opaque id from a searchGifs result.
        schema:
          type: string
    get:
      operationId: getGifPreview
      tags: [gifs]
      summary: Fetch a search result's thumbnail, proxied through this server.
      description: >
        Streams a small preview image for a token `searchGifs` minted, so a
        result grid never asks a client to load an image straight from the
        provider's own CDN. Requires the same ATTACH_FILES bit `searchGifs`
        does.
      responses:
        "200":
          description: The thumbnail's raw bytes, sniffed the same way a stored attachment's are.
          content:
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >
            The token names no result this server still holds; see
            `selectGif`'s own 404. Search again rather than retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          description: This deployment has no GIF provider configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"

  /link-preview:
    get:
      operationId: getLinkPreview
      tags: [gifs]
      summary: Unfurl a pasted URL into a title/description/image preview.
      description: >
        Fetches `url` server-side, behind an SSRF guard (decision 0019), and
        returns its OpenGraph/title metadata. Enabled only when the operator
        set `SLIMM_LINK_PREVIEWS` (see `/version`'s `link_previews_enabled`),
        which a client is expected to check first. Any preview image is
        returned as an opaque `image_token` redeemed at `getLinkPreviewImage`,
        never the upstream URL. If the page is recognized as a playable video
        (YouTube today), `video_provider`/`video_id` are set so a client can
        render a click-to-play affordance instead - see those fields. For a
        recognized video, `title`/`image`/`author_name`/`author_url` come
        from the provider's oembed endpoint, a second SSRF-guarded request
        behind the same redirect handling as the page fetch, made only for a
        recognized video and never for an ordinary link; a failed or slow
        oembed request degrades to a generic title and no author rather than
        failing the unfurl.
      parameters:
        - name: url
          in: query
          required: true
          description: The http(s) URL to unfurl. Refused with 400 if malformed or pointing at a non-public address.
          schema:
            type: string
      responses:
        "200":
          description: The link's preview metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkPreview"
        "400":
          description: The URL is malformed, not http(s), or resolves to a blocked address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The URL is public and well-formed but yielded no usable preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          description: This deployment does not have link previews enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"

  /link-preview/image/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: An opaque id from a getLinkPreview result's image_token.
        schema:
          type: string
    get:
      operationId: getLinkPreviewImage
      tags: [gifs]
      summary: Fetch a preview's image, proxied through this server.
      description: >
        Streams the image a token stands for, so a card never loads an image
        straight from the third-party host. The token gates it: only an image
        a real preview surfaced can be proxied, never an arbitrary URL.
      responses:
        "200":
          description: The image's raw bytes, sniffed rather than trusting the upstream content type.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The token names no image this server still holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          description: This deployment does not have link previews enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"

  /gifs/select:
    post:
      operationId: selectGif
      tags: [gifs]
      summary: Pick a search result and store it as an ordinary attachment.
      description: >
        Downloads the full-resolution image through this server for a token
        `searchGifs` minted, and stores it exactly the way `uploadAttachment`
        stores a client-supplied body: content-addressed, sniffed rather than
        trusted, checked against both the per-upload and deployment-wide size
        ceilings. The response is the same `Attachment` shape
        `uploadAttachment` answers with, and its `id` may be referenced in
        `attachment_ids` on `sendMessage` exactly like one from an upload -
        nothing about sending it later depends on the provider or the token
        again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: An opaque id from a searchGifs result.
      responses:
        "201":
          description: The stored attachment's metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >
            The id names no result this server still holds. Tokens live in
            memory for fifteen minutes and do not survive a restart, so a
            picker left open can hold results that are all already dead.
            Retrying the same id cannot succeed; search again for fresh ones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          description: This deployment has no GIF provider configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"

  /channels/{channelId}/messages/polls:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: sendPollMessage
      tags: [messages]
      summary: Send a message that carries a poll.
      description: >
        A poll is not its own resource: it is a message, so this is
        idempotent by the client-supplied `id` exactly like `sendMessage`,
        and gated on the same VIEW_CHANNEL plus SEND_MESSAGES permissions,
        evaluated in this channel. Options are ordered and fixed at
        creation; a poll needs between 2 and 4 of them. `close_at`, if given,
        is a unix-millisecond deadline after which the server refuses votes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePollMessageRequest"
      responses:
        "200":
          description: The stored message, with its poll attached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/messages/apps:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: launchAppMessage
      tags: [messages]
      summary: Launch an installed module's app as a message.
      description: >
        An app surface is not its own resource: it is a message, so this is
        idempotent by the client-supplied `id` exactly like `sendMessage`, and
        gated on the same VIEW_CHANNEL plus SEND_MESSAGES permissions, evaluated
        in this channel. The caller must also currently be able to reach the
        named app (installed, enabled, and holding its declared permission),
        the same three checks `listApps` filters on. The message carries only
        which module and command to launch; the surface's live, shared state is
        the module's own output, run and seen by everyone through the shared
        code-run route at block 0, exactly like a fenced code block. slim has no
        notion of what any app does - see docs/decisions/0021.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaunchAppRequest"
      responses:
        "200":
          description: The stored message, with its app surface attached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /messages/{messageId}/save:
    parameters:
      - name: messageId
        in: path
        required: true
        description: The message's UUID.
        schema:
          type: string
          format: uuid
    put:
      operationId: saveMessage
      tags: [messages]
      summary: Keep a message in your own saved list.
      description: >
        Private to the caller. Unlike a pin, which is a moderation act on a
        channel, this is something anyone does to their own account: the only
        permission it needs is VIEW_CHANNEL on the message's channel, the
        same one that let them read it. Nobody else can read, add to, or
        count somebody's saved list, and no live event is published - a save
        changes nothing anyone else can observe.


        Idempotent: saving something already saved leaves the original
        `saved_at` alone rather than moving it to the top, so a double tap
        cannot silently reorder the list. A message in a channel the caller
        cannot see is a 404 rather than a 403, so this cannot probe for one.


        An account holds at most 500 saved messages. Saving past that is a
        400; re-saving something already held is not, since it adds no row.
        The ceiling is at the write rather than a page at the read for the
        reason `pinMessage`'s own limit is: `listSavedMessages` serves the
        set whole, so the set has to stay small enough to serve whole.
      responses:
        "204":
          description: The message was saved (or already was).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: unsaveMessage
      tags: [messages]
      summary: Remove a message from your own saved list.
      description: >
        Idempotent, and deliberately asks for no permission on the message's
        channel and does not require the message to still exist. Letting go
        of something is never refused: somebody removed from a channel must
        still be able to clear their own list of it, and a save whose message
        has since been deleted is exactly the entry they most want gone.
      responses:
        "204":
          description: The message is not saved (whether or not it was).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /saved:
    get:
      operationId: listSavedMessages
      tags: [messages]
      summary: Your own saved messages, newest save first.
      description: >
        Ordered by when each was saved, not when it was sent, so keeping an
        old message puts it at the top of the list rather than the bottom.


        Filtered by what you can see *now*, not by what you could see when
        you saved it. Access is revocable and a saved list is not a licence
        to keep reading a channel you were removed from, so an entry whose
        channel you can no longer view is left out of the answer. The entry
        itself is kept rather than deleted: losing sight of a channel may be
        temporary, and discarding somebody's saves on a permission change
        would be destroying their data on a moderator's behalf. A deleted
        message is left out for good, since nothing brings it back.


        Returned whole, with no paging, which `saveMessage`'s ceiling of 500
        is what makes safe - the same arrangement `listPinnedMessages` and
        `pinMessage` have.
      responses:
        "200":
          description: The caller's saved messages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/messages/{messageId}/pin:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
      - name: messageId
        in: path
        required: true
        description: The message's UUID.
        schema:
          type: string
          format: uuid
    put:
      operationId: pinMessage
      tags: [messages]
      summary: Pin a message in its channel.
      description: >
        Idempotent: pinning an already-pinned message leaves the original
        pin's timestamp and pinner in place. Requires MANAGE_MESSAGES,
        evaluated in this channel specifically; holding it in another channel
        is not enough. Live connections are told over the WebSocket
        (`message.pinned`).


        A channel holds at most 200 pins. Pinning past that is a 400; pinning
        one that is already pinned is not, since it adds nothing.
      responses:
        "204":
          description: The message was pinned (or already was).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: unpinMessage
      tags: [messages]
      summary: Unpin a message.
      description: >
        Idempotent: unpinning a message that is not pinned succeeds, since the
        caller's intent already holds either way. Requires MANAGE_MESSAGES in
        this channel. Live connections are told over the WebSocket
        (`message.unpinned`).
      responses:
        "204":
          description: The message was unpinned (or was already not pinned).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/messages/{messageId}/thread:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
      - name: messageId
        in: path
        required: true
        description: The message's UUID.
        schema:
          type: string
          format: uuid
    post:
      operationId: openThread
      tags: [messages]
      summary: Open (or reuse) the thread hanging off a message.
      description: >
        A thread is a hidden channel with `parent_message_id` set to this
        message: its own view and send permissions inherit the parent
        channel's, evaluated live rather than copied, and it never appears
        in `listChannels`. Idempotent per message - a second call for the
        same message, by anyone who can already see it, returns the same
        channel rather than creating a second one. Requires VIEW_CHANNEL and
        SEND_MESSAGES in `channelId`, the same bits `sendMessage` itself
        needs there, since starting a thread is a way of sending rather than
        a way of managing the channel. Refused if the named message is
        itself inside a thread: nesting is not supported. Also refused,
        with a 400, once `channelId` already holds 500 live threads -
        reopening one that already exists never counts against that
        ceiling.
      responses:
        "200":
          description: The thread channel, created on first use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/pins:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: listPinnedMessages
      tags: [messages]
      summary: List a channel's pinned messages, newest pin first.
      description: >
        Requires only VIEW_CHANNEL. Each entry is the full message, flattened,
        plus when and by whom it was pinned.


        A channel holds at most 200 pins, refused at the pin rather than paged
        at the read, so this answers with the whole set unless `limit` narrows
        it.
      parameters:
        - name: limit
          in: query
          description: At most this many pins, newest first; the server clamps it into 1..200 rather than rejecting it. Omitted means every pin in the channel (itself capped at 200).
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: The channel's pinned messages, newest pin first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PinnedMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/pins/count:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: getPinnedMessageCount
      tags: [messages]
      summary: How many messages are pinned in a channel.
      description: >
        Backs the channel header's pin count without the client fetching
        every pinned message just to count them. Requires only VIEW_CHANNEL.
      responses:
        "200":
          description: The pin count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinCount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/messages/search:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: searchMessages
      tags: [messages]
      summary: Full-text search a channel's live messages, with Slack-style operators.
      description: >
        Backed by FTS5; `q` reaches it close to as-is, so its mini query
        language (`AND`/`OR`/`NOT`, `"phrase"`, a trailing `*` prefix) is
        available. `q` is optional: a search made entirely of `from`/`in`/
        `has`/`after_date`/`before_date` needs no free text at all, though at
        least one of `q` and those filters is required. Results are
        permission-filtered exactly like listing and keyset paginated on
        `seq` the same way. A `q` that is not valid FTS5 syntax is a 400,
        never a 500. `in` is the one filter with an oracle-safety rule of its
        own: a channel name that does not exist, or that exists but the
        caller cannot view, answers with an empty array rather than a 403 or
        404, so it cannot be used to learn a hidden channel exists.
      parameters:
        - name: q
          in: query
          description: >
            Free-text FTS5 query. Optional when at least one other filter is
            given; when present, still must be non-blank.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: before
          in: query
          description: Return only messages with a `seq` strictly below this.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          description: Page size; the server clamps it.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: from
          in: query
          description: >
            Only messages authored by this exact username (`from:username`).
            A username matching no live account answers with no results,
            never an error - the same oracle-safety rule `in` states above,
            applied to an account instead of a channel.
          schema:
            type: string
        - name: in
          in: query
          description: >
            Search this channel by name instead of the one in the path
            (`in:channel-name`). See this operation's own description for
            what an unviewable or nonexistent name answers with.
          schema:
            type: string
        - name: has
          in: query
          description: >
            `has:attachment` and/or `has:link` (`has=attachment,link` for
            both). `link` is a plain, case-sensitive substring match for
            `http://`/`https://` in the content, not a real URL parse.
          schema:
            type: string
        - name: after_date
          in: query
          description: >
            `after:YYYY-MM-DD`. Inclusive: messages created on or after this
            UTC calendar date.
          schema:
            type: string
            format: date
        - name: before_date
          in: query
          description: >
            `before:YYYY-MM-DD`. Exclusive: messages created strictly before
            this UTC calendar date, so the named date itself is excluded.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Matching messages, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /search/messages:
    get:
      operationId: searchMessagesAll
      tags: [messages]
      summary: Full-text search every channel the caller can view, with the same Slack-style operators.
      description: >
        The cross-channel counterpart to `GET
        /channels/{channelId}/messages/search`: same query language, same
        operators, same result shape, but with no path channel to scope it.
        By default the scope is every channel the caller holds VIEW_CHANNEL
        in (DMs and threads excluded, the same set `GET /channels` lists);
        `in` narrows that to one named channel exactly as it does on the
        per-channel route, with the same oracle-safety answer for an
        unviewable or nonexistent name. `q` is optional under the same rule
        as the per-channel route: at least one of `q` and the other filters
        is required. Results are permission-filtered and keyset paginated on
        `seq` exactly like the per-channel route.
      parameters:
        - name: q
          in: query
          description: >
            Free-text FTS5 query. Optional when at least one other filter is
            given; when present, still must be non-blank.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: before
          in: query
          description: Return only messages with a `seq` strictly below this.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          description: Page size; the server clamps it.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: from
          in: query
          description: >
            Only messages authored by this exact username (`from:username`).
            A username matching no live account answers with no results,
            never an error.
          schema:
            type: string
        - name: in
          in: query
          description: >
            Search this channel by name instead of every viewable channel
            (`in:channel-name`). A name that does not exist, or that exists
            but the caller cannot view, answers with an empty array rather
            than a 403 or 404, so it cannot be used to learn a hidden
            channel exists.
          schema:
            type: string
        - name: has
          in: query
          description: >
            `has:attachment` and/or `has:link` (`has=attachment,link` for
            both). `link` is a plain, case-sensitive substring match for
            `http://`/`https://` in the content, not a real URL parse.
          schema:
            type: string
        - name: after_date
          in: query
          description: >
            `after:YYYY-MM-DD`. Inclusive: messages created on or after this
            UTC calendar date.
          schema:
            type: string
            format: date
        - name: before_date
          in: query
          description: >
            `before:YYYY-MM-DD`. Exclusive: messages created strictly before
            this UTC calendar date, so the named date itself is excluded.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Matching messages across every viewable channel, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /messages/{messageId}/reactions/{emoji}:
    parameters:
      - name: messageId
        in: path
        required: true
        description: The message's UUID.
        schema:
          type: string
          format: uuid
      - name: emoji
        in: path
        required: true
        description: >
          The reaction, URL-encoded: one emoji, the `:shortcode:` of a custom
          emoji, or a custom emoji's id. Anything else is refused with 400 when
          adding; removing is not checked, so an old reaction can always go.
        schema:
          type: string
    get:
      operationId: listReactionUsers
      tags: [messages]
      summary: List who left one reaction on a message.
      description: >
        The people who left this emoji, oldest reaction first, as the caller
        may see them: a reactor the caller has blocked is left out, exactly as
        the tally leaves them out of the count, so the list is as long as the
        count shown to the same caller. Needs only what reading the message
        needs; a hidden or deleted message answers as a missing one. An emoji
        nobody used is an empty list. `limit` defaults to 50 and is at most
        100; `after` is a `next_cursor` from the previous page. Reactor
        identity is never on the WebSocket, only here.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: after
          in: query
          schema:
            type: string
      responses:
        "200":
          description: One page of reactors.
          content:
            application/json:
              schema:
                type: object
                required: [users, next_cursor]
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required: [user_id]
                      properties:
                        user_id:
                          type: string
                          format: uuid
                  next_cursor:
                    type: [string, "null"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      operationId: addReaction
      tags: [messages]
      summary: React to a message with one emoji.
      description: >
        Idempotent: reacting twice with the same emoji leaves one reaction.
        Requires being able to view the message's channel as well as
        ADD_REACTIONS, so reacting cannot be used to probe for a message in a
        channel the caller cannot see; a hidden message answers exactly as a
        missing one.
      responses:
        "204":
          description: The reaction was recorded.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: removeReaction
      tags: [messages]
      summary: Remove the caller's own reaction of one emoji from a message.
      description: >
        Idempotent: removing a reaction that is not there succeeds, since the
        caller's intent already holds.
      responses:
        "204":
          description: The reaction was removed (or was already absent).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /messages/{messageId}/blocks/{blockIndex}/run:
    parameters:
      - name: messageId
        in: path
        required: true
        description: The message's UUID.
        schema:
          type: string
          format: uuid
      - name: blockIndex
        in: path
        required: true
        description: The index of the fenced code block within the message.
        schema:
          type: integer
          format: int64
    post:
      operationId: runCodeBlock
      tags: [messages]
      summary: Run a fenced code block in a message and share the result.
      description: >
        Like runModuleCommand, but the result is stored against this
        (message, block) and broadcast, so everyone viewing the message sees
        the latest run inline without rerunning it. Requires being able to
        view the message's channel (a hidden message answers as a missing one)
        as well as the permission the named command declares. A re-run
        replaces the block's stored result. A resource-limit or module error
        still answers 200 with `ok: false`, the same as runModuleCommand.


        `moduleId: "code-runner"` reaches the code-runner broker here too
        (see runModuleCommand's own note), except `RUN_CODE` is evaluated for
        this message's own channel rather than at the base level, so a
        channel overwrite can grant or withhold it per channel.


        If this message launched an app surface (see launchAppMessage), the
        named `moduleId`/`command` must match the ones that launched it, on
        every block index, or the call is refused with 403 - a module
        permission held for something else can never overwrite a surface it
        did not launch.


        The server runs its own extraction of block `blockIndex` from the
        stored message, by the same fence rules the client renders with, and
        does not trust `input`; it is used as-is only for a message that
        launched an app surface. A message with no code block at that index
        (for instance after an edit) is refused with 409. A block containing
        a control, text-direction or zero-width character (tab and line
        breaks aside) is refused with 403, for every caller, so what a viewer
        reads is what runs (decision 0026's addendum).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCodeBlockRequest"
      responses:
        "200":
          description: The block ran; see `ok` for whether it succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunModuleCommandResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /messages/{messageId}/polls/vote:
    parameters:
      - name: messageId
        in: path
        required: true
        description: The message's UUID.
        schema:
          type: string
          format: uuid
    put:
      operationId: votePoll
      tags: [messages]
      summary: Cast or change the caller's vote on a message's poll.
      description: >
        One vote per user per poll: a second call replaces the first rather
        than adding to it. Requires being able to view the message's channel
        as well as SEND_MESSAGES there - the same permission sending a
        message needs, evaluated in this channel specifically. Refused once
        the poll's `close_at` has passed, checked against the server's own
        clock. Live connections are told over the WebSocket (`poll.voted`)
        with the whole refreshed tally, never who cast which vote.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VotePollRequest"
      responses:
        "204":
          description: The vote was recorded.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /push:
    put:
      operationId: registerPush
      tags: [push]
      summary: Register (or replace) the caller's own device's push registration.
      description: >
        Always scoped to the device the caller's access token belongs to; a
        device can never register on behalf of another device. The public key
        is what the server seals content-free push envelopes to, so a device
        that never registers one cannot receive push.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushRequest"
      responses:
        "204":
          description: The registration was stored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deregisterPush
      tags: [push]
      summary: Clear the caller's own device's push registration.
      responses:
        "204":
          description: The registration was cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /push/lifecycle:
    put:
      operationId: reportPushLifecycle
      tags: [push]
      summary: Report the caller's own device's app lifecycle state.
      description: >
        Push is triggered from this self-reported state, not from WebSocket
        presence: a suspended-but-still-connected socket (iOS backgrounding)
        is not proof the app can show a notification. A recent `foreground`
        report suppresses push to that device until it goes stale or changes.
        A report of any other state also withdraws the channels this device
        reported open over the WebSocket (`ClientViewing`), and both signals go
        stale after the same 60 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportLifecycleRequest"
      responses:
        "204":
          description: The lifecycle state was recorded.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /push/preference:
    get:
      operationId: getNotificationPreference
      tags: [push]
      summary: Read the caller's own notification preference.
      description: >
        Account-wide, unlike every other route under this tag: which messages
        are worth waking any of the caller's devices for, not one device's own
        registration. A genuine round trip rather than a local echo - unlike
        `PATCH /presence`, nothing here needs a per-viewer-derived answer.
        Absent on a server too old to have this route, which a caller must
        read as the preference not being offered at all, never as `everything`.
      responses:
        "200":
          description: The preference now in effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreference"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      operationId: setNotificationPreference
      tags: [push]
      summary: Set the caller's own notification preference.
      description: >
        Enforced where push recipients are computed
        (`push::recipients::message_recipients`), before a device is ever
        woken - never filtered client-side after a push has already landed.
        `mentions` still wakes a device for a plain message in a DM, since
        somebody messaging the caller there is addressing them directly, the
        same as an `@`-mention; `nothing` is absolute and silences a DM too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreference"
      responses:
        "200":
          description: The preference now in effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreference"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /push/preview:
    get:
      operationId: getPushPreview
      tags: [push]
      summary: Read whether the caller's push envelopes carry a message preview.
      description: >
        Account-wide, so a reinstall or a new device shows the same answer.
      responses:
        "200":
          description: The choice now in effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      operationId: setPushPreview
      tags: [push]
      summary: Choose whether push envelopes carry a message preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushPreview"
      responses:
        "200":
          description: The choice now in effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /notification-preferences/channels:
    get:
      operationId: listChannelNotificationOverrides
      tags: [push]
      summary: List the caller's own per-channel notification overrides.
      description: >
        Only channels the caller has actually overridden appear here - one
        following the account default (`getNotificationPreference`) carries
        no entry, never one listed at `everything`.
      responses:
        "200":
          description: The caller's channel-scoped overrides.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelNotificationOverrideEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /notification-preferences/channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    put:
      operationId: setChannelNotificationOverride
      tags: [push]
      summary: Mute this channel, or narrow it to mentions only.
      description: >
        Enforced where push recipients are computed
        (`push::recipients::narrow_for_notification_preference`), the same
        choke point `setNotificationPreference` already goes through - never
        filtered client-side after a push has already landed. Requires
        VIEW_CHANNEL, the same bar reading the channel already sets; a
        channel the caller cannot view answers 403, identically whether or
        not it exists. `everything` is refused: having no override already
        means that, so `DELETE` is the way back to it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelNotificationOverrideRequest"
      responses:
        "200":
          description: The override now in effect for this channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelNotificationOverrideEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: clearChannelNotificationOverride
      tags: [push]
      summary: Clear this channel's override, reverting it to the account default.
      description: >
        Idempotent, and needs no VIEW_CHANNEL: this only ever touches the
        caller's own row, keyed on their own id, so the one way back to the
        account default must still work after losing view access to the
        channel.
      responses:
        "204":
          description: The channel now follows the account default.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /push/quiet-hours:
    get:
      operationId: getQuietHours
      tags: [push]
      summary: Read the caller's own quiet-hours window.
      description: >
        Account-wide, the same scope as `GET /push/preference`. A genuine
        round trip, not a local echo. `null` means disabled, the default,
        and what every account that predates this feature keeps on upgrade.
      responses:
        "200":
          description: The window now in effect, or `null` if disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuietHoursResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      operationId: setQuietHours
      tags: [push]
      summary: Set the caller's own quiet-hours window.
      description: >
        Minutes since midnight UTC: entered in local time by the client and
        converted to UTC before this call, so the server never needs to
        know the account's time zone. `start_minute` may be greater than
        `end_minute` for a window that crosses midnight - 23:00-08:00 is the
        ordinary shape, not an edge case. Legacy: the window is stored and read
        back, but nothing uses it to decide push since the notification
        schedule replaced it, so use `setNotificationSchedule` to silence an
        account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuietHours"
      responses:
        "200":
          description: The window now in effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuietHours"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: clearQuietHours
      tags: [push]
      summary: Disable the caller's own quiet-hours window.
      description: >
        Idempotent: clearing a window that was never set, or was already
        cleared, is not an error.
      responses:
        "204":
          description: Quiet hours are now disabled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /notifications/schedule:
    get:
      operationId: getNotificationSchedule
      tags: [push]
      summary: Read the caller's own notification schedule.
      description: >
        `null` means never configured, distinct from a schedule with every
        weekday empty - see docs/decisions/0033-notification-schedule.md.
        `/push/quiet-hours` is untouched and still readable; this is the
        schedule that actually gates push (`push::recipients`).
      responses:
        "200":
          description: The schedule now in effect, or `null` if never configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationScheduleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      operationId: setNotificationSchedule
      tags: [push]
      summary: Replace the caller's own timezone, off-hours mode and weekly windows.
      description: >
        `timezone` must be a resolvable IANA name. Each day in `days` is
        0 (Monday) to 6 (Sunday) and may appear at most once; `end_minute`
        may be less than `start_minute` for a window crossing midnight into
        the next weekday. Never touches `snooze_until` or either allow-list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetNotificationScheduleRequest"
      responses:
        "200":
          description: The schedule now in effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationScheduleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: clearNotificationSchedule
      tags: [push]
      summary: Turn the schedule off entirely, back to never configured.
      description: >
        Removes the weekly windows, both allow-lists and any active snooze
        together - a real `DELETE`, not a tombstone, so the cascade genuinely
        fires.
      responses:
        "204":
          description: The schedule is now unconfigured.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /notifications/schedule/allowed-users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: addNotificationScheduleAllowedUser
      tags: [push]
      summary: Notify me about this person even off hours.
      description: >
        The member card's off-hours action. A DM or mention from `userId`
        still notifies during off hours even in `nothing` mode, floored at
        mentions-shaped, never raised to `everything`. Works with no
        schedule configured yet; it is inert until there is an off-hours
        window for it to break through.
      responses:
        "204":
          description: userId is now on the caller's off-hours people allow-list.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: removeNotificationScheduleAllowedUser
      tags: [push]
      summary: Remove a person from the off-hours allow-list.
      responses:
        "204":
          description: userId is no longer on the caller's off-hours people allow-list.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /notifications/schedule/allowed-channels/{channelId}:
    parameters:
      - name: channelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: addNotificationScheduleAllowedChannel
      tags: [push]
      summary: Notify me off hours in this channel.
      description: >
        The channel menu's off-hours action. `channelId` notifies exactly as
        it would in hours during an off-hours window, bypassing off-hours
        narrowing entirely rather than floored at mentions. Requires
        `VIEW_CHANNEL`, the same bar muting a channel already sets.
      responses:
        "204":
          description: channelId is now on the caller's off-hours channel allow-list.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: removeNotificationScheduleAllowedChannel
      tags: [push]
      summary: Remove a channel from the off-hours allow-list.
      responses:
        "204":
          description: channelId is no longer on the caller's off-hours channel allow-list.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /notifications/schedule/snooze:
    put:
      operationId: setNotificationSnooze
      tags: [push]
      summary: Pause notifications until a deadline (Slack's 30m / 1h / until tomorrow).
      description: >
        `until_ms` is an absolute epoch-millisecond deadline the client
        computes for whichever option was chosen - only the client knows the
        account's own local midnight for "until tomorrow". Must be in the
        future and no more than a week out. While active, the schedule reads
        as off hours in `nothing` mode regardless of the configured window
        or mode, still subject to both allow-lists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSnoozeRequest"
      responses:
        "200":
          description: The snooze now in effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnoozeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: clearNotificationSnooze
      tags: [push]
      summary: End an active snooze early.
      responses:
        "204":
          description: The snooze is cleared; the ordinary schedule applies again.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/read:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: getReadState
      tags: [sync]
      summary: Read the caller's last-read marker and unread count.
      responses:
        "200":
          $ref: "#/components/responses/ReadStateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      operationId: markRead
      tags: [sync]
      summary: Advance the caller's last-read marker.
      description: Monotonic; a lower `seq` never moves the marker backwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadRequest"
      responses:
        "200":
          $ref: "#/components/responses/ReadStateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/unread:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    put:
      operationId: markUnread
      tags: [sync]
      summary: Mark the channel unread without moving the marker.
      description: >-
        Records an intention beside the marker rather than rewinding it; the
        marker is monotonic. Reading the channel clears it.
      responses:
        "200":
          $ref: "#/components/responses/ReadStateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/canvas/objects:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: listCanvasViewport
      tags: [canvas]
      summary: Read the canvas objects in a region of a channel's canvas.
      description: >
        Requires `VIEW_CHANNEL` and `USE_CANVAS`, evaluated for this channel.
        Returns every live object whose bounding box intersects the rectangle
        given by `min_x`, `min_y`, `max_x` and `max_y`, in paint order (`z_index`
        then `seq`), backed by a spatial index rather than a scan of the canvas.


        A client that is panning also sends the rectangle it is leaving as
        `prev_min_x` and the rest, plus the `latest_seq` it last saw as
        `after_seq`. The answer is then the delta: objects in the new rectangle
        that are not in the old one, plus anything inside both that is newer
        than the cursor. All four previous bounds are sent together or not at
        all. Omitting them is a cold fetch of the whole region.


        The delta covers objects arriving, not objects removed. A soft delete
        does not advance an object's `seq`, so no cursor over this endpoint can
        report one; removals belong to `listCanvasOps`, the ordered op stream
        this operation's `latest_seq` is also a valid cursor into.
      parameters:
        - name: min_x
          in: query
          required: true
          schema: { type: number, format: double }
        - name: min_y
          in: query
          required: true
          schema: { type: number, format: double }
        - name: max_x
          in: query
          required: true
          schema: { type: number, format: double }
        - name: max_y
          in: query
          required: true
          schema: { type: number, format: double }
        - name: prev_min_x
          in: query
          deprecated: true
          description: >-
            The leaving rectangle. Send all four bounds or none. Superseded by
            `listCanvasOps`: no known client sends this.
          schema: { type: number, format: double }
        - name: prev_min_y
          in: query
          deprecated: true
          schema: { type: number, format: double }
        - name: prev_max_x
          in: query
          deprecated: true
          schema: { type: number, format: double }
        - name: prev_max_y
          in: query
          deprecated: true
          schema: { type: number, format: double }
        - name: after_seq
          in: query
          description: >
            Hold back objects at or below this canvas `seq` that the leaving
            rectangle already covered. Ignored without a leaving rectangle.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          description: Page size; the server clamps it.
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
      responses:
        "200":
          description: The objects in the region, in paint order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasViewport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: placeCanvasObject
      tags: [canvas]
      summary: Place one object on a channel's canvas.
      description: >
        Requires `VIEW_CHANNEL` and `USE_CANVAS`, evaluated for this channel,
        and is additionally refused while the caller is timed out. A timeout
        does not subtract `USE_CANVAS` (that one bit means view *and* draw, so
        subtracting it would blank the canvas rather than make it read-only),
        so this route checks the timeout itself: a timed-out member keeps
        seeing the canvas and cannot add to it.


        `id` is a client-generated UUIDv7 and is the idempotency key, the same
        way a message id is. Replaying it answers with the stored row, its
        original `seq` intact, writes nothing, and broadcasts nothing. The same
        id in another channel, or one belonging to an object that has since
        been removed, is a 409.


        `x` and `y` are the object's top-left corner in world coordinates and
        `w` and `h` are its extents, all inside the bounded world of plus or
        minus 5,000,000. Neither extent may exceed 8,192: an object is a mark,
        not a region, and one legally spanning the world would be indexed into
        every cell of a client's spatial grid.


        `kind` is `stroke`, `image`, `note` or `shape`. It is an allowlist
        rather than free text, because the kind decides how every client
        renders a row and an unknown one is a row nobody can draw and nobody
        can remove. There is no `window` kind: a window is a behaviour of an
        object rather than an object (decision 0004). `note` and `shape` are
        the tool dock's other two tools that decision names; neither needs a
        validation exception, since neither carries a field this route
        authorizes against the way an image's attachment does.


        `props` is kind-specific and opaque to the server, capped at 4 KiB
        serialized, with one exception: an `image` object's `props.attachment`
        is read, since it is what this route authorizes against. For a
        `stroke` it carries `points` (a flat `[x0,y0,x1,y1,...]` array
        *relative to* `x` and `y`, in world units), `width`, and `color`. A
        client splits a long stroke into several objects on this byte budget
        rather than on a point count. For an `image`, `props.attachment` is
        the hex id of an already-uploaded attachment (`POST /attachments`),
        checked the same way attaching one to a message is: the caller must
        have uploaded it themselves, or already hold `VIEW_CHANNEL` somewhere
        it is already visible. An attachment never uploaded, already swept as
        an orphan, or not visible to this caller is a 400, the same collapse
        a message's own attachment check already makes. For a `note`, `props`
        carries `text`, set once at creation - there is no edit verb on this
        canvas for any kind, so revising a note's text means removing it and
        placing a new one. For a `shape`, `props` carries `shape`, one of
        `rectangle`, `ellipse`, `line` or `arrow`; a line or an arrow is
        always the diagonal of the object's own `x`/`y`/`w`/`h` box, so
        reshaping either is an ordinary `move` op against a different box,
        with no separate points to keep in step.


        A 409 also means the channel's canvas is full: a canvas holds at most
        20,000 live objects by default (an admin can set it between 100 and
        100,000 through `/space/canvas-cap`), refused in the same transaction
        that counts them. A `remove` or `clear` op frees room again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvasObjectPlacement"
      responses:
        "201":
          description: The stored object, freshly placed or replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/canvas/ops:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: listCanvasOps
      tags: [canvas]
      summary: Page a channel's canvas op stream from a cursor.
      description: >
        Requires `VIEW_CHANNEL` and `USE_CANVAS`, evaluated for this channel,
        byte-identical to the viewport read's gate. No timeout check: this is
        a read.


        Every canvas mutation allocates one seq and writes one op row in the
        same transaction, so the sequence is dense over ops: `after_seq + 1`
        is always either the very next op or past `latest_seq`, with no
        possibility of an allocated-but-unwritten gap. Unlike the viewport
        read's `has_more`, this cursor is stable and paging is correct - every
        op has its own seq and there are no ties, so a page boundary is never
        ambiguous the way the viewport read's "ask for a smaller region"
        advice is.


        `reset: true` always comes with an empty `ops` array and means the
        cursor cannot be paged from: discard local canvas state and cold-fetch
        the viewport instead. It is returned when the caller is more than
        2,000 ops behind, when `after_seq` names a point before the oldest op
        this server still retains (a background sweep compacts `remove`,
        `clear` and `restore` rows older than 30 days, so a client that has
        been offline for a month can hit this),
        or when `after_seq` is past `latest_seq`, which happens after a
        restore from backup.


        A page also stops early, before `limit` rows, once the accumulated
        `place` props cross a byte budget: a `place` op carries whole props at
        up to 4 KiB while every other kind carries none, so a row count alone
        does not bound the response.
      parameters:
        - name: after_seq
          in: query
          required: true
          description: Exclusive cursor. 0 reads from the start of the stream.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          description: Page size; the server clamps it.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: The next page of the op stream, or a reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasOpPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: submitCanvasOp
      tags: [canvas]
      summary: Remove objects from a channel's canvas, clear it, restore a removal, move an object, or restack it.
      description: >
        Requires `VIEW_CHANNEL` and `USE_CANVAS`, evaluated for this channel.
        An unrecognised `kind` is a 400, the same as an unrecognised
        placement kind.


        `id` is a client-minted UUIDv7 and the op's own idempotency key, the
        same shape `placeCanvasObject`'s `id` already is: a replayed id
        returns the stored op with `fresh: false` and publishes nothing.


        `remove` names between 1 and 64 object ids and erases whichever of
        them are still live. Removing your own object needs nothing further;
        removing anyone else's needs `MANAGE_CANVAS`. An id absent from this
        channel, or belonging to another one, is a 404 - one answer for both,
        so the route cannot be used to probe whether an id exists elsewhere.


        `clear` needs `MANAGE_CANVAS` unconditionally and takes a required
        `before_seq`: every live object placed at or below it is removed.
        The fence is required, not optional, because a lost response retried
        without one would wipe whatever was drawn in the interval.


        `restore` names a prior `remove` or `clear` op as `target_op` and
        un-deletes exactly the objects that op touched. Restoring an op you
        authored needs nothing further; restoring anyone else's needs
        `MANAGE_CANVAS` - the gate is on authorship of the *op*, never of the
        objects it touched, or the person being moderated could undo the
        moderation. `target_op` naming an op that is not a `remove` or a
        `clear` in this channel is a 404, the same one an absent or foreign id
        gets. A restore that would push this channel's live object count past
        its ceiling is a 409, refused inside the same transaction that counts.


        `move` repositions a single live object to `x`, `y`, `w`, `h`,
        touching nothing else about it - not its `z_index`, not its `props`.
        A resize is the same request with different `w`/`h`: the server has
        no separate notion of "moved" versus "resized". Moving your own
        object needs nothing further; moving anyone else's needs
        `MANAGE_CANVAS`. An id absent from this channel, or belonging to
        another one, is the same 404 `remove` gives; bounds outside the world
        or past the object-extent ceiling are the same 400 a placement gives.
        An id naming an already-removed object is not an error: `affected` is
        0, the same as the other kinds' own not-quite-there answers below.


        `reorder` sets a single live object's `z_index` to an explicit value,
        touching nothing about its bounds or `props`. Any integer is legal,
        including negative: there is no ceiling on paint order the way there
        is on bounds. The caller computes the target itself - typically one
        above or below every `z_index` it currently knows about, for "bring
        to front"/"send to back" - and the server only applies and
        broadcasts whatever value is sent, the same explicit-value shape
        `move` already uses for bounds rather than a server-computed delta.
        That is also what makes two concurrent reorders resolve
        unambiguously: last write wins on the stored column, so whichever
        commits second lands exactly where it asked to, unaffected by
        whatever the first one asked for. Restacking your own object needs
        nothing further; restacking anyone else's needs `MANAGE_CANVAS`, the
        same split `move` already makes.


        Refused for `remove`, `clear` and `restore` is a timeout: a timeout
        freezes the pen, not the eraser, so a timed-out member may still
        remove or restore their own ink. `move` and `reorder` are the
        exception, refused under a timeout the same way `placeCanvasObject`
        is, since both change how ink presents rather than removing it.
        `affected` may be 0 for any kind - every named object already gone,
        nothing at or below `before_seq`, a restore naming nothing still
        dead, or a move or reorder naming an already-removed object - in
        which case no seq is allocated, no op is written, and nothing is
        published; an op row exists only for a real state transition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvasOpRequest"
      responses:
        "201":
          description: The op, written or replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasOpResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/canvas/media-slots:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: listCanvasMediaSlots
      tags: [canvas]
      summary: Read every camera or screen-share tile a channel's canvas remembers.
      description: >
        Requires `VIEW_CHANNEL` and `USE_CANVAS`, evaluated for this channel,
        byte-identical to the viewport read's gate. No timeout check: this is
        a read.


        A slot is a place saying "this participant's video goes here",
        remembered whether or not that participant is on a call right now -
        rejoining a call tomorrow finds a tile exactly where it was left
        yesterday. There is no pagination: the set is bounded by however many
        distinct participants have ever had a tile touched in this channel,
        which is small enough on this product's target scale that no page
        limit earns its cost the way `listCanvasOps` needed one.
      responses:
        "200":
          description: Every slot this channel's canvas currently remembers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasMediaSlotPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/canvas/media-slots/{kind}/{userId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [camera, screen]
      - name: userId
        in: path
        required: true
        description: >-
          The participant this tile represents, never necessarily the
          caller: anyone holding `VIEW_CHANNEL` and `USE_CANVAS` may
          rearrange anyone's tile, the same shared-editing trust this
          channel already grants over drawing.
        schema:
          type: string
          format: uuid
    put:
      operationId: putCanvasMediaSlot
      tags: [canvas]
      summary: Move, resize, lock or restack one participant's camera or screen-share tile.
      description: >
        Requires `VIEW_CHANNEL` and `USE_CANVAS`, evaluated for this channel, and is additionally refused
        while the caller is timed out, the same gate `placeCanvasObject` uses, or while a move would
        leave an already-locked slot locked. `userId` must name a real account, or the call is a 404.


        Unlike a real canvas object there is no own-tile-versus-`MANAGE_CANVAS`
        split: `userId` names the participant a tile represents, not who
        arranged it, so this is a plain upsert on `(channelId, userId, kind)`
        rather than a moderation act. Every field is sent on every call, and
        the stored row is replaced outright rather than merged.


        Not idempotent by a client id the way `placeCanvasObject` is: every
        call names a real intended arrangement, so every successful call
        publishes a live update, including a retry after a lost response.
        Applying the same state twice is a no-op for every receiver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvasMediaSlotUpdate"
      responses:
        "200":
          description: The slot's current, now-shared state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasMediaSlot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/voice/token:
    post:
      operationId: mintVoiceToken
      tags: [voice]
      summary: Mint a short-lived token for this channel's voice room.
      description: >
        Requires `VIEW_CHANNEL` and `CONNECT`. `SPEAK` and `USE_CANVAS` are not
        pass-or-fail here: they are carried into the token as SFU grants, so a
        member with listen-only rights joins with a token that cannot publish
        and the SFU enforces that, rather than the client being trusted to hide
        a button.


        The room name is derived from the channel id on the server and echoed
        back; it is never accepted from the caller, so a token can only ever be
        for the channel that was authorized. The token is deliberately
        short-lived, because the server cannot revoke a bearer credential the
        SFU has already accepted: somebody removed from a room is evicted
        through the room service, and the expiry bounds how long a token they
        still hold could let them back in.


        A 501 means this deployment has no SFU configured, which is a supported
        way to run a text-only server rather than a fault, so a client should
        hide voice instead of retrying.
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: A join token for the channel's room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          description: This deployment has no voice configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{channelId}/voice/heartbeat:
    post:
      operationId: sendVoiceHeartbeat
      tags: [voice]
      summary: Refresh proof that the caller is still on this channel's call.
      description: >
        Requires `VIEW_CHANNEL` and `CONNECT`, the same gate minting a token
        needs: a heartbeat for a room the caller could not have joined proves
        nothing.


        A LiveKit room eventually reaps a connection that vanished without a
        clean close on its own, but that timing is the SFU's, not this
        server's to promise. A client still on the call sends this on a plain
        interval, independent of whether the app is foregrounded, so a
        genuinely backgrounded call is never mistaken for a dead one; a
        terminated app simply stops, and once its last heartbeat is old
        enough the server evicts it from the room itself rather than waiting
        on the SFU's own default.


        Idempotent: repeating it only pushes the deadline further out.


        A 501 means this deployment has no SFU configured.
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "204":
          description: The heartbeat was recorded.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          description: This deployment has no voice configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: forgetVoiceHeartbeat
      tags: [voice]
      summary: Tell the server this call was left cleanly.
      description: >
        No permission gate beyond authentication, unlike every other voice
        route: forgetting a caller's own liveness marker exposes nothing
        about the channel it names, so there is nothing here for a
        permission check to protect and a permission revoked mid-call must
        not be what blocks a client's own cleanup.


        Meant to be sent once, right after leaving a call, so the server
        drops the entry immediately rather than leaving it for the sweep to
        rediscover once it goes stale and evict a participant who already
        disconnected on their own. Idempotent, and answers the same way on a
        deployment with no SFU configured or a channel that does not exist:
        there is never anything to forget either way.
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "204":
          description: The heartbeat entry was dropped, or there was none to drop.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/voice/roster:
    get:
      operationId: listVoiceRoster
      tags: [voice]
      summary: Who is currently in a channel's voice room.
      description: >
        Requires `VIEW_CHANNEL` alone, the same bit `listMessages` reads
        under: seeing who is talking is exactly as sensitive as seeing what
        they typed, and no more, so this does not also require `CONNECT`.


        A participant who has chosen to appear offline is omitted from every
        viewer's roster but their own, the same treatment presence gives
        everywhere else. This is a real round trip to the SFU's room
        service, unlike minting a token, so a client should poll it on an
        interval rather than on every render.


        A 501 means this deployment has no SFU configured. A 503 means one is
        configured but could not be reached right now; both are distinct from
        a 200 with an empty list, which means the room is genuinely empty.
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: Who the SFU reports as connected, visible to this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceRoster"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          description: This deployment has no voice configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"

  /channels/{channelId}/voice/participants/{userId}/kick:
    parameters:
      - name: channelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: kickVoiceParticipant
      tags: [voice]
      summary: Evict a participant from a channel's voice room.
      description: >
        Requires KICK_MEMBERS in that channel, evaluated per channel rather
        than deployment-wide. Idempotent: removing somebody who is not
        connected succeeds, since the SFU is the authority on who is in the
        room and a retried request must not report a kick that landed as a
        failure.


        This does not prevent the target requesting a new token. Removing
        CONNECT is what bars someone from a room; this is what makes that take
        effect immediately rather than when their current token expires.
      responses:
        "204":
          description: The participant is no longer in the room.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          description: This deployment has no voice configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /voice/webhook:
    post:
      operationId: receiveLiveKitWebhook
      tags: [voice]
      security: []
      summary: Internal - LiveKit's own webhook, never called by this repo's client.
      description: >
        Not part of the client-facing wire contract; documented here only
        because every route the router serves must appear in this file. The
        only caller is the configured LiveKit deployment itself, and the only
        client of what it publishes is `hub::Event` - see
        docs/decisions/0032-voice-participant-webhooks.md.


        Authenticated by the request's own `Authorization: <JWT>` header,
        verified against the deployment's configured LiveKit API key and
        secret (the same trio `SLIMM_LIVEKIT_URL`/`_API_KEY`/`_API_SECRET`
        voice already requires), never a session. A `403` means the
        signature did not verify; a `501` means this deployment has no SFU
        configured at all, so there is no secret to verify against.


        Always `204` once the signature verifies, including for an event
        this server takes no action on - LiveKit retries any non-2xx
        response, and an event this server deliberately ignores
        (`room_started`, egress events, a non-screen-share track) is not a
        delivery failure.
      requestBody:
        required: true
        content:
          application/webhook+json:
            schema:
              $ref: "#/components/schemas/LiveKitWebhookEvent"
      responses:
        "204":
          description: The signature verified; the event was applied or deliberately ignored.
        "403":
          description: The signature did not verify.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          description: This deployment has no voice configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /channels/{channelId}/voice/ring:
    post:
      operationId: ringDmCall
      tags: [voice]
      summary: Ring the other side of a DM call.
      description: >
        Requires `VIEW_CHANNEL` and `CONNECT`, the same gate minting a token
        already needs; a blocked party never reaches this far, since `CONNECT`
        is one of the bits a block removes.


        Refuses anything that is not a DM between the caller and exactly one
        other account with a 404: ringing is meaningless for any other channel
        shape, and a caller's own personal space has nobody on the other end
        to ring.


        Publishes a live `call.ringing` event to the other participant and, in
        the background, a push notification if their account's notification
        preference allows it - see `call.ringing`'s own schema doc for exactly
        what that means. A second ring for the same channel replaces whatever
        was already outstanding rather than stacking a second one.


        The response's `timeout_ms` is how long the server itself will wait
        before giving up on this ring if nobody answers; a client renders its
        own countdown from it rather than hard-coding a duration that could
        drift from the server's.


        A 501 means this deployment has no SFU configured.
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: The ring was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RingStarted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          description: This deployment has no voice configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /voice/rings/incoming:
    get:
      operationId: listIncomingDmCallRings
      tags: [voice]
      summary: List the DM call rings still waiting on the caller.
      description: >
        For a client that connected after a `call.ringing` event was published,
        such as an app launched from a closed state by a VoIP push. Only rings
        naming the authenticated account as the callee are returned, newest
        first; a ring past its timeout is never listed. Reading claims nothing:
        answering is still the callee's first voice heartbeat, and declining
        still goes through `declineDmCallRing`.
      responses:
        "200":
          description: The outstanding rings, possibly none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomingDmCallRings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /channels/{channelId}/voice/ring/decline:
    post:
      operationId: declineDmCallRing
      tags: [voice]
      summary: Decline an incoming DM call ring.
      description: >
        No `CONNECT` check, unlike every other voice route but
        `forgetVoiceHeartbeat`: declining reveals and grants nothing about the
        room itself, only that this caller chose not to join it.


        Idempotent: declining a ring that already ended some other way
        (answered, canceled, or already timed out) finds nothing outstanding
        and still returns 204.


        Publishes a live `call.ring_ended` event (`outcome: declined`) to the
        caller, and evicts the caller's own participant from the SFU room if
        they had already joined it while the ring was outstanding, so the room
        is released immediately rather than left for the ring's own timeout.
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "204":
          description: The ring was declined, or there was none outstanding.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /space/settings:
    get:
      operationId: getSpaceSettings
      tags: [space]
      summary: Read the deployment's settings.
      description: >
        Gated on MANAGE_SERVER, the same bit that changes them. Whether the
        Space is open to join is already public through `/version`, which
        onboarding needs before an account exists; this route exists so the
        screen that changes it can show the current value, and gating reads
        keeps a later setting from becoming member-readable by default.
      responses:
        "200":
          description: The current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: updateSpaceSettings
      tags: [space]
      summary: Change the deployment's settings.
      description: >
        `join_policy` is `invite` (a code is required to register) or `open`
        (anyone who can reach the server may). An open Space still accepts a
        code, so an invite that grants a role keeps working. Any other value
        is refused rather than coerced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceSettings"
      responses:
        "200":
          description: The settings as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /bots:
    get:
      operationId: listBots
      tags: [bots]
      summary: Bots in the deployment.
      description: >-
        Carries no token. A bot that is still a member is always listed, even
        with its token revoked, with its token fields absent, so an operator
        can see that it can no longer act. A bot that has been removed from
        the Space is left out by default: it is already gone from `GET
        /members`, so keeping it here forever would answer "every bot ever
        minted" rather than "what has a credential on this deployment". Pass
        `include_removed=true` to see those too.
      parameters:
        - name: include_removed
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            Include bots that have been removed from the Space. Default
            false.
      responses:
        "200":
          description: The bots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createBot
      tags: [bots]
      summary: Create a bot and issue its token.
      description: >-
        The only response that ever carries the token; it is stored hashed and
        cannot be read back. A managed role is created alongside the bot,
        holding the requested `permissions` (default none). Refused for a
        caller that is itself a bot, so one compromised credential cannot
        mint another that survives revoking it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBotRequest"
      responses:
        "201":
          description: The bot, and its token once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewBot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /bots/{botId}/revoke:
    parameters:
      - name: botId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The bot's user id.
    post:
      operationId: revokeBot
      tags: [bots]
      summary: Revoke a bot's token and session.
      description: >-
        Stops the bot on its next request. The account and its roles stay, so
        what it wrote stays attributed to it, exactly as revoking a person's
        session does.
      responses:
        "204":
          description: Revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /bots/commands:
    put:
      operationId: setBotCommands
      tags: [bots]
      summary: Bulk-overwrite the caller's own registered prefix and commands.
      description: >-
        Advertisement, not interactions (decision
        0031-bot-command-registration): registering a command never gives the
        server anything to run. It only lets the composer offer `/name` as a
        row that inserts the bot's own prefix and keyword as plain text,
        exactly the message the bot's own process already parses today - the
        server never checks a caller's identity or permissions before
        delivering that message, and a declared `permission` only hides the
        row in the composer for a caller who lacks it, so the bot must still
        verify who sent it. Refused for a caller that is not itself a bot.

        Replaces the caller's *entire* prior registration - prefix and every
        command - in one transaction, all or nothing: a set that fails
        validation leaves the previous registration untouched rather than
        partially applying. A bot is expected to re-register its complete set
        on every connect, the same bulk-overwrite shape Discord's own
        application-command registration uses, so a command dropped from its
        own source actually disappears rather than lingering as a stale
        advertisement.

        Caps: at most 50 commands; a prefix is 1 to 16 characters, has no
        whitespace, and must not be one of the composer's own reserved
        triggers `/`, `@`, `:`; a command name is 1 to 32 characters of
        letters, digits, `-` and `_` and must be unique (case-insensitively)
        within the set; a description is 1 to 100 characters; a `usage` hint
        is at most 80 characters; a `permission` is exactly one bit from
        `Permissions`, the same bitmask `getChannelPermissions` returns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBotCommandsRequest"
      responses:
        "204":
          description: Registered.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/ephemeral-messages:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: sendEphemeralMessage
      tags: [bots]
      summary: Answer a member privately, so only they see it.
      description: >-
        Bot-only (decision 0037-ephemeral-bot-messages). The message is never
        stored: it goes out over the live socket to the recipient's own
        connections and is gone on reload. It has no `seq`, so it leaves no
        gap in the channel's ordering, and it never appears in
        `listMessages`, search or `sync`. Moderators cannot see it; a recipient can report it with
        `fileReport` and `subject_kind: ephemeral_message`.

        The recipient is not named. It is the author of `in_reply_to_id`, a
        live message from a person in this channel, sent within the last 15
        minutes, and addressed to the caller: it mentions the bot, replies to
        one of the bot's messages, or opens with the bot's registered prefix
        and one of its registered commands (decision 0031). A message that
        does none of those is refused, so a bot can answer someone who spoke
        to it and reach nobody else. The caller needs `VIEW_CHANNEL` and
        `SEND_MESSAGES` in the channel, and the recipient must still be able
        to view it. At most 3 private messages may be sent per anchor; the
        fourth is a 429. A member who has blocked the bot never receives it,
        and the call still succeeds. Bots and the caller's own messages are
        not valid anchors. The 403 is the same whatever the reason. Content
        follows the same length rules as `sendMessage`, except that it may be
        empty when `embeds` or `attachment_ids` is given. Embeds follow
        `sendMessage`'s caps. An attachment must already be fetchable by both
        the bot and the recipient, since nothing here can make a file
        fetchable; anything else is one 400. Also metered as an ordinary
        write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendEphemeralMessageRequest"
      responses:
        "200":
          description: Sent to the recipient's connected devices, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EphemeralMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/messages/{messageId}/interactions:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: pressMessageButton
      tags: [bots]
      summary: Press a button on a bot's message.
      description: >-
        Decision 0039-bot-message-buttons. The press is delivered to the
        message's author bot only, as an `interaction.created` frame carrying
        the presser's id and display name, and nothing about it is stored
        beyond a row that expires after 15 minutes. The caller needs
        `VIEW_CHANNEL`, must not be a bot, and the message must be a live bot
        message carrying an enabled, non-link button with that `custom_id`.
        Every refusal that depends on the message or the button is the same
        404. The `id` is chosen by the caller, so a retry is the same press;
        an id already used by another account is a 409. Charged to its own
        per-caller rate limit class.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PressButtonRequest"
      responses:
        "200":
          description: Recorded and delivered to the bot, if it is connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/messages/{messageId}/components:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setMessageComponents
      tags: [bots]
      summary: Replace or clear the buttons on a bot's own message.
      description: >-
        Decision 0039-bot-message-buttons. Only the bot that authored the
        message, with `VIEW_CHANNEL` and `SEND_MESSAGES`. The list replaces the
        old one whole (an empty list clears it), is checked against the same
        caps as `sendMessage`, and reaches every viewer as a
        `message.components` frame. Naming the press being answered in
        `interaction_id` also marks it answered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMessageComponentsRequest"
      responses:
        "200":
          description: The buttons as stored.
          content:
            application/json:
              schema:
                type: object
                required: [components]
                properties:
                  components:
                    type: array
                    items:
                      $ref: "#/components/schemas/ComponentRow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/interactions/{interactionId}/ack:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
      - name: interactionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: acknowledgeInteraction
      tags: [bots]
      summary: Say a button press was seen and needs no visible answer.
      description: >-
        Decision 0039-bot-message-buttons. Only the bot the press was sent to,
        within 15 minutes of it. The presser's button stops waiting; nobody
        else is told. Answering with a private reply or a components change
        that names the press does the same, so this is only for a press that
        needs neither.
      responses:
        "204":
          description: Acknowledged. Repeating it is harmless.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /bots/{botId}/commands:
    parameters:
      - name: botId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The bot's user id.
    get:
      operationId: getBotCommands
      tags: [bots]
      summary: A bot's whole registered prefix and command list.
      description: >-
        Unfiltered by any viewer's own channel or permissions - what a
        profile popover shows about the bot itself, not what one particular
        caller may currently be offered in one particular channel (see
        `listChannelBotCommands` for that). `prefix` is absent and `commands`
        is empty for a bot that has never registered anything, including for
        an id that does not name a bot at all - the same clean-no-op shape
        `listSlashCommands` gives an empty deployment, rather than a 404 that
        would let a caller probe which ids exist.
      responses:
        "200":
          description: The bot's registration, possibly empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotCommandRegistration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /bots/ui:
    put:
      operationId: setBotUi
      tags: [bots]
      summary: Bulk-overwrite the caller's own message menu entries and call controls.
      description: >-
        Decision 0045-bot-contributed-ui. Replaces the caller's whole
        registration in one transaction, all or nothing, so a bot re-sends its
        complete set on every connect. Refused for a caller that is not a bot.
        At most 5 `message_menu` entries and 8 `call_controls`. A label is 1 to
        32 characters and cannot hold control, zero-width or bidi characters;
        an id is 1 to 64 characters of letters, digits and `-_.`, unique within
        its surface. `icon` is one of `play`, `pause`, `stop`, `skip_next`,
        `skip_previous`, `volume`, `volume_off`, `repeat`, `shuffle`, `list`,
        and only a call control takes one. `permission` is one
        `Permissions` bit the member must hold in the channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBotUiRequest"
      responses:
        "204":
          description: Registered.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/bot-ui:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: listChannelBotUi
      tags: [channels]
      summary: Menu entries and call controls the caller may be offered in this channel.
      description: >-
        Decision 0045-bot-contributed-ui. A bot is listed only while its token
        is live, it is still a member of the Space and it holds `VIEW_CHANNEL`
        here. An entry that names a `permission` is left out when the caller
        lacks it. Masked to an empty list for a caller who cannot view the
        channel. Each bot is listed with its own name so a client can show
        its entries apart from the app's own.
      responses:
        "200":
          description: Each bot's entries here, possibly empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelBotUi"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/watch-session:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: getWatchSession
      tags: [channels]
      summary: What the room is watching and where it is.
      description: >-
        Decision 0050-watch-party-sync-authority-and-direct-play. The durable
        copy of the position `watch.tick` carries, which a late joiner or a
        reconnect reads here. A playing position is `position_ms` plus the time
        since `sampled_at_ms`, measured on the server clock given as
        `server_time_ms`. 404 when nothing is playing, for a caller who cannot
        view the channel, once the bot has gone `ttl_ms` without a tick, and
        once the bot is no longer on the call.
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      operationId: setWatchSession
      tags: [channels]
      summary: A bot states the room's watch session.
      description: >-
        Decision 0050-watch-party-sync-authority-and-direct-play. Refused for a
        caller that is not a bot, for a channel that is not a voice channel
        the bot can view, and for a bot that is not on the call (403). The
        epoch changes when `item_id` changes or `seeked` is true, and is a
        millisecond timestamp so it never repeats across an end and a new
        session. `controller_user_id` must be a user who can view the
        channel, and is advisory. Fans out as a `watch.tick` so viewers hear
        of a play, pause or seek now. A session whose bot is still on the call
        and has ticked within `ttl_ms` is not replaced by another bot (409);
        one whose bot has left is. Charged to the tick rate class.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetWatchSessionRequest"
      responses:
        "204":
          description: Set.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: endWatchSession
      tags: [channels]
      summary: A bot ends its own watch session.
      description: >-
        Fans out a `watch.tick` with `ended` true. A bot that leaves the call
        through `DELETE /channels/{channelId}/voice/heartbeat` ends its
        session the same way.
      responses:
        "204":
          description: Ended.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/watch-session/tick:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: tickWatchSession
      tags: [channels]
      summary: A bot re-samples its session's position.
      description: >-
        Decision 0050-watch-party-sync-authority-and-direct-play. Send one
        about every 5 seconds, paused or not: it is the session's heartbeat,
        and a session `ttl_ms` without one reads as ended. Refused with 403
        when the bot is not on the call. Fans out as a `watch.tick`. Charged
        to its own rate class, not the write class.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchTickRequest"
      responses:
        "204":
          description: Sampled.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /channels/{channelId}/bot-ui/{botId}/interactions:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
      - name: botId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: useBotUiEntry
      tags: [bots]
      summary: Use a bot's message menu entry or call control.
      description: >-
        Decision 0045-bot-contributed-ui. Delivered to that bot only, as an
        `interaction.created` frame with `kind` `message_menu` or
        `call_control`, the entry id as `custom_id` and the member's id and
        display name, the same as a button press, and answered the same way
        (`sendEphemeralMessage` with `interaction_id`, or
        `acknowledgeInteraction`). The caller needs `VIEW_CHANNEL` and must
        not be a bot. A menu entry names the message it was used on. A call
        control needs a voice channel with the caller on its call, else 403.
        A bot that has left or cannot view the channel, an entry it has not
        registered, one whose `permission` the caller lacks and a message
        that is not in the channel are the same 404. The `id` is chosen by the
        caller, so a retry is the same use. Charged to the same per-caller
        rate limit class as a button press.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UseBotUiEntryRequest"
      responses:
        "200":
          description: Recorded and delivered to the bot, if it is connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /bots/{botId}/permissions:
    parameters:
      - name: botId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The bot's user id.
    patch:
      operationId: setBotPermissions
      tags: [bots]
      summary: Change what a bot's managed role grants.
      description: >-
        A convenience shortcut for editing the managed role's permissions
        directly, guarded exactly like a human role edit: every bit must
        already be held by the caller, and the role's *current* bits must not
        already exceed what the caller holds. See
        docs/decisions/0028-bot-accounts.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBotPermissionsRequest"
      responses:
        "200":
          description: The bot, with its updated permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /webhooks/{webhookId}/{token}:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The webhook's own id, from the URL pasted into a caller's configuration.
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: >-
          The webhook's bearer credential. In the path, not a header, because
          the callers this route exists for take one URL field and
          paste-ability is the entire feature.
      - name: wait
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: >-
          When true, answers 200 with a minimal acknowledgement instead of
          204. Never the full `Message` DTO: its per-viewer fields
          (`mentions_me`, a reaction's own `reacted`) mean nothing for a
          caller that is not a viewer.
    post:
      operationId: deliverWebhook
      tags: [webhooks]
      security: []
      summary: Post as a webhook, unauthenticated by anything but the token.
      description: >-
        The only route in the product a webhook credential can use, and the
        only one with no client binding by design: a webhook URL is pasted
        into somebody else's program, never sent by this repo's own client.
        See docs/decisions/0030-incoming-webhooks.md.


        A missing id, an unknown id, a wrong token, and a revoked webhook all
        answer the identical 404 below, so this route is never an existence
        oracle for which webhook ids are live.


        Rate limited twice: an address-keyed budget charged before the token
        even resolves, so a flood of unknown tokens costs a cheap in-memory
        check rather than a database lookup per request, then a second
        budget keyed on the webhook's own id once it does. Both answer 429.


        An `Idempotency-Key` header makes a retried delivery land on the
        exact same message rather than posting twice. A caller that sends
        none gets ordinary at-least-once delivery: a genuine retry of a
        request whose response never arrived can post a duplicate, which is
        treated as the honest case it is rather than something to silently
        deduplicate by content.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomingWebhookPayload"
      responses:
        "204":
          description: Delivered.
        "200":
          description: Delivered, answered instead of 204 because the caller asked with `?wait=true`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveredWebhookMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /webhooks:
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: Webhooks in the deployment, newest first.
      description: >-
        Carries no credential. See docs/decisions/0030-incoming-webhooks.md's
        admin-surface addendum for why the list, not the response body, is
        where an operator learns which webhooks exist.
      responses:
        "200":
          description: The webhooks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createWebhook
      tags: [webhooks]
      summary: Mint a webhook and its delivery path.
      description: >-
        The only response that ever carries the delivery path with its token
        legible; it is stored hashed and cannot be read back. Fixed to
        `channel_id` at mint, never editable - see the decision record for
        why re-pointing an already-pasted URL is refused rather than offered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "201":
          description: The webhook, and its delivery path once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewWebhook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /webhooks/{webhookId}:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The webhook's own id.
    patch:
      operationId: renameWebhook
      tags: [webhooks]
      summary: Rename a webhook's admin-facing label.
      description: >-
        Updates the label shown in the admin surface and the webhook
        principal's own display name together, the same pair
        `createWebhook` sets in one step.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameWebhookRequest"
      responses:
        "200":
          description: The renamed webhook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /webhooks/{webhookId}/rotate:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The webhook's own id.
    post:
      operationId: rotateWebhook
      tags: [webhooks]
      summary: Issue a webhook a new token, keeping its identity.
      description: >-
        The old delivery path 404s from the same commit and the new one is
        returned here, once, like createWebhook. The webhook keeps its
        principal, so what it already posted stays attributed to it. Audited
        as webhook_rotate.
      responses:
        "200":
          description: Rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewWebhook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /webhooks/{webhookId}/revoke:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The webhook's own id.
    post:
      operationId: revokeWebhook
      tags: [webhooks]
      summary: Revoke a webhook.
      description: >-
        Its delivery path 404s on its very next attempt. There is no session
        and no socket to also close, so the row going away is the whole of
        it. Whatever it already posted stays attributed to it.
      responses:
        "204":
          description: Revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /space/analytics:
    get:
      operationId: getSpaceAnalytics
      tags: [space]
      summary: Read this Space's usage stats, if analytics recording is on.
      description: >
        Gated on MANAGE_SERVER, the same bit as `/space/settings`. Answers 200
        either way: `stats` is present only when `enabled` is true, so a
        disabled deployment reads as an off feature rather than an error a
        client has to special-case apart from a real permission failure.
        `stats.messages_by_day` and `active_hours` cover a trailing 30-day
        window; `active_hours` is a 24-bucket histogram summed across every
        author, never broken out per member. `member_storage` is the one
        exception to that rule: per-member attachment bytes, for storage
        stewardship, kept out of `stats` on purpose.
      responses:
        "200":
          description: The current toggle state, and stats if it is on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceAnalytics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: updateSpaceAnalytics
      tags: [space]
      summary: Turn Space analytics recording on or off.
      description: >
        Off by default on every deployment. Turning it on does not start a
        background job: the one recorded series (this process's own memory)
        is sampled lazily on a later read of this same route, at most once
        every five minutes, so a deployment that enables it and never opens
        the analytics screen adds nothing to what runs. Turning it off stops
        this route answering with stats; already-recorded samples are kept
        rather than deleted, and reappear if it is turned back on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSpaceAnalytics"
      responses:
        "200":
          description: The toggle state after the change, and stats if now on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceAnalytics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /space/storage:
    get:
      operationId: getSpaceStorage
      tags: [space]
      summary: Read operator-visible storage usage and background sweep health.
      description: >
        Gated on MANAGE_SERVER, the same bit as `/space/analytics`, and always
        computes - there is no on/off toggle. `database_bytes` and
        `database_reclaimable_bytes` come from SQLite's own page accounting,
        not a filesystem stat or directory walk. `attachment_bytes` is the
        same total `/space/analytics` reports. `top_channels` excludes DMs
        and threads, the same scope `/space/analytics`'s `channel_count`
        uses. `sweeps` lists every background sweep that has recorded at
        least one run; a sweep that has never run is simply absent.
      responses:
        "200":
          description: Current storage usage and sweep status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceStorage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /space/retention:
    get:
      operationId: getSpaceRetention
      tags: [space]
      summary: Read the message retention window.
      description: >
        Gated on MANAGE_SERVER, the same bit as `/space/analytics`. `0` means
        disabled - keep every message forever - and is the default every
        deployment keeps on upgrade.
      responses:
        "200":
          description: The current window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceRetention"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: updateSpaceRetention
      tags: [space]
      summary: Change the message retention window.
      description: >
        A background sweep prunes messages older than `retention_days` on a
        periodic tick, not immediately on this call. Pruning is a soft
        delete, the same shape a manual message delete already produces, so
        a client that missed it while offline recovers the same way it
        recovers from any other message-op gap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceRetention"
      responses:
        "200":
          description: The window after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceRetention"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /space/canvas-cap:
    get:
      operationId: getSpaceCanvasCap
      tags: [space]
      summary: Read the per-channel canvas object cap.
      description: >
        Gated on MANAGE_SERVER, the same bit as `/space/analytics`. The cap is
        the most live objects one channel's canvas may hold before a placement
        is refused; it applies to every client. The default a deployment keeps
        on upgrade is 20000.
      responses:
        "200":
          description: The current cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceCanvasCap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: updateSpaceCanvasCap
      tags: [space]
      summary: Change the per-channel canvas object cap.
      description: >
        Lower it to keep a busy canvas light on every client's memory and
        paint, raise it to allow denser boards at that cost. A value outside
        the settable range (100 to 100000) is refused rather than clamped.
        The new cap governs the next placement; objects already on a canvas
        over a freshly-lowered cap are not removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceCanvasCap"
      responses:
        "200":
          description: The cap after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceCanvasCap"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /space/screen-share:
    get:
      operationId: getSpaceScreenShareCap
      tags: [space]
      summary: Read the screen-share resolution ceiling.
      description: >
        Gated on MANAGE_SERVER, the same bit as `/space/analytics`. The
        ceiling is client-advertised: a client reads it and caps its own
        screen-share capture and publish parameters before starting a share.
        There is no server-side track inspection. The default a deployment
        keeps on upgrade is 2160.
      responses:
        "200":
          description: The current ceiling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceScreenShareCap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: updateSpaceScreenShareCap
      tags: [space]
      summary: Change the screen-share resolution ceiling.
      description: >
        Lower it to keep a screen share light on every client's bandwidth and
        the SFU, raise it to allow a sharper share at that cost. A value
        outside the settable range (360 to 2160) is refused rather than
        clamped. The new ceiling applies to the next share a client starts;
        a share already in progress is unaffected until it is restarted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceScreenShareCap"
      responses:
        "200":
          description: The ceiling after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceScreenShareCap"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /space/dock/modules:
    get:
      operationId: listDockModules
      tags: [space]
      parameters:
        - $ref: "#/components/parameters/DockSourceQuery"
      summary: Browse the module marketplace's index. Requires MANAGE_SERVER.
      description: >
        Fetches `index.json` from the addons repo (docs/decisions/0021) over
        a host-allowlisted client. Nothing is installed by this call. The
        `source` query parameter picks a community source (decision 0046);
        omitted, it reads the official one. An entry with `shadowed: true`
        cannot be installed from this source. A source with no registry at
        that repository answers 404; 503 is kept for an upstream that is
        really unreachable.
      responses:
        "200":
          description: The marketplace listing.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DockIndexEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/UpstreamInvalid"
        "503":
          $ref: "#/components/responses/Unavailable"
  /space/dock/modules/{moduleId}:
    parameters:
      - name: moduleId
        in: path
        required: true
        description: The module's slug id from the registry's index.
        schema:
          type: string
    get:
      operationId: getDockModule
      tags: [space]
      parameters:
        - $ref: "#/components/parameters/DockSourceQuery"
      summary: Read a module's full manifest before installing it. Requires MANAGE_SERVER.
      description: >
        Shows every permission the module will register and every capability
        it asks for, so an admin reviews both before installing.
      responses:
        "200":
          description: The module's manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DockManifest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/UpstreamInvalid"
        "503":
          $ref: "#/components/responses/Unavailable"
  /space/dock/modules/{moduleId}/install:
    parameters:
      - name: moduleId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: installDockModule
      tags: [space]
      parameters:
        - $ref: "#/components/parameters/DockSourceQuery"
      summary: Install a module at a pinned version. Requires MANAGE_SERVER.
      description: >
        Re-fetches the module's manifest, refuses if its version no longer
        matches the one requested, refuses (409) an id another source already
        owns (decision 0046), and records the install, its declared
        permissions, and its approved capabilities. No runtime executes the
        module; see docs/decisions/0021's phasing. Off (disabled) by default -
        a separate enable call turns it on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallDockModuleRequest"
      responses:
        "200":
          description: The installed module.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledDockModule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/UpstreamInvalid"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: uninstallDockModule
      tags: [space]
      summary: Uninstall a module. Requires MANAGE_SERVER.
      description: >
        Removes the install, its registered permissions, and every role
        grant of them - nothing dangles.
      responses:
        "204":
          description: The module was uninstalled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /space/dock/modules/{moduleId}/enable:
    parameters:
      - name: moduleId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: enableDockModule
      tags: [space]
      summary: Enable an installed module. Requires MANAGE_SERVER.
      description: >
        Refused with 409 when another enabled module already provides one of
        this module's slash command keywords (compared case-insensitively),
        because a composer would otherwise run whichever was listed first.
        Disable the other module first. Installing a new version of an already
        enabled module is refused the same way.
      responses:
        "200":
          description: The module after enabling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledDockModule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /space/dock/modules/{moduleId}/disable:
    parameters:
      - name: moduleId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: disableDockModule
      tags: [space]
      summary: Disable an installed module without losing its config. Requires MANAGE_SERVER.
      responses:
        "200":
          description: The module after disabling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledDockModule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /space/dock/installed:
    get:
      operationId: listInstalledDockModules
      tags: [space]
      summary: List every installed module. Requires MANAGE_SERVER.
      responses:
        "200":
          description: Every installed module.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstalledDockModule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /space/dock/sources:
    get:
      operationId: listDockSources
      tags: [space]
      summary: List the module sources, the official one first. Requires MANAGE_SERVER.
      responses:
        "200":
          description: Every module source.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DockSource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: addDockSource
      tags: [space]
      summary: Add a community module source. Requires MANAGE_SERVER.
      description: >
        A source is a GitHub `owner/repo` slug read from the same fixed host
        as the official one (decision 0046); a URL or any other host is
        refused. Adding a repo that is already a source answers 200 with the
        existing one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDockSourceRequest"
      responses:
        "200":
          description: That repo was already a source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DockSource"
        "201":
          description: The source was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DockSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /space/dock/sources/{sourceId}:
    parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: removeDockSource
      tags: [space]
      summary: Remove a community module source. Requires MANAGE_SERVER.
      description: >
        Modules already installed from it stay installed and enabled; they
        keep their source label and cannot be updated until the source is
        added again (decision 0046). The official source cannot be removed.
      responses:
        "204":
          description: The source was removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /modules/{moduleId}/commands/{command}:
    parameters:
      - name: moduleId
        in: path
        required: true
        description: The installed module's slug id.
        schema:
          type: string
      - name: command
        in: path
        required: true
        description: The `command` extension point's own name from its manifest.
        schema:
          type: string
    post:
      operationId: runModuleCommand
      tags: [space]
      summary: Runs an installed module's command in the wasm sandbox.
      description: >
        Requires the module to be installed and enabled, and the caller to
        hold the permission its manifest declared for this command (see
        DockExtensionPoint). Runs the module's own wasm artifact under its
        declared resource limits (docs/decisions/0021's "Module ABI v1"
        section); a fuel, memory, or wall-clock limit hit still answers 200
        with `ok: false`, never a 500 and never a hang.


        `moduleId: "code-runner"` is reserved: it never names an installed
        module and instead reaches this deployment's optional code-runner
        broker (docs/decisions/0026), which speaks a self-hosted Piston
        instance's own protocol and never executes anything itself. It
        requires the `RUN_CODE` permission (default: nobody) instead of a
        module permission, and answers 404 when no runner is configured -
        absent configuration is this route's normal, fully supported state.
        `command` is the language name, from `GET /modules/code-block-runners`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunModuleCommandRequest"
      responses:
        "200":
          description: The module ran; see `ok` for whether it succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunModuleCommandResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /modules/code-block-runners:
    get:
      operationId: listCodeBlockRunners
      tags: [space]
      summary: Discover which code-block runners this caller may use.
      description: >
        One entry per installed and enabled module that declares a
        `code-block-runner` extension point and whose declared permission the
        caller holds (Store::user_has_module_permission). Never names a
        runner the caller cannot reach; an empty list means the client should
        offer no Run affordance at all. Each entry's own `language` lets a
        client match a runner to a fenced block's language tag rather than
        picking the first one regardless of language; a `null` language is a
        wildcard. slim has no notion of what any runner does - see
        docs/decisions/0021's module-agnostic principle.


        Also includes one entry per language this deployment's optional code
        runner currently reports installed, under the reserved
        `module_id: "code-runner"` (docs/decisions/0026) - only when a runner
        is configured and the caller holds `RUN_CODE`. This reuses the exact
        same discovery a module's own `code-block-runner` extension point
        uses rather than a parallel mechanism.
      responses:
        "200":
          description: The code-block runners this caller may use, possibly empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CodeBlockRunner"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /modules/slash-commands:
    get:
      operationId: listSlashCommands
      tags: [space]
      summary: Discover which slash commands this caller may use in the composer.
      description: >
        One entry per installed and enabled module that declares a
        `slash-command` extension point and whose declared permission the
        caller holds (Store::user_has_module_permission). Each entry's `name`
        is the keyword the composer offers as `/name` and `command` is the
        `command` extension point to POST to via
        /modules/{moduleId}/commands/{command}. An empty list means the
        composer offers no module slash commands. slim has no notion of what
        any command does - see docs/decisions/0021's module-agnostic principle.
      responses:
        "200":
          description: The slash commands this caller may use, possibly empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlashCommand"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /modules/apps:
    get:
      operationId: listApps
      tags: [space]
      summary: Discover which apps this caller may launch into a channel.
      description: >
        One entry per installed and enabled module that declares an `app`
        extension point and whose declared permission the caller holds
        (Store::user_has_module_permission). Each entry's `name` is what the
        composer's apps menu shows and `command` is the `command` extension
        point that `launchAppMessage` posts. An empty list means no launchable
        apps. slim has no notion of what any app does - see docs/decisions/0021's
        module-agnostic principle.
      responses:
        "200":
          description: The apps this caller may launch, possibly empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/App"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /read-states:
    get:
      operationId: listReadStates
      tags: [sync]
      summary: Read the caller's marker in every channel they can read.
      description: >
        One request instead of one `GET /channels/{channelId}/read` per
        channel, for a client signing in. Covers the channels `GET /channels`
        lists and every DM the caller is party to, hidden ones included, and
        only the caller's own markers. A channel never opened is answered with
        a zero marker, and each row is what the per-channel route would return.
        Order is unspecified.
      responses:
        "200":
          description: One entry per readable channel.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelReadState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /sync:
    post:
      operationId: sync
      tags: [sync]
      summary: Catch several scopes up in one request.
      description: >
        The reconnect path: send every per-scope cursor at once rather than one
        request per channel. Scopes the caller cannot view are omitted rather
        than refused, so the response never reveals a hidden channel. The
        response is capped per scope and in aggregate, and a cursor too far
        behind returns `reset`, meaning discard local state for that scope and
        refetch it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Per-scope deltas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ws:
    get:
      operationId: connectWebSocket
      tags: [system]
      summary: Open the event WebSocket.
      security: []
      description: >
        Upgrade, then send a `hello` frame carrying a ticket from
        `/auth/ws-ticket` and the protocol version. The server redeems the
        ticket and replies with its own `hello`. After that the connection
        carries server-to-client events, authorized per event, plus a ping and
        pong keepalive. See the ClientFrame and ServerFrame schemas.
      responses:
        "101":
          description: Switching protocols.
        "503":
          description: The connection ceiling was reached.

  /emoji:
    get:
      operationId: listCustomEmoji
      tags: [emoji]
      summary: Every custom emoji in this deployment.
      description: >
        Unpaginated on purpose: a client needs the whole set to render any
        message containing a `:shortcode:`, and the set is capped server-side.
        Readable by every authenticated member, unlike an attachment, which is
        gated on viewing a channel that references it - an emoji renders inside
        messages a member may already read, and gating it per channel would
        leak which channels use which emoji.
      responses:
        "200":
          description: The deployment's emoji, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomEmoji"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: uploadCustomEmoji
      tags: [emoji]
      summary: Add a custom emoji.
      description: >
        Requires MANAGE_SERVER. The name is normalised to lowercase a-z, 0-9
        and underscore, so two spellings of one name collide rather than
        creating two emoji a `:shortcode:` could not choose between. Content
        type is sniffed from the bytes against the inline image allowlist,
        never taken from a header. The bytes reuse the content-addressed
        attachment store, so an image already present costs no second copy.
        A name that is a standard unicode emoji's shortcode is refused with
        409, since the custom emoji would shadow it. An image identical to an
        existing emoji's is accepted and names that emoji in `same_image_as`.
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "201":
          description: The emoji was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomEmoji"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  /emoji/{emoji_id}:
    delete:
      operationId: deleteCustomEmoji
      tags: [emoji]
      summary: Remove a custom emoji.
      description: >
        Requires MANAGE_SERVER. Idempotent: removing one already gone answers
        204, so a retry never has to tell "gone" from "never existed". The
        stored bytes are left for the orphan sweep, since another emoji or a
        message may still reference the same hash.
      parameters:
        - name: emoji_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed, or already absent.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /emoji/{emoji_id}/image:
    get:
      operationId: fetchCustomEmojiImage
      tags: [emoji]
      summary: An emoji's image bytes.
      description: >
        Readable by any authenticated member. Served with the same security
        headers as an attachment and an immutable cache policy, since the
        bytes are content-addressed and cannot change under an id.
      parameters:
        - name: emoji_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            The emoji's raw bytes, served as the type sniffed from the stored
            bytes rather than anything the uploader claimed.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /emoji/bulk:
    post:
      operationId: bulkUploadCustomEmoji
      tags: [emoji]
      summary: Add several emoji in one request.
      description: >
        Requires MANAGE_SERVER. Exists so importing a pack of images is not
        one `POST /emoji` per image: that charges the upload rate limit once
        per image, which exhausts it long before a large pack finishes. This
        route charges the limit once for the whole request, however many
        images it carries.


        Validated and written as a whole: an unusable name, an unsupported
        image, or a name colliding with another image in the same request or
        an existing emoji, refuses the entire request rather than the one
        image at fault, so none of it is written. At most 50 images and 20
        MiB of decoded image data per request; a larger pack is split into
        more than one call. Each image is otherwise checked exactly as
        `uploadCustomEmoji` checks its own: normalised name, non-empty, at
        most 1 MiB, and sniffed as an inline image type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  description: At most 50 images, in the order they are created.
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [name, data]
                    properties:
                      name:
                        type: string
                        description: >
                          The emoji's requested name; normalised the same way
                          uploadCustomEmoji's own `name` is.
                      data:
                        type: string
                        format: byte
                        description: Standard base64 of the image's raw bytes.
      responses:
        "201":
          description: >
            Every image was added, in the same order as the request.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomEmoji"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "507":
          $ref: "#/components/responses/InsufficientStorage"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An opaque access token from register, login, or refresh.

  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      description: The channel's UUID.
      schema:
        type: string
        format: uuid
    DockSourceQuery:
      name: source
      in: query
      required: false
      description: >
        A module source's id from listDockSources; omitted, the official
        source.
      schema:
        type: string

  responses:
    Tokens:
      description: A new access and refresh token pair.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TokenPair"
    ReadStateResponse:
      description: The caller's read state in a channel.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReadState"
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, expired, or revoked credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        The caller lacks the required permission. A channel that does not exist
        is refused identically, so its existence is not observable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist within a scope the caller can see.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request collided with existing state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: >
        The request body is over the route's own limit, refused at the byte
        level before it is parsed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InsufficientStorage:
      description: >
        The deployment has no room left for what this would store, against
        `SLIMM_MAX_TOTAL_ATTACHMENT_BYTES`. Distinct from a 413, which means the
        single upload is over the per-file limit: one is the sender's to fix by
        sending something smaller, the other is the operator's. Nothing is
        written, so a retry after the operator raises the ceiling or the orphan
        sweep reclaims space succeeds unchanged.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >
        The caller is over its rate budget for this traffic class. Carries a
        `Retry-After` header (whole seconds, at least 1) computed from the
        class's own refill rate: the time until the caller's bucket holds one
        more token. The same number is in the body's `retry_after_seconds`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: The server shed the request under load; retry shortly.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UpstreamInvalid:
      description: >
        The Dock reached the module registry, but what it returned was
        malformed, oversized, or otherwise not a manifest this server is
        willing to install.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    CustomEmoji:
      type: object
      description: >-
        One of the deployment's own emoji. The name is what a member types
        between colons; the image is fetched at /emoji/{id}/image.
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
          description: Lowercase a-z, 0-9 and underscore, normalised on upload.
        uploader_id:
          type: string
          nullable: true
          description: Null once the uploader's account has been deleted.
        created_at:
          type: integer
          format: int64
        same_image_as:
          type: string
          description: >-
            Only on the upload response: the name of an older emoji with
            identical image bytes. The new emoji is still added.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: A short, stable, human-readable reason.
        retry_after_seconds:
          type: integer
          format: int64
          description: >
            How many seconds remain before the request would succeed. Present
            on a slow-mode 429 from `sendMessage` and on every rate-limiter
            429 (both also echoed as a `Retry-After` header); absent
            everywhere else, including the 429 of a two-factor lockout and of
            the private-message budget.
        missing_permissions:
          type: integer
          format: int64
          description: >
            The permission bits the caller lacked. Present only on the 403
            from a channel overwrite write that would grant bits the caller
            does not hold.

    Version:
      type: object
      required: [name, version, protocol]
      properties:
        name:
          type: string
        version:
          type: string
          description: The server's release version.
        build_id:
          type: string
          description: >
            Short git commit SHA the server was built from, so two deploys of
            one version can be told apart. Absent when the build was not given
            one (a plain `cargo run`, or a server older than this field).
        protocol:
          type: integer
          format: int32
          description: Wire-protocol envelope version a client negotiates against.
        push_enabled:
          type: boolean
          description: >
            Whether this deployment can deliver push notifications at all
            (a relay is configured). Absent on servers older than 0.8.0,
            which a client must treat as unknown rather than false.
            Deliberately unauthenticated: onboarding surfaces it before an
            account exists, so someone choosing a LAN-only server learns
            their phone will stay silent while they can still choose
            differently.
        invite_required:
          type: boolean
          description: >
            Whether creating an account here needs an invite code. Follows
            the deployment's `join_policy`. Absent on servers older than
            0.14.2, which a client must treat as unknown rather than false.
            Unauthenticated for the same reason `push_enabled` is: the
            sign-up screen has to say so before an account exists.
        claimed:
          type: boolean
          description: >
            Whether the first account has registered, which is what claims a
            deployment and makes it the administrator. False means the next
            registration becomes the admin and needs no invite, though
            `invite_required` still reads true. Absent on servers older than
            this field, which a client must treat as unknown rather than
            false. Unauthenticated like `invite_required`: it reveals only
            what an attempted registration already shows.
        gif_search_enabled:
          type: boolean
          description: >
            Whether this deployment can search and attach GIFs at all (both
            SLIMM_GIF_PROVIDER and SLIMM_GIF_API_KEY are set). A client is
            expected to check this before ever showing a GIF picker button,
            so a disabled deployment costs it nothing: no button, no
            request.
        link_previews_enabled:
          type: boolean
          description: >
            Whether this deployment unfurls pasted links into preview cards
            (SLIMM_LINK_PREVIEWS is set). A client checks this before asking
            for any link preview, so a disabled deployment makes no request.
        screen_share_max_height:
          type: integer
          description: >
            The tallest resolution a screen share may publish at. Follows
            the deployment's screen-share ceiling. Rides on `/version`,
            unauthenticated, rather than staying behind
            `GET /space/screen-share` (which is MANAGE_SERVER-gated): every
            client caps its own capture parameters before starting a share,
            not only one with MANAGE_SERVER. Absent on servers older than
            this field, which a client must treat as no ceiling.
        min_client_version:
          type: string
          description: >
            The oldest client version this deployment serves, as `X.Y.Z`.
            Absent means no floor, the default. Below it a client stops and
            offers to update. Set with SLIMM_MIN_CLIENT_VERSION.
        capabilities:
          type: array
          items:
            type: string
            enum: [block, report, webhooks]
          description: >
            The optional features this build serves, read off the router at
            runtime rather than declared, so the list cannot drift from what
            is really mounted. `report` means a member can file a report
            (`POST /reports`, not the moderator queue `GET /reports`), and
            `block` means a member can block someone (`POST /blocks/{userId}`).
            `webhooks` means this build serves incoming webhook delivery
            (`POST /webhooks/{webhookId}/{token}`) - a client uses it to
            decide whether the webhook admin surface is worth showing; minting
            and rotating one is `createWebhook` and `rotateWebhook`.


            slim-m's safety model is manual reporting plus blocking and
            nothing else, so a deployment missing either leaves a member being
            harassed with no tool for it. A client is expected to check this
            during onboarding and say so, without refusing the connection: an
            operator may knowingly self-host without them.


            Absent on servers older than 0.17.0. That is "unknown", not
            "neither": a client must say it could not tell rather than accuse
            an old server of having no safety tools.
        identity:
          type: object
          required:
            [public_key, fingerprint, fingerprint_groups, color_strip]
          description: >
            The server's long-lived, trust-on-first-use identity. Pinned by
            a client on first connect and compared on every one after, so a
            later machine-in-the-middle changes the fingerprint visibly
            instead of silently. This protects nothing about the very first
            connection: a client with nothing pinned yet cannot tell a
            faithful server from an attacker's own keypair, which is why the
            onboarding design has the admin read the fingerprint aloud for
            comparison rather than trusting it silently on that first
            connect. Deliberately not derived from the TLS certificate, so it
            exists and stays stable for plain-HTTP LAN deployments and behind
            a reverse proxy's own, separately renewing certificate.
          properties:
            public_key:
              type: string
              description: >-
                Standard base64 of the 32-byte Ed25519 public key. This, not
                `fingerprint`, is what a client should pin and compare
                byte-for-byte.
            fingerprint:
              type: string
              description: >-
                32 lowercase hex characters (a truncated SHA-256 of the
                public key), with no separators.
            fingerprint_groups:
              type: array
              items:
                type: string
              minItems: 8
              maxItems: 8
              description: >-
                The same fingerprint as eight 4-character hex groups, for the
                onboarding design's two-rows-of-four display.
            color_strip:
              type: array
              items:
                type: integer
                format: int32
                minimum: 0
                maximum: 5
              minItems: 4
              maxItems: 4
              description: >-
                Four indices into the client's six-entry cursor colour
                palette, deterministically derived from the fingerprint.

    TokenPair:
      type: object
      required: [user_id, access_token, refresh_token, access_expires_at]
      properties:
        user_id:
          type: string
          format: uuid
        access_token:
          type: string
          description: Bearer token for authenticated requests. Short-lived.
        refresh_token:
          type: string
          description: Single-use token that rotates on each refresh.
        access_expires_at:
          type: integer
          format: int64
          description: Unix milliseconds at which the access token expires.

    Ticket:
      type: object
      required: [ticket, expires_at]
      properties:
        ticket:
          type: string
          description: Single-use secret redeemed by the WebSocket hello frame.
        expires_at:
          type: integer
          format: int64
          description: Unix milliseconds at which the ticket expires.

    ResetCodeIssued:
      type: object
      required: [code, expires_at]
      properties:
        code:
          type: string
          description: The plaintext one-time code. Shown only this once.
        expires_at:
          type: integer
          format: int64
          description: Unix milliseconds at which the code stops being usable.

    ResetRequest:
      type: object
      required: [code, new_password]
      properties:
        code:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 1024

    RegisterRequest:
      type: object
      required: [username, display_name, password, device_name]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[A-Za-z0-9_.-]+$"
          description: >
            `everyone` and `here` (in any letter case) are reserved for the
            `@everyone` / `@here` mentions and refused with 400.
        display_name:
          type: string
          minLength: 1
          maxLength: 64
          description: >
            Must not contain control characters or text-direction overrides,
            which could be used to spoof how a name renders to other members.
        password:
          type: string
          minLength: 8
          maxLength: 1024
        device_name:
          type: string
          minLength: 1
          maxLength: 64
        invite_code:
          # OpenAPI 3.0 `nullable`, alone in this 3.1 file because a 3.1 null union fails the oasdiff gate (docs/ci.md).
          type: string
          nullable: true
          description: >
            Required once the deployment has been claimed, since joining is by
            invitation from that point on. Ignored on an unclaimed deployment,
            where the first account is the one that claims it and there is
            nobody to have issued a code yet. A blank or whitespace-only value
            counts as absent.
        client_kind:
          type: string
          nullable: true
          maxLength: 16
          description: >
            A coarse client kind ("ios", "android", "desktop", "web"), for the
            devices list to name a session by more than its free-text device
            name. Optional; absent on a client older than this field.
        client_version:
          type: string
          nullable: true
          maxLength: 32
          description: The app version opening this session; same absence rule as `client_kind`.
        install_id:
          type: string
          nullable: true
          description: >
            A random id the client makes once per install and keeps, 8 to 64
            characters of letters, digits, "-" and "_". Signing in again with the
            same id replaces that install's session (the old refresh token is
            revoked) instead of adding a device. Optional; a client that sends
            none gets a new device per sign-in, and a malformed one is a 400.

    LoginRequest:
      type: object
      required: [username, password, device_name]
      properties:
        username:
          type: string
        password:
          type: string
        device_name:
          type: string
        client_kind:
          type: string
          nullable: true
          maxLength: 16
          description: See `RegisterRequest.client_kind`.
        client_version:
          type: string
          nullable: true
          maxLength: 32
          description: See `RegisterRequest.client_version`.
        install_id:
          type: string
          nullable: true
          description: See `RegisterRequest.install_id`.

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    UserProfile:
      type: object
      required: [id, username, display_name, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
          description: >
            What readers see: the nickname an administrator gave this account
            if there is one, else `account_display_name`.
        account_display_name:
          type: string
          description: The account's own name, whatever the nickname is.
        nickname:
          type: [string, "null"]
          description: The space-local name an administrator gave this account.
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds.
        avatar_updated_at:
          type: [integer, "null"]
          format: int64
          description: >
            When this user's avatar was last set, or null for no avatar. Not
            itself fetchable: a client appends it as a cache-busting query
            parameter on `getAvatar`, which ignores the query string and
            serves whatever is currently stored. Absent on servers older
            than the avatar feature, which a client must treat as unknown
            (no cache key), not as "no avatar".
        roles:
          type: array
          items:
            type: string
          description: >
            Role names this member holds, for a client to render a badge
            (e.g. "Op") beside them. Excludes `@everyone`: every member holds
            that one, so including it would put a meaningless badge on every
            row. Empty rather than absent for a member with nothing beyond
            it. Deliberately no colour field: badges use the design system's
            accent, not a per-role one. Absent on servers older than this
            field, which a client must treat as unknown rather than "no
            roles".
        role_ids:
          type: array
          items:
            type: string
            format: uuid
          description: >
            The same roles as ids, positionally matching `roles`. Both,
            rather than one: a badge renders the name, and an assignment is
            made against the id. Nothing stops two roles sharing a name, so a
            client deciding "does this member hold that role" by name would
            answer yes for both of them.
        hoisted_role_id:
          type: [string, "null"]
          format: uuid
          description: The hoisted role this member is listed under in the member pane, or null when none of theirs is hoisted. Always one of `role_ids`.
        hoisted_role_position:
          type: [integer, "null"]
          format: int64
          description: That role's hierarchy position, so section order is exact without `GET /roles`, which needs MANAGE_ROLES.
        timed_out_until:
          type: [integer, "null"]
          format: int64
          description: >
            When this member's timeout lifts, in Unix milliseconds, or null
            if they are not timed out. An elapsed timeout reads as null
            rather than as a past deadline, so a client never has to do the
            comparison to know whether the badge belongs on screen.
        status_text:
          type: [string, "null"]
          maxLength: 80
          description: >
            A short free-text status line this member set for themselves, or
            null for none. Shown in the member pane under the name. Absent
            on servers older than this field, which a client must treat as
            unknown rather than "no status".
        pronouns:
          type: [string, "null"]
          maxLength: 40
          description: >
            A short self-described pronoun set ("she/her"), or null if unset.
            Shown on the member card beside the `@handle`. Absent on servers
            older than this field, which a client must treat as unknown
            rather than "no pronouns".
        about:
          type: [string, "null"]
          maxLength: 190
          description: >
            A short "about" line, or null if unset. Shown on the member card
            under the status line. Absent on servers older than this field,
            which a client must treat as unknown rather than "no about".
        profile_color:
          type: integer
          description: >
            An index into the design system's closed categorical colour set
            (six hues). Always present: an account that never chose one reads
            a stable default derived from its id, so a card is never
            colourless. Absent on servers older than this field, which a
            client must treat as unknown rather than defaulting to zero.
        is_bot:
          type: boolean
          description: >
            Whether this account is a bot rather than a person. The interface
            draws a badge from it, so a reader can tell that something was
            written by a program without inspecting anything. It says nothing
            about what the account may do - that is its roles, exactly as for
            a person. Absent on servers older than this field, which a client
            reads as not a bot.
        is_webhook:
          type: boolean
          description: >
            Whether this account is a webhook's principal rather than a
            person or a bot. The interface draws its always-on `Webhook`
            badge from this - see docs/decisions/0030-incoming-webhooks.md.
            A webhook never appears in `GET /members`, so this is only ever
            seen by resolving a message's own author id. Absent on servers
            older than this field, which a client reads as not a webhook.
        invite_code:
          type: [string, "null"]
          description: >
            The invite this member registered through, present only to
            callers with MANAGE_ROLES - a moderation signal for spotting a
            returning (ban-evading) account, never a public value. Absent
            for any other caller, and for a member who registered without one.
            MANAGE_ROLES, not BAN_MEMBERS: redeeming a code applies the role
            it grants, so a caller who could not grant it must not read one.

    SpaceRemoval:
      type: object
      required: [user_id, username, display_name, removed_at]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        reason:
          type: [string, "null"]
        removed_by:
          type: [string, "null"]
          format: uuid
          description: Null once the removing moderator's own account is deleted.
        removed_at:
          type: integer
          format: int64
          description: Unix milliseconds.
        invite_code:
          type: [string, "null"]
          description: >
            The invite this member registered through, or null if they had
            none. Gated as `UserProfile.invite_code` is: the endpoint needs
            BAN_MEMBERS, the code itself also needs MANAGE_ROLES.

    Me:
      type: object
      required: [id, username, display_name, created_at, permissions]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds.
        avatar_updated_at:
          type: [integer, "null"]
          format: int64
          description: Same meaning as `UserProfile.avatar_updated_at`.
        permissions:
          type: integer
          format: int64
          description: >
            The caller's base (deployment-level) permission bitmask, ignoring
            any per-channel overwrite. A UI nicety for hiding actions the
            caller cannot perform; every write is still re-authorized
            server-side regardless of what this says.

            Already has any timeout subtracted, so a client that greys the
            composer on a missing SEND_MESSAGES bit needs no separate rule
            for being timed out; `timed_out_until` is what says why.
        timed_out_until:
          type: [integer, "null"]
          format: int64
          description: >
            When the caller's own timeout lifts, or null. Present so a client
            can name what happened rather than leaving somebody with a
            disabled composer and no explanation.
        timeout_reason:
          type: [string, "null"]
          description: >
            Why the caller was timed out, or null if they are not timed out,
            or the moderator left no reason. Self-view only: moderation
            information about the caller, never exposed on `UserProfile`
            (which other members read) - only this endpoint may return it.
        status_text:
          type: [string, "null"]
          maxLength: 80
          description: The caller's own status line; see `UserProfile.status_text`.
        pronouns:
          type: [string, "null"]
          maxLength: 40
          description: The caller's own pronouns; see `UserProfile.pronouns`.
        about:
          type: [string, "null"]
          maxLength: 190
          description: The caller's own about line; see `UserProfile.about`.
        profile_color:
          type: integer
          description: The caller's own profile colour index; see `UserProfile.profile_color`.
        presence_visibility:
          type: string
          enum: [online, away, dnd, hidden]
          description: >
            The caller's own stored presence choice, as `SetVisibilityRequest`
            takes it. Self-view only: never on `UserProfile` or any frame.

    UpdateMeRequest:
      type: object
      description: >
        Every field is optional, absence meaning "leave it as it is" - the
        same "at least one, absent means untouched" convention
        `UpdateChannelRequest` uses for its own name and topic. A request
        naming none of them is a 400.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 64
          description: >
            Must not contain control characters or text-direction overrides,
            the same rule registration enforces.
        status_text:
          type: string
          maxLength: 80
          description: >
            A blank or whitespace-only value clears the status back to null
            rather than storing an empty string, the same convention
            `UpdateChannelRequest.topic` uses.
        pronouns:
          type: string
          maxLength: 40
          description: >
            A blank or whitespace-only value clears it back to null, the same
            convention `status_text` uses.
        about:
          type: string
          maxLength: 190
          description: >
            A blank or whitespace-only value clears it back to null, the same
            convention `status_text` uses.
        profile_color:
          type: integer
          description: >
            An index into the design system's closed categorical colour set.
            There is no clearing this back to unset: every account always has
            one, defaulting to a stable value derived from its id. An index
            outside the set is a 400.

    TotpChallenge:
      type: object
      required: [totp_challenge, expires_at]
      properties:
        totp_challenge:
          type: string
          description: >
            Single-use, and short-lived. Present it to /auth/totp/verify with a
            code. It carries the device fields from the login request that
            produced it, so those are not resent.
        expires_at:
          type: integer
          format: int64
          description: Unix milliseconds after which the challenge is refused.
    TotpEnrolment:
      type: object
      required: [secret, provisioning_uri]
      properties:
        secret:
          type: string
          description: >
            The base32 shared secret, for somebody typing it in by hand.
            Returned once and never again.
        provisioning_uri:
          type: string
          description: >
            An otpauth URI to render as a QR code. It states no algorithm,
            digit count or period, because those are the otpauth defaults this
            server uses (HMAC-SHA1, 6 digits, 30 seconds) and several
            authenticator apps mis-handle them when stated explicitly.
    TotpEnrolRequest:
      type: object
      properties:
        password:
          type: string
          description: >
            The account's current password. Optional only so the schema stays
            additive; a well-formed request without it is refused with 400, and the
            server behaviour is the same as if it were required.
    TotpConfirmRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: A six-digit authenticator code from the new secret.
        password:
          type: string
          description: >
            The account's current password. Optional only so the schema stays
            additive; a well-formed request without it is refused with 400, and the
            server behaviour is the same as if it were required.
    DeleteAccountRequest:
      type: object
      properties:
        password:
          type: string
          description: >
            The account's current password. Optional only so the schema stays
            additive; a well-formed request without it is refused with 400, and the
            server behaviour is the same as if it were required.
        code:
          type: string
          description: >
            A current authenticator code or an unused recovery code. Required
            while two-factor is on, ignored otherwise.
    TotpCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: >
            A six-digit authenticator code, or one of the recovery codes.
            Surrounding whitespace is trimmed.
    TotpVerifyRequest:
      type: object
      required: [challenge, code]
      properties:
        challenge:
          type: string
        code:
          type: string
        install_id:
          type: string
          nullable: true
          description: See `RegisterRequest.install_id`; the challenge does not store one.
    TotpRecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          description: >
            Shown exactly once. Stored only as hashes, so this list cannot be
            re-read; each code works once.
          items:
            type: string
    TotpStatus:
      type: object
      required: [enabled, pending, recovery_codes_remaining, policy]
      properties:
        enabled:
          type: boolean
          description: Confirmed, and therefore required at sign-in.
        pending:
          type: boolean
          description: >
            Enrolled but never confirmed, so not required at sign-in. A client
            seeing this offers to finish setup rather than to start over.
        confirmed_at:
          type: [integer, "null"]
          format: int64
        recovery_codes_remaining:
          type: integer
          description: Unused recovery codes left.
        policy:
          type: string
          enum: [off, optional, required_for_elevated]
          description: >
            What this deployment asks for. `off` refuses new enrolments and
            deliberately keeps enforcing a factor somebody already enabled, so
            the switch cannot silently weaken an account; the disable path stays
            open either way. `required_for_elevated` makes an administrator
            without a factor get a 403 on administrator-gated routes; sign-in
            and enrolment stay open, and a bot is never asked.
    SpaceSettings:
      type: object
      required: [join_policy]
      properties:
        totp_policy:
          type: string
          enum: [off, optional, required_for_elevated]
          description: >
            The deployment's second-factor policy. Optional in a PATCH body, so
            a client that predates it can change the join policy without
            silently resetting this. Always present in a response.
        join_policy:
          type: string
          enum: [invite, open]
          description: >
            `invite` means registration requires a valid code, and is the
            default every deployment keeps on upgrade. `open` means anyone
            who can reach the server may register; a code is still accepted,
            so an invite granting a role keeps working.
    UpdateSpaceAnalytics:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    SpaceAnalyticsStats:
      type: object
      required:
        [
          total_messages,
          member_count,
          channel_count,
          attachment_bytes,
          messages_by_day,
          active_hours,
          memory_samples,
        ]
      properties:
        total_messages:
          type: integer
          description: All-time count of live (non-deleted) messages, Space-wide.
        member_count:
          type: integer
        channel_count:
          type: integer
          description: Live, non-DM, non-thread channels.
        attachment_bytes:
          type: integer
          description: Current total bytes stored across every attachment.
        messages_by_day:
          type: array
          description: One entry per day in the trailing 30-day window, zero-filled.
          items:
            $ref: "#/components/schemas/SpaceAnalyticsDayCount"
        active_hours:
          type: array
          description: >
            24 entries, index 0-23 as UTC hour-of-day, each the count of
            messages sent starting in that hour across the same 30-day
            window, summed over every author.
          items:
            type: integer
          minItems: 24
          maxItems: 24
        memory_samples:
          type: array
          description: >
            This process's resident memory, oldest first, sampled lazily on a
            read of this route rather than on a timer.
          items:
            $ref: "#/components/schemas/SpaceAnalyticsMemorySample"
    SpaceAnalyticsDayCount:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
          description: "`YYYY-MM-DD`, UTC."
        count:
          type: integer
    SpaceAnalyticsMemorySample:
      type: object
      required: [sampled_at, rss_bytes]
      properties:
        sampled_at:
          type: integer
          description: Unix milliseconds.
        rss_bytes:
          type: integer
    SpaceAnalyticsMemberStorage:
      type: object
      required: [user_id, attachment_bytes]
      properties:
        user_id:
          type: string
          format: uuid
        attachment_bytes:
          type: integer
          description: >
            Every attachment this member has personally uploaded, by content
            hash. Two members who each uploaded identical bytes are each
            charged the full size.
    SpaceAnalytics:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        stats:
          description: Present only when `enabled` is true.
          anyOf:
            - $ref: "#/components/schemas/SpaceAnalyticsStats"
            - type: "null"
        member_storage:
          description: >
            Present only when `enabled` is true. Sibling of `stats`, never
            nested in it: `stats` never names a member and this is the one
            field on this response that does, on purpose, for storage
            stewardship rather than usage surveillance. Heaviest member
            first.
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/SpaceAnalyticsMemberStorage"
            - type: "null"
    SpaceStorageChannel:
      type: object
      required: [channel_id, name, attachment_bytes]
      properties:
        channel_id:
          type: string
          format: uuid
        name:
          type: string
        attachment_bytes:
          type: integer
    SpaceSweepStatus:
      type: object
      required: [name, last_run_at, last_reclaimed]
      properties:
        name:
          type: string
          description: >
            Stable snake_case identifier, for example `token`, `attachments`,
            `canvas_ops`, `message_retention`.
        last_run_at:
          type: integer
          description: Unix milliseconds of the sweep's most recent pass.
        last_reclaimed:
          type: integer
          description: >
            What that pass reclaimed, in whatever unit that sweep counts
            (rows removed, files freed): sweep-specific, not always bytes.
    SpaceStorage:
      type: object
      required:
        [
          database_bytes,
          database_reclaimable_bytes,
          attachment_bytes,
          top_channels,
          sweeps,
        ]
      properties:
        database_bytes:
          type: integer
          description: The database file's logical size, from SQLite's page count.
        database_reclaimable_bytes:
          type: integer
          description: How much of that a `VACUUM` could reclaim.
        attachment_bytes:
          type: integer
          description: Current total bytes stored across every attachment.
        top_channels:
          type: array
          description: >
            Channels holding the most attachment bytes, heaviest first. DMs
            and threads are excluded.
          items:
            $ref: "#/components/schemas/SpaceStorageChannel"
        sweeps:
          type: array
          description: Every background sweep that has recorded at least one run.
          items:
            $ref: "#/components/schemas/SpaceSweepStatus"
    SpaceRetention:
      type: object
      required: [retention_days]
      properties:
        retention_days:
          type: integer
          description: >
            Days a message is kept before the sweep prunes it. `0` means
            disabled - keep forever - and is the default.
    SpaceCanvasCap:
      type: object
      required: [object_cap]
      properties:
        object_cap:
          type: integer
          description: >
            Most live objects one channel's canvas may hold before a placement
            is refused. Applies to every client. Settable range is 100 to
            100000; the default is 20000.
    SpaceScreenShareCap:
      type: object
      required: [max_height]
      properties:
        max_height:
          type: integer
          description: >
            The tallest resolution a screen share may publish at.
            Client-advertised: a client reads this and caps its own capture
            parameters, rather than the server inspecting published tracks.
            Settable range is 360 to 2160; the default is 2160.
    DockIndexEntry:
      type: object
      required: [id, name, version, summary, shadowed]
      properties:
        id:
          type: string
          description: The module's slug id, safe for a URL path segment.
        name:
          type: string
        version:
          type: string
        summary:
          type: string
        shadowed:
          type: boolean
          description: >
            True when another source already owns this id, so it cannot be
            installed from the source being listed.
    DockSource:
      type: object
      required: [id, repo, official]
      properties:
        id:
          type: string
          description: Pass as `source`; the official source's id is `official`.
        repo:
          type: string
          description: The GitHub `owner/repo` slug.
        official:
          type: boolean
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds; absent for the official source.
    AddDockSourceRequest:
      type: object
      required: [repo]
      properties:
        repo:
          type: string
          description: A GitHub `owner/repo` slug, never a URL.
    DockArtifact:
      type: object
      required: [kind, path, sha256]
      properties:
        kind:
          type: string
        path:
          type: string
        sha256:
          type: string
          description: 64 lowercase hex characters. See docs/decisions/0021.
    DockLimits:
      type: object
      properties:
        memory_mb:
          type: integer
          nullable: true
        wall_ms:
          type: integer
          nullable: true
        fuel:
          type: integer
          nullable: true
    DockRuntime:
      type: object
      required: [backend, limits]
      properties:
        backend:
          type: string
        limits:
          $ref: "#/components/schemas/DockLimits"
    DockPermission:
      type: object
      required: [key, name, description]
      properties:
        key:
          type: string
          description: Safe slug, namespaced by the module id once installed.
        name:
          type: string
        description:
          type: string
    DockExtensionPoint:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        permission:
          type: string
          nullable: true
          description: >
            The declared permission key (see DockPermission) a caller must
            hold to reach this extension point. Always present for a
            `command` or a `code-block-runner`; the module host checks it
            via Store::user_has_module_permission before ever running the
            module. See docs/decisions/0021's "Module ABI v1" section.
        command:
          type: string
          nullable: true
          description: >
            For a `code-block-runner` only: the `command` extension point's
            own name it invokes, so `GET /modules/code-block-runners` can
            hand a client a `(module_id, command)` pair
            `POST /modules/{moduleId}/commands/{command}` is guaranteed to
            accept.
        language:
          type: string
          nullable: true
          description: >
            For a `code-block-runner` only: the fenced-block language it
            matches (a short slug such as `javascript`). Absent means a
            wildcard, matching any block - see docs/decisions/0021's
            code-block-runner section.
    DockManifest:
      type: object
      required:
        [
          id,
          name,
          version,
          summary,
          artifact,
          runtime,
          permissions,
          capabilities,
          extension_points,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        summary:
          type: string
        author:
          type: string
          nullable: true
        artifact:
          $ref: "#/components/schemas/DockArtifact"
        runtime:
          $ref: "#/components/schemas/DockRuntime"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/DockPermission"
        capabilities:
          type: array
          items:
            type: string
        extension_points:
          type: array
          items:
            $ref: "#/components/schemas/DockExtensionPoint"
    InstallDockModuleRequest:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: >
            The version reviewed in the Dock before installing. Refused with
            409 if the registry's current manifest no longer matches it.
        approved_host_capabilities:
          type: array
          items:
            type: string
          description: >
            The host capabilities the admin approved after seeing them listed
            (kv.store, message.post; decision 0023). Each must be declared in
            the manifest and implemented by the host, or the install is refused
            with 400. An empty list withdraws every approval. Omitted keeps
            what was approved before, minus anything the new manifest no
            longer declares, and never adds one.
    InstalledDockModule:
      type: object
      required:
        [
          id,
          name,
          version,
          artifact_sha256,
          approved_capabilities,
          approved_host_capabilities,
          extension_points,
          enabled,
          installed_at,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        artifact_sha256:
          type: string
        approved_capabilities:
          type: array
          items:
            type: string
        approved_host_capabilities:
          type: array
          items:
            type: string
          description: >
            The host capabilities an admin approved the module to use through
            slim.host_call; empty for a module installed before that approval
            existed. A run may use only a capability that is declared in
            approved_capabilities and also listed here.
        source_repo:
          type: string
          description: >
            The community source's `owner/repo` it was installed from; absent
            for the official source.
        extension_points:
          type: array
          description: >
            Every extension point the module's manifest declared at install,
            so a client can discover which commands it offers - and which
            permission each needs - without re-browsing the Dock.
          items:
            $ref: "#/components/schemas/DockExtensionPoint"
        enabled:
          type: boolean
        installed_at:
          type: integer
    RunModuleCommandRequest:
      type: object
      required: [input]
      properties:
        input:
          type: string
          description: >
            The module ABI's own request `input` field, passed through
            verbatim. What it means is entirely up to the module.
        channel_id:
          type: string
          description: >
            The channel the command was typed in. Only a run that names one
            may use the message.post capability, and it may post only there.
    RunCodeBlockRequest:
      type: object
      required: [module_id, command, input]
      properties:
        module_id:
          type: string
          description: The installed module whose command runs the block.
        command:
          type: string
          description: The `command` extension point's own name to run.
        input:
          type: string
          description: The block's own text, passed through as the ABI `input`.
    RunModuleCommandResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        output:
          type: string
          nullable: true
          description: Present when `ok` is true.
        error:
          type: string
          nullable: true
          description: >
            Present when `ok` is false: either the module's own declared
            failure, or a clean description of a host-level refusal (a
            resource limit, a malformed module response). Never a 500 and
            never a hang; see docs/decisions/0021's "Module ABI v1" section.
    CodeBlockRunner:
      type: object
      required: [module_id, command]
      properties:
        module_id:
          type: string
        command:
          type: string
          description: >
            The `command` extension point's own name to POST to via
            /modules/{moduleId}/commands/{command}.
        language:
          type: string
          nullable: true
          description: >
            The fenced-block language this runner matches, or absent for a
            wildcard that matches any block. The client normalizes case and
            applies a small alias map before comparing this against a
            block's own fence tag.
    SlashCommand:
      type: object
      required: [module_id, command, name]
      properties:
        module_id:
          type: string
        command:
          type: string
          description: >
            The `command` extension point's own name to POST to via
            /modules/{moduleId}/commands/{command}.
        name:
          type: string
          description: >
            The keyword the composer offers as `/name`; what the caller types
            before any arguments.
        description:
          type: string
          nullable: true
          description: A short human summary of what the command does.
    App:
      type: object
      required: [module_id, command, name]
      properties:
        module_id:
          type: string
        command:
          type: string
          description: >
            The `command` extension point's own name the launch posts, and that
            the surface then runs and re-runs through the shared code-run route.
        name:
          type: string
          description: What the composer's apps menu shows for this app.
        description:
          type: string
          nullable: true
          description: A short human summary of what the app is.
    CallRecord:
      type: object
      required: [outcome]
      description: >-
        How a DM call ended. Carried by the message that records it, so it
        orders, paginates and syncs like any other message.
      properties:
        caller_id:
          type: [string, "null"]
          format: uuid
          description: >-
            Who placed the call. Null once that account has been deleted,
            exactly as a message's own `author_id` is.
        outcome:
          type: string
          enum: [answered, declined, canceled, timed_out]
          description: >-
            `timed_out` is the missed call - nobody answered before the ring's
            own timeout. `canceled` is the caller hanging up first, which the
            other side also never answered.
        duration_ms:
          type: [integer, "null"]
          format: int64
          description: >-
            How long the call lasted, or null. Null for every outcome but
            `answered`, and also null on an answered call until the duration is
            known: the record is written when the call is answered, and how
            long it ran is only settled when the last participant leaves.
    AppSurface:
      type: object
      required: [module_id, command]
      properties:
        module_id:
          type: string
        command:
          type: string
          description: >
            The module command this message launched. The surface's live state
            is the code-run at block 0 of this message, not carried here.
    PresenceStatus:
      type: object
      required: [user_id, status]
      properties:
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [online, away, dnd, offline]
          description: >
            What this specific caller may be told. Never `hidden`: a user who
            chose it is `offline` here to anyone but themselves, and their
            true state when they ask about their own id.
        activity:
          $ref: "#/components/schemas/PresenceActivity"

    PresenceActivity:
      type: object
      required: [type, title]
      additionalProperties: false
      description: >
        What a member is doing right now. Absent when they are doing nothing
        they chose to share, when they are offline, and to every viewer but
        themselves when they chose `hidden`. The only image is `art_url`,
        which the server accepts only as a Spotify cover URL.
      properties:
        type:
          type: string
          enum: [listening, playing]
        title:
          type: string
          description: At most 128 characters.
        subtitle:
          type: string
          description: At most 128 characters, for example the artist.
        started_at:
          type: integer
          format: int64
          description: Epoch milliseconds the activity began, when known.
        source:
          type: string
          description: >
            Which player reported it, for example Spotify or Firefox. At most
            32 characters, never empty, no control characters.
        art_url:
          type: string
          description: >
            Cover art. Accepted only as `https://i.scdn.co/image/` followed by
            40 lowercase hex characters, with no port, query or fragment;
            anything else is refused with 400. Decision 0056.

    SetVisibilityRequest:
      type: object
      required: [visibility]
      properties:
        visibility:
          type: string
          enum: [online, away, dnd, hidden]
          description: >
            `hidden` is the appear-offline choice: the caller's own client
            still sees their true state; everyone else sees `offline`.

    Device:
      type: object
      required: [id, name, created_at, is_current]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: integer
          format: int64
        last_seen_at:
          type: [integer, "null"]
          format: int64
        client_kind:
          type: [string, "null"]
          description: >
            A coarse client kind ("ios", "android", "desktop", "web"), or null
            for a session opened before this field existed.
        client_version:
          type: [string, "null"]
          description: >
            The app version that opened this session, or null; same absence
            rule as `client_kind`.
        is_current:
          type: boolean
          description: Whether this is the device making the request.

    UserNote:
      type: object
      required: [body, updated_at]
      properties:
        body:
          type: [string, "null"]
          description: >-
            `null` if the caller has left no note about this subject.
        updated_at:
          type: [integer, "null"]
          format: int64
          description: >-
            When the note was last set, or `null` alongside a `null` body.

    ReportRequest:
      type: object
      required: [subject_kind, subject_id, reason]
      properties:
        id:
          type: string
          format: uuid
          description: >
            A client-minted UUIDv7 that makes the filing idempotent, like
            every other durable write. Omitted, the server mints one and a
            retry cannot be told apart from a second report.
        subject_kind:
          type: string
          enum: [message, user, ephemeral_message]
        subject_id:
          type: string
          format: uuid
          description: >-
            For `ephemeral_message`, the private message's own id.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: >
            Control and invisible characters are refused with 400; line breaks
            and tabs are ordinary text. The same holds for the reason on a
            timeout or a removal.
        channel_id:
          type: string
          format: uuid
          description: >-
            Only with `ephemeral_message`, where all three of this,
            `author_id` and `snapshot` are required; the reporter must be able
            to view the channel.
        author_id:
          type: string
          format: uuid
          description: The bot that sent it; anything else is a 404.
        snapshot:
          type: string
          description: >-
            The text the reporter was shown, at most 4000 characters. The
            server stored nothing, so this is the reporter's word and is
            shown to moderators as such.

    ReportFiled:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid

    Report:
      type: object
      required: [id, subject_kind, subject_id, reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        reporter_id:
          type: [string, "null"]
          format: uuid
          description: Null once the reporter's account has been anonymized.
        subject_kind:
          type: string
          enum: [message, user, ephemeral_message]
        subject_id:
          type: string
          format: uuid
        channel_id:
          type: [string, "null"]
          format: uuid
        reason:
          type: string
        snapshot:
          type: [string, "null"]
          description: >
            The reported content as it stood at filing time; the author may
            have since edited or deleted it. Absent for a user report.
        subject_author_id:
          type: [string, "null"]
          format: uuid
          description: >
            Who wrote the reported message. Null for a report about a user
            (there is no message), for a message since hard-deleted, and once
            the author's account has been anonymized. Joined at read time
            rather than stored: a report names a message id, and the
            authorship of that id does not change - only its content does,
            which is what `snapshot` is for.
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds.
        channel_permissions:
          type: [integer, "null"]
          format: int64
          description: >
            The caller's effective permission bitmask in `channel_id`, null
            exactly when `channel_id` is null. Batched per page rather than
            per report; masked to zero whenever the caller lacks
            VIEW_CHANNEL, the same rule `getChannelPermissions` applies -
            see docs/decisions/0011-per-channel-permissions.md. A DM
            report's bitmask structurally never carries MANAGE_MESSAGES,
            since no one holds that permission in a DM. Absent on servers
            older than this field, which a client must treat as unknown
            rather than assuming zero.

    MyReportStatus:
      type: object
      required: [id, subject_kind, subject_id, created_at, status]
      description: >
        A reporter's own, narrow view of a report they filed, from
        `myReportStatus`. Deliberately smaller than `Report`: no `reporter_id`
        (it is always the caller), no `snapshot`, no `subject_author_id`, and
        no `resolved_by` or the finer `resolved`/`dismissed` resolution label
        - none of that is the reporter's to see.
      properties:
        id:
          type: string
          format: uuid
        subject_kind:
          type: string
          enum: [message, user, ephemeral_message]
        subject_id:
          type: string
          format: uuid
        channel_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds; when the reporter filed it.
        status:
          type: string
          enum: [open, resolved]

    ResolveReportRequest:
      type: object
      required: [resolution]
      properties:
        resolution:
          type: string
          enum: [resolved, dismissed]

    ModerationHistoryItem:
      description: >
        One entry in `moderationHistory`'s feed: a resolved report or an
        audit-log entry. `kind` is also the value `after_kind` expects back,
        so a client can build its next page's cursor from the last item on
        this one.
      oneOf:
        - $ref: "#/components/schemas/ResolvedReportHistoryEntry"
        - $ref: "#/components/schemas/AuditLogHistoryEntry"
      discriminator:
        propertyName: kind
        mapping:
          resolved_report: "#/components/schemas/ResolvedReportHistoryEntry"
          audit_log: "#/components/schemas/AuditLogHistoryEntry"

    ResolvedReportHistoryEntry:
      type: object
      required:
        [kind, id, subject_kind, subject_id, reason, created_at, resolved_at]
      properties:
        kind:
          type: string
          enum: [resolved_report]
        id:
          type: string
          format: uuid
        reporter_id:
          type: [string, "null"]
          format: uuid
          description: Null once the reporter's account has been anonymized.
        subject_kind:
          type: string
          enum: [message, user, ephemeral_message]
        subject_id:
          type: string
          format: uuid
        channel_id:
          type: [string, "null"]
          format: uuid
        reason:
          type: string
        snapshot:
          type: [string, "null"]
          description: >
            The reported content as it stood at filing time. Absent for a
            user report.
        subject_author_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds; when the report was filed.
        resolved_at:
          type: integer
          format: int64
          description: Unix milliseconds; when a moderator closed it.
        resolved_by:
          type: [string, "null"]
          format: uuid
          description: Null once that moderator's account has been anonymized.
        resolution:
          type: [string, "null"]
          enum: [resolved, dismissed, null]

    AuditLogHistoryEntry:
      type: object
      required: [kind, id, subject_id, action, created_at]
      properties:
        kind:
          type: string
          enum: [audit_log]
        id:
          type: string
          description: >
            The audit row's own id, as a decimal string (an integer row id,
            carried as a string the same way every other id in this API is).
        actor_id:
          type: [string, "null"]
          format: uuid
          description: Null once the actor's account has been anonymized.
        subject_id:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - remove
            - restore
            - timeout
            - timeout_cleared
            - messages_deleted
            - bot_create
            - bot_revoke
            - bot_permission_grant
            - webhook_create
            - webhook_revoke
            - webhook_rotate
            - totp_cleared
            - account_delete
            - reset_code_issue
            - nickname_set
            - nickname_clear
        reason:
          type: [string, "null"]
        until:
          type: [integer, "null"]
          format: int64
          description: >
            Unix milliseconds; the deadline a `timeout` set or a
            `timeout_cleared` cut short. Null for every other action.
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds.

    Invite:
      type: object
      required: [code, uses, created_at, revoked, usable]
      properties:
        code:
          type: string
        max_uses:
          type: [integer, "null"]
          format: int64
          description: Null means unlimited.
        uses:
          type: integer
          format: int64
        expires_at:
          type: [integer, "null"]
          format: int64
          description: Unix milliseconds; null means it never expires.
        created_at:
          type: integer
          format: int64
        revoked:
          type: boolean
        role_grant:
          type: [string, "null"]
          format: uuid
          description: The role this code grants, or null.
        usable:
          type: boolean
          description: Whether the invite can be redeemed right now.

    CreateInviteRequest:
      type: object
      properties:
        max_uses:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: Null means unlimited.
        expires_at:
          type: [integer, "null"]
          format: int64
          description: >
            Unix milliseconds; null means it never expires. Must be in the
            future: an invite cannot be created already expired.
        role_grant:
          type: [string, "null"]
          format: uuid
          description: >
            A role every account redeeming this code receives. Null grants
            none. Setting it requires MANAGE_ROLES on top of CREATE_INVITE,
            and the role's permissions must already be held by the caller:
            an invite that grants a role is role assignment with a delay, so
            it is gated exactly as assigning one directly is.

    CheckInviteResponse:
      type: object
      required: [usable]
      properties:
        usable:
          type: boolean
          description: >-
            Whether this code can be redeemed right now. Deliberately the only
            signal when false: saying why not would let someone probe for
            real codes.
        community:
          description: >-
            Present only when `usable` is true; absent (not null) otherwise,
            so the unusable response body stays exactly `{"usable": false}`.
          type: object
          required:
            [name, member_count, invited_by, uses_remaining, expires_at]
          properties:
            name:
              type: string
              description: This deployment's display name.
            member_count:
              type: integer
              format: int64
              description: How many live accounts the deployment has.
            invited_by:
              type: [string, "null"]
              description: >-
                The inviter's current display name, or null if their account
                has since been deleted.
            uses_remaining:
              type: [integer, "null"]
              format: int64
              description: Null means unlimited.
            expires_at:
              type: [integer, "null"]
              format: int64
              description: Unix milliseconds; null means it never expires.

    Bot:
      type: object
      required: [user_id, username, display_name, created_at, permissions]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        created_at:
          type: integer
          format: int64
        token_name:
          type: [string, "null"]
          description: Absent once the token is revoked.
        token_last_used_at:
          type: [integer, "null"]
          format: int64
          description: >-
            Written at most once a minute, so it is a recency hint rather than
            an exact last-call time.
        role_id:
          type: [string, "null"]
          format: uuid
          description: The bot's managed role; see docs/decisions/0028-bot-accounts.md.
        permissions:
          type: integer
          format: int64
          description: >-
            What the managed role currently grants. Change it with `PATCH
            /bots/{botId}/permissions`, or by editing the role directly.
    CreateBotRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          description: >-
            1 to 32 characters, letters, digits and _ . - only, the same rule a
            person's username follows so a bot is mentionable the same way.
        display_name:
          type: [string, "null"]
          description: Defaults to the username.
        permissions:
          type: integer
          format: int64
          default: 0
          description: >-
            The permission bits to grant the bot's managed role. Defaults to
            none. Every bit must already be held by the caller, the same
            no-escalation check a human-assigned role goes through; a bot may
            hold any bit a human role could, including ADMINISTRATOR. See
            docs/decisions/0028-bot-accounts.md.
    SetBotPermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: integer
          format: int64
          description: >-
            Replaces what the bot's managed role grants. Same guards as
            `CreateBotRequest.permissions`.
    NewBot:
      type: object
      required: [bot, token]
      properties:
        bot:
          $ref: "#/components/schemas/Bot"
        token:
          type: string
          description: >-
            Shown once and never again. Prefixed so a presented credential can
            be routed without a second lookup.
    BotCommandInput:
      type: object
      required: [name, description]
      description: >-
        One command in a `setBotCommands` request. See that route's own
        description for the caps on each field.
      properties:
        name:
          type: string
          description: >-
            The bare keyword the composer offers after the bot's own prefix,
            e.g. `ping` for a bot whose prefix is `!` offering `!ping`. Never
            includes the prefix itself.
        description:
          type: string
        usage:
          type: [string, "null"]
          description: An optional short example of the command's arguments.
        permission:
          type: [integer, "null"]
          format: int64
          description: >-
            A single bit from `Permissions`. Hides this command in the
            composer for a caller who lacks it in the current channel; never
            checked against the message the bot itself goes on to receive.
    SetBotCommandsRequest:
      type: object
      required: [prefix]
      properties:
        prefix:
          type: string
          description: >-
            What this bot answers to, e.g. `!`, `?` or `$`. Must not be one of
            the composer's own reserved triggers `/`, `@`, `:`.
        commands:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/BotCommandInput"
    SendEphemeralMessageRequest:
      type: object
      required: [content]
      description: >-
        Send exactly one of `in_reply_to_id` and `interaction_id`; anything
        else is a 400. They are separate ids and never read as each other.
      properties:
        in_reply_to_id:
          type: string
          format: uuid
          description: >-
            The member's message being answered. Its author is the recipient.
        interaction_id:
          type: string
          format: uuid
          description: >-
            A button press on this bot's message (decision
            0039-bot-message-buttons): the recipient is whoever pressed, within
            15 minutes of the press and under the same limit of 3. A press
            that is not this bot's, or is in another channel, is a 404.
        content:
          type: string
        attachment_ids:
          type: array
          maxItems: 10
          items:
            type: string
          description: >-
            Hex sha256 ids of files already on a message both sides can see.
            Needs `ATTACH_FILES`.
        embeds:
          type: array
          items:
            $ref: "#/components/schemas/RequestEmbed"
    EphemeralMessage:
      type: object
      required:
        [
          id,
          channel_id,
          author_id,
          author_display_name,
          content,
          in_reply_to_id,
          created_at,
          attachments,
          embeds,
        ]
      description: >-
        A message only its recipient sees. Not a `Message`: it has no `seq`,
        is never stored, and cannot be fetched again.
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        author_display_name:
          type: string
        content:
          type: string
        in_reply_to_id:
          type: string
          format: uuid
        created_at:
          type: integer
          format: int64
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        embeds:
          type: array
          items:
            $ref: "#/components/schemas/Embed"
    MessageEphemeral:
      type: object
      required: [type, channel_id, message]
      description: >
        A bot answered this account privately. Delivered only to the
        recipient's own connections, and only while they can view the channel.
        It carries no `seq` and there is no catch-up: a client keeps it in
        memory and drops it on dismissal or reload. Best effort, like typing.
      properties:
        type:
          type: string
          enum: [message.ephemeral]
        channel_id:
          type: string
          format: uuid
        message:
          $ref: "#/components/schemas/EphemeralMessage"
    ComponentRow:
      type: object
      required: [buttons]
      description: One row of buttons on a bot's message.
      properties:
        buttons:
          type: array
          items:
            $ref: "#/components/schemas/Button"
    Button:
      type: object
      required: [label, style]
      description: >-
        A link button carries a `url` and never reaches the bot. Every other
        style carries a `custom_id` the bot chose, and pressing it delivers an
        interaction to that bot.
      properties:
        label:
          type: string
        style:
          type: string
          enum: [primary, secondary, danger, link]
        custom_id:
          type: string
          description: Absent on a link button.
        url:
          type: string
          description: Present only on a link button, http or https.
        disabled:
          type: boolean
          description: A disabled button cannot be pressed. Absent means false.
    PressButtonRequest:
      type: object
      required: [id, custom_id]
      properties:
        id:
          type: string
          format: uuid
          description: Chosen by the caller, so a retried press is the same press.
        custom_id:
          type: string
    Interaction:
      type: object
      required: [id, created_at]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: integer
          format: int64
    SetMessageComponentsRequest:
      type: object
      required: [components]
      properties:
        components:
          type: array
          description: The whole new list. Empty clears every button.
          items:
            $ref: "#/components/schemas/ComponentRow"
        interaction_id:
          type: string
          format: uuid
          description: The press this change answers, if any.
    MessageComponents:
      type: object
      required: [type, channel_id, message_id, components]
      description: >
        A bot replaced or cleared the buttons on its message. The whole current
        list, so a client that missed a frame still converges.
      properties:
        type:
          type: string
          enum: [message.components]
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentRow"
    BotUiEntry:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        icon:
          type: string
          description: A call control's glyph, from the list `setBotUi` names.
        permission:
          type: integer
          format: int64
    SetBotUiRequest:
      type: object
      properties:
        message_menu:
          type: array
          items:
            $ref: "#/components/schemas/BotUiEntry"
        call_controls:
          type: array
          items:
            $ref: "#/components/schemas/BotUiEntry"
    ChannelBotUi:
      type: object
      required:
        [
          bot_user_id,
          bot_username,
          bot_display_name,
          message_menu,
          call_controls,
        ]
      properties:
        bot_user_id:
          type: string
          format: uuid
        bot_username:
          type: string
        bot_display_name:
          type: string
        message_menu:
          type: array
          items:
            $ref: "#/components/schemas/BotUiEntry"
        call_controls:
          type: array
          items:
            $ref: "#/components/schemas/BotUiEntry"
    UseBotUiEntryRequest:
      type: object
      required: [id, surface, entry_id]
      properties:
        id:
          type: string
          format: uuid
        surface:
          type: string
          enum: [message_menu, call_control]
        entry_id:
          type: string
        message_id:
          type: string
          format: uuid
          description: Required for a menu entry, absent for a call control.
    InteractionCreated:
      type: object
      required:
        [
          type,
          interaction_id,
          channel_id,
          custom_id,
          user_id,
          user_display_name,
          created_at,
        ]
      description: >
        A member pressed one of this bot's buttons, or used one of its message
        menu entries or call controls (decision 0045). For the latter two
        `custom_id` is the entry id, and a call control names no message. Delivered to the bot's own
        connections only. The presser's id is given deliberately (decision
        0039), unlike an advertised command. Reply within 15 minutes with
        `sendEphemeralMessage` with `interaction_id`
        (three replies at most), `setMessageComponents`, or
        `acknowledgeInteraction`. Best effort, with no catch-up.
      properties:
        type:
          type: string
          enum: [interaction.created]
        interaction_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [button, message_menu, call_control]
        custom_id:
          type: string
        user_id:
          type: string
          format: uuid
        user_display_name:
          type: string
        created_at:
          type: integer
          format: int64
    InteractionAnswered:
      type: object
      required: [type, interaction_id, channel_id]
      description: >
        The bot answered this account's press. Absent `message_id` means a
        call control. Delivered to the presser's own
        connections only, so the pressed button can stop showing as pending.
      properties:
        type:
          type: string
          enum: [interaction.answered]
        interaction_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
    RegisteredBotCommand:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string
        usage:
          type: [string, "null"]
    BotCommandRegistration:
      type: object
      required: [commands]
      properties:
        prefix:
          type: [string, "null"]
          description: Absent for a bot that has never registered anything.
        commands:
          type: array
          items:
            $ref: "#/components/schemas/RegisteredBotCommand"
    ChannelBotCommand:
      type: object
      required:
        [bot_user_id, bot_username, bot_display_name, prefix, name, description]
      properties:
        bot_user_id:
          type: string
          format: uuid
        bot_username:
          type: string
        bot_display_name:
          type: string
        prefix:
          type: string
        name:
          type: string
        description:
          type: string
        usage:
          type: [string, "null"]
    IncomingWebhookPayload:
      type: object
      description: >-
        A Discord incoming-webhook body. The promise is acceptance, not
        fidelity: an unrecognised field never refuses the request, since the
        caller here is somebody else's program and a loud refusal would hide
        their bug rather than ours. Only `content`, `username` and `embeds`
        are honoured; every other property below is accepted and silently
        discarded, field by field, rather than refused.
      properties:
        content:
          type: string
          maxLength: 4000
          description: >-
            Honoured. The same 4000-character ceiling `SendMessageRequest.content`
            carries, comfortably above Discord's own 2000, so no compatible
            caller can overflow it. `@name` mentions inside it resolve
            exactly as they do for a person; `@everyone`, `@here`, and role
            mentions never resolve, because a webhook holds no permission
            that could grant them.
        username:
          type: string
          maxLength: 64
          description: >-
            Honoured, as a per-post label shown in the name slot beside the
            always-on `Webhook` badge - the badge is the whole mitigation, so
            this label is never checked for collision with a real member's
            name and is never mentionable. Never written to the webhook's own
            account name and never returned as a message's own author name.
            Refused with 400 when it holds a control, text-direction or
            invisible character, as a display name is.
        embeds:
          description: >-
            Honoured, in the same shape and with the same caps
            `SendMessageRequest.embeds` documents in full (see the
            `RequestEmbed` schema there) - one implementation
            (`http::embeds::build_embeds`) shared by both routes so a
            webhook and a bot cannot drift onto different ceilings. Left
            untyped here rather than given its own schema, the same as
            every other property on this object: this payload is
            member-supplied and additive-only by design, and a formal type
            on a field that was accepted-and-discarded until this change is
            exactly the kind of narrowing the breaking-change gate exists to
            catch. Unlike `SendMessageRequest.embeds` there is no `is_bot`
            gate: every webhook post is somebody else's program by
            construction, so this is unconditional.


            Read more tolerantly than `RequestEmbed`, since the sender is
            somebody else's program. An embed `timestamp` may be an integer
            (epoch milliseconds), an RFC 3339 string with `Z` or a numeric
            offset and any number of fractional digits (Discord's own shape,
            which Sonarr and Radarr send; years 1970 through 9999), or null.
            A string that does not parse, or any other type, drops the
            timestamp and the delivery still posts. A null `embeds` or a null
            embed `fields` reads as empty. `SendMessageRequest.embeds` is
            unchanged and still refuses a string timestamp with 400.
        avatar_url:
          description: >-
            Accepted and discarded, permanently. Honouring it would mean
            either this server fetching an arbitrary caller-supplied URL per
            post, reopening the SSRF surface link-preview fetching already
            guards against for a cosmetic field, or every viewer's own
            client fetching it and leaking their address to whatever host
            the caller named.
        tts:
          description: Accepted and discarded.
        flags:
          description: Accepted and discarded.
        components:
          description: Accepted and discarded.
        thread_name:
          description: Accepted and discarded.
        poll:
          description: Accepted and discarded.
        attachments:
          description: >-
            Accepted and discarded. A webhook cannot upload a file - no
            multipart, despite Discord supporting it - so the storage
            ceiling and the orphaned-attachment sweep never see an
            unauthenticated writer.
        allowed_mentions:
          description: >-
            Accepted and discarded in this build. Intended to later narrow,
            never widen, which of a message's mentions resolve; not yet
            wired in.
    DeliveredWebhookMessage:
      type: object
      description: >-
        The minimal acknowledgement `?wait=true` asks for, never the full
        `Message` DTO - see `deliverWebhook`'s own description for why.
      required: [id, channel_id, seq, created_at]
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64
    Webhook:
      type: object
      required: [id, channel_id, label, created_at]
      description: >-
        A webhook, as the admin surface lists it. Carries no credential; see
        NewWebhook for the one response that does.
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        label:
          type: string
        created_at:
          type: integer
          format: int64
        last_delivery_at:
          type: [integer, "null"]
          format: int64
          description: Absent if this webhook has never delivered.
        created_by_display_name:
          type: [string, "null"]
          description: >-
            Who minted this webhook. Absent if that admin's own account has
            since been deleted; the webhook itself keeps working either way.
    CreateWebhookRequest:
      type: object
      required: [channel_id, label]
      properties:
        channel_id:
          type: string
          format: uuid
          description: >-
            Fixed at mint and never editable - see
            docs/decisions/0030-incoming-webhooks.md for why re-pointing an
            already-pasted URL is refused rather than offered.
        label:
          type: string
          description: >-
            1 to 64 characters, the admin-facing name shown in the listing
            and, until renamed, the webhook principal's own display name.
    RenameWebhookRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          description: Same rule as CreateWebhookRequest.label.
    NewWebhook:
      type: object
      required: [webhook, delivery_path]
      properties:
        webhook:
          $ref: "#/components/schemas/Webhook"
        delivery_path:
          type: string
          description: >-
            `/webhooks/{id}/{token}`, shown once and never again - the server
            stores only a hash of the token. Not a full URL: the server has
            no notion of its own externally reachable origin, so the client
            joins this path to the address it already talks to this
            deployment on.
    Channel:
      type: object
      required: [id, name, kind, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [text, voice]
        topic:
          type: [string, "null"]
          maxLength: 256
          description: >
            A one-line description shown beside the name in the client's
            channel header, or null for no topic. Absent on servers older
            than this field, which a client must treat as unknown rather
            than "no topic".
        position:
          type: integer
          format: int64
          description: >
            Sort key among the deployment's live, non-DM channels: lower
            sorts first. Deployment-wide, set by `reorderChannels`, not a
            per-device preference. Absent on servers older than this field,
            which a client must treat as unknown rather than assuming 0.
            Meaningless on a DM, which never appears in `listChannels`.
        parent_message_id:
          type: [string, "null"]
          format: uuid
          description: >
            The message this channel is a thread of, or null for an ordinary
            channel. A thread's own `kind` and permissions are never what
            govern it: VIEW_CHANNEL/SEND_MESSAGES here inherit the parent
            message's own channel, resolved live rather than copied. A
            thread never appears in `listChannels`; reach one through
            `openThread`.
        category_id:
          type: [string, "null"]
          format: uuid
          description: >
            The rail section this channel is filed under, or null for
            uncategorised - rendered as an implicit section above every named
            category. Decides placement only, never behaviour: `kind` still
            decides that. Absent on servers older than this field, which a
            client must treat as unknown rather than assuming uncategorised.
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds.
        slow_mode_seconds:
          type: integer
          format: int64
          description: >
            The minimum interval, in seconds, a non-MANAGE_CHANNELS member
            must wait between their own messages in this channel; 0 means
            off. Set with `updateChannel`. Absent on servers older than this
            field, which a client must treat as unknown rather than
            assuming 0.
        join_muted:
          type: boolean
          description: >
            True when joining this voice channel should start with the mic
            off. A default members can override by unmuting, not a lock:
            SPEAK overwrites are what restrict who may speak. Set with
            `updateChannel` or at `createChannel`. Absent on servers older
            than this field, which a client must treat as false.
        permissions:
          type: integer
          format: int64
          description: >
            The caller's effective permission bitmask in this channel,
            already resolved through thread and DM handling with any
            timeout subtracted - the batched sibling of
            `getChannelPermissions`. Present only on `listChannels`, where
            every row already carries VIEW_CHANNEL by construction, so
            unlike that dedicated route this is never masked to zero;
            absent from `createChannel`, `updateChannel`, `reorderChannels`,
            `openThread` and the live `channel.created`/`channel.updated`
            frames, none of which have one caller whose bitmask would be
            right to embed.
        restricted:
          type: boolean
          description: >
            True when @everyone lacks VIEW_CHANNEL here, so the channel is
            hidden from ordinary members rather than visible to anyone in
            the deployment. Identical for every caller, unlike
            `permissions`. Present on `listChannels`, on the `createChannel`
            and `updateChannel` responses, and on the live `channel.created`
            and `channel.updated` frames; absent (not `false`) from a server
            too old to send it or from any other response, which a client
            must treat as unknown rather than assuming public.

    ChannelCategory:
      type: object
      required: [id, name, position, created_at]
      description: >
        A rail section a channel of any kind may be filed under. Carries no
        permission of its own; see docs/decisions/0006-channel-categories.md.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
          format: int64
          description: >
            Sort key among the deployment's live categories: lower sorts
            first.
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds.

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: >
            Client-generated UUIDv7. Retrying with the same id returns the
            stored category instead of creating a second one.
        name:
          type: string
          minLength: 1
          maxLength: 64

    UpdateCategoryRequest:
      type: object
      description: >
        At least one of `name` and `position` must be present; a request
        with neither is a 400. Each is independent, the same convention
        `UpdateChannelRequest` follows for its own two optional fields.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        position:
          type: integer
          format: int64

    CreateChannelRequest:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: >
            Client-generated UUIDv7. Retrying with the same id returns the
            stored channel instead of creating a second one.
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: >
            Refused with 400 when it holds a control, text-direction or
            invisible character. The same rule covers channel and category
            names and topics, and role names, on create and on rename; a name
            already stored with one is still listed and can be edited.
        kind:
          type: string
          enum: [text, voice]
          default: text
        category_id:
          type: [string, "null"]
          format: uuid
          description: >
            The rail section to file this channel under, or absent for
            uncategorised. Lets a client create straight into the category a
            person asked from, rather than creating uncategorised and
            following up with `reorderChannels` - two calls whose second one
            can fail on its own and leave the channel in a section nobody
            chose. A category that does not exist is a 400, never a silent
            fall back to uncategorised.
        restricted:
          type: boolean
          default: false
          description: >
            True to deny `@everyone` VIEW_CHANNEL here and grant it only to
            the creator, written atomically with the channel row itself so a
            caller can never observe the channel public before a follow-up
            edit narrows it. Absent or false creates a channel visible to
            `@everyone` as usual. Requires MANAGE_ROLES in addition to the
            MANAGE_CHANNELS this route already needs; there is no role
            picker here, others are granted afterwards through
            `setRoleOverwrite`/`setMemberOverwrite`.
        join_muted:
          type: boolean
          description: >
            True creates a voice channel whose joins start with the mic off.
            Absent or false leaves the default off. Refused on a text channel.

    UpdateChannelRequest:
      type: object
      description: >
        At least one of `name`, `topic`, `slow_mode_seconds` and
        `join_muted` must be present; a request with none of them is a 400. Each is independent:
        sending only one leaves the others untouched.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        topic:
          type: string
          maxLength: 256
          description: >
            A blank or whitespace-only value clears the topic back to null
            rather than storing an empty string.
        slow_mode_seconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 21600
          description: >
            0 turns slow mode off. Refused, not clamped, outside this range.
        join_muted:
          type: boolean
          description: >
            Sets the join-muted default. Absent leaves it unchanged. `true` is
            refused on a text channel.

    ReorderChannelsRequest:
      type: object
      description: >
        Exactly one of `channel_ids` and `categories` must be present;
        sending neither, or both, is a 400. Both are optional here so the
        pre-category shape (`channel_ids` alone) keeps validating for a
        client that has never heard of categories, the same "additive, never
        reshaped" rule the rest of this wire follows.
      properties:
        channel_ids:
          type: array
          description: >
            Every live, non-DM, non-thread channel id, in the desired order.
            Must name exactly that set - no more, no fewer, no repeats.
            Reorders positions only; every channel's `category_id` is left
            exactly as it was.
          items:
            type: string
            format: uuid
        categories:
          type: array
          description: >
            The whole rail, grouped by section, in display order. The
            channel ids named across every group's `channel_ids`, flattened,
            must be exactly the live, non-DM, non-thread channels - no more,
            no fewer, no repeats.
          items:
            type: object
            required: [channel_ids]
            properties:
              category_id:
                type: [string, "null"]
                format: uuid
                description: The section's category id, or null for the implicit uncategorised section.
              channel_ids:
                type: array
                items:
                  type: string
                  format: uuid
                description: This section's channels, in the desired order.

    DmConversation:
      type: object
      required: [channel_id, user, unread, created_at]
      properties:
        channel_id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/UserProfile"
        unread:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds the DM channel was first opened.

    Role:
      type: object
      required: [id, name, permissions, is_everyone, mentionable, hoist, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        permissions:
          type: integer
          format: int64
          description: >
            The raw permission bitmask; see the server's `Permissions` type
            for what each bit means.
        is_everyone:
          type: boolean
          description: >
            Whether this is the deployment's single `@everyone` base role.
            Exactly one role always carries this.
        mentionable:
          type: boolean
          description: Whether any member may wake this role with `@[Role Name]` with no permission of their own. Defaults false; MENTION_EVERYONE overrides it.
        hoist:
          type: boolean
          description: Whether the member pane lists this role's members under their own heading. Defaults false.
        created_at:
          type: integer
          format: int64
          description: Unix milliseconds.
        managed_bot_id:
          type: [string, "null"]
          format: uuid
          description: >-
            Informational: the bot this role was minted for, if any. An
            ordinary, freely editable role otherwise; see
            docs/decisions/0028-bot-accounts.md.
        position:
          type: integer
          format: int64
          description: >-
            Hierarchy order: higher sorts first, matching the order this
            list already comes back in. `@everyone` always sorts last. Set
            by reorderRoles.
        member_count:
          type: integer
          format: int64
          description: >-
            How many members currently hold this role; `@everyone`'s counts
            the whole deployment.

    ModulePermission:
      type: object
      required: [module_id, module_name, perm_key, name, description]
      description: >
        A grantable module-scoped permission, registered by the Dock's
        install handler. See docs/decisions/0021-modules-and-the-dock.md.
      properties:
        module_id:
          type: string
        module_name:
          type: string
        perm_key:
          type: string
        name:
          type: string
        description:
          type: string

    GrantedModulePermission:
      type: object
      required: [module_id, perm_key]
      properties:
        module_id:
          type: string
        perm_key:
          type: string

    CreateRoleRequest:
      type: object
      required: [name, permissions]
      properties:
        id:
          type: string
          format: uuid
          description: >
            Client-generated UUIDv7. Retrying with the same id returns the
            stored role instead of creating a second one.
        name:
          type: string
          minLength: 1
          maxLength: 64
        permissions:
          type: integer
          format: int64
          description: >
            Must be a subset of the caller's own effective permissions, or
            the request is refused.
        mentionable:
          type: boolean
          description: Defaults false. Applied only on a genuinely fresh create, never on a retry of one that already succeeded.

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        permissions:
          type: integer
          format: int64
          description: Checked the same way `CreateRoleRequest.permissions` is.
        mentionable:
          type: boolean
        hoist:
          type: boolean

    ReorderRolesRequest:
      type: object
      required: [role_ids]
      properties:
        role_ids:
          type: array
          items:
            type: string
            format: uuid
          description: >-
            Every non-`@everyone` role id, top to bottom. See reorderRoles's
            own description for the exact-set and hierarchy rules.

    SetOverwriteRequest:
      type: object
      properties:
        allow:
          type: integer
          format: int64
          default: 0
          description: >
            Bits to force on. Must be a subset of the caller's own effective
            permissions in this channel.
        deny:
          type: integer
          format: int64
          default: 0
          description: >
            Bits to force off. A bit may not be in both `allow` and `deny`.

    BatchOverwriteEntry:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [role, member]
        id:
          type: string
          format: uuid
          description: The role's or member's UUID, matching `kind`.
        allow:
          type: integer
          format: int64
          default: 0
          description: Same as `SetOverwriteRequest.allow`, checked per entry.
        deny:
          type: integer
          format: int64
          default: 0
          description: Same as `SetOverwriteRequest.deny`.

    BatchSetOverwritesRequest:
      type: object
      required: [overwrites]
      properties:
        overwrites:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/BatchOverwriteEntry"

    CanvasObject:
      type: object
      required: [id, kind, z_index, x, y, w, h, props, seq, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated UUIDv7; also the idempotency key.
        kind:
          type: string
          description: What the object is. `stroke`, `image`, `note` or `shape`.
        z_index:
          type: integer
          format: int64
          description: >-
            Paint order, lowest first. Seeded from `seq`, so the default order
            is the order things were drawn in.
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        w:
          type: number
          format: double
        h:
          type: number
          format: double
        props:
          type: object
          description: >-
            Kind-specific fields, opaque to the server. An object it cannot
            parse is reported as an empty one rather than failing the read.
        author_id:
          type: [string, "null"]
          format: uuid
          description: Null once the author's account has been deleted.
        seq:
          type: integer
          format: int64
          description: >-
            Per-channel monotonic order key on the canvas stream, which is
            independent of the same channel's message stream.
        created_at:
          type: integer
          format: int64

    CanvasObjectPlacement:
      type: object
      required: [id, kind, x, y, w, h, props]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated UUIDv7; also the idempotency key.
        kind:
          type: string
          enum: [stroke, image, note, shape]
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        w:
          type: number
          format: double
          description: Width, at most 8192.
        h:
          type: number
          format: double
          description: Height, at most 8192.
        props:
          type: object
          description: >-
            Kind-specific fields, opaque to the server, at most 4 KiB
            serialized. A stroke carries `points`, `width` and `color`.

    CanvasViewport:
      type: object
      required: [objects, has_more, latest_seq]
      properties:
        objects:
          type: array
          items:
            $ref: "#/components/schemas/CanvasObject"
        has_more:
          type: boolean
          description: >-
            More objects intersect this region than the limit allowed. There is
            no stable cursor across a region query, so the answer is to ask for
            a smaller region, not a next page.
        latest_seq:
          type: integer
          format: int64
          description: >-
            The channel's highest assigned canvas `seq`. Every op at or below
            this is reflected in `objects`, since both are read from one
            snapshot. Send back as `after_seq` on the next viewport read, or
            as the cursor into `listCanvasOps` to learn what has changed
            since, removals included.

    CanvasOp:
      type: object
      required: [seq, id, kind, actor_id, created_at]
      description: >-
        One entry in a channel's canvas op stream. Which of `object`,
        `object_ids`, `before_seq`, `target_op`, the move fields, and
        `z_index` are present depends on `kind`: a `place` carries `object`
        (absent once the object has since been removed); a `remove` or
        `restore` carries `object_ids`; a `clear` carries `before_seq`; a
        `restore` also carries `target_op`; a `move` carries `object_id`,
        `x`, `y`, `w` and `h`; a `reorder` carries `object_id` and `z_index`.
      properties:
        seq:
          type: integer
          format: int64
        id:
          type: string
          format: uuid
          description: >-
            Server-minted for a `place` (the object's own id is already the
            idempotency key); client-minted for every other kind.
        kind:
          type: string
          enum: [place, remove, clear, restore, move, reorder]
        actor_id:
          type: [string, "null"]
          format: uuid
          description: >-
            Null once the actor's account has been anonymized, and on a
            `remove`, `clear`, `restore`, `move` or `reorder` read without
            `MANAGE_CANVAS`: a moderation act does not name its moderator to
            the whole channel, which is what the live removal event withholds
            too. A `place` always names its actor - `CanvasObject.author_id`
            is the same id.
        created_at:
          type: integer
          format: int64
        object:
          $ref: "#/components/schemas/CanvasObject"
        object_ids:
          type: array
          items: { type: string, format: uuid }
          description: The objects a `remove` or `restore` touched.
        before_seq:
          type: integer
          format: int64
          description: A `clear` removed every object placed at or below this seq.
        target_op:
          type: string
          format: uuid
          description: The `remove` or `clear` op a `restore` undoes.
        object_id:
          type: string
          format: uuid
          description: The object a `move` repositioned or a `reorder` restacked.
        x:
          type: number
          format: double
          description: A `move`'s new top-left corner.
        y:
          type: number
          format: double
        w:
          type: number
          format: double
          description: A `move`'s new width.
        h:
          type: number
          format: double
          description: A `move`'s new height.
        z_index:
          type: integer
          format: int64
          description: A `reorder`'s new paint order. Any integer is legal.

    CanvasOpPage:
      type: object
      required: [ops, latest_seq, has_more, reset]
      properties:
        ops:
          type: array
          items:
            $ref: "#/components/schemas/CanvasOp"
        latest_seq:
          type: integer
          format: int64
        has_more:
          type: boolean
          description: >-
            More ops exist past this page; page again from the last op's
            `seq`. Unlike the viewport read's `has_more`, this cursor is
            stable and paging is correct.
        reset:
          type: boolean
          description: >-
            The cursor could not be paged from. `ops` is always empty
            alongside this; discard local canvas state and cold-fetch the
            viewport instead of trusting a partial answer.

    CanvasOpRequest:
      type: object
      required: [id, kind]
      description: >-
        One mutation submitted to `submitCanvasOp`. Which of `object_ids`,
        `before_seq`, `target_op`, the move fields, and `z_index` may be
        present depends on `kind`: a `remove` takes `object_ids` and none of
        the others; a `clear` takes `before_seq` and none of the others; a
        `restore` takes `target_op` and none of the others; a `move` takes
        `object_id`, `x`, `y`, `w` and `h`, and none of `object_ids`,
        `before_seq`, `target_op` or `z_index`; a `reorder` takes `object_id`
        and `z_index`, and none of `object_ids`, `before_seq`, `target_op`,
        `x`, `y`, `w` or `h`.
      properties:
        id:
          type: string
          format: uuid
          description: Client-minted UUIDv7; also the idempotency key.
        kind:
          type: string
          enum: [remove, clear, restore, move, reorder]
        object_ids:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: string, format: uuid }
          description: The objects a `remove` erases, at most 64 per op.
        before_seq:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Required for `clear`. Every live object placed at or below this
            canvas `seq` is removed.
        target_op:
          type: string
          format: uuid
          description: >-
            Required for `restore`. The `remove` or `clear` op to undo, which
            must belong to this channel and which the caller must have
            authored unless they hold `MANAGE_CANVAS`.
        object_id:
          type: string
          format: uuid
          description: >-
            Required for `move` and `reorder`. The object to reposition or
            restack, which the caller must have authored unless they hold
            `MANAGE_CANVAS`.
        x:
          type: number
          format: double
          description: Required for `move`. The object's new top-left corner.
        y:
          type: number
          format: double
          description: Required for `move`.
        w:
          type: number
          format: double
          description: Required for `move`. At most 8192, as a placement's own `w` is.
        h:
          type: number
          format: double
          description: Required for `move`. At most 8192, as a placement's own `h` is.
        z_index:
          type: integer
          format: int64
          description: >-
            Required for `reorder`. The object's new paint order. Any
            integer is legal, unlike `x`/`y`/`w`/`h` there is no ceiling.

    CanvasOpResult:
      type: object
      required: [op, fresh]
      properties:
        op:
          type: object
          required: [id, seq, kind, affected, created_at]
          properties:
            id:
              type: string
              format: uuid
            seq:
              type: integer
              format: int64
            kind:
              type: string
              enum: [remove, clear, restore, move, reorder]
            affected:
              type: integer
              format: int64
              description: >-
                How many objects this op actually changed. May be 0: every
                named object was already gone, nothing matched `before_seq`,
                a restore named nothing still dead, or a move or reorder
                named an already-removed object.
            created_at:
              type: integer
              format: int64
        fresh:
          type: boolean
          description: >-
            Whether this call is what wrote the op. A replayed id answers
            `false` with the originally stored op and publishes nothing.

    CanvasMediaSlot:
      type: object
      required: [kind, user_id, x, y, w, h, locked, sent_to_back, updated_at]
      properties:
        kind:
          type: string
          enum: [camera, screen]
        user_id:
          type: string
          format: uuid
          description: The participant this tile represents.
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        w:
          type: number
          format: double
        h:
          type: number
          format: double
        locked:
          type: boolean
          description: >-
            Shared, not personal: a locked tile stops intercepting the
            pointer for every viewer, protecting an arrangement everyone
            relies on the same way Figma's own layer lock does.
        sent_to_back:
          type: boolean
          description: Whether this tile paints behind the canvas's drawn content.
        updated_at:
          type: integer
          format: int64

    CanvasMediaSlotUpdate:
      type: object
      required: [x, y, w, h, locked, sent_to_back]
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        w:
          type: number
          format: double
        h:
          type: number
          format: double
        locked:
          type: boolean
        sent_to_back:
          type: boolean

    CanvasMediaSlotPage:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/CanvasMediaSlot"

    Message:
      type: object
      required: [id, channel_id, seq, content, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated UUIDv7; also the idempotency key.
        channel_id:
          type: string
          format: uuid
        author_id:
          type: [string, "null"]
          format: uuid
          description: Null once the author's account has been deleted.
        author_display_name:
          type: [string, "null"]
          description: >-
            The author's display name, sent with the message so a client does
            not need a lookup per distinct sender. Null once the account is
            anonymized, exactly as author_id is.
        seq:
          type: integer
          format: int64
          description: Per-channel monotonic order key, and the sync cursor.
        content:
          type: string
        created_at:
          type: integer
          format: int64
        edited_at:
          type: [integer, "null"]
          format: int64
        reply_to_id:
          type: [string, "null"]
          format: uuid
          description: >-
            The message this one replies to, or null. Always in this same
            channel. Carries only the id: resolve the parent's own content,
            author and liveness by looking that id up like any other message,
            never trust a cached copy of them here.
        forwarded:
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/ForwardedMessage'
          description: >-
            What this message forwards, or null when it forwards nothing.
            Always present as a key, the same "null means genuinely none"
            convention `poll` follows. A forwarding message's own `content`
            is whatever the sender chose to say alongside it and is often
            empty; the thing being forwarded is in here and is never mixed
            into that text.
        thread_channel_id:
          type: [string, "null"]
          format: uuid
          description: >-
            The thread opened from this message, or null if none has been
            started yet. Always present as a key, the same "null means
            genuinely none" convention `poll` follows. Open (or reuse) it
            with `openThread`.
        thread_reply_count:
          type: [integer, "null"]
          format: int64
          description: >-
            Undeleted replies in this message's thread, or null exactly when
            thread_channel_id is null. Can be 0: opening a thread creates its
            channel before the first reply lands in it.
        thread_last_reply_at:
          type: [integer, "null"]
          format: int64
          description: >-
            When the thread's newest undeleted reply was sent, unix
            milliseconds, or null when thread_reply_count is null or 0.
        thread_unread_count:
          type: [integer, "null"]
          format: int64
          description: >-
            How many of the thread's live messages the caller has not yet
            read, or null exactly when thread_channel_id is null. Genuinely
            0 for a thread the caller has fully read - never omitted the way
            an unstarted thread's fields are.
        reactions:
          type: array
          description: >-
            Reaction summaries for this message, one entry per distinct emoji,
            with `reacted` set from the calling user's point of view. Always
            present: an empty array means no reactions, never that the server
            omitted them.
          items:
            $ref: "#/components/schemas/ReactionSummary"
        poll:
          oneOf:
            - $ref: "#/components/schemas/Poll"
            - type: "null"
          description: >-
            The poll this message carries, if any. Always present as a key:
            null means this message is not a poll, the same convention
            `reactions` follows for "genuinely none" versus omitted.
        app_surface:
          oneOf:
            - $ref: "#/components/schemas/AppSurface"
            - type: "null"
          description: >-
            The app this message launches, if any. Always present as a key:
            null means this message launches no app, the same "genuinely none"
            convention `poll` follows. The surface's live, shared state is the
            code-run at block 0, not carried here.
        call:
          oneOf:
            - $ref: "#/components/schemas/CallRecord"
            - type: "null"
          description: >-
            What happened to the DM call this message records, if any. Always
            present as a key: null means this message is not a call, the same
            "genuinely none" convention `poll` follows. A call message's own
            `content` is always empty - what to say about a call depends on
            which side is reading it, so the wording is the client's.
        attachments:
          type: array
          description: >-
            Always present, empty when there are none - same convention as
            `reactions`. Unlike reactions, a freshly sent message can carry
            these immediately, since they are uploaded before the send and
            only referenced by it.
          items:
            $ref: "#/components/schemas/Attachment"
        code_runs:
          type: array
          description: >-
            The shared result of each fenced code block that has been run in
            this message, one entry per block that has a run. Always present,
            empty means none - same convention as `reactions`. A re-run
            replaces its block's entry; everyone viewing the message sees the
            latest.
          items:
            $ref: "#/components/schemas/CodeRun"
        mentions_me:
          type: boolean
          description: >-
            Whether this message mentions the caller - by @name, by a role
            the caller holds, or by @everyone/@here when the author held
            that permission. Per-viewer exactly like `reacted`, and always
            false on the sender's own send or edit response: an author is
            never resolved as mentioning themselves.
        webhook_username:
          type: [string, "null"]
          description: >-
            A webhook post's own `username` label, or null on every other
            message. A label only: `author_display_name` stays the webhook's
            name and clients keep the Webhook badge beside it.
        embeds:
          type: array
          description: >-
            Structured, machine-authored content attached by a webhook
            (`deliverWebhook`) or a bot sending through `sendMessage`. Always
            present, empty when there are none - same convention as
            `reactions`. Fixed once a message exists: nothing edits an
            embed, so `editMessage` always echoes the same array a message
            was sent with. See docs/decisions/0030-incoming-webhooks.md's
            "Where embeds live".
          items:
            $ref: "#/components/schemas/Embed"
        components:
          type: array
          description: >-
            Buttons a bot attached to its own message (decision
            0039-bot-message-buttons), in rows. Empty when there are none.
            Unlike `embeds` a bot can replace them after the fact
            (`setMessageComponents`), so a live `message.components` frame
            carries the whole current list. An edit of the text never changes
            them.
          items:
            $ref: "#/components/schemas/ComponentRow"

    Embed:
      type: object
      description: >-
        The useful core of Discord's own embed shape, capped to Discord's
        own published limits so a caller's tool is never bitten by a
        slim-m-specific ceiling: at most 10 embeds per message, a 256-
        character title, a 4096-character description, at most 25 fields
        (256-character name, 1024-character value each), a 2048-character
        footer, a 256-character author name, and a 6000-character total
        across every title/description/author-name/footer/field on the
        whole message. `deliverWebhook` and `sendMessage` share one
        implementation of every cap (`http::embeds` on the server), so the
        two routes cannot silently drift apart.

        Two fields Discord's own embed has are deliberately absent:
        `author.icon_url` and `footer.icon_url`. Each is a small
        avatar-shaped image beside a name, which is exactly the
        identity-spoofing objection this project already gives for
        dropping `avatar_url` outright (see IncomingWebhookPayload), so
        they get the same answer rather than reopening it for two more
        image fields.
      properties:
        title:
          type: [string, "null"]
        description:
          type: [string, "null"]
        url:
          type: [string, "null"]
          description: Where the embed's title links, if anywhere.
        accent:
          type: [string, "null"]
          enum: [red, orange, yellow, green, blue, purple, null]
          description: >-
            The caller's colour, reduced to one of six pre-tuned swatches -
            never a raw hex fill. slim-m's design system keeps its one
            accent hue closed to seven unrelated chrome roles (decision
            0004) and this is not that accent: it is a second, separate
            closed palette that exists only so a caller can tell one
            embed's kind from another at a glance. The client paints it as
            a border stripe and a soft tint only, never as text, so no
            caller input can land on a contrast failure. Null when the
            caller sent no colour, or sent one too close to black, white or
            grey to read as a hue.
        author_name:
          type: [string, "null"]
        author_url:
          type: [string, "null"]
        fields:
          type: array
          description: Always present, empty when the caller sent none.
          items:
            $ref: "#/components/schemas/EmbedField"
        footer_text:
          type: [string, "null"]
        timestamp:
          type: [integer, "null"]
          format: int64
        image_token:
          type: [string, "null"]
          description: >-
            Redeemable at `getLinkPreviewImage`, exactly like an ordinary
            pasted link's preview image - never the raw upstream URL. Null
            when the caller sent no image, the URL failed the same SSRF
            guard decision 0019 already runs for link previews, or this
            deployment has not opted into outbound image fetching at all
            (`SLIMM_LINK_PREVIEWS`). Every one of those degrades identically:
            the embed still posts, with no image.
        thumbnail_token:
          type: [string, "null"]
          description: Same treatment as image_token, for the smaller slot.

    EmbedField:
      type: object
      required: [name, value, inline]
      properties:
        name:
          type: string
        value:
          type: string
        inline:
          type: boolean
          description: >-
            Whether this field may sit beside its neighbors rather than
            taking the embed's full width - Discord's own field shape.

    SavedMessage:
      allOf:
        - $ref: "#/components/schemas/Message"
        - type: object
          required: [saved_at]
          properties:
            saved_at:
              type: integer
              format: int64
              description: >
                When the caller saved it, unix milliseconds - not when it was
                sent, which is the message's own `created_at`. The list is
                ordered by this.

    ForwardedMessage:
      type: object
      required: [message_id, channel_id, created_at, content]
      description: >
        What a message was forwarded from. A snapshot taken when the forward
        was sent, not a live read: an edit to the original never rewrites what
        was passed on. Deleting or ageing out the original removes the
        snapshot: a copy with nothing of its own is deleted, and one carrying
        the forwarder's note keeps it with `removed` true and the snapshot
        blanked.

        Always the first original. Forwarding a forward does not nest: the
        chain is flattened at send time, so this never names a message that
        is itself only relaying something else.
      properties:
        message_id:
          type: string
          format: uuid
          description: >
            The original, for jumping to it in place. Resolve `channel_id`
            against your own channel list first: an origin you have no
            access to names a channel you do not hold, so offer no jump
            rather than a request that would be refused.
        channel_id:
          type: string
          format: uuid
          description: >
            The channel the original lives in. Deliberately sent without its
            name - resolve that from the channel list you already hold, so a
            name you are not entitled to is never sent in the first place.
            An id you cannot resolve is an origin you cannot reach.
        author_id:
          type: [string, "null"]
          format: uuid
          description: >
            Who wrote the original. Null once that account is anonymized,
            the same convention a message's own author_id follows.
        author_display_name:
          type: [string, "null"]
          description: Null under the same conditions as author_id.
        author_avatar_updated_at:
          type: [integer, "null"]
          format: int64
          description: >
            Builds the author's avatar URL without a second lookup, and
            busts the cache when they change it.
        created_at:
          type: integer
          format: int64
          description: >
            When the original was sent, not when it was forwarded - that is
            the carrying message's own created_at.
        content:
          type: string
          description: >
            What the original said when it was forwarded. Empty once removed.
        removed:
          type: boolean
          description: >
            The original was deleted or aged out. Render "original message was
            deleted" in place of the snapshot.

    Attachment:
      type: object
      required: [id, filename, content_type, size]
      properties:
        id:
          type: string
          description: >
            Hex sha256 of the stored bytes. Also the path segment
            `getAttachment` fetches it at.
        filename:
          type: string
          description: >
            Sanitized display name. Content-addressed storage means this is a
            property of the bytes, not of any one message attaching them: the
            first upload of a given hash sets it.
        content_type:
          type: string
          description: >
            One of a fixed server-side allowlist, decided by sniffing the
            uploaded bytes - never the client's declared Content-Type or a
            filename extension.
        size:
          type: integer
          format: int64

    GifResult:
      type: object
      required: [id, title, width, height]
      properties:
        id:
          type: string
          description: >
            An opaque token minted by this search, never the provider's own
            id or CDN URL. Redeemable at getGifPreview and selectGif for a
            short time, then expires.
        title:
          type: string
          description: The provider's own description of the result, which may be empty.
        width:
          type: integer
          description: >
            The full-resolution image's width, or 0 when the provider's
            response does not carry dimensions.
        height:
          type: integer
          description: Paired with width; see that field's own description.

    LinkPreview:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The URL this preview is for, echoed back so a client can key its own cache.
        title:
          type: [string, "null"]
          description: The page's OpenGraph or plain title, if any.
        description:
          type: [string, "null"]
          description: The page's OpenGraph or meta description, if any.
        site_name:
          type: [string, "null"]
          description: The page's OpenGraph site name, if any.
        image_token:
          type: [string, "null"]
          description: >
            An opaque token for the preview image, redeemable at
            getLinkPreviewImage. Never the upstream image URL, so the image is
            always proxied through this server. Null when the page had no
            usable image.
        video_provider:
          type: [string, "null"]
          description: >
            Set together with video_id when the linked page was recognized as
            a playable video during unfurl, purely from its URL or an
            og:video tag - detecting the provider and id makes no extra
            request. Only "youtube" exists today. When set, a client should
            render a click-to-play affordance instead of the static card, and
            must not contact the provider until the reader taps. Null for an
            ordinary link. Detection is separate from populating this video's
            title/image/author, which does make one further request - see
            author_name.
        video_id:
          type: [string, "null"]
          description: >
            The provider's own canonical video id (paired with
            video_provider), never a URL - a client builds its own playback
            URL from provider and id. Null unless video_provider is set.
        author_name:
          type: [string, "null"]
          description: >
            The page's author or publisher, if known - a recognized video's
            channel name today (from the provider's oembed response, a second
            best-effort request; see the getLinkPreview description). Null
            for an ordinary link, or when that request failed.
        author_url:
          type: [string, "null"]
          description: >
            The author's own page, paired with author_name - a channel name a
            reader cannot click is less useful. Null unless author_name is
            set, and even then only when the provider supplied a usable
            http(s) URL.

    PinnedMessage:
      description: >-
        A pinned message: every Message field, flattened, plus when and by
        whom it was pinned.
      allOf:
        - $ref: "#/components/schemas/Message"
        - type: object
          required: [pinned_at]
          properties:
            pinned_at:
              type: integer
              format: int64
              description: When the message was pinned, unix milliseconds.
            pinned_by:
              type: [string, "null"]
              format: uuid
              description: >-
                Who pinned it. Null once that account has been anonymized,
                exactly as author_id is.

    PinCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          format: int64
          description: >-
            How many messages are currently pinned in the channel. Cheap to
            read: a single indexed count, never a fetch of every pinned
            message.

    VoiceToken:
      type: object
      required: [url, room, token, expires_at, can_publish]
      properties:
        url:
          type: string
          description: >-
            The SFU to connect to, as reachable from outside the deployment.
        room:
          type: string
          description: >-
            The room to join. Derived from the channel id on the server, echoed
            here so a client does not have to know the derivation rule.
        token:
          type: string
          description: A LiveKit access token (an HS256 JWT).
        expires_at:
          type: integer
          format: int64
          description: >-
            Unix milliseconds. Deliberately soon; re-mint before it lapses
            rather than waiting to be disconnected.
        can_publish:
          type: boolean
          description: >-
            Whether this token grants publishing audio, mirroring the SPEAK
            grant inside it, so the UI can show a listen-only state up front
            instead of after the SFU refuses a track.
    RingStarted:
      type: object
      required: [ring_id, timeout_ms]
      properties:
        ring_id:
          type: string
          format: uuid
          description: >-
            Names this specific ring attempt, echoed on the `call.ring_ended`
            event that eventually closes it.
        timeout_ms:
          type: integer
          format: int64
          description: >-
            How long the server waits for an answer before giving up on this
            ring on its own; a client renders its own countdown from this
            value rather than a hard-coded duration.

    IncomingDmCallRings:
      type: object
      required: [rings]
      properties:
        rings:
          type: array
          items:
            $ref: "#/components/schemas/IncomingDmCallRing"
    IncomingDmCallRing:
      type: object
      required: [channel_id, ring_id, caller_id, remaining_ms]
      properties:
        channel_id:
          type: string
          format: uuid
        ring_id:
          type: string
          format: uuid
        caller_id:
          type: string
          format: uuid
        remaining_ms:
          type: integer
          format: int64
          description: >-
            How long until the server gives up on this ring.

    LiveKitWebhookEvent:
      type: object
      required: [event]
      description: >-
        LiveKit's own webhook payload, trimmed to the fields this server
        reads. See docs/decisions/0032-voice-participant-webhooks.md; the
        full shape is LiveKit's, not documented here field by field.
      properties:
        event:
          type: string
          description: >-
            One of LiveKit's event names, for example participant_joined,
            participant_left, track_published or track_unpublished. Anything
            else is accepted and ignored.
        room:
          type: object
          properties:
            name:
              type: string
        participant:
          type: object
          properties:
            identity:
              type: string
        track:
          type: object
          properties:
            sid:
              type: string
            source:
              type: string

    VoiceRoster:
      type: object
      required: [participants]
      properties:
        participants:
          type: array
          items:
            $ref: "#/components/schemas/VoiceRosterParticipant"
        call_age_ms:
          type: integer
          format: int64
          nullable: true
          description: >-
            How long the longest-present listed participant has been in the
            room, in milliseconds - the call's age. An age rather than a start
            time so every client reads the same length whatever its clock says.
            Null when nobody is listed.

    VoiceRosterParticipant:
      type: object
      required: [user_id, display_name]
      properties:
        user_id:
          type: string
        display_name:
          type: string
          description: >-
            As it was when this participant joined the room, not necessarily
            their current profile name.
        is_sharing_screen:
          type: boolean
          description: >-
            Whether any of this participant's published tracks is
            screen-share sourced, read directly off the same LiveKit
            response as the rest of this roster entry.
        has_video:
          type: boolean
          description: >-
            Whether any of this participant's published tracks is video,
            camera or screen share alike.

    ReactionSummary:
      type: object
      required: [emoji, count, reacted]
      properties:
        emoji:
          type: string
          description: The reaction emoji itself. User content, never chrome.
        count:
          type: integer
          format: int64
          description: How many people have reacted with this emoji.
        reacted:
          type: boolean
          description: >-
            Whether the calling user is one of them, so a client can render the
            toggled state without a second request.

    Poll:
      type: object
      required: [question, options, total_votes, closed]
      properties:
        question:
          type: string
        options:
          type: array
          minItems: 2
          maxItems: 4
          description: Ordered and fixed at creation; never reordered or edited.
          items:
            $ref: "#/components/schemas/PollOption"
        total_votes:
          type: integer
          format: int64
          description: The sum of every option's count.
        voted_option:
          type: [integer, "null"]
          format: int64
          description: >-
            The 0-based position the calling user picked, or null if they
            have not voted. Per-viewer, exactly like ReactionSummary.reacted:
            never present for anyone but the voter themselves.
        close_at:
          type: [integer, "null"]
          format: int64
          description: Unix milliseconds. Null means the poll never closes.
        closed:
          type: boolean
          description: >-
            Whether the server's own clock already considers this poll past
            close_at. Voting is refused server-side regardless of what a
            client believes this to be.

    PollOption:
      type: object
      required: [position, label, votes]
      properties:
        position:
          type: integer
          format: int64
          description: 0-based, fixed at creation; also the option's identity.
        label:
          type: string
        votes:
          type: integer
          format: int64
          description: >-
            How many people picked this option. Who they are is never
            revealed by this or any other read: only the calling user's own
            voted_option is.

    CreatePollMessageRequest:
      type: object
      required: [id, question, options]
      properties:
        id:
          type: string
          format: uuid
          description: >
            Client-generated UUIDv7. Retrying with the same id returns the
            stored message instead of sending twice.
        content:
          type: string
          maxLength: 4000
          description: >-
            An optional caption riding alongside the poll. May be empty or
            omitted: the poll itself is what the message is for.
        question:
          type: string
          minLength: 1
          maxLength: 300
        options:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: string
            minLength: 1
            maxLength: 100
        close_at:
          type: integer
          format: int64
          description: >-
            Unix milliseconds. Omitted or null means the poll never closes.

    LaunchAppRequest:
      type: object
      required: [id, module_id, command]
      properties:
        id:
          type: string
          format: uuid
          description: >
            Client-generated UUIDv7. Retrying with the same id returns the
            stored message instead of launching twice.
        content:
          type: string
          maxLength: 4000
          description: >-
            An optional caption riding alongside the app. May be empty or
            omitted: the app itself is what the message is for.
        module_id:
          type: string
          description: The installed module whose app to launch.
        command:
          type: string
          description: >-
            The module command this app's `app` extension point names.

    VotePollRequest:
      type: object
      required: [option]
      properties:
        option:
          type: integer
          format: int64
          description: The 0-based position of the option being voted for.

    SendMessageRequest:
      type: object
      required: [id, content]
      properties:
        id:
          type: string
          format: uuid
          description: >
            Client-generated UUIDv7. Retrying with the same id returns the
            stored message instead of sending twice.
        content:
          type: string
          maxLength: 4000
          description: >
            Must not be blank unless the message carries something else:
            `attachment_ids` is non-empty, or `forwarded_from_id` is set. A
            message carrying a file or a forward needs no text of its own,
            and a blank one carrying neither is a 400.
        attachment_ids:
          type: array
          description: >
            Hex sha256 ids of attachments already uploaded through
            `uploadAttachment`, in display order. Requires ATTACH_FILES in
            addition to SEND_MESSAGES when non-empty. An id that was never
            uploaded (or was already reclaimed) is a 400, not a silent drop.
          items:
            type: string
          maxItems: 10
        reply_to_id:
          type: [string, "null"]
          format: uuid
          description: >-
            The message this one replies to. Must already exist (live or
            soft-deleted) in this same channel, or the send is a 400.
        forwarded_from_id:
          type: [string, "null"]
          format: uuid
          description: >-
            The message this one forwards. Unlike `reply_to_id` it may live
            in any channel you can see, but it must be live: forwarding a
            deleted message is a 400, because a forward copies the text and
            would republish what someone removed. Only the id is accepted -
            the server reads the original's author, timestamp and text
            itself, so a request cannot dress its own text up as another
            account's. A target that does not exist, or that you cannot see,
            is refused identically so this cannot probe for private
            messages.
        embeds:
          type: array
          description: >-
            Structured, machine-authored content, honoured only when the
            sender is a bot account (`is_bot`) - a person's composer has no
            embed UI, so the route itself enforces that rather than only the
            client happening to respect it. From anyone else this field is
            accepted and silently discarded, never a 400: neither a bot nor
            a webhook is a person typing by hand, and
            docs/decisions/0030-incoming-webhooks.md already gives a
            webhook's own body that same accept-not-refuse treatment.

            At most 10 embeds per message. Per embed: a 256-character title,
            a 4096-character description, a 256-character author name, a
            2048-character footer, at most 25 fields (a 256-character name
            and a 1024-character value each), and a 6000-character total
            across every title/description/author-name/footer/field-text on
            the whole message - Discord's own published limits, shared with
            `deliverWebhook`'s own `embeds` by one implementation
            (`http::embeds::build_embeds`) so the two routes cannot drift
            onto different ceilings. Any of those overrun 400s naming how far
            over.

            `image`/`thumbnail` are the one exception: a URL that fails the
            same SSRF guard `getLinkPreview` already runs (decision 0019), or
            is sent while this deployment has not opted into outbound
            fetching at all (`SLIMM_LINK_PREVIEWS`), is silently dropped
            rather than refused - the image is never the reason the message
            exists. See the `Embed` schema for what a caller gets back.
          items:
            $ref: "#/components/schemas/RequestEmbed"
        components:
          type: array
          description: >-
            Rows of buttons, bot accounts only: from anyone else the request is
            refused with 403 rather than the field being dropped, because the
            caller is a program that would otherwise never learn its buttons
            were discarded. At most 5 rows of 5 buttons, an 80-character label,
            a 100-character `custom_id` unique within the message and a
            512-character `url` (http or https, link buttons only). Any overrun
            is a 400 naming the rule.
          items:
            $ref: "#/components/schemas/ComponentRow"

    RequestEmbed:
      type: object
      description: >-
        What a caller sends to attach one embed - see `embeds` on
        SendMessageRequest and `embeds` on IncomingWebhookPayload for the
        caps both share. `author`/`footer`/`image`/`thumbnail` are Discord's
        own nested shape, so a tool already speaking Discord's contract needs
        no translation for the fields this honours.
      properties:
        title:
          type: [string, "null"]
        description:
          type: [string, "null"]
        url:
          type: [string, "null"]
        color:
          type: [integer, "null"]
          description: >-
            A 24-bit RGB integer (Discord's own shape). Out of that range is
            dropped, not refused: see the `Embed` schema's `accent` for what
            this becomes on the way back out.
        author:
          type: [object, "null"]
          properties:
            name:
              type: string
            url:
              type: [string, "null"]
          required: [name]
        fields:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name:
                type: string
              value:
                type: string
              inline:
                type: boolean
        footer:
          type: [object, "null"]
          properties:
            text:
              type: string
          required: [text]
        timestamp:
          type: [integer, "null"]
          format: int64
        image:
          type: [object, "null"]
          properties:
            url:
              type: string
          required: [url]
        thumbnail:
          type: [object, "null"]
          properties:
            url:
              type: string
          required: [url]

    EditMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000

    RegisterPushRequest:
      type: object
      required: [platform, push_token, push_public_key]
      properties:
        platform:
          type: string
          enum: [ios, android]
        push_token:
          type: string
          minLength: 1
          maxLength: 1024
          description: The opaque relay token for ordinary (non-VoIP) push.
        voip_push_token:
          type: string
          minLength: 1
          maxLength: 1024
          description: The opaque relay token for VoIP wake (incoming calls).
        push_public_key:
          type: string
          format: byte
          description: >
            The device's X25519 public key, base64-encoded (32 bytes decoded).
            Push content is sealed to this key with an anonymous sealed box; a
            device without one registered cannot receive push.
        include_content:
          type: boolean
          description: >
            The member's explicit choice about a preview (sender, channel name,
            a truncated body) sealed inside the push envelope, saved to the
            account. Absent means the client never asked, so the account's own
            choice applies, else the server default. It never changes whether
            a device is woken. The preview rides inside the sealed box, so the
            relay and APNs and FCM cannot read it.
        include_content_chosen:
          type: boolean
          description: >
            Marks `include_content` as a deliberate toggle by the member. An
            unmarked `false` is ignored, because a client that predates this
            field sends `false` whenever the member never toggled; an unmarked
            `true` is always saved. A marked value is always saved.

    PushPreview:
      type: object
      required: [include_content]
      properties:
        include_content:
          type: boolean
          description: >
            Whether push envelopes carry a preview of the message. The
            account's own choice, else the server default.

    ReportLifecycleRequest:
      type: object
      required: [state]
      properties:
        state:
          type: string
          minLength: 1
          maxLength: 32
          description: >
            A client lifecycle label, for example `foreground` or
            `background`. Only `foreground` carries meaning to the server
            today; anything else is treated as not foreground.

    NotificationPreference:
      type: object
      required: [preference]
      properties:
        preference:
          type: string
          enum: [everything, mentions, nothing]
          description: >
            `everything` is every message in a channel the caller can see -
            the default, and what every account already got before this
            preference existed. `mentions` is a direct `@`-mention plus every
            message in a DM. `nothing` is no push at all, ever, including a
            DM.

    QuietHours:
      type: object
      required: [start_minute, end_minute]
      properties:
        start_minute:
          type: integer
          minimum: 0
          maximum: 1439
          description: Minutes since midnight UTC that the window opens.
        end_minute:
          type: integer
          minimum: 0
          maximum: 1439
          description: >
            Minutes since midnight UTC that the window closes, exclusive.
            May be less than `start_minute` for a window that crosses
            midnight (23:00-08:00 is the ordinary shape); must not equal
            `start_minute`.

    QuietHoursResponse:
      type: object
      required: [quiet_hours]
      properties:
        quiet_hours:
          oneOf:
            - $ref: "#/components/schemas/QuietHours"
            - type: "null"
          description: >-
            Always present as a key: null means quiet hours are disabled,
            the same convention `Message.poll` follows for "genuinely none"
            versus omitted.

    NotificationScheduleDay:
      type: object
      required: [weekday, start_minute, end_minute]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Monday .. 6 = Sunday.
        start_minute:
          type: integer
          minimum: 0
          maximum: 1439
          description: Minutes since midnight, in the schedule's own timezone, that this weekday's on-hours window opens.
        end_minute:
          type: integer
          minimum: 0
          maximum: 1439
          description: >
            Minutes since midnight that the window closes, exclusive. May be
            less than `start_minute` for a window that starts this weekday
            and crosses midnight into the next one; must not equal
            `start_minute`.

    NotificationSchedule:
      type: object
      required: [timezone, days, off_hours_mode, snooze_until, allowed_user_ids, allowed_channel_ids]
      properties:
        timezone:
          type: string
          description: An IANA time zone name, for example "America/New_York".
        days:
          type: array
          items:
            $ref: "#/components/schemas/NotificationScheduleDay"
          description: A weekday absent here has no on-hours window at all - the whole day is off hours.
        off_hours_mode:
          type: string
          enum: [mentions, nothing]
          description: >
            `mentions` lets mentions and DMs through off hours (today's
            quiet-hours behaviour, and the default). `nothing` silences
            everything off hours, including a mention, unless an allow-list
            says otherwise.
        snooze_until:
          oneOf:
            - type: integer
              format: int64
            - type: "null"
          description: Epoch-millisecond deadline; while in the future the schedule reads as off hours in `nothing` mode regardless of the window or mode.
        allowed_user_ids:
          type: array
          items:
            type: string
            format: uuid
        allowed_channel_ids:
          type: array
          items:
            type: string
            format: uuid

    NotificationScheduleResponse:
      type: object
      required: [schedule]
      properties:
        schedule:
          oneOf:
            - $ref: "#/components/schemas/NotificationSchedule"
            - type: "null"
          description: >-
            Always present as a key: null means never configured, distinct
            from a schedule with every weekday empty.

    SetNotificationScheduleRequest:
      type: object
      required: [timezone, days, off_hours_mode]
      properties:
        timezone:
          type: string
        days:
          type: array
          items:
            $ref: "#/components/schemas/NotificationScheduleDay"
        off_hours_mode:
          type: string
          enum: [mentions, nothing]

    SetSnoozeRequest:
      type: object
      required: [until_ms]
      properties:
        until_ms:
          type: integer
          format: int64
          description: Epoch-millisecond deadline, in the future and no more than a week out.

    SnoozeResponse:
      type: object
      required: [snooze_until]
      properties:
        snooze_until:
          oneOf:
            - type: integer
              format: int64
            - type: "null"

    ChannelNotificationOverrideRequest:
      type: object
      required: [preference]
      properties:
        preference:
          type: string
          enum: [mentions, nothing]
          description: >
            Never `everything`: having no override already means that, so
            `DELETE /notification-preferences/channels/{channelId}` is the
            way back to it rather than a third spelling of the same answer.

    ChannelNotificationOverrideEntry:
      type: object
      required: [channel_id, preference]
      properties:
        channel_id:
          type: string
          format: uuid
        preference:
          type: string
          enum: [mentions, nothing]

    ChannelPermissions:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: integer
          format: int64
          description: >
            The caller's effective permission bitmask in this one channel,
            already resolved through thread and DM handling and with any
            timeout subtracted - see `getChannelPermissions`. Zero whenever
            the caller lacks VIEW_CHANNEL here, including for a channel that
            does not exist at all.

    ChannelOverwrites:
      type: object
      required: [overwrites]
      properties:
        overwrites:
          type: array
          description: Every overwrite set on the channel, role and member alike.
          items:
            type: object
            required: [kind, id, allow, deny]
            properties:
              kind:
                type: string
                enum: [role, member]
                description: Which kind of target `id` names.
              id:
                type: string
                format: uuid
                description: The role's or member's UUID, matching `kind`.
              allow:
                type: integer
                format: int64
                description: The permission bits this overwrite forces on.
              deny:
                type: integer
                format: int64
                description: The permission bits this overwrite forces off.

    ThreadParent:
      type: object
      required:
        [
          parent_channel_id,
          parent_channel_name,
          parent_message_id,
          parent_content,
          parent_deleted,
          parent_author_id,
          parent_author_display_name,
        ]
      properties:
        parent_channel_id:
          type: string
          format: uuid
          nullable: true
          description: The channel the thread's parent message lives in.
        parent_channel_name:
          type: string
          nullable: true
          description: That channel's current name, resolved server-side.
        parent_message_id:
          type: string
          format: uuid
          nullable: true
          description: The message this thread hangs off.
        parent_content:
          type: [string, "null"]
          description: >-
            The parent message's current text, joined at read time. Null
            exactly when parent_deleted is true.
        parent_deleted:
          type: boolean
          description: >-
            True once the parent message has been soft-deleted. The thread
            stays open either way, since its replies are a separate channel.
        parent_author_id:
          type: [string, "null"]
          format: uuid
          description: Null once the parent's author account is anonymized.
        parent_author_display_name:
          type: [string, "null"]

    ThreadListItem:
      description: >-
        One row of `listThreads`: a thread's own channel id, the parent
        message it hangs off (flattened, not just referenced, so a list
        needs no per-row follow-up fetch), and how busy and how read it is.
      type: object
      required:
        [
          id,
          parent_message_id,
          parent_content,
          parent_author_id,
          parent_author_display_name,
          created_at,
          reply_count,
          last_reply_at,
          unread_count,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: The thread's own channel id. Open (or reuse) it with `openThread`.
        parent_message_id:
          type: string
          format: uuid
        parent_content:
          type: string
          description: >-
            The parent message's current text, joined at read time - not a
            snapshot frozen at whenever the thread opened, so an edit to the
            parent is reflected the next time this listing is fetched.
        parent_author_id:
          type: [string, "null"]
          format: uuid
          description: Null once the parent's author account is anonymized.
        parent_author_display_name:
          type: [string, "null"]
        created_at:
          type: integer
          format: int64
          description: When the thread was opened, unix milliseconds.
        reply_count:
          type: integer
          format: int64
          description: Undeleted replies in this thread. Can be 0.
        last_reply_at:
          type: [integer, "null"]
          format: int64
          description: When the newest undeleted reply was sent, or null when reply_count is 0.
        unread_count:
          type: integer
          format: int64
          description: >-
            How many of this thread's live messages the caller has not yet
            read - the same read-tracking every channel already carries,
            surfaced here for the first time.

    ReadState:
      type: object
      required: [last_read_seq, unread, manually_unread]
      properties:
        last_read_seq:
          type: integer
          format: int64
        unread:
          type: integer
          format: int64
          description: Live count of messages past the marker.
        manually_unread:
          type: boolean
          description: The caller asked to see this as unread despite the marker.

    ChannelReadState:
      allOf:
        - $ref: "#/components/schemas/ReadState"
        - type: object
          required: [channel_id]
          properties:
            channel_id:
              type: string
              format: uuid

    MarkReadRequest:
      type: object
      required: [seq]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 0

    SyncRequest:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ScopeCursor"

    ScopeCursor:
      type: object
      required: [channel_id, after_seq]
      properties:
        channel_id:
          type: string
          format: uuid
        after_seq:
          type: integer
          format: int64
          description: The highest `seq` this client already holds for the scope.
        after_op_seq:
          type: integer
          format: int64
          description: >
            The highest message-op `seq` this client already holds. Absent when
            it holds none, which is what every client older than the op stream
            sends and what a newer one sends before adopting a head. A scope
            that omits this receives no `ops` and is never told to `reset`
            because of an op gap.

    SyncResponse:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ScopeDelta"

    ScopeDelta:
      type: object
      required: [channel_id, messages, has_more, reset, ops, op_latest_seq, ops_has_more]
      properties:
        channel_id:
          type: string
          format: uuid
        messages:
          type: array
          description: Messages after the cursor, oldest first.
          items:
            $ref: "#/components/schemas/Message"
        has_more:
          type: boolean
          description: More remains past what this response carried.
        reset:
          type: boolean
          description: >
            Either cursor was too far behind to stream. Discard local state for
            this scope and refetch it. One flag rather than two, because the
            recovery is identical whichever cursor could not be answered; it is
            only ever set from an op gap for a scope that sent `after_op_seq`.
        ops:
          type: array
          description: >
            Message edits and deletes after `after_op_seq`, oldest first. Empty
            whenever the request carried no op cursor, and empty when there is
            genuinely nothing.
          items:
            $ref: "#/components/schemas/MessageOp"
        op_latest_seq:
          type: integer
          format: int64
          description: >
            The head of this channel's message-op stream. Always present on a
            server that has one, which is how a client tells that apart from a
            stream nothing has been written to.
        ops_has_more:
          type: boolean
          description: More ops remain past what this response carried.

    MessageOp:
      type: object
      required: [seq, kind, message_id, created_at]
      description: >
        One entry in a channel's message-op stream: the record of an edit or a
        delete, which `messages.seq` cannot carry because it is allocated once
        at creation and never moves. No op names its actor, on any kind: the
        live `message.deleted` frame carries only the ids a connection needs to
        drop it from view, and this feed does not disclose more than that.
      properties:
        seq:
          type: integer
          format: int64
          description: >
            Order within the message-op stream, dense over ops. A different
            sequence from a message's own `seq`.
        kind:
          type: string
          enum: [edit, delete]
        message_id:
          type: string
          format: uuid
        created_at:
          type: integer
          format: int64
        content:
          type: string
          description: >
            The message's current text, joined at read time rather than stored
            on the op. Absent on a `delete`, absent once the message has been
            deleted, and absent on every edit but the last naming a message
            within one page. An op with no content still carries its `seq`, so
            a cursor advances through it.
        edited_at:
          type: integer
          format: int64
        forwarded_removed:
          type: boolean
          description: >
            On an `edit`, present and true when the message is a forward whose
            original was removed, so the snapshot should be cleared. Applies
            even when `content` is absent.

    ClientFrame:
      description: A frame sent by the client over the WebSocket.
      oneOf:
        - $ref: "#/components/schemas/ClientHello"
        - $ref: "#/components/schemas/ClientPing"
        - $ref: "#/components/schemas/ClientTyping"
        - $ref: "#/components/schemas/ClientViewing"
        - $ref: "#/components/schemas/ClientCanvasCursor"
        - $ref: "#/components/schemas/ClientCanvasStrokePreview"

    ClientHello:
      type: object
      required: [type, ticket, protocol]
      properties:
        type:
          type: string
          enum: [hello]
        ticket:
          type: string
        protocol:
          type: integer
          format: int32
          description: Must match the server's protocol version.

    ClientPing:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [ping]

    ClientTyping:
      type: object
      required: [type, channel_id]
      description: >
        A typing refresh. Rate-limited and authorized like a channel event
        (the caller must be able to view and send in the channel); there is
        no explicit "stop typing" frame, since the state lapses on its own
        server-side after a few seconds without another refresh.
      properties:
        type:
          type: string
          enum: [typing]
        channel_id:
          type: string
          format: uuid

    ClientViewing:
      type: object
      required: [type, channel_ids]
      description: >
        The channels this connection has open and focused right now,
        replacing its previous report; an empty list clears it. A client
        re-sends it about every 30 seconds while it holds, because the
        server lets a report lapse after 60 seconds. It is used only to skip
        a push notification for a message this account is already reading,
        is never broadcast, and is unaffected by presence visibility. At
        most 8 ids are honoured and ids that do not parse are ignored.
      properties:
        type:
          type: string
          enum: [viewing]
        channel_ids:
          type: array
          items:
            type: string
            format: uuid

    ClientCanvasCursor:
      type: object
      required: [type, channel_id, x, y]
      description: >
        A pointer position on a channel's canvas: ephemeral, relayed to the
        other viewers but never persisted, with no "stop" frame. Rate-limited
        silently, and dropped without an error when a coordinate is not finite
        or lies outside the canvas world (5,000,000 units from the origin on
        either axis), or when the member lacks view and canvas permission.
      properties:
        type:
          type: string
          enum: [canvas.cursor]
        channel_id:
          type: string
          format: uuid
        x:
          type: number
          format: double
        y:
          type: number
          format: double

    ClientCanvasStrokePreview:
      type: object
      required: [type, channel_id, object_id, points]
      description: >
        An in-flight stroke preview on a channel's canvas: ephemeral,
        relayed but never persisted. `points` is a delta - only the points
        added since this client's last frame for `object_id` - never the
        whole path so far, since a full-path frame would cost more with
        every point drawn. Rate-limited by the frame's own byte size rather
        than by count, and refused outright for a timed-out member, since
        unlike `typing` or `canvas.cursor` this frame carries drawing
        content.
      properties:
        type:
          type: string
          enum: [canvas.stroke_preview]
        channel_id:
          type: string
          format: uuid
        object_id:
          type: string
          format: uuid
          description: >
            A client-minted id keying this preview session. Never a row in
            canvas_objects: the object(s) a finished stroke commits are
            decided later, by POST .../canvas/objects, and one stroke can
            split into several.
        points:
          type: array
          items: { type: number, format: double }
        ended:
          type: boolean
          default: false
          description: >
            Marks this as the gesture's last frame, whether or not it went
            on to commit a real object.

    ServerFrame:
      description: A frame sent by the server over the WebSocket.
      oneOf:
        - $ref: "#/components/schemas/ServerHello"
        - $ref: "#/components/schemas/MessageCreated"
        - $ref: "#/components/schemas/MessageEdited"
        - $ref: "#/components/schemas/MessageDeleted"
        - $ref: "#/components/schemas/ReactionsChanged"
        - $ref: "#/components/schemas/CodeRunChanged"
        - $ref: "#/components/schemas/CodeRunsCleared"
        - $ref: "#/components/schemas/ThreadUpdated"
        - $ref: "#/components/schemas/MessagePinned"
        - $ref: "#/components/schemas/MessageUnpinned"
        - $ref: "#/components/schemas/PollVoted"
        - $ref: "#/components/schemas/PresenceChanged"
        - $ref: "#/components/schemas/MemberTimeout"
        - $ref: "#/components/schemas/MemberRemoved"
        - $ref: "#/components/schemas/MemberRestored"
        - $ref: "#/components/schemas/MemberJoined"
        - $ref: "#/components/schemas/ProfileChanged"
        - $ref: "#/components/schemas/TypingStarted"
        - $ref: "#/components/schemas/TypingStopped"
        - $ref: "#/components/schemas/RoleChanged"
        - $ref: "#/components/schemas/MemberRoleChanged"
        - $ref: "#/components/schemas/ChannelCreated"
        - $ref: "#/components/schemas/ChannelUpdated"
        - $ref: "#/components/schemas/ChannelDeleted"
        - $ref: "#/components/schemas/OverwriteChanged"
        - $ref: "#/components/schemas/CategoryChanged"
        - $ref: "#/components/schemas/VoiceActivityChanged"
        - $ref: "#/components/schemas/VoiceParticipantJoined"
        - $ref: "#/components/schemas/VoiceParticipantLeft"
        - $ref: "#/components/schemas/VoiceScreenShareChanged"
        - $ref: "#/components/schemas/WatchTick"
        - $ref: "#/components/schemas/CallRinging"
        - $ref: "#/components/schemas/CallRingEnded"
        - $ref: "#/components/schemas/CanvasObjectPlaced"
        - $ref: "#/components/schemas/CanvasObjectsRemoved"
        - $ref: "#/components/schemas/CanvasCleared"
        - $ref: "#/components/schemas/CanvasObjectsRestored"
        - $ref: "#/components/schemas/CanvasCursorMoved"
        - $ref: "#/components/schemas/CanvasStrokePreviewUpdated"
        - $ref: "#/components/schemas/CanvasObjectMoved"
        - $ref: "#/components/schemas/CanvasObjectReordered"
        - $ref: "#/components/schemas/CanvasMediaSlotChanged"
        - $ref: "#/components/schemas/ReportsChanged"
        - $ref: "#/components/schemas/ReadStateChanged"
        - $ref: "#/components/schemas/NotificationOverrideChanged"
        - $ref: "#/components/schemas/MessageEphemeral"
        - $ref: "#/components/schemas/MessageComponents"
        - $ref: "#/components/schemas/InteractionCreated"
        - $ref: "#/components/schemas/InteractionAnswered"
        - $ref: "#/components/schemas/NewDeviceSignIn"
        - $ref: "#/components/schemas/ServerPong"
        - $ref: "#/components/schemas/ServerError"
    CanvasObjectPlaced:
      type: object
      required: [type, channel_id, seq, object]
      description: >-
        An object was placed on a channel's canvas. Delivered only to
        connections holding both `VIEW_CHANNEL` and `USE_CANVAS` in that
        channel, matching what the viewport read requires, and only for a fresh
        write - an idempotent replay broadcasts nothing.
      properties:
        type:
          type: string
          enum: [canvas.object.placed]
        channel_id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        object:
          $ref: "#/components/schemas/CanvasObject"

    CanvasObjectsRemoved:
      type: object
      required: [type, channel_id, seq, op_id, object_ids]
      description: >-
        Objects were removed from a channel's canvas, gated the same way
        `canvas.object.placed` is. Ids only, matching `message.deleted`: a
        removal publishes an id rather than content, and the actor is
        deliberately absent so a moderation act does not name its moderator
        to the whole channel.
      properties:
        type:
          type: string
          enum: [canvas.objects.removed]
        channel_id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        op_id:
          type: string
          format: uuid
        object_ids:
          type: array
          items: { type: string, format: uuid }

    CanvasCleared:
      type: object
      required: [type, channel_id, seq, op_id, before_seq]
      description: >-
        Every object placed at or below `before_seq` was removed at once.
        Carries no ids: a clear can cover a channel's whole live ceiling, and
        the hub's broadcast ring buffers only 1024 cloned events.
      properties:
        type:
          type: string
          enum: [canvas.cleared]
        channel_id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        op_id:
          type: string
          format: uuid
        before_seq:
          type: integer
          format: int64

    CanvasObjectsRestored:
      type: object
      required: [type, channel_id, seq, op_id, object_ids]
      description: >-
        A `remove` or a `clear` was undone, gated the same way
        `canvas.object.placed` is. `object_ids` names what came back, up to
        the same bound `canvas.objects.removed` does; past it (only possible
        when the restored op was a large `clear`) it is empty and a receiver
        should refetch instead of trusting an incomplete list.
      properties:
        type:
          type: string
          enum: [canvas.objects.restored]
        channel_id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        op_id:
          type: string
          format: uuid
        object_ids:
          type: array
          items: { type: string, format: uuid }

    CanvasCursorMoved:
      type: object
      required: [type, channel_id, user_id, x, y]
      description: >-
        A live pointer position on a channel's canvas, gated the same way
        `canvas.object.placed` is. Carries no `seq`: it is a this-instant
        hint, not a change to a durable object or op, so a receiver ages a
        cursor out on its own after a short silence rather than waiting for a
        matching "stopped" frame, which does not exist.
      properties:
        type:
          type: string
          enum: [canvas.cursor.moved]
        channel_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        x:
          type: number
          format: double
        y:
          type: number
          format: double

    CanvasStrokePreviewUpdated:
      type: object
      required: [type, channel_id, user_id, object_id, points, ended]
      description: >-
        A live in-flight stroke preview on a channel's canvas, gated the
        same way `canvas.object.placed` is, plus a direct timeout check the
        write route itself uses - unlike `canvas.cursor.moved`, this frame
        carries drawing content. Carries no `seq`: like a cursor it is a
        this-instant hint, not a change to a durable object, so a receiver
        that misses one is not stale. `object_id` never names a row in
        canvas_objects; it only keys this preview session, since the
        object(s) a finished stroke commits are decided later and one
        stroke can split into several. `points` is a delta - only what was
        added since the sender's last frame for this `object_id` - and
        `ended` marks the gesture's last frame.
      properties:
        type:
          type: string
          enum: [canvas.stroke_preview.updated]
        channel_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        object_id:
          type: string
          format: uuid
        points:
          type: array
          items: { type: number, format: double }
        ended:
          type: boolean

    CanvasObjectMoved:
      type: object
      required: [type, channel_id, seq, op_id, object_id, x, y, w, h]
      description: >-
        A placed object was repositioned, gated the same way
        `canvas.object.placed` is. Carries the whole new box, so a receiver
        needs no refetch to draw it in its new place. The actor is
        deliberately absent, matching `canvas.objects.removed`: moving
        another member's object needs `MANAGE_CANVAS` and so can be a
        moderation act the same way a removal is. Delivered only for a fresh,
        effective move - an idempotent replay, or a move naming an
        already-removed object, publishes nothing.
      properties:
        type:
          type: string
          enum: [canvas.object.moved]
        channel_id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        op_id:
          type: string
          format: uuid
        object_id:
          type: string
          format: uuid
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        w:
          type: number
          format: double
        h:
          type: number
          format: double

    CanvasObjectReordered:
      type: object
      required: [type, channel_id, seq, op_id, object_id, z_index]
      description: >-
        A placed object's paint order changed, gated the same way
        `canvas.object.placed` is. Carries the new `z_index` outright, so a
        receiver needs no refetch to repaint it in its new stacking position.
        The actor is deliberately absent, matching `canvas.object.moved`:
        restacking another member's object needs `MANAGE_CANVAS` and so can
        be a moderation act the same way a move is. Delivered only for a
        fresh, effective reorder - an idempotent replay, or a reorder naming
        an already-removed object, publishes nothing.
      properties:
        type:
          type: string
          enum: [canvas.object.reordered]
        channel_id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        op_id:
          type: string
          format: uuid
        object_id:
          type: string
          format: uuid
        z_index:
          type: integer
          format: int64

    CanvasMediaSlotChanged:
      type: object
      required: [type, channel_id, kind, user_id, x, y, w, h, locked, sent_to_back]
      description: >-
        A participant's camera or screen-share tile was moved, resized,
        locked, or sent to the back or front, gated the same way
        `canvas.object.placed` is. Carries the whole current row, so a
        receiver needs no refetch to redraw the tile. `user_id` names the
        participant the tile represents, never who moved it: anyone holding
        `USE_CANVAS` may rearrange anyone's tile, so there is no actor field
        the way a moderation act on a real canvas object carries one.
        Carries no `seq`: a slot mutates in place rather than joining the
        canvas op stream, so there is nothing here for a reconnecting client
        to catch up on beyond a fresh `listCanvasMediaSlots`.
      properties:
        type:
          type: string
          enum: [canvas.media_slot.changed]
        channel_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [camera, screen]
        user_id:
          type: string
          format: uuid
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        w:
          type: number
          format: double
        h:
          type: number
          format: double
        locked:
          type: boolean
        sent_to_back:
          type: boolean

    ServerHello:
      type: object
      required: [type, protocol]
      properties:
        type:
          type: string
          enum: [hello]
        protocol:
          type: integer
          format: int32
        moderation_seq:
          type: integer
          format: int64
          description: >
            The number of the latest moderation event (`member.timeout`,
            `member.removed`, `member.restored`, `member.role_changed`,
            `role.changed`), each of which carries the same kind of number as
            `seq`. A consumer that stored the last one it saw and finds a
            larger head here missed events while disconnected. Not a
            history cursor: nothing can be replayed from it, and it is
            monotonic across restarts but not consecutive.

    MessageCreated:
      type: object
      required: [type, channel_id, seq, message]
      properties:
        type:
          type: string
          enum: [message.created]
        channel_id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        message:
          $ref: "#/components/schemas/Message"

    MessageEdited:
      type: object
      required: [type, channel_id, seq, message]
      properties:
        type:
          type: string
          enum: [message.edited]
        channel_id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
          description: >
            The message's own order key, which an edit does not move. Not to be
            confused with `op_seq` beside it.
        op_seq:
          type: integer
          format: int64
          description: >
            This edit's place in the channel's message-op stream, a different
            sequence from `seq`. Absent from a server with no op stream.
        message:
          $ref: "#/components/schemas/Message"

    MessageDeleted:
      type: object
      required: [type, channel_id, message_id]
      properties:
        type:
          type: string
          enum: [message.deleted]
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        op_seq:
          type: integer
          format: int64
          description: >
            This delete's place in the channel's message-op stream. Absent from
            a server with no op stream, and absent when the delete found
            nothing to do.

    ReactionsChanged:
      type: object
      required: [type, channel_id, message_id, reactions]
      description: >
        The full public tally for one message, replacing whatever the client
        held rather than describing a delta. Resolved per receiving connection
        the way PresenceChanged's status is: a reactor the viewer has blocked
        is excluded from the counts, and an emoji whose only reactors are
        blocked is absent rather than present at zero. Carries no reactor ids
        at all, so what the viewer themselves reacted with is not derivable
        from this frame and has to come from a read.
      properties:
        type:
          type: string
          enum: [reactions.changed]
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/ReactionCount"

    CodeRunChanged:
      type: object
      required:
        [type, channel_id, message_id, block_index, module_id, command, ok, output, ran_at]
      description: >
        A fenced code block in a message was run and its shared result
        changed. Carries the whole current result, replacing whatever the
        client held for that block rather than describing a delta. Not
        per-viewer: the output is the same for everyone who can see the
        message, so it is delivered as-is.
      properties:
        type:
          type: string
          enum: [code_run.changed]
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        block_index:
          type: integer
          format: int64
        module_id:
          type: string
        command:
          type: string
        ok:
          type: boolean
        output:
          type: string
        ran_by:
          type: string
          format: uuid
          nullable: true
        ran_at:
          type: integer
          format: int64

    CodeRunsCleared:
      type: object
      required: [type, channel_id, message_id]
      description: >
        Every stored run for this message was dropped because its content
        just changed. Carries no block index: an edit can add or remove a
        block above another one and shift every later index, so this clears
        the whole message at once rather than naming a block a shifted index
        could get wrong. A client drops every cached run for the message on
        receiving this rather than waiting for a `message.edited` frame to
        imply it, since that frame's bare DTO is merged and never used to
        shrink what a client already holds.
      properties:
        type:
          type: string
          enum: [code_runs.cleared]
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid

    ReactionCount:
      type: object
      required: [emoji, count]
      description: One emoji and how many people used it. Public counts only.
      properties:
        emoji:
          type: string
        count:
          type: integer
          format: int64

    CodeRun:
      type: object
      required: [block_index, module_id, command, ok, output, ran_at]
      description: >-
        One fenced code block's shared run result. `output` holds the module's
        output when `ok`, or its error message when not - the same `{ok,
        output}` / `{ok, error}` outcome the run route answers with, flattened
        to one field since a stored run is always one or the other.
      properties:
        block_index:
          type: integer
          format: int64
          description: The index of the fenced code block within the message.
        module_id:
          type: string
        command:
          type: string
        ok:
          type: boolean
        output:
          type: string
        ran_by:
          type: string
          format: uuid
          nullable: true
          description: Who ran it, or null once their account is anonymized.
        ran_at:
          type: integer
          format: int64

    ThreadUpdated:
      type: object
      required:
        [
          type,
          channel_id,
          parent_message_id,
          thread_channel_id,
          reply_count,
        ]
      description: >
        A thread's reply summary changed: it was just opened, or gained a
        reply. Carries the current count rather than a delta, so a client
        that missed a frame cannot drift. `channel_id` is the parent
        channel, not the thread's own - the one a bystander's connection is
        actually gated on. Unlike ReactionsChanged the count is the same for
        every viewer regardless of blocking, matching the batch reply-count
        load a REST fetch already uses, so it is carried directly rather
        than re-derived per connection.
      properties:
        type:
          type: string
          enum: [thread.updated]
        channel_id:
          type: string
          format: uuid
        parent_message_id:
          type: string
          format: uuid
        thread_channel_id:
          type: string
          format: uuid
        reply_count:
          type: integer
          format: int64
        last_reply_at:
          type: [integer, "null"]
          format: int64

    MessagePinned:
      type: object
      required: [type, channel_id, message_id, pinned_at]
      description: >
        `pinned_by` is null when the account that pinned it has since been
        anonymized, which is not the same as nobody having pinned it.
      properties:
        type:
          type: string
          enum: [message.pinned]
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        pinned_by:
          type: [string, "null"]
          format: uuid
        pinned_at:
          type: integer
          format: int64

    MessageUnpinned:
      type: object
      required: [type, channel_id, message_id]
      properties:
        type:
          type: string
          enum: [message.unpinned]
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid

    PollVoted:
      type: object
      required: [type, channel_id, message_id, options]
      description: >
        The whole option set with current tallies, not the one option that
        moved, so a client that missed a frame still converges.
      properties:
        type:
          type: string
          enum: [poll.voted]
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        options:
          type: array
          items:
            $ref: "#/components/schemas/PollOptionCount"

    PollOptionCount:
      type: object
      required: [position, votes]
      description: >
        One option and its public tally. Never carries who voted, which is
        what keeps a poll from becoming a public record of how each member
        answered.
      properties:
        position:
          type: integer
          format: int64
        votes:
          type: integer
          format: int64

    PresenceChanged:
      type: object
      required: [type, user_id, status]
      description: >
        Resolved for this specific connection's viewer; see PresenceStatus.
        A user who chose `hidden` is `offline` here to anyone but themselves.
      properties:
        type:
          type: string
          enum: [presence.changed]
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [online, away, dnd, offline]
        activity:
          $ref: "#/components/schemas/PresenceActivity"

    MemberTimeout:
      type: object
      required: [type, user_id]
      description: >
        A member was timed out or had one lifted. `until` is the epoch
        milliseconds it lapses at, and null means lifted. Broadcast to every
        connection rather than to the subject alone, because a timeout is a
        subtraction from what that member may do in every channel and other
        clients render it on the member row.
      properties:
        type:
          type: string
          enum: [member.timeout]
        seq:
          type: integer
          format: int64
          description: Moderation cursor; see ServerHello.moderation_seq.
        user_id:
          type: string
          format: uuid
        until:
          type: [integer, "null"]
          format: int64

    MemberRemoved:
      type: object
      required: [type, user_id]
      description: >
        A member was removed from the Space. Their authored content stays,
        so this is not an account deletion and a client should not treat it
        as one; what it means is that the account can no longer sign in.
      properties:
        type:
          type: string
          enum: [member.removed]
        seq:
          type: integer
          format: int64
          description: Moderation cursor; see ServerHello.moderation_seq.
        user_id:
          type: string
          format: uuid

    MemberRestored:
      type: object
      required: [type, user_id]
      description: >
        A removed member was let back in. The mirror of MemberRemoved: a
        client that dropped them from its member list on that event puts
        them back by refetching, rather than staying stale until an
        unrelated refresh.
      properties:
        type:
          type: string
          enum: [member.restored]
        seq:
          type: integer
          format: int64
          description: Moderation cursor; see ServerHello.moderation_seq.
        user_id:
          type: string
          format: uuid

    MemberJoined:
      type: object
      required: [type, user_id]
      description: >
        Somebody actually joined the Space: registration, or an existing
        account spending an invite code. Not sent for a restore from removal,
        which is MemberRestored instead. Carries only the id, like
        MemberRemoved: a bot resolves the rest of the profile over
        GET /members.
      properties:
        type:
          type: string
          enum: [member.joined]
        user_id:
          type: string
          format: uuid

    ProfileChanged:
      type: object
      required: [type, user_id]
      description: >
        A user changed their display name. Carries only the id: the name
        itself lives in exactly one place, `users.display_name`, and a
        receiving connection re-asks `GET /users/{id}` or `GET /users` rather
        than trusting a second copy of the value riding the wire. Broadcast
        to every connection like `member.removed`, since a display name is
        already public on every profile response.
      properties:
        type:
          type: string
          enum: [profile.changed]
        user_id:
          type: string
          format: uuid

    TypingStarted:
      type: object
      required: [type, channel_id, user_id]
      properties:
        type:
          type: string
          enum: [typing.started]
        channel_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid

    TypingStopped:
      type: object
      required: [type, channel_id, user_id]
      description: >
        Published either on an explicit end or on lapsing a few seconds
        without a refresh; the two are indistinguishable on the wire, since a
        client only needs to stop showing the indicator either way.
      properties:
        type:
          type: string
          enum: [typing.stopped]
        channel_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid

    RoleChanged:
      type: object
      required: [type, role_id]
      description: >
        A role was created, renamed, had its permission bits changed, or was
        deleted. Carries only the id: the name and the bits are gated behind
        MANAGE_ROLES over `GET /roles`, and this frame reaches every
        connection regardless of whether they hold it, since a role's effect
        on channel visibility is deployment-wide. A receiving client cannot
        resolve what changed, only that it should re-ask what it is now
        allowed to do (its own permissions and channel list, and its role
        list if it manages roles).
      properties:
        type:
          type: string
          enum: [role.changed]
        seq:
          type: integer
          format: int64
          description: Moderation cursor; see ServerHello.moderation_seq.
        role_id:
          type: string
          format: uuid

    MemberRoleChanged:
      type: object
      required: [type, user_id, role_id]
      description: >
        A role was granted to or revoked from a member. Carries both ids,
        which is no more than `GET /members` already publishes for any
        caller. Broadcast to every connection for the same reason
        RoleChanged is: the fact itself is not privileged, only a role's
        bits are, and those never travel here either.
      properties:
        type:
          type: string
          enum: [member.role_changed]
        seq:
          type: integer
          format: int64
          description: Moderation cursor; see ServerHello.moderation_seq.
        user_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid

    ChannelCreated:
      type: object
      required: [type, channel]
      description: >
        A channel was created. Reaches a connection under the same
        current-permission check `message.created` already uses: a fresh
        channel has no prior state to reconcile, so whoever can view it now
        is exactly who should be told.
      properties:
        type:
          type: string
          enum: [channel.created]
        channel:
          $ref: "#/components/schemas/Channel"

    ChannelUpdated:
      type: object
      required: [type, channel]
      description: >
        A channel was renamed or had its topic replaced. Never changes what
        the channel's permission model allows, so the same current-permission
        check is exact here too.
      properties:
        type:
          type: string
          enum: [channel.updated]
        channel:
          $ref: "#/components/schemas/Channel"

    ChannelDeleted:
      type: object
      required: [type, channel_id]
      description: >
        A channel was soft-deleted. Gated on having been able to view it a
        moment before, not on the ordinary current-permission check, which
        always answers "no such channel" the instant this fires and so would
        reach nobody.
      properties:
        type:
          type: string
          enum: [channel.deleted]
        channel_id:
          type: string
          format: uuid

    OverwriteChanged:
      type: object
      required: [type, channel_id]
      description: >
        A permission overwrite was set or cleared for one role or one member
        in this channel. Carries only the channel id, never the allow/deny
        mask, which is exactly the kind of privileged detail RoleChanged
        withholds too. Reached under the ordinary current-permission check:
        a viewer who gains access is told immediately, while a viewer this
        exact change revokes is a known, narrow gap (see the server's own
        notes on `http::ws::authorize`).
      properties:
        type:
          type: string
          enum: [overwrite.changed]
        channel_id:
          type: string
          format: uuid

    CategoryChanged:
      type: object
      required: [type]
      description: >
        A channel category was created, renamed, repositioned, or deleted.
        Carries no fields at all: a category is organisational only (see
        docs/decisions/0006-channel-categories.md), so there is nothing
        privileged to withhold and nothing per-viewer to resolve. A receiving
        client re-fetches `listChannels`, the same path a `channel.created`,
        `channel.updated`, or `channel.deleted` frame already drives.
      properties:
        type:
          type: string
          enum: [category.changed]

    ReportsChanged:
      type: object
      required: [type]
      description: >
        The moderation queue changed: a report was filed or resolved.
        Carries no fields at all, deliberately - a report's content,
        reporter and subject must never fan out over the wire the same way
        `Report` itself must never answer below MANAGE_MESSAGES over REST.
        Delivered only to a connection whose user holds MANAGE_MESSAGES;
        everyone else receives nothing for this event, not even the frame
        with an empty body. A receiving client re-fetches `listOpenReports`
        or `moderationHistory`.
      properties:
        type:
          type: string
          enum: [reports.changed]

    ReadStateChanged:
      type: object
      required: [type, channel_id, last_read_seq]
      description: >
        This account's read marker in a channel moved, from any of its
        devices: a `putRead` from one, or a message the account itself sent.
        Delivered only to the account's own connections, so a badge clears on
        every device; nobody else receives it, and it is not a read receipt.
        `last_read_seq` is the stored marker, which only moves forward, so a
        receiver applies it as `max(current, last_read_seq)`.
      properties:
        type:
          type: string
          enum: [read_state.changed]
        channel_id:
          type: string
          format: uuid
        last_read_seq:
          type: integer
          format: int64
        manually_unread:
          type: boolean
          description: >
            True when the channel was just marked unread by hand, false for a
            read. Absent from servers that predate the field, read as false.

    NotificationOverrideChanged:
      type: object
      required: [type, channel_id, preference]
      description: >
        This account's per-channel notification override was set or cleared
        from one of its devices. Delivered only to the account's own
        connections; nobody else receives it. A write that changes nothing
        is not announced.
      properties:
        type:
          type: string
          enum: [notification_override.changed]
        channel_id:
          type: string
          format: uuid
        preference:
          type: string
          nullable: true
          description: >
            `mentions` or `nothing`; null once the channel follows the account
            default.

    NewDeviceSignIn:
      type: object
      required: [type, device_id, device_name, signed_in_at]
      description: >
        A device this account has not used before just signed in. Delivered
        only to the account's other connections, never to the device that
        signed in and never to anyone else. "Not used before" means no earlier
        device row with the same name and client kind; a first device, a
        re-login of a known one and a token refresh send nothing. Sent at most
        a few times per account per ten minutes. A client offers a way to
        review and sign out devices from it.
      properties:
        type:
          type: string
          enum: [device.signed_in]
        device_id:
          type: string
          format: uuid
        device_name:
          type: string
        client_kind:
          type: string
          nullable: true
        signed_in_at:
          type: integer
          format: int64
          description: Unix milliseconds.

    VoiceActivityChanged:
      type: object
      required: [type, channel_id]
      description: >
        Someone's presence on a channel's voice call changed: a join (the
        first heartbeat for a user on that call), a clean hangup, or the
        stale-heartbeat sweep evicting someone. Carries only the channel id,
        never who: unlike ThreadUpdated's reply count, a voice roster is
        per-viewer (GET .../voice/roster drops a hidden participant from
        every viewer but themselves), so naming a participant here would be a
        second, unfiltered way to learn who is on a call. A receiving client
        re-fetches the roster, which already applies that filtering.
      properties:
        type:
          type: string
          enum: [voice.activity]
        channel_id:
          type: string
          format: uuid

    VoiceParticipantJoined:
      type: object
      required: [type, channel_id, user_id]
      description: >
        Someone joined a channel's voice room, per a LiveKit webhook. Unlike
        VoiceActivityChanged this names the participant, safe only because it
        is gated on the joiner's own presence visibility the same way
        `GET .../voice/roster` already is - a viewer who has that user
        hidden from them receives nothing. See
        docs/decisions/0032-voice-participant-webhooks.md. Only fires when
        the deployment's LiveKit is configured with a webhook pointed at
        this server; VoiceActivityChanged still fires either way.
      properties:
        type:
          type: string
          enum: [voice.participant_joined]
        channel_id:
          type: string
          format: uuid
        user_id:
          type: string

    VoiceParticipantLeft:
      type: object
      required: [type, channel_id, user_id]
      description: >
        The webhook-sourced counterpart to VoiceParticipantJoined, for a
        participant leaving.
      properties:
        type:
          type: string
          enum: [voice.participant_left]
        channel_id:
          type: string
          format: uuid
        user_id:
          type: string

    VoiceScreenShareChanged:
      type: object
      required: [type, channel_id, user_id, is_sharing_screen]
      description: >
        A participant started or stopped sharing their screen, per LiveKit's
        track_published/track_unpublished webhooks. Gated the same way
        VoiceParticipantJoined is. See
        docs/decisions/0032-voice-participant-webhooks.md.
      properties:
        type:
          type: string
          enum: [voice.screen_share_changed]
        channel_id:
          type: string
          format: uuid
        user_id:
          type: string
        is_sharing_screen:
          type: boolean

    WatchSession:
      type: object
      required: [channel_id, bot_user_id, item_id, title, playing, position_ms, sampled_at_ms, epoch, ttl_ms, server_time_ms]
      properties:
        channel_id:
          type: string
          format: uuid
        bot_user_id:
          type: string
          format: uuid
        item_id:
          type: string
        title:
          type: string
        duration_ms:
          type: [integer, "null"]
          format: int64
        playing:
          type: boolean
        position_ms:
          type: integer
          format: int64
        sampled_at_ms:
          type: integer
          format: int64
        epoch:
          type: integer
          format: int64
        controller_user_id:
          type: [string, "null"]
          format: uuid
          description: Advisory, for display; never an authority.
        ttl_ms:
          type: integer
          format: int64
          description: >
            How long after `sampled_at_ms` the session still counts as live.
            A viewer hides it on this rather than a number of its own.
        server_time_ms:
          type: integer
          format: int64

    SetWatchSessionRequest:
      type: object
      required: [item_id, title, playing, position_ms]
      properties:
        item_id:
          type: string
        title:
          type: string
        duration_ms:
          type: integer
          format: int64
        playing:
          type: boolean
        position_ms:
          type: integer
          format: int64
        seeked:
          type: boolean
        controller_user_id:
          type: string
          format: uuid

    WatchTickRequest:
      type: object
      required: [playing, position_ms]
      properties:
        playing:
          type: boolean
        position_ms:
          type: integer
          format: int64

    WatchTick:
      type: object
      required: [type, channel_id, bot_user_id, ended, item_id, playing, position_ms, sampled_at_ms, epoch]
      description: >
        The room's watch position, about every 5 seconds and on every play,
        pause or seek. Ephemeral: no seq, never persisted, and a missed one is
        corrected by the next. `ended` is true when the bot ended the session
        or left the call; a session whose ticks just stop is over once
        `ttl_ms` from the REST read has passed. `bot_user_id` and `epoch`
        name the session: a tick for a lower epoch is older and is dropped.
        Decision 0050-watch-party-sync-authority-and-direct-play.
      properties:
        type:
          type: string
          enum: [watch.tick]
        channel_id:
          type: string
          format: uuid
        bot_user_id:
          type: string
          format: uuid
        ended:
          type: boolean
        item_id:
          type: string
        playing:
          type: boolean
        position_ms:
          type: integer
          format: int64
        sampled_at_ms:
          type: integer
          format: int64
        epoch:
          type: integer
          format: int64

    CallRinging:
      type: object
      required: [type, channel_id, ring_id, caller_id]
      description: >
        A DM call ring started. Reaches only the two DM participants, the
        ordinary VIEW_CHANNEL check every voice event already uses - a DM's
        own permission model grants that to nobody else, ADMINISTRATOR
        included, and a blocked party is refused before a ring can ever be
        started (CONNECT is one of the bits a block removes). `ring_id` names
        this specific attempt, distinguishing it from an immediate retry, so
        `call.ring_ended` can name exactly which ring it concerns.
      properties:
        type:
          type: string
          enum: [call.ringing]
        channel_id:
          type: string
          format: uuid
        ring_id:
          type: string
          format: uuid
        caller_id:
          type: string
          format: uuid
    CallRingEnded:
      type: object
      required: [type, channel_id, ring_id, outcome]
      description: >
        A DM call ring (started by `call.ringing`) reached a terminal state.
        `outcome` is `answered` (the callee joined the call before the
        timeout), `declined` (the callee explicitly refused it),
        `canceled` (the caller hung up, or left the call, before it was
        answered), or `timed_out` (nobody answered before the server's own
        ring timeout elapsed, at which point the caller's own SFU participant
        is also released). No trace of a ring is kept in the conversation
        itself past this event - see the ring feature's own PR for that
        choice.
      properties:
        type:
          type: string
          enum: [call.ring_ended]
        channel_id:
          type: string
          format: uuid
        ring_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [answered, declined, canceled, timed_out]
    ServerPong:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [pong]

    ServerError:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
          enum: [error]
        message:
          type: string
          description: >
            A terminal condition. `resync` means the connection fell behind and
            was closed; reconnect and catch up over /sync.
