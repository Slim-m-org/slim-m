name: server-binaries

# Static musl server binaries per arch, uploaded as run artifacts; callers and consumers are in docs/ci.md, server-binaries.

on:
  workflow_call:
    inputs:
      ref:
        description: "The commit to build; empty builds the commit that started the run"
        type: string
        default: ""
      server_version:
        description: "The server version being released"
        type: string
        required: true
  # By hand, to check both arches build before a release needs them; it only uploads run artifacts.
  workflow_dispatch:
    inputs:
      ref:
        description: "The commit to build; empty builds the commit that started the run"
        type: string
        default: ""
      server_version:
        description: "The version to name the binaries after"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # jemalloc fixes its page size at build time; arm64 builds for 64K so 16K and 64K page kernels can run it.
          - target: x86_64-unknown-linux-musl
            arch: amd64
            runner: ubuntu-24.04
            jemalloc_lg_page: "12"
          - target: aarch64-unknown-linux-musl
            arch: arm64
            runner: ubuntu-24.04-arm
            jemalloc_lg_page: "16"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      # Natively in the image's own pinned alpine builder (read from the Dockerfile): Ubuntu's arm64 musl-gcc cannot compile jemalloc.
      - name: build static binary
        env:
          SLIMM_BUILD_ID: ${{ inputs.ref || github.sha }}
          JEMALLOC_SYS_WITH_LG_PAGE: ${{ matrix.jemalloc_lg_page }}
        run: |
          builder="$(sed -n 's/^FROM \(rust:[^ ]*\) AS builder$/\1/p' docker/server.Dockerfile)"
          if [[ -z "$builder" ]]; then
            echo "::error::no 'FROM rust:... AS builder' line in docker/server.Dockerfile"
            exit 1
          fi
          docker run --rm -v "$PWD":/build -w /build \
            -e SQLX_OFFLINE=true -e SLIMM_BUILD_ID -e JEMALLOC_SYS_WITH_LG_PAGE \
            -e HOST_IDS="$(id -u):$(id -g)" \
            "$builder" \
            sh -c 'apk add --no-cache musl-dev make && cargo build --locked --release --bin slimm-server; status=$?; chown -R "$HOST_IDS" target; exit $status'

      - name: stage binary
        id: stage
        run: |
          name="slimm-server-${{ inputs.server_version }}-linux-${{ matrix.arch }}"
          file "target/release/slimm-server" | grep -q "static" || { echo "::error::the binary is not statically linked"; exit 1; }
          install -Dm755 "target/release/slimm-server" "dist/${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-binary-${{ matrix.arch }}
          path: dist/${{ steps.stage.outputs.name }}
          if-no-files-found: error
