name: server-binaries

# Static musl server binaries per arch, uploaded as run artifacts; callers and consumers are in docs/ci.md, server-binaries.

on:
  workflow_call:
    inputs:
      ref:
        description: "The commit to build; empty builds the commit that started the run"
        type: string
        default: ""
      server_version:
        description: "The server version being released"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      # Each arch builds its own musl target natively, no cross and no QEMU, like the container image.
      - name: musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: ${{ matrix.target }}

      - name: build static binary
        env:
          SLIMM_BUILD_ID: ${{ inputs.ref || github.sha }}
        run: cargo build --locked --release --target ${{ matrix.target }} --bin slimm-server

      - name: stage binary
        id: stage
        run: |
          name="slimm-server-${{ inputs.server_version }}-linux-${{ matrix.arch }}"
          install -Dm755 "target/${{ matrix.target }}/release/slimm-server" "dist/${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-binary-${{ matrix.arch }}
          path: dist/${{ steps.stage.outputs.name }}
          if-no-files-found: error
