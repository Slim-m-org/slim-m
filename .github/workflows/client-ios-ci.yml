name: client-ios-ci

# Split out of client-ci and gated harder than it was, because it is the
# expensive job by an order of magnitude: 14 minutes on a macOS runner against
# 5 for everything else, and it ran on every client change including the
# Dart-only ones that cannot affect it.
#
# The paths are what can actually change the answer: the iOS project itself,
# the plugins that pull in CallKit and WebRTC, the data package (its encrypted database
# compiles native sqlite code, and a change there once shipped an iOS launch failure with no iOS job run), and the dependency set, which is
# how a Dart-side change reaches an Xcode build. Push to main uses the same
# filter: it gates nothing outside a release, and the release commit always
# matches it through its pubspec bump.
#
# PR #292 shipped a category on a private engine class, an undefined-symbol
# link error that "ios unit tests" (a simulator, Debug build) could not see
# and `build ipa` (a device, Release archive) failed on, only at release
# time. Two gates close that, at very different costs, so only one runs
# unconditionally: pbxproj-registration is a grep with no Xcode involved, so
# it always runs. The release-configuration device build below is real
# compile time on an already-scarce macOS runner, so it is narrowed by the
# `changes` job's own path filter rather than by the "main is never trusted
# on a filter alone" doctrine above: unlike the XCTest job, nothing this
# build can catch is reachable from a change outside that filter's paths,
# since Dart code never participates in native linking at all.
on:
  push:
    branches: [main]
    paths:
      - "client/packages/app/ios/**"
      - "client/packages/rtc/**"
      - "client/packages/platform/**"
      - "client/packages/data/**"
      - "client/pubspec.yaml"
      - "client/pubspec.lock"
      - "client/packages/app/pubspec.yaml"
      - ".github/workflows/client-ios-ci.yml"
      - ".github/actions/**"
      # A release-please version bump is deliberately NOT excluded:
      # verify-release-checks.yml gates the client publish jobs on this
      # workflow's checks being present on the release commit, so it must run
      # there. See docs/ci.md and client-ci.yml's matching note.
  pull_request:
    paths:
      - "client/packages/app/ios/**"
      - "client/packages/rtc/**"
      - "client/packages/platform/**"
      - "client/packages/data/**"
      - "client/pubspec.yaml"
      - "client/pubspec.lock"
      - "client/packages/app/pubspec.yaml"
      - ".github/workflows/client-ios-ci.yml"
      - ".github/actions/**"
      # A release-please version bump is deliberately NOT excluded:
      # verify-release-checks.yml gates the client publish jobs on this
      # workflow's checks being present on the release commit, so it must run
      # there. See docs/ci.md and client-ci.yml's matching note.

permissions:
  contents: read

concurrency:
# On main, keyed per commit: a group shared across pushes lets GitHub cancel an older still-queued run outright, which cancel-in-progress cannot prevent; see docs/ci.md.
  group: client-ios-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Narrows the release-configuration build below to changes that can
  # actually affect linking, the dorny/paths-filter pattern main-builds.yml
  # already uses for the same reason.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            native:
              - 'client/packages/app/ios/**'
              - 'client/packages/rtc/**'
              - 'client/packages/platform/**'
              - 'client/packages/data/**'
              - 'client/pubspec.yaml'
              - 'client/pubspec.lock'
              - 'client/packages/app/pubspec.yaml'

  # A source file that compiles cleanly on its own but is never added to a
  # target's Sources build phase is skipped by xcodebuild with no error and
  # no warning; a Dart test cannot see it either, since the native method
  # channel handler it would provide simply never registers. No Xcode
  # needed, so this runs on ubuntu ahead of the macOS jobs below.
  pbxproj-registration:
    name: ios sources are registered in project.pbxproj
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: every Runner .swift/.m file is in the Sources build phase
        run: |
          set -euo pipefail
          pbx=client/packages/app/ios/Runner.xcodeproj/project.pbxproj
          sources=$(awk '/Begin PBXSourcesBuildPhase section/{f=1}
                          f{print}
                          /End PBXSourcesBuildPhase section/{f=0}' "$pbx")
          fail=0
          # NotificationService/ is here for the same reason Runner/ is: its
          # sources compile nowhere if they are missing from the phase, and a
          # notification would silently keep showing the generic string with
          # nothing anywhere saying why.
          for f in client/packages/app/ios/Runner/*.swift \
                   client/packages/app/ios/Runner/*.m \
                   client/packages/app/ios/NotificationService/*.swift; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            grep -qF "$name in Sources" <<<"$sources" || {
              echo "::error file=$f::$name is not in any target's Sources build phase"
              fail=1
            }
          done
          [ "$fail" -eq 0 ] && echo "every Runner/NotificationService source is registered"
          exit $fail
      - name: every object id in the project is unique
        run: |
          python3 scripts/check-pbxproj-ids.py \
            client/packages/app/ios/Runner.xcodeproj/project.pbxproj

  # The CallKit synchronous-report invariant is a termination risk, not a style
  # rule, so it gets a macOS runner. Simulator only; see docs/ci.md.
  ios-unit-tests:
    name: ios unit tests (callkit invariant)
    needs: [changes]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up flutter (stable channel)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - uses: ./.github/actions/native-hooks-cache

      # --enforce-lockfile, for the same reason the Rust side builds --locked:
      # without it the committed lockfile is advisory and CI can silently
      # resolve versions nobody committed.
      - name: resolve workspace dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile

      # Rebuilding these from scratch is most of the five minutes the project
      # generation step costs; the lockfile is what decides their contents.
      - name: cache cocoapods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            client/packages/app/ios/Pods
            ~/Library/Caches/CocoaPods
          # Keyed on the lockfiles alone, with no prefix fallback: restoring
          # pods resolved from a different lockfile is how a build stops
          # matching the dependencies it claims to have.
          key: pods-${{ runner.os }}-${{ hashFiles('client/packages/app/ios/Podfile.lock', 'client/pubspec.lock') }}

      # xcodebuild will not open the project until a Flutter build has generated
      # its config and plugin registrant. --no-codesign keeps it to compiling.
      - name: generate the ios project
        working-directory: client/packages/app
        run: flutter build ios --simulator --no-codesign

      # An app extension carrying a Frameworks directory is refused by the
      # store with error 90206, which only surfaces at upload - after a
      # release has been tagged and an archive built. Caught here instead.
      - name: the broadcast extension embeds no frameworks
        working-directory: client/packages/app
        run: |
          set -euo pipefail
          appex="$(find build/ios -name 'BroadcastExtension.appex' -maxdepth 6 | head -n1)"
          if [ -z "$appex" ]; then
            echo "::error::BroadcastExtension.appex was not built"
            exit 1
          fi
          echo "found $appex"
          if [ -d "$appex/Frameworks" ]; then
            echo "::error::$appex embeds frameworks; the store refuses this (90206)"
            ls -la "$appex/Frameworks"
            exit 1
          fi
          echo "the extension embeds no frameworks"

      # Chosen from what the runner actually has, not by name: a hardcoded
      # 'iPhone 16' broke on day one and would break on every image roll.
      - name: pick an available simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, devs in sorted(devices.items()):
              if 'iOS' not in runtime:
                  continue
              for dev in devs:
                  if dev.get('isAvailable') and 'iPhone' in dev.get('name', ''):
                      print(dev['udid'])
                      raise SystemExit
          ")
          if [ -z "$udid" ]; then
            echo "::error::no available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid" || true

      - name: run xctest
        working-directory: client/packages/app/ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:RunnerTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || exit "${PIPESTATUS[0]}"

      # PR #292's actual failure: a link error only `build ipa` (Release,
      # device) hit, never the Debug simulator build above. This is that
      # same linking path, unsigned, so it needs no store secrets to run.
      - name: build for a real device in release configuration (no codesign)
        if: needs.changes.outputs.native == 'true'
        working-directory: client/packages/app
        run: flutter build ios --release --no-codesign

      - {if: failure(), uses: ./.github/actions/native-hooks-diagnose}
