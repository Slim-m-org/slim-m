name: client-ios-ci

# Split out of client-ci and gated harder than it was, because it is the
# expensive job by an order of magnitude: 14 minutes on a macOS runner against
# 5 for everything else, and it ran on every client change including the
# Dart-only ones that cannot affect it.
#
# On main the paths are everything that can change the answer: the iOS project
# itself, the plugins that pull in CallKit and WebRTC, the data package (its
# encrypted database compiles native sqlite code, and a change there once
# shipped an iOS launch failure with no iOS job run), and the dependency set,
# which is how a Dart-side change reaches an Xcode build. A pull request runs
# it only for what reaches Xcode natively (ios/, darwin/, build hooks, the
# pubspecs and the lockfile), since a Dart-only change compiles on every other
# platform's job first; main still runs it for those, and the release commit
# always matches through its pubspec bump.
#
# PR #292 shipped a category on a private engine class, an undefined-symbol
# link error that "ios unit tests" (a simulator, Debug build) could not see
# and `build ipa` (a device, Release archive) failed on, only at release
# time. Two gates close that, at very different costs, so only one runs
# unconditionally: pbxproj-registration is a grep with no Xcode involved, so
# it always runs. The release-configuration device build below is real
# compile time on an already-scarce macOS runner, so it is narrowed by the
# `changes` job's own path filter rather than by the "main is never trusted
# on a filter alone" doctrine above: unlike the XCTest job, nothing this
# build can catch is reachable from a change outside that filter's paths,
# since Dart code never participates in native linking at all.
on:
  push:
    branches: [main]
    paths:
      - "client/packages/app/ios/**"
      - "client/packages/rtc/**"
      - "client/packages/platform/**"
      - "client/packages/data/**"
      - "client/pubspec.yaml"
      - "client/pubspec.lock"
      - "client/packages/app/pubspec.yaml"
      - ".github/workflows/client-ios-ci.yml"
      - ".github/actions/native-hooks-cache/**"
      - ".github/actions/native-hooks-diagnose/**"
      - ".github/actions/select-xcode/**"
      - "scripts/select-xcode.sh"
      # A release-please version bump is deliberately NOT excluded:
      # verify-release-checks.yml gates the client publish jobs on this
      # workflow's checks being present on the release commit, so it must run
      # there. See docs/ci.md and client-ci.yml's matching note.
  pull_request:
    paths:
      - "client/packages/*/ios/**"
      - "client/packages/*/darwin/**"
      - "client/packages/*/hook/**"
      - "client/packages/*/pubspec.yaml"
      - "client/pubspec.yaml"
      - "client/pubspec.lock"
      - ".github/workflows/client-ios-ci.yml"
      - ".github/actions/native-hooks-cache/**"
      - ".github/actions/native-hooks-diagnose/**"
      - ".github/actions/select-xcode/**"
      - "scripts/select-xcode.sh"
      # A release-please version bump is deliberately NOT excluded:
      # verify-release-checks.yml gates the client publish jobs on this
      # workflow's checks being present on the release commit, so it must run
      # there. See docs/ci.md and client-ci.yml's matching note.

permissions:
  contents: read

concurrency:
# On main, keyed per commit: a group shared across pushes lets GitHub cancel an older still-queued run outright, which cancel-in-progress cannot prevent; see docs/ci.md.
  group: client-ios-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Narrows the release-configuration build below to changes that can
  # actually affect linking, the dorny/paths-filter pattern main-builds.yml
  # already uses for the same reason.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            native:
              - 'client/packages/app/ios/**'
              - 'client/packages/rtc/**'
              - 'client/packages/platform/**'
              - 'client/packages/data/**'
              - 'client/pubspec.yaml'
              - 'client/pubspec.lock'
              - 'client/packages/app/pubspec.yaml'
              # An edit to the job itself has to run it, or the first run of a changed build is the one after the merge.
              - '.github/workflows/client-ios-ci.yml'
              - '.github/actions/select-xcode/**'
              - 'scripts/select-xcode.sh'

  # A source file that compiles cleanly on its own but is never added to a
  # target's Sources build phase is skipped by xcodebuild with no error and
  # no warning; a Dart test cannot see it either, since the native method
  # channel handler it would provide simply never registers. No Xcode
  # needed, so this runs on ubuntu ahead of the macOS jobs below.
  pbxproj-registration:
    name: ios sources are registered in project.pbxproj
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: every Runner .swift/.m file is in the Sources build phase
        run: |
          set -euo pipefail
          pbx=client/packages/app/ios/Runner.xcodeproj/project.pbxproj
          sources=$(awk '/Begin PBXSourcesBuildPhase section/{f=1}
                          f{print}
                          /End PBXSourcesBuildPhase section/{f=0}' "$pbx")
          fail=0
          # NotificationService/ is here for the same reason Runner/ is: its
          # sources compile nowhere if they are missing from the phase, and a
          # notification would silently keep showing the generic string with
          # nothing anywhere saying why.
          for f in client/packages/app/ios/Runner/*.swift \
                   client/packages/app/ios/Runner/*.m \
                   client/packages/app/ios/NotificationService/*.swift; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            grep -qF "$name in Sources" <<<"$sources" || {
              echo "::error file=$f::$name is not in any target's Sources build phase"
              fail=1
            }
          done
          [ "$fail" -eq 0 ] && echo "every Runner/NotificationService source is registered"
          exit $fail
      - name: every object id in the project is unique
        run: |
          python3 scripts/check-pbxproj-ids.py \
            client/packages/app/ios/Runner.xcodeproj/project.pbxproj

  # The CallKit synchronous-report invariant is a termination risk, not a style
  # rule, so it gets a macOS runner. Simulator only; see docs/ci.md.
  ios-unit-tests:
    name: ios unit tests (callkit invariant)
    needs: [changes]
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/select-xcode

      - name: set up flutter (stable channel)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - uses: ./.github/actions/native-hooks-cache

      # --enforce-lockfile, for the same reason the Rust side builds --locked:
      # without it the committed lockfile is advisory and CI can silently
      # resolve versions nobody committed.
      - name: resolve workspace dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile

      # Chosen from what the runner actually has, not by name: a hardcoded
      # 'iPhone 16' broke on day one and would break on every image roll.
      - name: pick an available simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, devs in sorted(devices.items()):
              if 'iOS' not in runtime:
                  continue
              for dev in devs:
                  if dev.get('isAvailable') and 'iPhone' in dev.get('name', ''):
                      print(dev['udid'])
                      raise SystemExit
          ")
          if [ -z "$udid" ]; then
            echo "::error::no available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid" || true

      # Config only: build-for-testing below is the one simulator build, so this writes the Flutter config, resolves the Swift packages and runs pod install if a plugin needs it.
      - name: generate the ios project
        working-directory: client/packages/app
        run: flutter build ios --simulator --no-codesign --config-only

      # Flutter resolved the Swift packages into build/ios/SourcePackages one step ago; without the same path xcodebuild clones them all again.
      - name: build the app and its tests for the simulator
        working-directory: client/packages/app/ios
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build-for-testing.log"
          # Only stdout goes through xcpretty, which drops lines it does not know; a failure prints the raw tail for the same reason.
          xcodebuild build-for-testing \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath ../build/ios/SourcePackages \
            -skipPackageUpdates \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee "$log" | xcpretty \
            || { code=${PIPESTATUS[0]}; echo "raw xcodebuild output, last 200 lines:"; tail -n 200 "$log"; exit "$code"; }
          sed -n '/Build Timing Summary/,$p' "$log"

      # An app extension carrying a Frameworks directory is refused by the
      # store with error 90206, which only surfaces at upload - after a
      # release has been tagged and an archive built. Caught here instead.
      - name: the broadcast extension embeds no frameworks
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r appex; do
            found=1
            echo "found $appex"
            if [ -d "$appex/Frameworks" ]; then
              echo "::error::$appex embeds frameworks; the store refuses this (90206)"
              ls -la "$appex/Frameworks"
              exit 1
            fi
          done < <(find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 8 -path '*/Build/Products/*' -name 'BroadcastExtension.appex')
          if [ "$found" -eq 0 ]; then
            echo "::error::BroadcastExtension.appex was not built"
            exit 1
          fi
          echo "the extension embeds no frameworks"

      # Booted here, not in the background: on a 3-core runner the boot slowed whatever ran beside it by about as much as it saved.
      - name: boot the simulator
        timeout-minutes: 15
        run: |
          SECONDS=0
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b > "$RUNNER_TEMP/simulator-boot.log" \
            || { cat "$RUNNER_TEMP/simulator-boot.log"; exit 1; }
          echo "booted in ${SECONDS}s"

      # From the build's .xctestrun (reopening the workspace cost up to 2.5 minutes), on the one booted simulator, with no parallel clones.
      - name: run xctest
        timeout-minutes: 30
        run: |
          set -euo pipefail
          xctestrun=$(find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 4 -path '*/Build/Products/*.xctestrun' -print -quit)
          if [ -z "$xctestrun" ]; then
            echo "::error::build-for-testing wrote no .xctestrun"
            exit 1
          fi
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:RunnerTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/RunnerTests.xcresult" \
            | tee "$RUNNER_TEMP/xctest.log" | xcpretty \
            || { code=${PIPESTATUS[0]}; echo "raw xcodebuild output, last 200 lines:"; tail -n 200 "$RUNNER_TEMP/xctest.log"; exit "$code"; }

      # xcpretty drops Xcode 26's test lines, so a failing test showed its name and never its message.
      - name: print the failing tests' messages
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/RunnerTests.xcresult" \
            | jq -r '.testFailures[]? | "::error::\(.targetName // "") \(.testName): \(.failureText)"' || true

      # A booted simulator keeps its own daemons busy, and the release build is the slowest compile in the job.
      - name: shut the simulator down
        if: needs.changes.outputs.native == 'true'
        run: |
          SECONDS=0
          xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || echo "not shut down (simctl exit $?); the release build runs anyway"
          echo "took ${SECONDS}s"

      # PR #292's actual failure: a link error only `build ipa` (Release,
      # device) hit, never the Debug simulator build above. This is that
      # same linking path, unsigned, so it needs no store secrets to run.
      # A step, not a parallel job: GitHub cancels a macOS arm64 job it cannot place, so a second one is a second way to fail a release.
      - name: build for a real device in release configuration (no codesign)
        if: needs.changes.outputs.native == 'true'
        working-directory: client/packages/app
        run: flutter build ios --release --no-codesign

      - {if: failure(), uses: ./.github/actions/native-hooks-diagnose}
