name: hygiene

on:
  merge_group:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
# On main, keyed per commit: a group shared across pushes lets GitHub cancel an older still-queued run outright, which cancel-in-progress cannot prevent; see docs/ci.md.
  group: hygiene-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 is for the commit-parse check below to walk the PR range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: github.event_name == 'pull_request'
        with:
          node-version: lts/*

      # A commit body release-please's parser crashes on is dropped from the changelog silently; see CLAUDE.md.
      - name: PR title parses, and no commit body crashes the parser
        if: github.event_name == 'pull_request'
        working-directory: scripts/commit-lint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm ci --ignore-scripts
          node check-parses.mjs

      # e2e.yml runs these too, but only post-merge and advisory; this is the
      # pull_request gate on them, and needs no server to do it.
      - name: unit tests for the e2e harness's scenario logic
        working-directory: scripts/lib
        run: python3 -m unittest discover -p 'test_*.py' -v

      - name: ios purpose strings are present
        run: bash scripts/check-ios-purpose-strings.sh

      - name: ios broadcast extension is wired up
        run: bash scripts/check-ios-broadcast-wired.sh

      # The lock-screen preview is a second process reading one key out of the
      # keychain, and a keychain query is a search over attributes: any one of
      # them differing between the two sides finds nothing at all, silently,
      # and the notification quietly keeps saying "New message". None of these
      # strings is checked by a compiler on either side, so they are checked
      # here. Every value is read out of the file that owns it rather than
      # written down twice in this script.
      - name: ios notification service extension is wired up
        run: bash scripts/check-ios-nse-wired.sh
      - name: orientation is locked on phones only
        run: bash scripts/check-orientation-lock.sh

      - name: no emoji in UI source
        run: scripts/check-no-emoji.sh

      - name: SPDX headers on Dart source
        run: bash scripts/check-spdx-dart.sh

      - name: SPDX headers on Rust source
        run: bash scripts/check-spdx-rust.sh

      # Warns at 300 and past 500, fails only well past it; see the script header.
      - name: file size budget
        run: bash scripts/check-file-budget.sh

      # Ratchets the one-line comment cap: a file may not gain a new run, and
      # the pre-existing ones are listed at their count. See the script header.
      - name: comment cap
        run: bash scripts/check-comment-cap.sh

      # An API failure caught and shown with a SnackBar regressed back three
      # times over a persistent AppErrorState. See the script header.
      - name: no API failure is caught and shown with a SnackBar
        run: python3 scripts/check-error-surface.py

      # TECHNICAL_DEBT CA1: `data.dart` exporting a drift row as `Message`
      # coupled most of `app` to drift transitively. See the script header.
      - name: data.dart exports Message as a plain DTO, not a drift row
        run: python3 scripts/check-message-dto-boundary.py

      # A duplicate version, or an edit to one already on main, only fails at
      # a deployed server's startup - which took the live instance down for
      # five hours on 2026-08-13. See the script header.
      - name: no migration collides or changes under a deployed database
        run: python3 scripts/check-migration-versions.py

      # The unscoped MediaQuery.of(context) rebuilds on every MediaQueryData
      # field; a 2026-08 audit found a dozen keyboard-avoidance call sites
      # copy-pasted with it instead of the scoped accessor. See the script
      # header and scripts/media-query-of-allow.txt.
      - name: no unscoped MediaQuery.of(context) outside the allowlist
        run: python3 scripts/check-media-query-scope.py

      # CLAUDE.md sends reviewers to docs/ci.md as the authoritative workflow
      # list, and an undocumented workflow is invisible there rather than
      # wrong-looking. See the script header.
      - name: every workflow is in the docs/ci.md table
        run: python3 scripts/check-ci-docs.py

      # The shell was the one layer nothing checked: 22 workflows, ~84 inline
      # `run:` blocks and 14 scripts orchestrating every build and deploy, with
      # no linter over any of it. A bad `${{ }}` expression, a `needs:` naming
      # a job that does not exist, or an invalid key only shows at runtime on
      # main, which is exactly where a workflow bug is most expensive.
      # actionlint runs shellcheck over the inline blocks as well, so this and
      # the step below cover the same language from both ends.
      - name: workflows lint
        run: bash scripts/check-actionlint.sh

      # Pinned by digest rather than using the runner's preinstalled shellcheck,
      # which is how this gate failed on the pull request that added it: the
      # runner ships 0.10.0, the image tagged `stable` is 0.11.0, and 0.11.0 no
      # longer reports the SC2015 that 0.10.0 does. Verifying locally against
      # one and gating on the other is a gate that disagrees with itself. Every
      # tracked *.sh is clean under both versions, so this arrives with no
      # backlog behind it and is a pure ratchet from here.
      - name: shell scripts lint
        run: bash scripts/check-shellcheck.sh
