name: hygiene

on:
  merge_group:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
# On main, keyed per commit: a group shared across pushes lets GitHub cancel an older still-queued run outright, which cancel-in-progress cannot prevent; see docs/ci.md.
  group: hygiene-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 is for the commit-parse check below to walk the PR range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: github.event_name == 'pull_request'
        with:
          node-version: lts/*

      # A commit body release-please's parser crashes on is dropped from the changelog silently; see CLAUDE.md.
      - name: PR title parses, and no commit body crashes the parser
        if: github.event_name == 'pull_request'
        working-directory: scripts/commit-lint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm ci --ignore-scripts
          node check-parses.mjs

      # e2e.yml runs these too, but only post-merge and advisory; this is the
      # pull_request gate on them, and needs no server to do it.
      - name: unit tests for the e2e harness's scenario logic
        working-directory: scripts/lib
        run: python3 -m unittest discover -p 'test_*.py' -v

      # App Store review rejects a missing purpose string asynchronously, by
      # email after CI is green. This makes it a red PR; see docs/ci.md.
      - name: ios purpose strings are present
        run: |
          plist=client/packages/app/ios/Runner/Info.plist
          missing=()
          # NSLocationWhenInUseUsageDescription is here for an API the app
          # never calls: ITMS-90683 rejected build 82 over a linked SDK's
          # Core Location reference, and dropping the key repeats that.
          for key in NSCameraUsageDescription NSMicrophoneUsageDescription \
                     NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription \
                     NSLocationWhenInUseUsageDescription \
                     NSLocalNetworkUsageDescription \
                     NSFaceIDUsageDescription; do
            grep -q "<key>$key</key>" "$plist" || missing+=("$key")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::$plist is missing purpose strings: ${missing[*]}."
            echo "App Store review will reject the upload after CI goes green."
            exit 1
          fi
          echo "ios purpose strings present"

      # Screen share on iOS is a second process. Every piece below is read at
      # runtime and every one of them fails silently when it is wrong: the
      # button does nothing, or the broadcast starts and sends no frames.
      # That is exactly how this shipped broken, so the gate checks the
      # identifiers agree rather than merely that each file exists.
      - name: ios broadcast extension is wired up
        run: |
          ios=client/packages/app/ios
          pbx=$ios/Runner.xcodeproj/project.pbxproj
          ext=$ios/BroadcastExtension
          fail=0

          value() {
            awk -v k="$1" '$0 ~ "<key>"k"</key>" {
              getline
              gsub(/^[ \t]*<string>|<\/string>[ \t]*$/, "")
              print
              exit
            }' "$2"
          }
          group_in() {
            awk '/<key>com.apple.security.application-groups<\/key>/ {f=1; next}
                 f && /<string>/ {
                   gsub(/^[ \t]*<string>|<\/string>[ \t]*$/, "")
                   print
                   exit
                 }' "$1"
          }

          # The Xcode target itself. Without the appex embedded in the app
          # there is nothing for the system picker to offer.
          grep -q 'productType = "com.apple.product-type.app-extension";' \
            "$pbx" || {
            echo "::error::$pbx has no app-extension target"
            fail=1
          }
          # Membership has to be read out of the build phases themselves. Every
          # one of these strings also appears in the file's own PBXBuildFile
          # declaration, which survives being dropped from the target, so
          # grepping the whole file passes over the break it is looking for.
          section() {
            awk -v s="$1" '$0 ~ "Begin "s" section" {f=1}
                           f {print}
                           $0 ~ "End "s" section" {f=0}' "$pbx"
          }
          copy_phases=$(section PBXCopyFilesBuildPhase)
          sources=$(section PBXSourcesBuildPhase)

          grep -q 'BroadcastExtension.appex in Embed Foundation Extensions' \
            <<<"$copy_phases" || {
            echo "::error::$pbx does not embed BroadcastExtension.appex"
            fail=1
          }
          grep -q 'dstSubfolderSpec = 13;' <<<"$copy_phases" || {
            echo "::error::$pbx has no PlugIns copy phase for the extension"
            fail=1
          }

          # A source file present on disk but absent from the target compiles
          # nowhere and is invisible in a diff.
          for f in "$ext"/*.swift; do
            grep -q "$(basename "$f") in Sources" <<<"$sources" || {
              echo "::error::$(basename "$f") is not in any target's Sources"
              fail=1
            }
          done

          point=$(value NSExtensionPointIdentifier "$ext/Info.plist")
          [ "$point" = "com.apple.broadcast-services-upload" ] || {
            echo "::error::$ext/Info.plist is not a broadcast upload extension"
            fail=1
          }
          grep -q 'RPBroadcastProcessModeSampleBuffer' "$ext/Info.plist" || {
            echo "::error::$ext/Info.plist must use the sample buffer mode"
            fail=1
          }

          # livekit_client reads this key to pick the extension; a value that
          # names no real bundle shows an empty picker.
          ext_id=$(value RTCScreenSharingExtension "$ios/Runner/Info.plist")
          [ -n "$ext_id" ] || {
            echo "::error::Runner/Info.plist has no RTCScreenSharingExtension"
            fail=1
          }
          if [ -n "$ext_id" ]; then
            count=$(grep -c "PRODUCT_BUNDLE_IDENTIFIER = $ext_id;" "$pbx")
            [ "$count" -ge 3 ] || {
              echo "::error::$pbx does not build $ext_id in all three configs"
              fail=1
            }
          fi

          # The App Group is the only channel between the two processes, and
          # all four of these have to be the same string.
          group=$(value RTCAppGroupIdentifier "$ios/Runner/Info.plist")
          [ -n "$group" ] || {
            echo "::error::Runner/Info.plist has no RTCAppGroupIdentifier"
            fail=1
          }
          if [ -n "$group" ]; then
            app_group=$(group_in "$ios/Runner/Runner.entitlements")
            ext_group=$(group_in "$ext/BroadcastExtension.entitlements")
            [ "$app_group" = "$group" ] || {
              echo "::error::Runner.entitlements grants '$app_group', not '$group'"
              fail=1
            }
            [ "$ext_group" = "$group" ] || {
              echo "::error::the extension grants '$ext_group', not '$group'"
              fail=1
            }
            grep -q "\"$group\"" "$ext/BroadcastConstants.swift" || {
              echo "::error::BroadcastConstants.swift does not use '$group'"
              fail=1
            }
          fi

          # Manual signing needs a profile per embedded bundle, or the export
          # fails late, on the release runner, naming this id.
          if [ -n "$ext_id" ]; then
            grep -q "<key>$ext_id</key>" "$ios/ExportOptions.plist" || {
              echo "::error::ExportOptions.plist has no profile for $ext_id"
              fail=1
            }
            # The name too, not just the key: xcodebuild matches it literally.
            grep -q "slim-m Broadcast Extension App Store" "$ios/ExportOptions.plist" || {
              echo "::error::ExportOptions.plist does not name the extension's profile"
              fail=1
            }
          fi

          if [ $fail -eq 0 ]; then
            echo "ios broadcast extension wired: $ext_id in $group"
          fi
          exit $fail

      # The lock-screen preview is a second process reading one key out of the
      # keychain, and a keychain query is a search over attributes: any one of
      # them differing between the two sides finds nothing at all, silently,
      # and the notification quietly keeps saying "New message". None of these
      # strings is checked by a compiler on either side, so they are checked
      # here. Every value is read out of the file that owns it rather than
      # written down twice in this script.
      - name: ios notification service extension is wired up
        run: bash scripts/check-ios-nse-wired.sh
      # Orientation is locked to portrait on phones only. The iOS app is iPhone
      # only (device family 1, no iPad orientation array), so the Android
      # sw600dp override is the one place a tablet is freed, and the two halves
      # fail in opposite directions if either is quietly edited: landscape back
      # in the iPhone array stretches the phone-sized shell across a 932pt-wide
      # window that the layout classes as a two-pane tablet, and dropping
      # landscape from the sw600dp override freezes an Android tablet in
      # portrait. Neither shows up in a diff as a behaviour change.
      - name: orientation is locked on phones only
        run: |
          plist=client/packages/app/ios/Runner/Info.plist
          res=client/packages/app/android/app/src/main/res
          fail=0

          phone=$(awk '/<key>UISupportedInterfaceOrientations<\/key>/{f=1}
                       f{print}
                       f&&/<\/array>/{exit}' "$plist")
          pbx=client/packages/app/ios/Runner.xcodeproj/project.pbxproj

          if [ -z "$phone" ]; then
            echo "::error::$plist is missing an orientation array"
            fail=1
          fi
          if grep -q 'Landscape' <<<"$phone"; then
            echo "::error::$plist allows landscape on iPhone"
            fail=1
          fi
          if grep -q 'UISupportedInterfaceOrientations~ipad' "$plist"; then
            echo "::error::$plist declares iPad orientations; the app is iPhone only"
            fail=1
          fi
          if grep 'TARGETED_DEVICE_FAMILY' "$pbx" | grep -qv '= 1;'; then
            echo "::error::$pbx has a build configuration that is not iPhone only"
            fail=1
          fi

          grep -q '<bool name="slimm_portrait_only">true</bool>' \
            "$res/values/bools.xml" || {
            echo "::error::$res/values/bools.xml must lock phones to portrait"
            fail=1
          }
          grep -q '<bool name="slimm_portrait_only">false</bool>' \
            "$res/values-sw600dp/bools.xml" || {
            echo "::error::$res/values-sw600dp/bools.xml must free tablets"
            fail=1
          }

          # Both resources can stay exactly as they are while the only code
          # that reads them is deleted, which is a silent unlock.
          kt=client/packages/app/android/app/src/main/kotlin/top/npcserver/slimm/MainActivity.kt
          code=$(sed -e 's://.*::' "$kt" |
                 awk '/\/\*/{c=1} !c{print} /\*\//{c=0}')
          for token in 'override fun onCreate' \
                       'R.bool.slimm_portrait_only' \
                       'requestedOrientation' \
                       'SCREEN_ORIENTATION_PORTRAIT'; do
            grep -qF "$token" <<<"$code" || {
              echo "::error::$kt no longer applies the lock ($token is gone)"
              fail=1
            }
          done

          if [ $fail -eq 0 ]; then
            echo "orientation locked on phones only"
          fi
          exit $fail

      - name: no emoji in UI source
        run: scripts/check-no-emoji.sh

      # The client is the larger half of this codebase by file count and had
      # no license-header enforcement at all until this step existed. That is
      # not hypothetical: PR #993 was branched before the PolyForm relicense
      # and added three Dart files still carrying Apache-2.0. Its four Rust
      # siblings redded the step below the moment they met relicensed main;
      # the Dart three passed every gate in the repo and merged.
      #
      # Scoped with `git ls-files` rather than `find`, so gitignored build
      # output (.dart_tool/, build/) is excluded by construction rather than
      # by a prune list that would drift. *.g.dart is excluded because drift
      # regenerates it wholesale and would strip any header added to it -
      # database.g.dart is the one such file tracked today.
      - name: SPDX headers on Dart source
        run: |
          missing=0
          checked=0
          while IFS= read -r f; do
            case "$f" in *.g.dart) continue ;; esac
            checked=$((checked + 1))
            if ! head -1 "$f" | grep -q 'SPDX-License-Identifier: LicenseRef-PolyForm-Noncommercial-1.0.0'; then
              echo "::error file=$f::source needs 'SPDX-License-Identifier: LicenseRef-PolyForm-Noncommercial-1.0.0'"
              missing=1
            fi
          done < <(git ls-files 'client/**/*.dart')
          # Same guard the Rust step carries: a pattern that matches nothing
          # would otherwise leave missing at 0 and report success.
          if [ "$checked" -eq 0 ]; then
            echo "::error::found no Dart source under client/; the check ran against nothing"
            exit 1
          fi
          echo "spdx (dart): $checked files checked"
          exit "$missing"

      # Presence alone is not enough: the identifier has to match, or a stale
      # header from the old per-component split would pass unnoticed.
      - name: SPDX headers on Rust source
        run: |
          missing=0
          checked=0
          while IFS= read -r f; do
            checked=$((checked + 1))
            if ! head -1 "$f" | grep -q 'SPDX-License-Identifier: LicenseRef-PolyForm-Noncommercial-1.0.0'; then
              echo "::error file=$f::source needs 'SPDX-License-Identifier: LicenseRef-PolyForm-Noncommercial-1.0.0'"
              missing=1
            fi
          done < <(find crates -name '*.rs')
          # A find that matches nothing left missing at 0 and reported success.
          if [ "$checked" -eq 0 ]; then
            echo "::error::found no Rust source under crates/; the check ran against nothing"
            exit 1
          fi
          echo "spdx: $checked Rust files checked"
          exit $missing

      # Warns at 300 and fails at 500; the reasoning is in the script header.
      - name: file size budget
        run: bash scripts/check-file-budget.sh

      # Ratchets the one-line comment cap: a file may not gain a new run, and
      # the pre-existing ones are listed at their count. See the script header.
      - name: comment cap
        run: bash scripts/check-comment-cap.sh

      # An API failure caught and shown with a SnackBar regressed back three
      # times over a persistent AppErrorState. See the script header.
      - name: no API failure is caught and shown with a SnackBar
        run: python3 scripts/check-error-surface.py

      # TECHNICAL_DEBT CA1: `data.dart` exporting a drift row as `Message`
      # coupled most of `app` to drift transitively. See the script header.
      - name: data.dart exports Message as a plain DTO, not a drift row
        run: python3 scripts/check-message-dto-boundary.py

      # A duplicate version, or an edit to one already on main, only fails at
      # a deployed server's startup - which took the live instance down for
      # five hours on 2026-08-13. See the script header.
      - name: no migration collides or changes under a deployed database
        run: python3 scripts/check-migration-versions.py

      # The unscoped MediaQuery.of(context) rebuilds on every MediaQueryData
      # field; a 2026-08 audit found a dozen keyboard-avoidance call sites
      # copy-pasted with it instead of the scoped accessor. See the script
      # header and scripts/media-query-of-allow.txt.
      - name: no unscoped MediaQuery.of(context) outside the allowlist
        run: python3 scripts/check-media-query-scope.py

      # CLAUDE.md sends reviewers to docs/ci.md as the authoritative workflow
      # list, and an undocumented workflow is invisible there rather than
      # wrong-looking. See the script header.
      - name: every workflow is in the docs/ci.md table
        run: python3 scripts/check-ci-docs.py

      # The shell was the one layer nothing checked: 22 workflows, ~84 inline
      # `run:` blocks and 14 scripts orchestrating every build and deploy, with
      # no linter over any of it. A bad `${{ }}` expression, a `needs:` naming
      # a job that does not exist, or an invalid key only shows at runtime on
      # main, which is exactly where a workflow bug is most expensive.
      # actionlint runs shellcheck over the inline blocks as well, so this and
      # the step below cover the same language from both ends.
      - name: workflows lint
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color

      # Pinned by digest rather than using the runner's preinstalled shellcheck,
      # which is how this gate failed on the pull request that added it: the
      # runner ships 0.10.0, the image tagged `stable` is 0.11.0, and 0.11.0 no
      # longer reports the SC2015 that 0.10.0 does. Verifying locally against
      # one and gating on the other is a gate that disagrees with itself. Every
      # tracked *.sh is clean under both versions, so this arrives with no
      # backlog behind it and is a pure ratchet from here.
      - name: shell scripts lint
        run: |
          set -euo pipefail
          mapfile -t scripts < <({ git ls-files '*.sh'; git grep -lE '^#!(/usr/bin/env )?(/bin/)?(ba)?sh$' -- ':(exclude)*.sh'; } | sort -u)
          printf 'checking %d scripts\n' "${#scripts[@]}"
          docker run --rm -v "$PWD":/repo -w /repo \
            koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d \
            "${scripts[@]}"
