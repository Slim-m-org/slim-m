name: advisory-watchdog

# Daily scheduled security-advisory check that opens a deduplicated issue; it gates nothing (docs/ci.md).

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# No concurrency group: daily, and issue dedup by label makes overlapping runs harmless.

jobs:
  check:
    name: no dependency has an open advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # continue-on-error so a real advisory reaches the reporting step instead of ending the job silently.
      - id: scan
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

      - name: open or close the advisory issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ADVISORY_STATUS: ${{ steps.scan.outcome == 'success' && 'clean' || 'found' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/report-advisory-issue.sh
