name: compose-smoke

# Every other gate tests one piece in isolation; this one asks whether
# `docker compose up` gives a self-hoster a working deployment. See docs/ci.md.
on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "docker-compose.voice.yml"
      - "deploy/**"
      - "docker/server.Dockerfile"
      - ".github/workflows/compose-smoke.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker-compose.voice.yml"
      - "deploy/**"
      - "docker/server.Dockerfile"
      - ".github/workflows/compose-smoke.yml"
  schedule:
    # Weekly, so a broken upstream image is found before a self-hoster finds it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-smoke-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    name: the self-host stack boots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The published image is only correct for main, so this branch's image is
      # built under the tag SLIMM_VERSION=smoke resolves to and compose uses it.
      - name: build the server image from this branch
        run: |
          image="$(grep -oE 'ghcr\.io/[a-z0-9-]+/slim-m-server' docker-compose.yml | head -n1)"
          docker build -f docker/server.Dockerfile -t "${image:?no slim-m-server image in docker-compose.yml}:smoke" .
        env:
          SQLX_OFFLINE: "true"

      - name: text chat boots with no voice configured at all
        run: |
          set -euo pipefail
          # The default deployment. A friend group who only want to type should
          # need no LiveKit keys and no second DNS record, and the server treats
          # an absent SFU as a normal configuration; see deploy/README.md.
          cp deploy/.env.example .env
          # Later assignments win in a dotenv file, so these override the
          # example without editing the lines it ships.
          {
            echo "SLIMM_API_DOMAIN=localhost"
            echo "SLIMM_VERSION=smoke"
          } >> .env
          docker compose config >/dev/null || {
            echo "::error::the text-only example does not even render"
            exit 1
          }
          docker compose up -d server
          for _ in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q server)" 2>/dev/null || echo starting)
            [ "$state" = "healthy" ] && break
            sleep 2
          done
          if [ "$state" != "healthy" ]; then
            echo "::error::a text-only deployment never became healthy"
            docker compose logs server
            exit 1
          fi
          # The specific regression: an empty SLIMM_MAX_TOTAL_ATTACHMENT_BYTES
          # used to abort the process on boot, and the LiveKit requirement was
          # hiding it. A crash-loop must never read as "voice is off".
          docker compose logs server | grep -q "voice is disabled" || {
            echo "::error::text-only server did not report voice disabled"
            docker compose logs server
            exit 1
          }
          echo "text-only deployment is healthy with voice off"

      - name: tear the text-only stack down
        run: docker compose down -v

      - name: the voice overlay refuses to start without livekit credentials
        run: |
          set -euo pipefail
          # Refusing to start without credentials is a security property, not a
          # convenience, so it gets a test of its own; see docs/ci.md.
          cp deploy/.env.example .env
          echo "COMPOSE_FILE=docker-compose.yml:docker-compose.voice.yml" >> .env
          if docker compose config >/dev/null 2>err.txt; then
            echo "::error::the voice overlay started with no LiveKit credentials set"
            exit 1
          fi
          # Any of the three names is a correct refusal: compose stops at the
          # first variable it interpolates, and that order is not ours to fix.
          grep -qE "LIVEKIT_(DOMAIN|API_KEY|API_SECRET)" err.txt || {
            echo "::error::compose refused but did not name the missing variable"
            cat err.txt
            exit 1
          }
          echo "refused correctly, naming the variable"

      - name: bring the stack up with voice
        run: |
          set -euo pipefail
          # Real-looking values so the config renders; nothing here is reachable
          # from outside the runner.
          {
            echo "SLIMM_API_DOMAIN=localhost"
            echo "LIVEKIT_DOMAIN=localhost"
            echo "LIVEKIT_API_KEY=APIsmoketestkey"
            echo "LIVEKIT_API_SECRET=$(openssl rand -hex 24)"
            echo "SLIMM_VERSION=smoke"
          } >> .env
          # Caddy needs a real domain and 80/443 to get a certificate, so this
          # covers the two services that carry the product; see docs/ci.md.
          docker compose up -d server livekit
          docker compose ps

      - name: the server becomes healthy and answers
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q server)" 2>/dev/null || echo starting)
            [ "$state" = "healthy" ] && break
            sleep 2
          done
          if [ "$state" != "healthy" ]; then
            echo "::error::server never became healthy"
            docker compose logs server
            exit 1
          fi
          # The image ships no shell, so ask from the host through a throwaway
          # container on the same network rather than exec-ing into it.
          net=$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(docker compose ps -q server)")
          version=$(docker run --rm --network "$net" curlimages/curl:8.11.1 -fsS http://server:8080/version)
          echo "$version"
          echo "$version" | grep -q '"name":"slim-m"'

      - name: voice is configured, not silently disabled
        run: |
          set -euo pipefail
          # The regression this exists for: the stack ran an SFU for months
          # without telling the server, so voice would 501. See docs/ci.md.
          docker compose logs server | grep -q "voice enabled" || {
            echo "::error::server did not report voice enabled; check SLIMM_LIVEKIT_* reach it"
            docker compose logs server
            exit 1
          }
          echo "server reports voice enabled"

      - name: the SFU actually starts
        run: |
          set -euo pipefail
          # "voice enabled" above is only the server's opinion of its own config,
          # and a real deployment crashlooped behind it; see docs/ci.md.
          for _ in $(seq 1 45); do
            docker compose logs livekit 2>/dev/null | grep -q "starting LiveKit server" && break
            sleep 2
          done
          docker compose logs livekit | grep -q "starting LiveKit server" || {
            echo "::error::livekit never finished starting"
            docker compose logs livekit
            exit 1
          }
          # A crashloop looks like a start too, so check it is still up a moment
          # later rather than trusting the one log line.
          sleep 5
          state=$(docker inspect --format '{{.State.Status}}' "$(docker compose ps -q livekit)")
          [ "$state" = "running" ] || {
            echo "::error::livekit is $state, not running"
            docker compose logs livekit
            exit 1
          }
          echo "livekit is up"

      - name: the SFU accepts a token signed with the configured key
        run: |
          set -euo pipefail
          # A key/secret that reached only one of the two services passes every
          # check above and fails on the first real call; see docs/ci.md.
          set -a; . ./.env; set +a
          token=$(python3 - <<'PY'
          import base64, hashlib, hmac, json, os, time

          key, secret = os.environ["LIVEKIT_API_KEY"], os.environ["LIVEKIT_API_SECRET"]
          seg = lambda o: base64.urlsafe_b64encode(
              json.dumps(o, separators=(",", ":")).encode()
          ).rstrip(b"=")
          now = int(time.time())
          body = seg({"alg": "HS256", "typ": "JWT"}) + b"." + seg({
              "iss": key, "sub": "smoke", "nbf": now, "exp": now + 120,
              "video": {"room": "smoke", "roomJoin": True, "canSubscribe": True},
          })
          sig = hmac.new(secret.encode(), body, hashlib.sha256).digest()
          print((body + b"." + base64.urlsafe_b64encode(sig).rstrip(b"=")).decode())
          PY
          )
          # Plain HTTP on purpose: a container-to-container call on a private
          # network, to the port LiveKit serves unencrypted. See docs/ci.md.
          net=$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(docker compose ps -q livekit)")
          curl_in() { docker run --rm --network "$net" curlimages/curl:8.11.1 "$@"; }
          curl_in -fsS "http://livekit:7880/rtc/validate?access_token=$token" | grep -q success || {
            echo "::error::the SFU rejected a token signed with the configured key"
            exit 1
          }
          # And the converse, so the check above cannot be passing on an SFU
          # that would accept anything.
          code=$(curl_in -s -o /dev/null -w '%{http_code}' "http://livekit:7880/rtc/validate?access_token=${token}tampered")
          [ "$code" = "401" ] || {
            echo "::error::a tampered token got $code, expected 401"
            exit 1
          }
          echo "the SFU honours our tokens and refuses forged ones"

      - name: tear down
        if: always()
        run: docker compose down -v
