name: e2e
# Advisory real-browser end to end run against a real LiveKit SFU; triggers and why it is not required: docs/ci.md.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "client/packages/rtc/**"
      - "client/packages/api/**"
      - "client/packages/voice_canvas/**"
      - "client/packages/platform/**"
      - "client/packages/app/lib/src/**/*voice*"
      - "client/packages/app/lib/src/**/*call*"
      - "client/packages/app/lib/src/**/*canvas*"
      - "client/packages/app/lib/src/**/*screen_share*"
      - "client/packages/app/lib/src/**/*stream*"
      - "client/packages/app/lib/src/routing/**"
      - "client/packages/app/lib/main.dart"
      - "client/pubspec.lock"
      - "crates/slimm-server/src/voice/**"
      - "crates/slimm-server/src/hub/**"
      - "crates/slimm-server/src/hub.rs"
      - "crates/slimm-server/src/auth.rs"
      - "crates/slimm-server/src/http/auth.rs"
      - "crates/slimm-server/src/http/ws.rs"
      - "crates/slimm-server/src/http/ws/**"
      - "crates/slimm-server/src/http/voice*.rs"
      - "crates/slimm-server/src/http/canvas*.rs"
      - "crates/slimm-server/src/lib.rs"
      - "crates/slimm-server/migrations/**"
      - "Cargo.lock"
      - "docker/**"
      - "schema/openapi.yaml"
      - "scripts/e2e.sh"
      - "scripts/e2e-stack.sh"
      - "scripts/lib/e2e_*.py"
      - "scripts/lib/test_e2e_*.py"
      - "scripts/lib/make_*voice.py"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A superseded PR run is cancelled; main, nightly and manual runs queue so a merge burst still leaves a verdict.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SQLX_OFFLINE: "true"
  E2E_WORK: /tmp/e2e

jobs:
  e2e:
    name: the full stack, driven end to end
    # Drafts skip the run; ready_for_review starts it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The harness's only third-party import, pinned and wheel-only so no sdist setup script runs.
      - name: python dependencies
        run: "pip install --only-binary :all: websocket-client==1.9.0"

      # Fast, no server needed: catches a regression in scenario logic before the 60-minute stack below runs at all.
      - name: unit tests for the harness's own scenario logic
        working-directory: scripts/lib
        run: python3 -m unittest discover -p 'test_*.py' -v

      # Deterministic resolve, the same reason client-ci does this before building.
      - name: resolve workspace dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile

      - name: chrome is present
        run: |
          if command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          elif command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            echo "::error::no google-chrome-stable or google-chrome on this runner"
            exit 1
          fi

      # E2E_REBUILD=1: a cached web build silently screenshots stale code.
      - name: run the harness
        env:
          E2E_REBUILD: "1"
        run: bash scripts/e2e.sh

      # Screenshots alone did not explain the first red run; these two did.
      - name: upload the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-evidence
          path: |
            ${{ env.E2E_WORK }}/shots
            ${{ env.E2E_WORK }}/server.log
          if-no-files-found: warn
          retention-days: 14
