name: client-macos-ci

# Compile-only, unsigned, and deliberately not a required check.
#
# `client/packages/app/macos/` is a fresh `flutter create --platforms=macos`
# scaffold with no signing identity, no notarization credential and no
# Apple Developer team wired to it - see docs/os_backlog/macos_backlog.md
# for what a real, distributable build still needs. This job only proves
# the Dart and Swift compile against the macOS SDK: `flutter build macos
# --debug` on this project's SPM-only plugin tree (no Podfile, no `pod
# install`, matching how `client-ios-ci.yml` already builds with no
# CocoaPods step), which produces a local "Sign to Run Locally" binary
# with no Apple account of any kind.
on:
  # Nightly and manual only: it gates nothing, so it does not take a macOS slot per merge.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
# On main, keyed per commit: a group shared across pushes lets GitHub cancel an older still-queued run outright, which cancel-in-progress cannot prevent; see docs/ci.md.
  group: client-macos-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  macos-build:
    name: macos debug build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up flutter (stable channel)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - uses: ./.github/actions/native-hooks-cache

      # --enforce-lockfile, for the same reason the Rust side builds --locked:
      # without it the committed lockfile is advisory and CI can silently
      # resolve versions nobody committed.
      - name: resolve workspace dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile

      # No signing team, no provisioning profile, no GoogleService-Info.plist
      # - a Debug build ad-hoc-signs itself ("Sign to Run Locally"), which
      # needs no Apple account, matching how client-ios-ci.yml's own
      # simulator build carries no signing secrets either.
      - name: flutter build macos --debug
        working-directory: client/packages/app
        run: flutter build macos --debug

      - {if: failure(), uses: ./.github/actions/native-hooks-diagnose}
