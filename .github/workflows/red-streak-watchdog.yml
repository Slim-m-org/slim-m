name: red-streak-watchdog

# Opens an issue when e2e or main-builds sits red for a streak, since neither gates anything; see docs/ci.md.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

# No concurrency group: daily and idempotent (issue dedup is by label), so overlap costs nothing.

jobs:
  e2e:
    name: e2e has not been red for several runs in a row
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Scoped to the job, not the workflow: least privilege, one job needs it.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: check the streak and manage the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/check-workflow-red-streak.sh

  # Its own job so one red workflow never stops the other being checked; the script exits non-zero on a streak.
  main-builds:
    name: main-builds has not been red for several runs in a row
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: check the streak and manage the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WATCHDOG_WORKFLOW: main-builds.yml
          WATCHDOG_SUBJECT: main-builds
          WATCHDOG_LABEL: main-builds-red-streak
          WATCHDOG_WHY: |
            main-builds.yml is what produces a build between releases, so while
            it is red no artifact is reaching a phone or the container registry
            and nothing downstream reports it: it gates no PR and no release.
            See docs/ci-details.md's main-builds section.
        run: bash scripts/check-workflow-red-streak.sh
