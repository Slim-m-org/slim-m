name: perf

# Path-gated to server and perf changes, except the release job, since the release event cannot be filtered (docs/ci.md).
on:
  pull_request:
    paths:
      - "crates/**"
      - "perf/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/perf.yml"
  release:
    types: [published]
  # Rebuilds a missed release's baseline: run it from main with that release's tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "The server release to measure, as server-vX.Y.Z"
        required: true

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

# Compiling the crate needs the committed .sqlx query cache, no database.
env:
  SQLX_OFFLINE: "true"

jobs:
  # Compile-only gate on every pull request, without a full measurement run per push.
  compile-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: compile benches (no run)
        run: cargo bench --locked -p slimm-server --no-run

  # Measures each server release on its own commit and commits perf/baselines/<version>.json to main; see perf/README.md.
  baseline:
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'server-v'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: check the tag
        run: |
          [[ "$TAG" =~ ^server-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a server-vX.Y.Z tag"; exit 1; }
          echo "VERSION=${TAG#server-v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: run benchmarks
        run: cargo bench --locked -p slimm-server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: criterion-report-${{ env.TAG }}
          path: target/criterion
          retention-days: 90
      - name: build the glibc release binary
        run: cargo build --locked --release --bin slimm-server
      # Five runs because one RSS reading can sit 2-3% off; the baseline keeps each figure's median.
      - name: measure idle and peak RSS, glibc and musl
        run: |
          mkdir -p rss
          perf/measure-idle-rss.sh > rss/run-1.log
          for run in 2 3 4 5; do
            perf/measure-idle-rss.sh --image slimm-server:rss-probe > "rss/run-${run}.log"
          done
          cat rss/run-*.log
      # From the workflow's own commit, since a tag measured by hand dispatch can predate the script.
      - name: write the baseline
        run: |
          git show "${GITHUB_SHA}:scripts/lib/perf_baseline.py" > "${RUNNER_TEMP}/perf_baseline.py"
          python3 "${RUNNER_TEMP}/perf_baseline.py" --version "$VERSION" \
            --environment "github-actions ubuntu-24.04, $(nproc) cpus" \
            --criterion-dir target/criterion --out "baseline-${VERSION}.json" rss/run-*.log
          cat "baseline-${VERSION}.json"
      # Rebased and retried, since a merge can land on main between fetch and push.
      - name: commit it to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git switch -q -C perf-baseline origin/main
            cp "baseline-${VERSION}.json" "perf/baselines/${VERSION}.json"
            git add "perf/baselines/${VERSION}.json"
            if git diff --cached --quiet; then
              echo "perf/baselines/${VERSION}.json is already on main"
              exit 0
            fi
            git commit -q -s -m "chore(perf): baseline ${VERSION}, measured by the release's own perf run"
            if git push -q origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::could not push perf/baselines/${VERSION}.json to main"
          exit 1
