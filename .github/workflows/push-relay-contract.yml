name: push-relay-contract

# The push envelope's wire framing spans two repos and two languages, so nothing
# else would notice one side changing it. Why and how: docs/ci.md.
on:
  push:
    branches: [main]
    paths:
      - "crates/slimm-server/src/push.rs"
      - "crates/slimm-server/src/push/**"
      - "crates/slimm-server/src/http/push.rs"
      - "crates/slimm-server/tests/push_relay_contract_fixture.rs"
      - "crates/slimm-server/tests/push_relay_contract_kinds/**"
      - ".github/workflows/push-relay-contract.yml"
  pull_request:
    paths:
      - "crates/slimm-server/src/push.rs"
      - "crates/slimm-server/src/push/**"
      - "crates/slimm-server/src/http/push.rs"
      - "crates/slimm-server/tests/push_relay_contract_fixture.rs"
      - "crates/slimm-server/tests/push_relay_contract_kinds/**"
      - ".github/workflows/push-relay-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-relay-contract-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  SQLX_OFFLINE: "true"

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: checkout slim-m
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: checkout slim-m-relay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/slim-m-relay
          path: slim-m-relay
          # Deliberately no `token:` input. An empty string is a provided value
          # and 401s rather than falling back to the default; see docs/ci.md.

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: generate the fixture from real slimm-server code
        run: cargo test -p slimm-server --test push_relay_contract_fixture
        env:
          SLIMM_PUSH_CONTRACT_FIXTURE_OUT: ${{ github.workspace }}/slim-m-relay/internal/api/testdata/push_relay_contract.generated.json

      # A generation step that silently wrote nothing must not fall through into
      # the relay step quietly skipping and going green; see docs/ci.md.
      - name: assert the fixture landed
        run: |
          fixture="slim-m-relay/internal/api/testdata/push_relay_contract.generated.json"
          if [ ! -s "$fixture" ]; then
            echo "::error::$fixture is missing or empty; the fixture generation step above did not produce it"
            exit 1
          fi

      - name: drive it through the real relay handler
        working-directory: slim-m-relay
        env:
          # A missing fixture here is a bug in this workflow, so the Go test must
          # fail rather than take its local-dev t.Skipf; see docs/ci.md.
          SLIMM_PUSH_CONTRACT_FIXTURE_REQUIRED: "1"
        run: |
          set -euo pipefail
          # `-run` matching zero tests exits 0 having asserted nothing, so the
          # test's own PASS line is what this gates on; see docs/ci.md.
          go test ./internal/api/... -run '^TestPushRelayContract$' -v | tee /tmp/push-relay-contract.log
          # The trailing `\(` is load-bearing: go test -v prints the duration
          # after the name, so anchoring on the name alone never matches.
          grep -qE '^--- PASS: TestPushRelayContract \('  /tmp/push-relay-contract.log
