name: update-manifest

# Signs a manifest of a client release's desktop artifacts; see docs/ci.md and decision 0041.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      require:
        type: string
        required: false
        default: "windows-x64,linux-x64"
      defer:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing client tag to sign a manifest for (e.g. client-v0.90.0)"
        required: true
        type: string
      require:
        description: "Comma-separated platforms that must be attached"
        required: false
        type: string
        default: "windows-x64,linux-x64"
      defer:
        description: "Skip quietly when a required platform is not attached yet, because its producer signs last"
        required: false
        type: boolean
        default: false
      trust_release_assets:
        description: "Sign what is attached without the producers' digests, for a release cut before they were recorded"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-manifest-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sign:
    name: sign update manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The signing key lives in this environment only, with deployment rules for main and client-v* tags, so a workflow on any other ref cannot read it.
    environment: release
    # write, not read: the last step attaches the manifest and signature to the github release. actions: read fetches the producers' digests.
    permissions:
      actions: read
      contents: write
    env:
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      TAG: ${{ inputs.tag }}
      REQUIRE: ${{ inputs.require }}
      DEFER: ${{ inputs.defer }}
      TRUST_RELEASE_ASSETS: ${{ inputs.trust_release_assets }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: check secret
        id: gate
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::UPDATE_SIGNING_KEY is not configured, so $TAG has no signed update manifest and no desktop client can self-update to it."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.ready == 'true'
        with:
          persist-credentials: false

      - name: download the desktop artifacts
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'slim-m-client-*-linux-amd64.tar.gz' \
            --pattern 'slim-m-client-*-windows-x64.zip' \
            --pattern 'slim-m-client-*-macos.zip' \
            --pattern 'slim-m-client-android*.apk'

      # What each trusted producer built, from its own workflow run on main or this tag; an asset attached by anything else has no digest and is refused.
      - name: fetch the producers' digests
        if: steps.gate.outputs.ready == 'true' && env.TRUST_RELEASE_ASSETS != 'true'
        run: |
          mkdir -p expected
          for label in linux android windows macos; do
            id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=digests-$TAG-$label&per_page=30" \
              | jq -r --arg tag "$TAG" '[.artifacts[] | select(.expired == false and (.workflow_run.head_branch == "main" or .workflow_run.head_branch == $tag))][0].id // empty')"
            [ -n "$id" ] || { echo "::notice::no digests recorded for $label"; continue; }
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$label.zip"
            unzip -q -o "$RUNNER_TEMP/$label.zip" -d expected
          done

      # The Linux tarball (release) and the Windows and macOS archives (desktop-clients) land in either order, so each producer calls this with defer and the last one to attach signs.
      - name: build the manifest
        id: build
        if: steps.gate.outputs.ready == 'true'
        run: |
          extra=(--expected expected)
          [ "$TRUST_RELEASE_ASSETS" = "true" ] && extra=(--trust-release-assets)
          [ "$DEFER" = "true" ] && extra+=(--defer-if-missing)
          python3 scripts/update-manifest.py build --tag "$TAG" --dir dist \
            --repo "$GITHUB_REPOSITORY" --require "$REQUIRE" --out manifest.json "${extra[@]}"
          if [ -f manifest.json ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not every required platform is attached to $TAG yet. The producer that attaches the last one signs the manifest."
          fi

      - name: sign the manifest
        if: steps.build.outputs.built == 'true'
        run: python3 scripts/update-manifest.py sign --manifest manifest.json --sig manifest.json.sig

      # Against the keys compiled into the client, so a secret that no installed app trusts fails here and not on a user's machine.
      - name: verify what was just signed
        if: steps.build.outputs.built == 'true'
        run: |
          python3 scripts/update-manifest.py verify --manifest manifest.json --sig manifest.json.sig \
            --keys-dart client/packages/app/lib/src/desktop/self_update/update_keys.dart --dir dist

      - name: attach to the github release
        if: steps.build.outputs.built == 'true'
        run: gh release upload "$TAG" manifest.json manifest.json.sig --repo "$GITHUB_REPOSITORY" --clobber
