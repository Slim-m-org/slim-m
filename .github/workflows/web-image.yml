name: web-image

# Builds the web client into ghcr.io/<owner>/slim-m-web and signs it; callers and tags are in docs/ci.md, web-image.

on:
  workflow_call:
    inputs:
      ref:
        description: "The commit to build; empty builds the commit that started the run"
        type: string
        default: ""
      tags:
        description: "Newline-separated tags to put on the merged manifest"
        type: string
        default: ""
      version:
        description: "A server version or server-v tag; it becomes the only tag"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: name the image after this repo's owner, lowercased for GHCR
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/slim-m-web" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            SHA=${{ inputs.ref || github.sha }}
            SLIMM_SPOTIFY_CLIENT_ID=${{ vars.SLIMM_SPOTIFY_CLIENT_ID }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.arch }}

      - name: export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-image-digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error

  # Both results are required: a failed arch must not ship a single-arch manifest.
  merge:
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TAGS: ${{ inputs.tags }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: name the image after this repo's owner, lowercased for GHCR
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/slim-m-web" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: web-image-digest-*
          path: /tmp/digests
          merge-multiple: true
          if-no-files-found: error

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create and inspect manifest
        id: manifest
        run: |
          refs=()
          for f in /tmp/digests/*; do refs+=("${IMAGE}@$(cat "$f")"); done
          args=()
          first=
          [ -z "$VERSION" ] || TAGS="${VERSION#server-v}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            args+=(-t "${IMAGE}:${tag}")
            first="${first:-$tag}"
          done <<< "$TAGS"
          [ "${#refs[@]}" -eq 2 ] || { echo "expected two arch digests, got ${#refs[@]}" >&2; exit 1; }
          [ -n "$first" ] || { echo "no tags given" >&2; exit 1; }
          docker buildx imagetools create "${args[@]}" "${refs[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${first}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The manifest-list digest covers both arch images and every tag that resolves to it.
      - name: cosign sign (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.manifest.outputs.digest }}"
