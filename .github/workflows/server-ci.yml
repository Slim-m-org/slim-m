name: server-ci

# Path-gated: a client-only change never triggers a server build. openapi.yaml is
# in the filter because tests/openapi_contract.rs gates it; see docs/ci.md.
on:
  merge_group:
  push:
    branches: [main]
    paths:
      - "crates/**"
      # The committed sqlx offline cache the build reads; it is not under
      # crates/, so without this a cache-only change runs no server tests.
      - ".sqlx/**"
      - "schema/openapi.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docker/server.Dockerfile"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "crates/**"
      # The committed sqlx offline cache the build reads; it is not under
      # crates/, so without this a cache-only change runs no server tests.
      - ".sqlx/**"
      - "schema/openapi.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docker/server.Dockerfile"
      - ".github/workflows/server-ci.yml"

permissions:
  contents: read

# Never on main: a release gate reads these very check runs, so cancelling one
# blocks a publish that had nothing wrong with it.
concurrency:
# On main, keyed per commit: a group shared across pushes lets GitHub cancel an older still-queued run outright, which cancel-in-progress cannot prevent; see docs/ci.md.
  group: server-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Build against the committed .sqlx query cache; no database needed in CI.
env:
  SQLX_OFFLINE: "true"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # A dependency nobody imports still compiles on every build and still
      # carries its own tree: `jiff` was declared, never used, and pulled ten
      # crates in behind it. Nothing else notices - the build is green and the
      # binary works - so it accrues quietly until somebody goes looking.
      #
      # Source-text based, so it can be wrong. Anything it flags belongs in
      # `[package.metadata.cargo-machete] ignored` with a reason, not deleted
      # on its say-so; the Dart side of this audit was three flags and three
      # false positives, all native side-effect packages with no import.
      - name: install cargo-machete
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-machete@0.9.2
      - name: no unused dependencies
        run: cargo machete
      # A new or edited query with no cache entry fails the offline build loudly,
      # so the gap this closes is narrower and quieter: a migration that changes
      # a column's nullability or type WITHOUT touching any query text. The
      # committed `.sqlx/` entries keep their old inferred types, the offline
      # build compiles clean, and nothing re-derives them against the new
      # schema - so a relaxed NOT NULL ships a Rust type the database can no
      # longer satisfy, surfacing as a runtime decode error against real data.
      #
      # CLAUDE.md is the realistic way in rather than a theoretical one: it says
      # to regenerate `.sqlx/` after changing a query, which a migration-only
      # change is not. `--check` is the `cargo fmt --check` of this cache.
      - name: install sqlx-cli
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: sqlx-cli@0.8.6
      - name: sqlx cache matches the migrated schema
        env:
          DATABASE_URL: sqlite:///tmp/slimm-sqlx-check.db
        run: |
          (cd crates/slimm-server && sqlx database create && sqlx migrate run --source migrations)
          cargo sqlx prepare --workspace --check -- --all-targets
      - name: install nextest
        # Pinned version, checksum-verified by the action rather than piped from
        # the network straight into tar. nextest runs the workspace's test
        # binaries in parallel; plain `cargo test` runs them one at a time, so
        # this is a large wall-clock win on a suite of many integration bins.
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-nextest@0.9.143
      - name: test
        run: cargo nextest run --locked --workspace
      - name: doctests
        # nextest does not run doctests; run them separately so they stay covered.
        run: cargo test --locked --workspace --doc
      - name: build (release)
        run: cargo build --locked --release --bin slimm-server
      - name: binary size budget
        # The brief treats binary size as a first-class budget; gate it in CI.
        run: |
          max=20971520   # 20 MiB
          size=$(stat -c%s target/release/slimm-server)
          echo "slimm-server: ${size} bytes (budget ${max})"
          if [ "$size" -gt "$max" ]; then
            echo "::error::release binary exceeds the 20 MiB budget"
            exit 1
          fi
