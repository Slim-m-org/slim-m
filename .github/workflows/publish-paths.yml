name: publish-paths

# Builds the release's server binaries and images on a pull request that edits their recipe, publishing nothing; see docs/ci.md, publish-paths.

on:
  pull_request:
    paths:
      - .github/workflows/publish-paths.yml
      - .github/workflows/release.yml
      - .github/workflows/main-builds.yml
      - .github/workflows/server-binaries.yml
      - .github/workflows/web-image.yml
      - docker/**
      - Cargo.toml
      - Cargo.lock
      - crates/slimm-server/Cargo.toml
      - rust-toolchain.toml
      - client/pubspec.lock

concurrency:
  group: publish-paths-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The same reusable workflow the release calls, so this check and the release cannot drift apart.
  server-binaries:
    uses: ./.github/workflows/server-binaries.yml
    permissions:
      contents: read
    with:
      server_version: pr-${{ github.event.pull_request.number }}

  server-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/server.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: SLIMM_BUILD_ID=${{ github.sha }}
          push: false

  # publish: false skips the login, the push, the manifest merge and the signature.
  web-image:
    uses: ./.github/workflows/web-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      publish: false
