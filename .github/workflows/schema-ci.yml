name: schema-ci

# The pull_request trigger stays path-gated: a server-only or client-only
# change never needs the schema checks. push does not: `breaking-change-gate-main`
# below has to run on every commit landing on main - including a
# release-please commit that touches only version files - so the release
# gate (`verify-release-checks.yml`) can always find its check-run on the
# commit a release actually verifies. See that job's own doc comment.
on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    paths:
      - "schema/**"
      - "redocly.yaml"
      - ".github/workflows/schema-ci.yml"

permissions:
  contents: read

concurrency:
# On main, keyed per commit: a group shared across pushes lets GitHub cancel an older still-queued run outright, which cancel-in-progress cannot prevent; see docs/ci.md.
  group: schema-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: lint openapi schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*

      - name: redocly lint
        run: |
          npm install --no-save --ignore-scripts @redocly/cli@2.40.0
          ./node_modules/.bin/redocly lint schema/openapi.yaml

  breaking-change-gate:
    name: breaking-change gate (additive-only)
    # A PR's base and head are what make a diff meaningful; a bare push has
    # no such pairing, which is what `breaking-change-gate-main` below is
    # for instead - not lint, which only checks syntax, never additive-only-ness.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # The head commit explicitly, not the default merge-ref, so HEAD below is
      # exactly the schema the PR proposes with no merge commit in between.
      - name: checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # The commit the PR branched from, not main's tip: a path main gained since reads as removed by a PR that predates it.
      # oasdiff reads that schema straight out of git, so it is fetched shallowly by SHA; see docs/ci.md.
      - name: find where the PR branched
        id: merge-base
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(bash scripts/pr-merge-base.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")" >> "$GITHUB_OUTPUT"

      # `oasdiff breaking` flags only what breaks existing clients, which is what
      # makes this gate additive-only by construction; see docs/ci.md.
      - name: oasdiff breaking-change check
        uses: oasdiff/oasdiff-action/breaking@45c956ed8138f7f18f0425d34e3d66730b805cb2 # v0
        with:
          base: "${{ steps.merge-base.outputs.sha }}:schema/openapi.yaml"
          revision: "HEAD:schema/openapi.yaml"
          fail-on: ERR

  # `verify-release-checks.yml` polls check-runs on the exact commit a
  # release verifies, and that commit is never the PR head above once
  # merged: a squash-merge mints a brand-new SHA on main, and a
  # release-please commit never touches schema/** at all, so
  # `breaking-change-gate` can never carry a check-run there regardless.
  # This job is what actually reaches it: diffed against its own immediate
  # parent, which - this repo's convention is squash-merge-only
  # (CLAUDE.md's contribution conventions) - is exactly the one commit a
  # merged PR added, the same comparison the PR-time gate above already
  # made once. A direct multi-commit push to main would only diff its last
  # commit; not a concern under a squash-merge-only workflow.
  breaking-change-gate-main:
    name: breaking-change gate (additive-only, push to main)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      # Two commits, not one: HEAD~1 needs its parent present locally, and a
      # push event's own checkout otherwise fetches only the pushed commit.
      - name: checkout with parent history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      # Trivially passes when schema/openapi.yaml did not change in this
      # commit at all, which is true of most pushes to main.
      - name: oasdiff breaking-change check
        uses: oasdiff/oasdiff-action/breaking@45c956ed8138f7f18f0425d34e3d66730b805cb2 # v0
        with:
          base: "HEAD~1:schema/openapi.yaml"
          revision: "HEAD:schema/openapi.yaml"
          fail-on: ERR
