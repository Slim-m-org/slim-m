#
# SonarQube Cloud analysis of the whole repository, CI mode: the scan runs here
# with the SONAR_TOKEN secret and reads sonar-project.properties for its scope.
# Advisory only, never a required check: it reports maintainability, duplication
# and complexity on the PR and on main, and the gates in hygiene, client-ci and
# server-ci stay the ones that block. See docs/ci.md.
name: sonar

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scan:
    name: sonarqube scan
    # A fork's PR gets no secrets, so the scan would only fail on a missing token.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, so new-code and blame attribution are accurate.
          fetch-depth: 0

      - name: cache sonar packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: set up flutter (stable channel)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      # The Dart analyzer resolves package imports, so unresolved ones would read as errors.
      - name: resolve workspace dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile

      - name: sonarqube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
