name: release

# Full release and publish pipeline. How a release is cut, why server and client version independently, why every publish job requires this commit's own CI to have passed, and what each job needs: docs/ci.md.

on:
  push:
    branches: [main]
  # No tag trigger: release-please's own PAT-created tag would start a second run on the same commit and publish everything twice.
  # Republish by hand with `gh workflow run release.yml --ref <server-v*|client-v*>`; the run then reads that tag as github.ref.
  workflow_dispatch:

# Minimal default. Individual jobs widen this to exactly what they require.
permissions:
  contents: read

# Keyed on the commit, not the ref: a run is never left pending behind another and cancelled outright. See docs/ci.md.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

# Public by design (a PKCE client id); empty on a fork pull request, which leaves the feature off.
env: {SLIMM_SPOTIFY_CLIENT_ID: "${{ vars.SLIMM_SPOTIFY_CLIENT_ID }}"}

jobs:
  # Opens and maintains release PRs, and cuts releases on merge. A no-op on a manual run on a tag, so downstream jobs can still resolve it via `needs`. See docs/ci.md.
  #
  # Two invocations, one manifest file each, so neither package's release commit conflicts the other's PR. See docs/ci.md.
  #
  # RELEASE_PLEASE_TOKEN decides whether the release PR's own checks ever run; without it they cannot. See docs/ci.md.
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      server_released: ${{ steps.rp-server.outputs['crates/slimm-server--release_created'] }}
      server_tag: ${{ steps.rp-server.outputs['crates/slimm-server--tag_name'] || steps.resolved.outputs.server_tag }}
      server_version: ${{ steps.rp-server.outputs['crates/slimm-server--version'] || steps.resolved.outputs.server_version }}
      client_released: ${{ steps.rp-client.outputs['client--release_created'] }}
      client_tag: ${{ steps.rp-client.outputs['client--tag_name'] || steps.resolved.outputs.client_tag }}
      client_version: ${{ steps.rp-client.outputs['client--version'] || steps.resolved.outputs.client_version }}
      # The commit each tag sits on; the publish jobs build this, as the verify jobs check it, and a by-hand run on a tag is already on it.
      server_ref: ${{ steps.rp-server.outputs['crates/slimm-server--sha'] || github.sha }}
      client_ref: ${{ steps.rp-client.outputs['client--sha'] || github.sha }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: rp-server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          manifest-file: .release-please-manifest.server.json
          config-file: release-please-config.server.json
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: rp-client
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          manifest-file: .release-please-manifest.client.json
          config-file: release-please-config.client.json
      # A by-hand run on a tag has no release-please output, so the tag itself names the release.
      - name: resolve the tag a by-hand run names
        id: resolved
        run: |
          case "$GITHUB_REF_NAME" in
            server-v*) echo "server_version=${GITHUB_REF_NAME#server-v}" >> "$GITHUB_OUTPUT"; echo "server_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT" ;;
            client-v*) echo "client_version=${GITHUB_REF_NAME#client-v}" >> "$GITHUB_OUTPUT"; echo "client_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT" ;;
          esac

  # Requires server-ci, hygiene and the license gate to have passed on this
  # exact commit before any server publish job runs. See docs/ci.md.
  # Every publish job gates on this job's result alone: a false condition here skips it, and a skip is not a success downstream.
  verify-server-ci:
    needs: [release-please]
    if: >-
      (needs.release-please.result == 'success' &&
       needs.release-please.outputs.server_released == 'true') ||
      startsWith(github.ref, 'refs/tags/server-v')
    permissions:
      checks: read
      contents: read
    uses: ./.github/workflows/verify-release-checks.yml
    with:
      ref: ${{ needs.release-please.outputs.server_tag }}
      required_checks: "check|hygiene|cargo dependency licenses|breaking-change gate (additive-only, push to main)"

  # Requires client-ci, client-ios-ci, hygiene and the license gate to have
  # passed on this exact commit before any client publish job runs.
  verify-client-ci:
    needs: [release-please]
    if: >-
      (needs.release-please.result == 'success' &&
       needs.release-please.outputs.client_released == 'true') ||
      startsWith(github.ref, 'refs/tags/client-v')
    permissions:
      checks: read
      contents: read
    uses: ./.github/workflows/verify-release-checks.yml
    with:
      ref: ${{ needs.release-please.outputs.client_tag }}
      required_checks: "analyze, format check|test and web build|linux desktop compiles|linux desktop shell smoke (Xvfb)|ios unit tests (callkit invariant)|ios sources are registered in project.pbxproj|hygiene|pub dependency licenses|breaking-change gate (additive-only, push to main)"

  # One single-arch image per architecture, built on a NATIVE runner and pushed
  # to GHCR by digest. No QEMU, and no stored key material. See docs/ci.md.
  server-image:
    needs: [release-please, verify-server-ci]
    if: needs.verify-server-ci.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: name the image after this repo's owner, lowercased for GHCR
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/slim-m-server" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.server_ref }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: .
          file: docker/server.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: SLIMM_BUILD_ID=${{ needs.release-please.outputs.server_ref }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true # by digest; the merge job tags it
          sbom: true
          provenance: mode=max

      - name: export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-image-digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error

  # Assembles the per-arch digests into one multi-arch manifest tag and
  # cosign-signs it keylessly over OIDC. Reviewer-gated.
  server-image-merge:
    needs: [release-please, server-image, verify-server-ci]
    # Both results: any `if:` drops the implicit needs gate, and a failed arch used to ship single-arch. See docs/ci.md.
    if: needs.verify-server-ci.result == 'success' && needs.server-image.result == 'success'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: name the image after this repo's owner, lowercased for GHCR
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/slim-m-server" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.server_ref }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: server-image-digest-*
          path: /tmp/digests
          merge-multiple: true
          if-no-files-found: error

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: decide whether :latest may move
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "move=$(bash scripts/decide-latest-tag.sh "$IMAGE" "${{ needs.release-please.outputs.server_version }}")" >> "$GITHUB_OUTPUT"
      - name: create and inspect manifest
        id: manifest
        run: |
          version="${{ needs.release-please.outputs.server_version }}"
          refs=()
          for f in /tmp/digests/*; do refs+=("${IMAGE}@$(cat "$f")"); done
          tags=(-t "${IMAGE}:${version}" -t "${IMAGE}:sha-${{ needs.release-please.outputs.server_ref }}")
          if [ "${{ steps.latest.outputs.move }}" = "true" ]; then tags+=(-t "${IMAGE}:latest"); fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the manifest-list digest, which covers both arch images and every
      # tag that resolves to it.
      - name: cosign sign (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.manifest.outputs.digest }}"

  # The web bundle under the server's version, so SLIMM_VERSION pins both images (decision 0025); never moves latest.
  web-image:
    needs: [release-please, server-image-merge]
    if: needs.server-image-merge.result == 'success'
    uses: ./.github/workflows/web-image.yml
    permissions: {contents: read, packages: write, id-token: write}
    with:
      ref: ${{ needs.release-please.outputs.server_ref }}
      version: ${{ needs.release-please.outputs.server_version }}

  # Static musl binaries for direct download, built per arch into artifacts and
  # aggregated by server-release-assets.
  server-binaries:
    needs: [release-please, verify-server-ci]
    if: needs.verify-server-ci.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/server-binaries.yml
    with:
      ref: ${{ needs.release-please.outputs.server_ref }}
      server_version: ${{ needs.release-please.outputs.server_version }}

  # GPG-signable SHA256SUMS plus the raw binaries on the server GitHub Release.
  # The GPG secrets are optional; only the .asc is skipped. See docs/ci.md.
  server-release-assets:
    needs: [release-please, server-binaries, verify-server-ci]
    # Same as server-image-merge: without the second clause a failed arch still published a partial release.
    if: needs.verify-server-ci.result == 'success' && needs.server-binaries.result == 'success'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: server-binary-*
          path: dist
          merge-multiple: true
          if-no-files-found: error

      - name: checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: sign checksums (optional)
        if: env.GPG_PRIVATE_KEY != ''
        working-directory: dist
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --pinentry-mode loopback --passphrase-fd 0 <<< "$GPG_PASSPHRASE" \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS

      # Retried, and fails when a required file is missing; scripts/upload-release-assets.sh.
      - name: attach to the github release
        env:
          # The same identity release-please creates the release with; see below.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: scripts/upload-release-assets.sh "${{ needs.release-please.outputs.server_tag }}" 'dist/slimm-server-*' dist/SHA256SUMS '?dist/SHA256SUMS.asc'

  # The portable Linux tarball, always, plus whichever packaging formats have
  # their inputs in the repo. Each format gates on its own file. See docs/ci.md.
  linux-client:
    needs: [release-please, verify-client-ci]
    if: needs.verify-client-ci.result == 'success'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.client_ref }}

      # The same build and staging as main-builds and copr-catch-up, so the snapshot and the release tarball cannot drift.
      # Published on every client release and gated on nothing. It is both the
      # download for a user with no packaging, and the spec's Source0.
      - name: build linux tarball
        uses: ./.github/actions/linux-tarball
        with:
          version: ${{ needs.release-please.outputs.client_version }}
          spotify_client_id: ${{ vars.SLIMM_SPOTIFY_CLIENT_ID }}

      # One gate per format, so a working rpm is not held back by the absence of
      # a flatpak manifest. The tarball above ships either way.
      - name: check packaging inputs
        id: pkg
        run: |
          if [ -f packaging/flatpak/top.npcserver.slimm.yaml ]; then
            echo "flatpak=true" >> "$GITHUB_OUTPUT"
          else
            echo "flatpak=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No packaging/flatpak/top.npcserver.slimm.yaml, so no Flatpak bundle is built. The portable tarball is published regardless."
          fi
          if [ -f packaging/rpm/slim-m-client.spec ]; then
            echo "rpm=true" >> "$GITHUB_OUTPUT"
          else
            echo "rpm=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No packaging/rpm/slim-m-client.spec, so no rpm is built. The portable tarball is published regardless."
          fi

      # continue-on-error: this format has one real CI run behind it versus the rpm's dozens; see packaging/flatpak/README.md.
      # librsvg2-common provides the gdk-pixbuf SVG loader `flatpak build-export`
      # needs on this host to validate exported icons; without it a valid SVG
      # fails export with "Format not recognized". See packaging/flatpak/README.md.
      - name: build flatpak
        if: steps.pkg.outputs.flatpak == 'true'
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils librsvg2-common
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo=dist/flatpak-repo build-dir \
            packaging/flatpak/top.npcserver.slimm.yaml
          flatpak build-bundle dist/flatpak-repo \
            "dist/slim-m-client-${{ needs.release-please.outputs.client_version }}.flatpak" \
            top.npcserver.slimm

      # In a Fedora container, not on the runner: the spec is written against
      # Fedora's macros and dependency generators, and Ubuntu's rpm has neither.
      - name: build rpm
        if: steps.pkg.outputs.rpm == 'true'
        env:
          VER: ${{ needs.release-please.outputs.client_version }}
        run: |
          docker run --rm -v "${PWD}:/w" -w /w -e VER fedora:44 bash -eo pipefail -c '
            dnf -y install rpm-build patchelf desktop-file-utils tar gzip >/dev/null
            mkdir -p rpmbuild/SOURCES
            cp dist/slim-m-client-*-linux-amd64.tar.gz \
              packaging/rpm/top.npcserver.slimm.desktop packaging/rpm/slim-m-client.repo \
              packaging/linux/icons/top.npcserver.slimm*.png \
              packaging/linux/icons/top.npcserver.slimm.svg rpmbuild/SOURCES/
            # The same stamp the copr job applies, so the .rpm on the release and
            # the one COPR builds carry the same version as the tag.
            sed "s/^Version:.*/Version:        ${VER}/" \
              packaging/rpm/slim-m-client.spec > rpmbuild/slim-m-client.spec
            rpmbuild -bb --define "_topdir /w/rpmbuild" --define "_rpmdir /w/dist" \
              rpmbuild/slim-m-client.spec
          '

      - name: checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          sha256sum -- slim-m-client-*-linux-amd64.tar.gz *.flatpak > SHA256SUMS
          # The rpm is attached by basename, so it is listed by basename too.
          for rpm in */*.rpm; do
            printf '%s  %s\n' "$(sha256sum < "$rpm" | cut -d' ' -f1)" "${rpm##*/}" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: sign checksums (optional)
        if: env.GPG_PRIVATE_KEY != ''
        working-directory: dist
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --pinentry-mode loopback --passphrase-fd 0 <<< "$GPG_PASSPHRASE" \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS

      - name: attach to the github release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          scripts/upload-release-assets.sh "${{ needs.release-please.outputs.client_tag }}" \
            'dist/slim-m-client-*-linux-amd64.tar.gz' \
            '?dist/*.flatpak' '?dist/*/*.rpm' \
            dist/SHA256SUMS '?dist/SHA256SUMS.asc'

      # Last and unconditional on earlier failures, so a missing bundle turns the run red after everything else has attached.
      - name: verify flatpak bundle was produced
        if: always() && steps.pkg.outputs.flatpak == 'true'
        run: |
          shopt -s nullglob
          bundles=(dist/slim-m-client-*.flatpak)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "::error::build flatpak did not produce a .flatpak bundle; see its logs for the real failure"
            exit 1
          fi
      - {if: failure(), uses: ./.github/actions/native-hooks-diagnose}

  # Re-signs the manifest after the tarball attaches, since desktop-clients may have finished first and signed without it. It defers when the Windows or macOS archive is not there yet, and desktop-clients then signs.
  update-manifest:
    name: signed update manifest
    needs: [release-please, linux-client, verify-client-ci]
    if: needs.verify-client-ci.result == 'success' && needs.linux-client.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/update-manifest.yml
    with:
      tag: ${{ needs.release-please.outputs.client_tag }}
      defer: true
    secrets:
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}

  # Submits the Fedora package to COPR. Inert without COPR_CONFIG or the spec,
  # and best effort: the .rpm is on the release, so a failure only warns.
  copr:
    needs: [release-please, linux-client, verify-client-ci]
    if: needs.verify-client-ci.result == 'success' && needs.linux-client.result == 'success'
    runs-on: ubuntu-24.04
    container: fedora:44
    environment: release
    permissions:
      contents: read
    env:
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
    steps:
      - name: check secret
        id: gate
        run: |
          if [ -n "$COPR_CONFIG" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::COPR_CONFIG is not configured. Add it to enable the Fedora COPR publish. Skipping."
          fi

      - name: install tooling
        if: steps.gate.outputs.ready == 'true'
        run: dnf -y install git copr-cli rpm-build rpmdevtools >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.client_ref }}
        if: steps.gate.outputs.ready == 'true'

      - name: submit to COPR
        if: steps.gate.outputs.ready == 'true'
        env:
          VER: ${{ needs.release-please.outputs.client_version }}
        run: |
          set -uo pipefail
          spec=packaging/rpm/slim-m-client.spec
          if [ ! -f "$spec" ]; then
            echo "::warning::${spec} does not exist, so there is nothing to submit to COPR. Skipping."
            exit 0
          fi
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
          rpmdev-setuptree
          # A macro file rather than a --define, because spectool and rpmbuild
          # both read it and only one of them is guaranteed to take the flag.
          printf '%%app_version %s\n' "$VER" >> ~/.rpmmacros
          cp "$spec" ~/rpmbuild/SPECS/slim-m-client.spec
          # spectool below fetches remote sources only, so the local ones have
          # to be placed by hand or rpmbuild -bs fails on a missing Source.
          cp packaging/rpm/top.npcserver.slimm.desktop packaging/rpm/slim-m-client.repo \
            packaging/linux/icons/top.npcserver.slimm*.png \
            packaging/linux/icons/top.npcserver.slimm.svg ~/rpmbuild/SOURCES/
          # Stamp the version only when the spec hardcodes it. A spec that
          # expands a macro there already has the value and must not be edited.
          if ! grep -q '^Version:.*%{' ~/rpmbuild/SPECS/slim-m-client.spec; then
            sed -i "s/^Version:.*/Version:        ${VER}/" ~/rpmbuild/SPECS/slim-m-client.spec
          fi
          # COPR's buildroot has no network, so Source0 has to travel inside the
          # SRPM. spectool downloads it here, while there is still a network.
          spectool -g -R ~/rpmbuild/SPECS/slim-m-client.spec
          rpmbuild -bs ~/rpmbuild/SPECS/slim-m-client.spec >/dev/null
          srpm=$(ls ~/rpmbuild/SRPMS/slim-m-client-*.src.rpm)
          if copr-cli build nc1107/slim-m "$srpm" --nowait; then
            echo "submitted slim-m-client ${VER} to COPR (nc1107/slim-m)"
          else
            echo "::warning::COPR submit failed for slim-m-client ${VER}. The .rpm is on the release; rebuild manually with 'copr-cli build nc1107/slim-m <srpm>' from ${spec}. See packaging/fedora/README.md."
          fi

  # Upload-signed apk and appbundle. Inert without its three secrets, and it
  # verifies the signer is the upload key, never debug. See docs/ci.md.
  android-client:
    needs: [release-please, verify-client-ci]
    if: needs.verify-client-ci.result == 'success'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
      ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
      ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
    steps:
      - name: check secrets
        id: gate
        run: |
          if [ -n "$ANDROID_UPLOAD_KEYSTORE_B64" ] && [ -n "$ANDROID_KEY_PROPERTIES" ] \
             && [ -n "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing secrets are not configured. Add ANDROID_UPLOAD_KEYSTORE_B64, ANDROID_KEY_PROPERTIES, and ANDROID_GOOGLE_SERVICES_JSON to enable the signed build. Skipping."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.client_ref }}
        if: steps.gate.outputs.ready == 'true'

      - name: write signing assets
        if: steps.gate.outputs.ready == 'true'
        run: |
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" \
            > client/packages/app/android/app/google-services.json
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 -d \
            > client/packages/app/android/app/upload-keystore.jks
          printf '%s' "$ANDROID_KEY_PROPERTIES" \
            > client/packages/app/android/key.properties

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        if: steps.gate.outputs.ready == 'true'
        with:
          distribution: temurin
          # The LTS the Android Gradle Plugin supports; local builds match.
          java-version: "21"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.gate.outputs.ready == 'true'
        with:
          channel: stable
          flutter-version: 3.47.0

      - uses: ./.github/actions/native-hooks-cache
        if: steps.gate.outputs.ready == 'true'
      - name: build android release
        if: steps.gate.outputs.ready == 'true'
        working-directory: client/packages/app
        run: |
          # --enforce-lockfile: resolve exactly what pubspec.lock pins.
          flutter pub get --enforce-lockfile
          # Build number from the run number and build name from the tag, never
          # from pubspec. Both stores reject a reuse; see docs/ci.md.
          flutter build appbundle --release --dart-define=SLIMM_SPOTIFY_CLIENT_ID="${SLIMM_SPOTIFY_CLIENT_ID}" \
            --build-name=${{ needs.release-please.outputs.client_version }} \
            --build-number=${{ github.run_number }}
          flutter build apk --release --dart-define=SLIMM_SPOTIFY_CLIENT_ID="${SLIMM_SPOTIFY_CLIENT_ID}" \
            --build-name=${{ needs.release-please.outputs.client_version }} \
            --build-number=${{ github.run_number }}

      - name: verify the signer is the upload key, not debug
        if: steps.gate.outputs.ready == 'true'
        working-directory: client/packages/app
        env:
          # Play's registered upload certificate. A public fingerprint, not a
          # secret, and the only check that proves Play will accept the upload.
          EXPECTED_SHA256: 9dc12a6a03bd6125065fb5f6eca2d8d8477f74009e0f6624efee2d2b98ec033b
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ] || [ ! -d "$sdk/build-tools" ]; then
            echo "::error::no Android build-tools; ANDROID_HOME='${sdk}'"
            exit 1
          fi
          tool="$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          if [ -z "$tool" ]; then
            echo "::error::no apksigner under $sdk/build-tools"
            ls -1 "$sdk/build-tools" || true
            exit 1
          fi
          # Captured to a file and echoed before matching. The previous form
          # assigned a grep pipeline, so a miss aborted with no output at all.
          "$tool" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk > certs.txt 2>&1 || {
              echo "::error::apksigner could not verify the release apk"
              cat certs.txt
              exit 1
            }
          cat certs.txt
          if grep -q 'Android Debug' certs.txt; then
            echo "::error::release apk is signed with the debug keystore; key.properties did not take effect"
            exit 1
          fi
          if ! grep -qi "$EXPECTED_SHA256" certs.txt; then
            echo "::error::signer is not Play's registered upload key (want $EXPECTED_SHA256)"
            exit 1
          fi
          echo "signed by the expected upload key"

      - name: checksums
        if: steps.gate.outputs.ready == 'true'
        working-directory: client/packages/app
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/slim-m-client-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/slim-m-client-android.aab"
          (cd dist && sha256sum -- slim-m-client-android.apk > SHA256SUMS.android)

      # No aab: a Play upload format testers download by mistake; docs/INSTALL.md.
      - name: attach to the github release
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/upload-release-assets.sh "${{ needs.release-please.outputs.client_tag }}" \
            client/packages/app/dist/slim-m-client-android.apk \
            client/packages/app/dist/SHA256SUMS.android
      - {if: failure() && steps.gate.outputs.ready == 'true', uses: ./.github/actions/native-hooks-diagnose}

  # Signed ipa to TestFlight, reviewer-gated. Inert without its six secrets: it
  # warns and stops rather than faking an upload. See docs/ci.md.
  ios-testflight:
    needs: [release-please, verify-client-ci]
    if: needs.verify-client-ci.result == 'success'
    runs-on: macos-latest
    environment: testflight
    permissions:
      contents: read
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      IOS_SIGNING_CERTIFICATE_P12: ${{ secrets.IOS_SIGNING_CERTIFICATE_P12 }}
      IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      IOS_BROADCAST_PROVISIONING_PROFILE: ${{ secrets.IOS_BROADCAST_PROVISIONING_PROFILE }}
      IOS_NSE_PROVISIONING_PROFILE: ${{ secrets.IOS_NSE_PROVISIONING_PROFILE }}
    steps:
      - name: check secrets
        id: gate
        run: |
          if [ -n "$APP_STORE_CONNECT_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] \
             && [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ] && [ -n "$IOS_SIGNING_CERTIFICATE_P12" ] \
             && [ -n "$IOS_SIGNING_CERTIFICATE_PASSWORD" ] && [ -n "$IOS_PROVISIONING_PROFILE" ] \
             && [ -n "$IOS_BROADCAST_PROVISIONING_PROFILE" ] \
             && [ -n "$IOS_NSE_PROVISIONING_PROFILE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::iOS TestFlight secrets are not configured. Add the App Store Connect API key, signing certificate, and all three provisioning profile secrets (the app's, the broadcast extension's and the notification service extension's) to enable the build and upload. Skipping."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.client_ref }}
        if: steps.gate.outputs.ready == 'true'

      - name: import signing assets
        if: steps.gate.outputs.ready == 'true'
        run: |
          KEYDIR="${HOME}/.appstoreconnect/private_keys"
          mkdir -p "$KEYDIR"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" \
            > "${KEYDIR}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          # A throwaway keychain, not the login one: it keeps the private key
          # out of any shared default that later steps touch.
          CERT_PATH="${RUNNER_TEMP}/build_certificate.p12"
          PROFILE_PATH="${RUNNER_TEMP}/build_pp.mobileprovision"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf '%s' "$IOS_SIGNING_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          BROADCAST_PROFILE_PATH="${RUNNER_TEMP}/build_pp_broadcast.mobileprovision"
          printf '%s' "$IOS_BROADCAST_PROVISIONING_PROFILE" \
            | base64 --decode > "$BROADCAST_PROFILE_PATH"
          NSE_PROFILE_PATH="${RUNNER_TEMP}/build_pp_nse.mobileprovision"
          printf '%s' "$IOS_NSE_PROVISIONING_PROFILE" | base64 --decode > "$NSE_PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_SIGNING_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Without this, codesign prompts for permission and hangs a headless run.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # xcodebuild finds a profile by its UUID under this directory, so the
          # file has to be named for the UUID embedded in its own signed plist.
          # One per bundle: the app and both extensions are signed separately,
          # and a missing extension profile fails the export naming only that
          # bundle id.
          PROFILE_DIR="${HOME}/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          INSTALLED=""
          for pp in "$PROFILE_PATH" "$BROADCAST_PROFILE_PATH" "$NSE_PROFILE_PATH"; do
            UUID="$(security cms -D -i "$pp" | plutil -extract UUID raw -o - -)"
            NAME="$(security cms -D -i "$pp" | plutil -extract Name raw -o - -)"
            cp "$pp" "${PROFILE_DIR}/${UUID}.mobileprovision"
            echo "installed profile ${NAME} (${UUID})"
            INSTALLED="${INSTALLED}${NAME}\n"
          done

          # Fail here rather than at export. xcodebuild matches these names
          # literally and its own error names only a bundle id, which sends
          # you looking at the wrong thing.
          # No pipe into the loop: a `while` on the right of a pipe runs in a
          # subshell, so its exit would not fail this step.
          EXPORT_OPTIONS=client/packages/app/ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Print :provisioningProfiles" "$EXPORT_OPTIONS" \
            | sed -n 's/^ *[^ ]* = \(.*\)$/\1/p' > "${RUNNER_TEMP}/wanted_profiles"
          printf '%b' "$INSTALLED" > "${RUNNER_TEMP}/installed_profiles"
          missing=0
          while read -r want; do
            [ -n "$want" ] || continue
            grep -qxF "$want" "${RUNNER_TEMP}/installed_profiles" || {
              echo "::error::ExportOptions names profile '${want}', which is not installed"
              missing=1
            }
          done < "${RUNNER_TEMP}/wanted_profiles"
          [ "$missing" -eq 0 ] || exit 1

          # Name the identity codesign can actually see: a downstream failure
          # otherwise says only "no valid code signing certificates were found".
          echo "signing identities available to codesign:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.gate.outputs.ready == 'true'
        with:
          channel: stable
          flutter-version: 3.47.0

      - uses: ./.github/actions/native-hooks-cache
        if: steps.gate.outputs.ready == 'true'
      - name: build ipa
        if: steps.gate.outputs.ready == 'true'
        working-directory: client/packages/app
        run: |
          # --enforce-lockfile: resolve exactly what pubspec.lock pins.
          flutter pub get --enforce-lockfile
          # Build number from the run number and build name from the tag, never
          # from pubspec. Both stores reject a reuse; see docs/ci.md.
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --dart-define=SLIMM_SPOTIFY_CLIENT_ID="${SLIMM_SPOTIFY_CLIENT_ID}" \
            --build-name=${{ needs.release-please.outputs.client_version }} \
            --build-number=${{ github.run_number }}

      - name: upload to TestFlight
        if: steps.gate.outputs.ready == 'true'
        working-directory: client/packages/app
        run: |
          ipa=(build/ios/ipa/*.ipa)
          xcrun altool --upload-app --type ios \
            --file "${ipa[0]}" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - {if: failure() && steps.gate.outputs.ready == 'true', uses: ./.github/actions/native-hooks-diagnose}
