name: copr-publish

# Reusable workflow called from main-builds and copr-catch-up, since it needs its own fedora:44 container; see docs/ci.md.
on:
  workflow_call:
    secrets:
      COPR_CONFIG:
        required: false

permissions:
  contents: read

jobs:
  # Snapshot build submitted to the same COPR project `dnf upgrade` already tracks on the owner's Fedora desktop.
  submit:
    runs-on: ubuntu-24.04
    container: fedora:44
    permissions:
      contents: read
    env:
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
    steps:
      - name: check secret
        id: gate
        run: |
          if [ -n "$COPR_CONFIG" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::COPR_CONFIG is not configured. Add it to enable the Fedora COPR publish. Skipping."
          fi

      - name: install tooling
        if: steps.gate.outputs.ready == 'true'
        run: dnf -y install git copr-cli rpm-build rpmdevtools >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.ready == 'true'

      - name: resolve version
        if: steps.gate.outputs.ready == 'true'
        id: ver
        run: |
          version="$(grep -m1 '^version:' client/pubspec.yaml | awk '{print $2}')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: steps.gate.outputs.ready == 'true'
        with:
          name: slim-m-client-tarball
          path: dist

      # A snapshot's Release is the spec's N plus the commit time and sha, which sorts above the release N of the same version and below the next version; scripts/copr-snapshot-release.sh.
      - name: submit snapshot to COPR
        if: steps.gate.outputs.ready == 'true'
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -uo pipefail
          spec=packaging/rpm/slim-m-client.spec
          if [ ! -f "$spec" ]; then
            echo "::warning::${spec} does not exist, so there is nothing to submit to COPR. Skipping."
            exit 0
          fi
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
          rpmdev-setuptree
          cp "$spec" ~/rpmbuild/SPECS/slim-m-client.spec
          cp packaging/rpm/top.npcserver.slimm.desktop packaging/rpm/slim-m-client.repo \
            packaging/linux/icons/top.npcserver.slimm*.png \
            packaging/linux/icons/top.npcserver.slimm.svg ~/rpmbuild/SOURCES/
          cp "dist/slim-m-client-${VER}-linux-amd64.tar.gz" ~/rpmbuild/SOURCES/
          SNAPSHOT_RELEASE="$(bash scripts/copr-snapshot-release.sh "$spec")" || { echo "::error::could not derive the snapshot Release from ${spec}"; exit 1; }
          sed -i "s/^Version:.*/Version:        ${VER}/" ~/rpmbuild/SPECS/slim-m-client.spec
          sed -i "s/^Release:.*/Release:        ${SNAPSHOT_RELEASE}%{?dist}/" ~/rpmbuild/SPECS/slim-m-client.spec
          rpmbuild -bs ~/rpmbuild/SPECS/slim-m-client.spec >/dev/null
          srpm=$(ls ~/rpmbuild/SRPMS/slim-m-client-*.src.rpm)
          # Auth failures are permanent, so only the rest is retried; a persistent failure must go red.
          for attempt in 1 2 3; do
            if out=$(copr-cli build nc1107/slim-m "$srpm" --nowait 2>&1); then
              echo "$out"
              echo "submitted slim-m-client ${VER}-${SNAPSHOT_RELEASE} snapshot to COPR (nc1107/slim-m)"
              exit 0
            fi
            echo "$out"
            if echo "$out" | grep -qiE 'unauthori[sz]ed|expired|invalid (api )?(login|token)|authentication|forbidden'; then
              echo "::error::COPR rejected the credentials for slim-m-client ${VER}-${SNAPSHOT_RELEASE}. Renew COPR_CONFIG; retrying cannot help."
              exit 1
            fi
            [ "$attempt" -lt 3 ] && sleep $((attempt * 30))
          done
          echo "::error::COPR submit failed three times for slim-m-client ${VER}-${SNAPSHOT_RELEASE}. Rebuild by hand with 'copr-cli build nc1107/slim-m <srpm>'."
          exit 1
