name: release-tag-watchdog

# Catches a release-please manifest bump on main that no tag ever followed, which no push-triggered check can; see docs/ci.md.

on:
  schedule:
    - cron: "31 * * * *"
  workflow_dispatch:

# Granted per job, so nothing is inherited.
permissions: {}

# No concurrency group on purpose: a cancel-in-progress group over a short cron cancels the run that would catch a stuck release; docs/ci.md.

jobs:
  check:
    name: release bookkeeping matches reality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: compare manifest versions against their tags
        run: bash scripts/check-release-tag-lag.sh

      # Always, so one stuck release never hides the other.
      - name: check no merged release PR is stuck pending
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-stuck-release-label.sh

  # Dispatches release.yml once on a tag whose verify timed out and whose checks are green now.
  redispatch:
    name: redispatch a release stalled by a verify timeout
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: dispatch release.yml for a tag whose verify failed and checks are green
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/redispatch-stalled-release.py
