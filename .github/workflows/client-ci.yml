name: client-ci

# Path-gated: a server-only or schema-only change never triggers the Flutter client build.
on:
  merge_group:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"
      - ".github/actions/**"
      # The client reads this: schema_coverage_test.dart fails when a route is
      # documented with no SlimmApi call behind it. A schema-only change used
      # to skip this workflow entirely and land that failure on main, which is
      # how bulkDeleteMessages (#675) broke the api package unnoticed.
      - "schema/openapi.yaml"
      # The smoke job runs this script, so a change to it must trigger the job that exercises it.
      - "scripts/desktop-shell-smoke.sh"
      - "scripts/chrome-tests.sh"
      # A release-please version bump (CHANGELOG + the two pubspecs) is
      # deliberately NOT excluded here. verify-release-checks.yml gates every
      # client publish job on this workflow's checks being present on the exact
      # release commit; excluding these left them absent, verify-client-ci
      # timed out, and client 0.47.0 shipped no COPR/TestFlight/Play. server-ci
      # never excluded its own version files, which is why server releases
      # deliver. See docs/ci.md.
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"
      - ".github/actions/**"
      # The client reads this: schema_coverage_test.dart fails when a route is
      # documented with no SlimmApi call behind it. A schema-only change used
      # to skip this workflow entirely and land that failure on main, which is
      # how bulkDeleteMessages (#675) broke the api package unnoticed.
      - "schema/openapi.yaml"
      # The smoke job runs this script, so a change to it must trigger the job that exercises it.
      - "scripts/desktop-shell-smoke.sh"
      - "scripts/chrome-tests.sh"
      # A release-please version bump (CHANGELOG + the two pubspecs) is
      # deliberately NOT excluded here. verify-release-checks.yml gates every
      # client publish job on this workflow's checks being present on the exact
      # release commit; excluding these left them absent, verify-client-ci
      # timed out, and client 0.47.0 shipped no COPR/TestFlight/Play. server-ci
      # never excluded its own version files, which is why server releases
      # deliver. See docs/ci.md.
  # By hand only: runs update-golden-references, never anything on a push or
  # pull request. See docs/ci.md.
  workflow_dispatch:

permissions:
  contents: read

# Never on main: a release gate reads these very check runs, so cancelling one
# blocks a publish that had nothing wrong with it.
concurrency:
# On main, keyed per commit: a group shared across pushes lets GitHub cancel an older still-queued run outright, which cancel-in-progress cannot prevent; see docs/ci.md.
  group: client-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Split from the test job so a typo or an unformatted file reports in about
  # a minute instead of fourteen, measured on the first run. They share a
  # setup and a pub get,
  # which is the duplicated cost this buys the fast signal with; everything
  # after that is disjoint. Both are in verify-client-ci's required_checks,
  # since each can fail with the other green.
  analyze-format:
    name: analyze, format check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up flutter (stable channel)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      # --enforce-lockfile, for the same reason the Rust side builds --locked:
      # without it the committed lockfile is advisory and CI can silently
      # resolve versions nobody committed.
      - name: resolve workspace dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile

      - name: analyze (workspace-wide)
        working-directory: client
        run: dart analyze

      - name: format check (workspace-wide)
        working-directory: client
        run: dart format --output=none --set-exit-if-changed .

  # Sharded because one package dominates: measured on a real run, packages/app
  # was 9m44s of a 13m9s serial loop, with rtc a distant 2m1s and the other
  # five under 25s each. Matrixing per package would therefore have bottomed
  # out at app's own time; splitting app itself is what actually moves it.
  #
  # These deliberately do NOT carry the name `test and web build`. That exact
  # string is what release.yml's verify-client-ci waits on, and a matrix job
  # publishes one check per leg (`... (app-1)`), none of which would match it.
  # The aggregating job below keeps the name instead.
  # Eight shards, not four. Measured 2026-09-16 on a main run: the app
  # package's tests were 590s on the slowest of four shards against ~60s of
  # setup, so the split is what decides wall clock and the setup is noise.
  # Halving the split trades four more runners' worth of setup for roughly
  # half the test time. The count is worth re-measuring rather than raising
  # on faith: past some point queueing for runners costs more than it saves.
  test-shards:
    name: client tests (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: app-1
            shard: "--total-shards=8 --shard-index=0"
          - label: app-2
            shard: "--total-shards=8 --shard-index=1"
          - label: app-3
            shard: "--total-shards=8 --shard-index=2"
          - label: app-4
            shard: "--total-shards=8 --shard-index=3"
          - label: app-5
            shard: "--total-shards=8 --shard-index=4"
          - label: app-6
            shard: "--total-shards=8 --shard-index=5"
          - label: app-7
            shard: "--total-shards=8 --shard-index=6"
          - label: app-8
            shard: "--total-shards=8 --shard-index=7"
          - label: other-packages
            shard: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up flutter (stable channel)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      # media_kit's Linux backend dlopens the system's libmpv at runtime,
      # never linked at build time (see packaging/rpm/slim-m-client.spec's own
      # comment on this), so `flutter test` here needs it present the same
      # way the runner already carries libgtk/libsecret for other plugins.
      # The runtime library, not -dev: the tests only dlopen libmpv.so.2, and -dev pulls roughly twice the packages (measured with apt-get -s on ubuntu:24.04: 413 against 213). Bounded because an apt stall here once ate the whole job timeout.
      - name: libmpv (media_kit's native video backend on Linux)
        timeout-minutes: 6
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libmpv2

      - uses: ./.github/actions/native-hooks-cache

      # --enforce-lockfile, for the same reason the Rust side builds --locked:
      # without it the committed lockfile is advisory and CI can silently
      # resolve versions nobody committed.
      - name: resolve workspace dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile

      - name: packages/app (sharded)
        if: matrix.label != 'other-packages'
        working-directory: client/packages/app
        run: flutter test ${{ matrix.shard }}

      # Every package with a test/ directory EXCEPT app, which the shards above
      # own. The exclusion is by name here and the shards are named explicitly,
      # so a new package joins this leg automatically rather than being silently
      # untested - the failure mode a hand-listed matrix would have.
      #
      # Goldens run inside these suites, not a job of their own, and only ever on
      # this channel and runner. design_system's pixel comparison turns itself
      # on once reference PNGs exist under its test/goldens/; see docs/ci.md
      # and update-golden-references below for how those get there.
      - name: every other workspace package
        if: matrix.label == 'other-packages'
        working-directory: client
        run: |
          set -euo pipefail
          status=0
          for pkg in . packages/*/; do
            dir="${pkg%/}"
            if [ "$dir" = "packages/app" ]; then
              continue
            fi
            if [ -d "$dir/test" ]; then
              define=""
              if [ "$dir" = "packages/design_system" ] && [ -n "$(ls -A "$dir/test/goldens" 2>/dev/null)" ]; then
                define="--dart-define=SLIMM_GOLDENS=true"
              fi
              echo "::group::flutter test - $dir"
              (cd "$dir" && flutter test $define) || status=$?
              echo "::endgroup::"
            fi
          done
          exit "$status"

      - {if: failure(), uses: ./.github/actions/native-hooks-diagnose}

  # Keeps the check-run name release.yml's verify-client-ci waits on. It gates
  # on every shard above, so a red shard leaves this skipped rather than
  # successful and the release gate still refuses the commit.
  test-web:
    name: test and web build
    needs: [test-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up flutter (stable channel)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - uses: ./.github/actions/native-hooks-cache

      - name: resolve workspace dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile

      # dart2js resolves conditional imports that `dart analyze` never does:
      # a symbol present in one branch of a `dart.library.js_interop` export
      # and missing from the other compiles fine here and fails only on web.
      # That is exactly how main shipped a web build that could not compile,
      # with analyze, format and every test green.
      - name: web compiles
        working-directory: client/packages/app
        run: flutter build web --release

      - {if: failure(), uses: ./.github/actions/native-hooks-diagnose}

  # Dart compiled to JavaScript, which the VM suites cannot see: see docs/ci.md, `client-ci`.
  test-chrome:
    name: logic tests under dart2js (chrome ${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Two legs: one job took 20.6 minutes at the median (p90 21.1, max 21.8, 38 runs), the critical path of the workflow.
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: 1
            shard: "--total-shards=2 --shard-index=0"
          - leg: 2
            shard: "--total-shards=2 --shard-index=1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up flutter (stable channel)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: resolve workspace dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile

      - name: flutter test --platform chrome
        env:
          CHROME_SHARD: ${{ matrix.shard }}
        run: scripts/chrome-tests.sh

  # A native desktop plugin's own CMake is invisible to analyze, test and the
  # web build alike: adding audioplayers put a gstreamer-1.0 pkg-config
  # requirement into the Linux build that nothing on a pull request compiled,
  # so main went red on merge and stayed red for five merges before a release
  # missed its Linux artifacts entirely. Its own job rather than a step above,
  # so it runs in parallel and its apt cost is not paid by every other check.
  linux-compiles:
    name: linux desktop compiles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: linux build deps
        uses: ./.github/actions/linux-build-deps

      - name: set up flutter (stable channel)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - uses: ./.github/actions/native-hooks-cache

      - name: resolve workspace dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile

      - name: linux compiles
        working-directory: client/packages/app
        run: flutter build linux --release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-desktop-shell-smoke-bundle
          path: client/packages/app/build/linux/x64/release/bundle
          if-no-files-found: error

      - {if: failure(), uses: ./.github/actions/native-hooks-diagnose}

  # decision 0012's own substitute for "does the desktop window shell run at
  # all": starts the real release binary under Xvfb (a virtual, off-screen X
  # server on this runner, never a real display) and checks its own claims
  # about default geometry, saved geometry, and close no longer terminating
  # the process. What this can and cannot prove is in the decision record's
  # own "the constraint that shapes everything else" section - it is not a
  # substitute for the owner confirming the feature on his own desktop.
  linux-desktop-shell-smoke:
    name: linux desktop shell smoke (Xvfb)
    needs: [linux-compiles]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: linux-desktop-shell-smoke-bundle
          path: bundle

      # linux-compiles builds with -dev packages on its own runner; this job only downloads the binary, so it needs the matching runtime libs named explicitly.
      # libmpv2 and libepoxy0 are new with media_kit_video: its own plugin links against both (confirmed via readelf on the built .so), so the app cannot even load its plugins - never mind play a video - without them present.
      - name: xvfb, window-manipulation tools, dbus, and the binary's runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb fluxbox wmctrl xdotool libgl1-mesa-dri mesa-utils \
            libgtk-3-0 libsecret-1-0 libgstreamer1.0-0 dbus-daemon \
            libgstreamer-plugins-base1.0-0 libayatana-appindicator3-1 libpulse0 \
            libmpv2 libepoxy0

      - name: chmod the downloaded binary
        run: chmod +x bundle/slimm_app

      # A private session bus, or GApplication's single-instance
      # registration cannot happen and the second-launch check below would
      # pass by accident rather than by exercising the real D-Bus path.
      - name: run the smoke script under a private session bus
        run: dbus-run-session -- scripts/desktop-shell-smoke.sh "$(pwd)/bundle"

  # One-time (or after a real design change) bootstrap for design_system's
  # golden references: runs only on workflow_dispatch, on the exact channel,
  # Flutter version and runner the test job above uses, so the PNGs it writes
  # are the ones that job will actually diff against. It cannot commit them
  # itself; a human downloads the artifact and commits its contents into
  # client/packages/design_system/test/goldens/. See docs/ci.md.
  update-golden-references:
    name: generate golden references (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up flutter (stable channel)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - uses: ./.github/actions/native-hooks-cache

      - name: resolve workspace dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile

      - name: generate references
        working-directory: client/packages/design_system
        run: flutter test --update-goldens --dart-define=SLIMM_GOLDENS=true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-references
          path: client/packages/design_system/test/goldens
          if-no-files-found: error

      - {if: failure(), uses: ./.github/actions/native-hooks-diagnose}

  # The iOS half lives in client-ios-ci.yml. It costs 14 minutes on a macOS
  # runner against 5 for everything here, so it is gated on the paths that can
  # actually change its answer rather than on any client change at all.

