name: client-windows-ci
# Compile-only and not required: a green run proves the plugin graph links, not that the app works on Windows (docs/ci.md).
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "packaging/windows/**"
      - ".github/workflows/client-windows-ci.yml"
      - ".github/actions/**"
      # A release-please bump touches these three only; a real dependency change still runs through the lock file.
      - "!client/CHANGELOG.md"
      - "!client/pubspec.yaml"
      - "!client/packages/app/pubspec.yaml"
  # Also nightly and by hand, and off pull requests: it gates nothing, so a PR push should not take a slot for it.
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-windows-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows-compiles:
    name: windows desktop compiles
    runs-on: windows-latest
    env:
      # firebase_cpp_sdk_windows vendors a pre-3.5 cmake_minimum_required CMake 4.x (windows-latest's default) refuses outright; this is CMake's own documented escape hatch, not a slim-m bug.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      # flutter_local_notifications_windows 1.0.3's <experimental/coroutine> use is a hard C2338 on this runner's newer MSVC; CL is MSVC's own env var for a define applied to every compile, the same shape as the policy floor above.
      CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: set up flutter (stable channel)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - uses: ./.github/actions/native-hooks-cache

      - name: resolve workspace dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile

      # Debug build: this job catches native plugin link failures, not shippable artifacts; release packaging is unscheduled.
      - name: windows compiles
        working-directory: client/packages/app
        run: flutter build windows --debug

      # Go's own test run, since the launcher is the one native piece the updater depends on (decision 0041).
      - name: launcher tests
        working-directory: packaging/windows/launcher
        run: |
          go vet ./...
          go test ./...

      - {if: failure(), uses: ./.github/actions/native-hooks-diagnose}
