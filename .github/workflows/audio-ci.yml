name: audio-ci
# Regenerates the notification WAVs and fails on drift or on the set not being level with itself (docs/ci.md).
on:
  push:
    branches: [main]
    paths:
      - "assets/audio/**"
      - "client/packages/app/assets/audio/**"
      - ".github/workflows/audio-ci.yml"
  pull_request:
    paths:
      - "assets/audio/**"
      - "client/packages/app/assets/audio/**"
      - ".github/workflows/audio-ci.yml"

permissions:
  contents: read

concurrency:
  group: audio-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  sounds:
    name: the sounds rebuild to the same bytes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Pinned to what generated the committed WAVs, interpreter included, since a float difference is a different WAV.
      - name: install the generator's dependencies
        # --only-binary so no sdist runs its setup code on the runner.
        run: |
          pip install --only-binary :all: "numpy==2.4.6" "pyloudnorm==0.2.0"

      - name: the family's own checks
        run: python3 -m unittest discover -s assets/audio -v

      - name: regenerate, and fail on any drift
        run: |
          set -euo pipefail
          python3 assets/audio/generate.py
          if [ -n "$(git status --porcelain -- assets/audio)" ]; then
            git status --short -- assets/audio
            echo "::error::a committed sound does not match what the code makes"
            exit 1
          fi
          echo "every sound rebuilt to the bytes that are committed"
