#
# apt-get install with bounded attempts and a fallback mirror; see scripts/apt-install.sh.

name: apt install
description: Install apt packages from a cache of their .debs, else retrying from archive.ubuntu.com if the runner's mirror stalls.

inputs:
  packages:
    description: Space-separated package names.
    required: true

runs:
  using: composite
  steps:
    # Image vars are runner env, so a step reads them; one deb directory per package list, since a shared one made a second install reuse the first's debs.
    - id: image
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        echo "version=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TEMP/apt-debs-$(printf '%s' "$PACKAGES" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
    # Keyed on the runner image so a new image resolves its own dependency versions instead of installing stale ones.
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.image.outputs.dir }}
        key: apt-debs-${{ runner.os }}-${{ steps.image.outputs.version }}-${{ inputs.packages }}-v1
    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        APT_DEB_CACHE: ${{ steps.image.outputs.dir }}
      run: |
        read -ra pkgs <<<"$PACKAGES"
        "$GITHUB_WORKSPACE/scripts/apt-install.sh" "${pkgs[@]}"
