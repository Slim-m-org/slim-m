#
# apt-get install with bounded attempts and a fallback mirror; see scripts/apt-install.sh.

name: apt install
description: Install apt packages, retrying from archive.ubuntu.com if the runner's mirror stalls.

inputs:
  packages:
    description: Space-separated package names.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        read -ra pkgs <<<"$PACKAGES"
        "$GITHUB_WORKSPACE/scripts/apt-install.sh" "${pkgs[@]}"
