#
# GPG_PRIVATE_KEY and GPG_PASSPHRASE come from the calling job's env and are optional; secrets and needs are not readable here, so the rest arrive as inputs.
name: release linux client
description: Build the Linux tarball, flatpak and rpm, checksum, sign and attach them to the client release.

inputs:
  version:
    description: client version, from release-please's client_version output
    required: true
  tag:
    description: client release tag, from release-please's client_tag output
    required: true
  spotify_client_id:
    description: Spotify app id for rich presence; empty keeps the feature off
    required: false
    default: ''
  gh_token:
    description: token that attaches assets to the release
    required: true

runs:
  using: composite
  steps:
    # The same build and staging as main-builds and copr-catch-up, so the snapshot and the release tarball cannot drift. Published on every client release and gated on nothing. It is both the download for a user with no packaging, and the spec's Source0.
    - name: build linux tarball
      uses: ./.github/actions/linux-tarball
      with:
        version: ${{ inputs.version }}
        spotify_client_id: ${{ inputs.spotify_client_id }}

    # One gate per format, so a working rpm is not held back by the absence of a flatpak manifest. The tarball above ships either way.
    - name: check packaging inputs
      shell: "bash -e {0}"
      id: pkg
      run: |
        if [ -f packaging/flatpak/top.npcserver.slimm.yaml ]; then
          echo "flatpak=true" >> "$GITHUB_OUTPUT"
        else
          echo "flatpak=false" >> "$GITHUB_OUTPUT"
          echo "::warning::No packaging/flatpak/top.npcserver.slimm.yaml, so no Flatpak bundle is built. The portable tarball is published regardless."
        fi
        if [ -f packaging/rpm/slim-m-client.spec ]; then
          echo "rpm=true" >> "$GITHUB_OUTPUT"
        else
          echo "rpm=false" >> "$GITHUB_OUTPUT"
          echo "::warning::No packaging/rpm/slim-m-client.spec, so no rpm is built. The portable tarball is published regardless."
        fi

    # continue-on-error: this format has one real CI run behind it versus the rpm's dozens; see packaging/flatpak/README.md. librsvg2-common provides the gdk-pixbuf SVG loader `flatpak build-export` needs on this host to validate exported icons; without it a valid SVG fails export with "Format not recognized". See packaging/flatpak/README.md.
    - name: install flatpak and its build tools
      if: steps.pkg.outputs.flatpak == 'true'
      continue-on-error: true
      uses: ./.github/actions/apt-install
      with:
        packages: flatpak flatpak-builder elfutils librsvg2-common

    - name: build flatpak
      shell: "bash -e {0}"
      if: steps.pkg.outputs.flatpak == 'true'
      continue-on-error: true
      run: |
        flatpak remote-add --user --if-not-exists flathub \
          https://flathub.org/repo/flathub.flatpakrepo
        flatpak-builder --user --install-deps-from=flathub --force-clean \
          --repo=dist/flatpak-repo build-dir \
          packaging/flatpak/top.npcserver.slimm.yaml
        flatpak build-bundle dist/flatpak-repo \
          "dist/slim-m-client-${{ inputs.version }}.flatpak" \
          top.npcserver.slimm

    # In a Fedora container, not on the runner: the spec is written against Fedora's macros and dependency generators, and Ubuntu's rpm has neither.
    - name: build rpm
      shell: "bash -e {0}"
      if: steps.pkg.outputs.rpm == 'true'
      env:
        VER: ${{ inputs.version }}
      run: |
        docker run --rm -v "${PWD}:/w" -w /w -e VER fedora:44 bash -eo pipefail -c '
          dnf -y install rpm-build patchelf desktop-file-utils tar gzip >/dev/null
          mkdir -p rpmbuild/SOURCES
          cp dist/slim-m-client-*-linux-amd64.tar.gz \
            packaging/rpm/top.npcserver.slimm.desktop packaging/rpm/slim-m-client.repo \
          packaging/rpm/slim-m-client-update-helper packaging/rpm/top.npcserver.slimm.update.policy \
            packaging/linux/icons/top.npcserver.slimm*.png \
            packaging/linux/icons/top.npcserver.slimm.svg rpmbuild/SOURCES/
          # The same stamp the copr job applies, so the .rpm on the release and the one COPR builds carry the same version as the tag.
          sed "s/^Version:.*/Version:        ${VER}/" \
            packaging/rpm/slim-m-client.spec > rpmbuild/slim-m-client.spec
          rpmbuild -bb --define "_topdir /w/rpmbuild" --define "_rpmdir /w/dist" \
            rpmbuild/slim-m-client.spec
        '

    - name: checksums
      shell: "bash -e {0}"
      working-directory: dist
      run: |
        shopt -s nullglob
        sha256sum -- slim-m-client-*-linux-amd64.tar.gz *.flatpak > SHA256SUMS
        # The rpm is attached by basename, so it is listed by basename too.
        for rpm in */*.rpm; do
          printf '%s  %s\n' "$(sha256sum < "$rpm" | cut -d' ' -f1)" "${rpm##*/}" >> SHA256SUMS
        done
        cat SHA256SUMS

    - name: sign checksums (optional)
      shell: "bash -e {0}"
      working-directory: dist
      run: |
        [ -n "$GPG_PRIVATE_KEY" ] || { echo "no GPG key configured; the checksums stay unsigned"; exit 0; }
        echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        gpg --batch --pinentry-mode loopback --passphrase-fd 0 <<< "$GPG_PASSPHRASE" \
          --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS

    - name: attach to the github release
      shell: "bash -e {0}"
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      run: |
        scripts/upload-release-assets.sh "${{ inputs.tag }}" \
          'dist/slim-m-client-*-linux-amd64.tar.gz' \
          '?dist/*.flatpak' '?dist/*/*.rpm' \
          dist/SHA256SUMS '?dist/SHA256SUMS.asc'

    # Last and unconditional on earlier failures, so a missing bundle turns the run red after everything else has attached.
    - name: verify flatpak bundle was produced
      shell: "bash -e {0}"
      if: always() && steps.pkg.outputs.flatpak == 'true'
      run: |
        shopt -s nullglob
        bundles=(dist/slim-m-client-*.flatpak)
        if [ ${#bundles[@]} -eq 0 ]; then
          echo "::error::build flatpak did not produce a .flatpak bundle; see its logs for the real failure"
          exit 1
        fi
