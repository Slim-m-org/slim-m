#
# Needs, from the calling job's env: the App Store Connect key and the IOS_* signing secrets. The calling job checks them before this runs.
name: release ios testflight
description: Import the signing assets, build the ipa and upload it to TestFlight.

inputs:
  version:
    description: client version, from release-please's client_version output
    required: true
  spotify_client_id:
    description: Spotify app id for rich presence; empty keeps the feature off
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: import signing assets
      shell: "bash -e {0}"
      run: |
        KEYDIR="${HOME}/.appstoreconnect/private_keys"
        mkdir -p "$KEYDIR"
        printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" \
          > "${KEYDIR}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

        # A throwaway keychain, not the login one: it keeps the private key out of any shared default that later steps touch.
        CERT_PATH="${RUNNER_TEMP}/build_certificate.p12"
        PROFILE_PATH="${RUNNER_TEMP}/build_pp.mobileprovision"
        KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
        KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

        printf '%s' "$IOS_SIGNING_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
        printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
        BROADCAST_PROFILE_PATH="${RUNNER_TEMP}/build_pp_broadcast.mobileprovision"
        printf '%s' "$IOS_BROADCAST_PROVISIONING_PROFILE" \
          | base64 --decode > "$BROADCAST_PROFILE_PATH"
        NSE_PROFILE_PATH="${RUNNER_TEMP}/build_pp_nse.mobileprovision"
        printf '%s' "$IOS_NSE_PROVISIONING_PROFILE" | base64 --decode > "$NSE_PROFILE_PATH"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$CERT_PATH" -P "$IOS_SIGNING_CERTIFICATE_PASSWORD" \
          -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        # Without this, codesign prompts for permission and hangs a headless run.
        security set-key-partition-list -S apple-tool:,apple: \
          -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
        security list-keychain -d user -s "$KEYCHAIN_PATH"

        # xcodebuild finds a profile by its UUID under this directory, so the file has to be named for the UUID embedded in its own signed plist. One per bundle: the app and both extensions are signed separately, and a missing extension profile fails the export naming only that bundle id.
        PROFILE_DIR="${HOME}/Library/MobileDevice/Provisioning Profiles"
        mkdir -p "$PROFILE_DIR"
        INSTALLED=""
        for pp in "$PROFILE_PATH" "$BROADCAST_PROFILE_PATH" "$NSE_PROFILE_PATH"; do
          UUID="$(security cms -D -i "$pp" | plutil -extract UUID raw -o - -)"
          NAME="$(security cms -D -i "$pp" | plutil -extract Name raw -o - -)"
          cp "$pp" "${PROFILE_DIR}/${UUID}.mobileprovision"
          echo "installed profile ${NAME} (${UUID})"
          INSTALLED="${INSTALLED}${NAME}\n"
        done

        # Fail here rather than at export. xcodebuild matches these names literally and its own error names only a bundle id, which sends you looking at the wrong thing. No pipe into the loop: a `while` on the right of a pipe runs in a subshell, so its exit would not fail this step.
        EXPORT_OPTIONS=client/packages/app/ios/ExportOptions.plist
        /usr/libexec/PlistBuddy -c "Print :provisioningProfiles" "$EXPORT_OPTIONS" \
          | sed -n 's/^ *[^ ]* = \(.*\)$/\1/p' > "${RUNNER_TEMP}/wanted_profiles"
        printf '%b' "$INSTALLED" > "${RUNNER_TEMP}/installed_profiles"
        missing=0
        while read -r want; do
          [ -n "$want" ] || continue
          grep -qxF "$want" "${RUNNER_TEMP}/installed_profiles" || {
            echo "::error::ExportOptions names profile '${want}', which is not installed"
            missing=1
          }
        done < "${RUNNER_TEMP}/wanted_profiles"
        [ "$missing" -eq 0 ] || exit 1

        # Name the identity codesign can actually see: a downstream failure otherwise says only "no valid code signing certificates were found".
        echo "signing identities available to codesign:"
        security find-identity -v -p codesigning "$KEYCHAIN_PATH"

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        flutter-version: 3.47.0

    - uses: ./.github/actions/native-hooks-cache
    - name: build ipa
      shell: "bash -e {0}"
      env:
        SLIMM_SPOTIFY_CLIENT_ID: ${{ inputs.spotify_client_id }}
      working-directory: client/packages/app
      run: |
        # --enforce-lockfile: resolve exactly what pubspec.lock pins.
        flutter pub get --enforce-lockfile
        # Build number from the run number and build name from the tag, never from pubspec. Both stores reject a reuse; see docs/ci.md.
        flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --dart-define=SLIMM_SPOTIFY_CLIENT_ID="${SLIMM_SPOTIFY_CLIENT_ID}" \
          --build-name=${{ inputs.version }} \
          --build-number=${{ github.run_number }}

    - name: upload to TestFlight
      shell: "bash -e {0}"
      working-directory: client/packages/app
      run: |
        ipa=(build/ios/ipa/*.ipa)
        xcrun altool --upload-app --type ios \
          --file "${ipa[0]}" \
          --apiKey "$APP_STORE_CONNECT_KEY_ID" \
          --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
