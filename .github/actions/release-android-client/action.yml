#
# Needs, from the calling job's env: ANDROID_UPLOAD_KEYSTORE_B64, ANDROID_KEY_PROPERTIES and ANDROID_GOOGLE_SERVICES_JSON. The calling job checks them before this runs. PLAY_SERVICE_ACCOUNT_JSON is optional: empty skips the Play upload.
name: release android client
description: Build the upload-signed apk and appbundle, verify the signer, attach the apk to the client release, and upload the appbundle to Play internal testing.

inputs:
  version:
    description: client version, from release-please's client_version output
    required: true
  tag:
    description: client release tag, from release-please's client_tag output
    required: true
  spotify_client_id:
    description: Spotify app id for rich presence; empty keeps the feature off
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: write signing assets
      shell: "bash -e {0}"
      run: |
        printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" \
          > client/packages/app/android/app/google-services.json
        printf '%s' "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 -d \
          > client/packages/app/android/app/upload-keystore.jks
        printf '%s' "$ANDROID_KEY_PROPERTIES" \
          > client/packages/app/android/key.properties

    - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
      with:
        distribution: temurin
        # The LTS the Android Gradle Plugin supports; local builds match.
        java-version: "21"
        cache: gradle

    - uses: ./.github/actions/gradle-mirror

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        flutter-version: 3.47.0

    - uses: ./.github/actions/native-hooks-cache
    - name: build android release
      shell: "bash -e {0}"
      env:
        SLIMM_SPOTIFY_CLIENT_ID: ${{ inputs.spotify_client_id }}
      working-directory: client/packages/app
      run: |
        # --enforce-lockfile: resolve exactly what pubspec.lock pins.
        flutter pub get --enforce-lockfile
        # Build number from the run number, name from the tag (stores reject a reuse); SLIMM_PLAY_BUILD drops the apk updater from Play's build. See docs/ci.md.
        flutter build appbundle --release --dart-define=SLIMM_SPOTIFY_CLIENT_ID="${SLIMM_SPOTIFY_CLIENT_ID}" \
          --dart-define=SLIMM_PLAY_BUILD=true \
          --build-name=${{ inputs.version }} \
          --build-number=${{ github.run_number }}
        # One apk per ABI: the fat one carried every ABI and weighed 189 MB. The appbundle above is untouched; Play splits it itself.
        flutter build apk --release --split-per-abi --dart-define=SLIMM_SPOTIFY_CLIENT_ID="${SLIMM_SPOTIFY_CLIENT_ID}" \
          --build-name=${{ inputs.version }} \
          --build-number=${{ github.run_number }}

    - uses: ./.github/actions/verify-android-signer

    # Play restricts this permission and the Play build never installs apks; fail before anything is uploaded.
    - name: verify the appbundle drops the install permission
      shell: "bash -e {0}"
      working-directory: client/packages/app
      run: |
        if unzip -p build/app/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml \
            | grep -a -q REQUEST_INSTALL_PACKAGES; then
          echo "::error::the appbundle still requests REQUEST_INSTALL_PACKAGES"
          exit 1
        fi

    - name: checksums
      shell: "bash -e {0}"
      working-directory: client/packages/app
      run: |
        mkdir -p dist
        for abi in arm64-v8a armeabi-v7a x86_64; do
          cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
            "dist/slim-m-client-android-${abi}.apk"
        done
        cp build/app/outputs/bundle/release/app-release.aab \
          "dist/slim-m-client-android.aab"
        (cd dist && sha256sum -- slim-m-client-android-*.apk > SHA256SUMS.android)

    - uses: ./.github/actions/record-asset-digests
      with:
        tag: ${{ inputs.tag }}
        label: android
        files: |
          client/packages/app/dist/slim-m-client-android-arm64-v8a.apk
          client/packages/app/dist/slim-m-client-android-armeabi-v7a.apk
          client/packages/app/dist/slim-m-client-android-x86_64.apk

    # No aab: a Play upload format testers download by mistake; docs/INSTALL.md.
    - name: attach to the github release
      shell: "bash -e {0}"
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        scripts/upload-release-assets.sh "${{ inputs.tag }}" \
          'client/packages/app/dist/slim-m-client-android-*.apk' \
          client/packages/app/dist/SHA256SUMS.android

    - name: skip the play upload
      if: env.PLAY_SERVICE_ACCOUNT_JSON == ''
      shell: "bash -e {0}"
      run: echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not configured; skipping the Google Play internal testing upload."

    # After the apk attach, so a Play failure fails the job without costing the release its apk.
    - name: upload to google play internal testing
      if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
      uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
      with:
        serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: top.npcserver.slimm
        releaseFiles: client/packages/app/dist/slim-m-client-android.aab
        tracks: internal
        status: completed
        releaseName: ${{ inputs.version }}
