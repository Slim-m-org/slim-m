#
# Builds the Linux client and stages dist/slim-m-client-<version>-linux-amd64.tar.gz.
# Shared by main-builds.yml's linux-client, copr-catch-up.yml and release.yml's linux-client,
# so the snapshot and the release feed copr-publish.yml the identical tarball, whose name matches the spec's Source0.
name: linux-tarball
description: Build the Linux client release bundle and stage its portable tarball into dist/

inputs:
  version:
    description: client/pubspec.yaml version, used in the tarball name
    required: true
  spotify_client_id:
    description: Spotify app id for rich presence; empty keeps the feature off
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: linux build deps
      uses: ./.github/actions/linux-build-deps

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        flutter-version: 3.47.0

    - uses: ./.github/actions/native-hooks-cache

    - name: build linux release
      shell: bash
      env:
        SLIMM_SPOTIFY_CLIENT_ID: ${{ inputs.spotify_client_id }}
      working-directory: client/packages/app
      run: |
        flutter config --enable-linux-desktop
        dart pub get --enforce-lockfile
        flutter build linux --release --dart-define=SLIMM_SPOTIFY_CLIENT_ID="${SLIMM_SPOTIFY_CLIENT_ID}"

    - name: stage portable tarball
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        name="slim-m-client-${VERSION}"
        bundle="client/packages/app/build/linux/x64/release/bundle"
        if [ ! -x "${bundle}/slimm_app" ]; then
          echo "::error::no linux bundle at ${bundle}"
          exit 1
        fi
        mkdir -p "stage/${name}" dist
        cp -a "${bundle}/." "stage/${name}/"
        cp LICENSES/LicenseRef-PolyForm-Noncommercial-1.0.0.txt "stage/${name}/LICENSE"
        cp packaging/linux/README.md packaging/linux/slim-m packaging/linux/install.sh "stage/${name}/"
        tar -C stage -czf "dist/${name}-linux-amd64.tar.gz" "${name}"
