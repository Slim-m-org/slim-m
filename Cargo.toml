[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Slim-m-org/slim-m"

# Shared dependency versions live here so every crate stays in lockstep.
# Why each crate and feature set is what it is: docs/dependencies.md.
[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "sync", "time", "fs"] }
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "catch-panic"] }
# Splitting a WebSocket into independent read and write halves (StreamExt/SinkExt).
futures-util = "0.3"
# Streams a std/tokio file as an axum response body without buffering it (ReaderStream).
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
envy = "0.4"
uuid = { version = "1", features = ["v7", "v5"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "uuid"] }
anyhow = "1"
# Auth primitives: Argon2id hashing, SHA-256 token hashing, URL-safe base64.
# All long-established audited crates, not fresh single-maintainer projects.
argon2 = "0.5"
sha2 = "0.10"
# HMAC-SHA256 for the LiveKit access tokens, which are HS256 JWTs. Signed here
# and never verified, so a full JWT library would be dead parsing code.
hmac = "0.12"
base64 = "0.22"
# `getrandom` turns on rand_core's OsRng, the entropy behind both the Argon2
# salt and the opaque token secrets, unifying onto argon2's own rand_core.
rand_core = { version = "0.6", features = ["getrandom"] }
# RFC 6238 TOTP (decision 0047). The 5.x hold and the feature cuts are both load-bearing; see docs/dependencies.md.
totp-rs = { version = "5.7", default-features = false, features = ["otpauth"] }
# Anonymous sealed boxes for the content-free push envelope. Exact-pinned
# because the `seal` API is still pre-release; see docs/dependencies.md.
crypto_box = { version = "=0.10.0-pre.0", features = ["seal"] }
# The push relay HTTP client. `rustls-tls` so the static musl binary and the
# distroless image never need OpenSSL; see docs/dependencies.md.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Transitive through reqwest; named so the relay URL's scheme and host can be
# validated at startup without hand-rolled parsing.
url = "2"
# The server's trust-on-first-use identity keypair. Feature cuts and the 2.x
# version hold are both load-bearing; see docs/dependencies.md.
ed25519-dalek = { version = "2.2", default-features = false, features = ["zeroize"] }
# Pure-Rust WASM interpreter for the module runtime host (decision 0021,
# Phase 3): no JIT, small binary footprint, and fuel metering for CPU limits.
# Chosen over wasmtime specifically to protect the release-binary size budget.
wasmi = "0.51"
# IANA-timezone-aware datetime arithmetic for the notification schedule
# (decision 0033): `tzdb-bundle-always` embeds the whole tz database in the
# binary, since the distroless release image ships no /usr/share/zoneinfo.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always", "serde"] }

[profile.dev]
# Line tables, not full DWARF. This crate builds 154 integration test files
# into 154 separate binaries, each statically linking the whole crate and its
# dependency tree, and measured on this tree full debug info was 78% of every
# one of them: a single test binary was 233 MB, and 52 MB once stripped. That
# put target/ at 84 GB, which is paid again in link time on every
# `cargo test --all` and again per agent worktree.
#
# `line-tables-only` keeps the file and line in a panic backtrace, which is
# what a failing test is actually read for. What it drops is variable and
# type DWARF, which only an interactive debugger consumes; a developer who
# wants that can build with `RUSTFLAGS=-Cdebuginfo=2` for the run they need
# it, rather than every build paying for it forever.
debug = "line-tables-only"

[profile.release]
# Small, fast self-host binary: the brief treats binary size as a budget.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Unwind so a request panic answers 500; any other panic still aborts (http::panic_guard).
panic = "unwind"
