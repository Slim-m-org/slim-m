# SPDX-License-Identifier: LicenseRef-PolyForm-Noncommercial-1.0.0
#
# The dependency-license allowlist, and the only copy of it.
# cargo-deny reads this file for the Rust tree and
# scripts/check-dart-licenses.py reads the same [licenses] table for the Dart
# tree, so the two ecosystems cannot drift onto different policies.
# Every allowed license below is permissive and imposes no source-disclosure
# or copyleft obligation on slim-m, which is not open source and could not
# satisfy one; anything else
# fails the gate and wants a human decision, one named package at a time.
# Why each exception is here, and why advisories and bans are not configured,
# is in docs/ci.md.

[graph]
all-features = true

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "Unicode-3.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
  # jpeg-decoder (media compression): a permissive BSD-style notice-only license.
  "IJG",
]
confidence-threshold = 0.9
# A license only the Dart half uses is not an unused Rust allowance.
unused-allowed-license = "allow"

# slim-m's own crate is named here rather than allowed outright, so the allowlist stays about third parties.
[[licenses.exceptions]]
name = "slimm-server"
allow = ["LicenseRef-PolyForm-Noncommercial-1.0.0"]

# MPL-2.0 is per-file copyleft and reaches neither client; see docs/ci.md.
[[licenses.exceptions]]
name = "dbus"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "nm"
allow = ["MPL-2.0"]

# Dart pub package behind app_links_linux's GTK binding: per-file copyleft we use unmodified, like dbus and nm above.
[[licenses.exceptions]]
name = "gtk"
allow = ["MPL-2.0"]

# Advisories run on a schedule in advisory-watchdog.yml, not per PR (docs/ci.md); an `ignore` entry is a dated decision, never a way to quiet it.
[advisories]
ignore = [
  # 2026-10-26: unmaintained, not a vulnerability; pulled by lopdf for font handling, revisit when lopdf can be upgraded past the cipher pin.
  "RUSTSEC-2026-0192",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
