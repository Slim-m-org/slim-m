# The litestream profile's config; litestream fills the ${...} values from the container's environment (deploy/README.md, Backups).
dbs:
  - path: /data/slimm.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_S3_BUCKET}
        path: ${LITESTREAM_S3_PATH}
        endpoint: ${LITESTREAM_S3_ENDPOINT}
        region: ${LITESTREAM_S3_REGION}
