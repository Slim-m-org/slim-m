[package]
name = "slimm-server"
version = "0.82.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "slim-m home server (Phase 0 foundation skeleton)"

[lib]
name = "slimm_server"
path = "src/lib.rs"

[[bin]]
name = "slimm-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
envy.workspace = true
uuid.workspace = true
sqlx.workspace = true
anyhow.workspace = true
argon2.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
rand_core.workspace = true
totp-rs.workspace = true
futures-util.workspace = true
tokio-util.workspace = true
crypto_box.workspace = true
reqwest.workspace = true
url.workspace = true
ed25519-dalek.workspace = true
wasmi.workspace = true
jiff.workspace = true
# `util` for ServiceExt::oneshot (http/capability.rs), `limit` for the concurrency bound; named explicitly, not via feature unification.
tower = { version = "0.5", features = ["util", "limit"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Compiles hand-written WAT fixtures at test time so their behavior is readable in the test.
wat = "1"
# A real client for the fan-out test; the round-trip tests use tower above.
tokio-tungstenite = "0.24"
# Validates responses against schema/openapi.yaml in tests/response_contract.rs; default-features cut is deliberate (docs/dependencies.md).
jsonschema = { version = "0.49", default-features = false }
# Maintained fork of the archived serde_yaml, used only to load the schema for the validator.
serde_yaml_ng = "0.10"

[[bench]]
name = "hot_paths"
harness = false

[lints.clippy]
# Componentization and clarity are enforced, not just encouraged.
all = { level = "warn", priority = -1 }
