#
# Production self-host example for slim-m: a small friend-group deployment.
#
# Three services:
#   server     the slim-m home server (this repo's binary), embedded
#              SQLite on a named volume, reachable only through Caddy.
#   caddy      the only thing bound to 443. Terminates TLS automatically
#              (Let's Encrypt) for the API domain.
#   litestream continuously streams the SQLite file to S3-compatible
#              storage. Disabled by default (see deploy/.env.example);
#              enable it once you have a real bucket.
#
# Text chat is the whole of this file, and that is a complete deployment. The
# server treats a missing SFU as a normal configuration rather than an error
# (see SLIMM_LIVEKIT_* below), so a friend group who only want to talk in text
# need no LiveKit keys and no second DNS record.
#
# Voice and screen share are an overlay: docker-compose.voice.yml adds the
# LiveKit service and the Caddy site that fronts its signaling. Turn it on with
# one line in your .env -
#
#     COMPOSE_FILE=docker-compose.yml:docker-compose.voice.yml
#
# - after which `docker compose up -d` brings up both. deploy/README.md walks
# through it, including the two DNS records and generating the keys.
#
# Copy deploy/.env.example to `.env` next to this file and fill it in before
# running `docker compose up -d`. See deploy/README.md for the full
# walkthrough.

# Shared container hardening: read-only root, no capabilities, no new privileges (deploy/README.md).
x-hardened: &hardened
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  server:
    <<: *hardened
    # Set SLIMM_VERSION in .env to pin a release, and bump it on every upgrade:
    # a stale tag predates every security fix since. See deploy/README.md.
    image: ghcr.io/slim-m-org/slim-m-server:${SLIMM_VERSION:-latest}
    restart: unless-stopped
    environment:
      SLIMM_LOG: ${SLIMM_LOG:-info}
      # Empty means no CORS layer at all and every cross-origin browser request
      # refused. Only a web build on another origin needs it; deploy/README.md.
      SLIMM_CORS_ALLOWED_ORIGINS: ${SLIMM_CORS_ALLOWED_ORIGINS:-}
      # 1 because Caddy is the one proxy in front of this. Unset means the TCP
      # peer is trusted instead, which behind any proxy puts every
      # unauthenticated caller in one rate-limit bucket; deploy/README.md.
      SLIMM_TRUST_PROXY_HOPS: ${SLIMM_TRUST_PROXY_HOPS:-1}
      # Empty means the key lives in /data/slimm-data.key; docs/OPERATING.md, The data key.
      SLIMM_DATA_KEY: ${SLIMM_DATA_KEY:-}
      SLIMM_MAX_TOTAL_ATTACHMENT_BYTES: ${SLIMM_MAX_TOTAL_ATTACHMENT_BYTES:-}
      # Empty means no floor; the server reads an empty value as unset.
      SLIMM_MIN_CLIENT_VERSION: ${SLIMM_MIN_CLIENT_VERSION:-}
      SLIMM_DIRECT_ADDRESSES: ${SLIMM_DIRECT_ADDRESSES:-}
      # Both unset means no GIF search at all, and no client-facing button for
      # it; deploy/README.md.
      SLIMM_GIF_PROVIDER: ${SLIMM_GIF_PROVIDER:-}
      SLIMM_GIF_API_KEY: ${SLIMM_GIF_API_KEY:-}
      # Off by default: unfurling makes the server fetch member-supplied URLs
      # (behind the SSRF guard, decision 0019). Set true to show link previews.
      SLIMM_LINK_PREVIEWS: ${SLIMM_LINK_PREVIEWS:-false}
      # No SLIMM_LIVEKIT_* here on purpose, and absent rather than empty: the
      # server reads an unset trio as "no SFU" and answers 501 for every voice
      # request, which is a supported way to run this rather than a broken one.
      # Setting them to "" would NOT be the same thing - envy deserializes an
      # empty var as Some(""), so the voice gate would light up on three blank
      # strings and the server would refuse to start. docker-compose.voice.yml
      # adds all three with `:?`; see deploy/README.md.
    # The server writes only under /data (the volume below); /tmp is scratch.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      # The whole directory is the volume (SLIMM_DATABASE_PATH defaults to
      # /data/slimm.db) so Litestream can see the database file and its WAL.
      - slimm_data:/data
    # The image already ships a HEALTHCHECK that runs the server's own
    # `--healthcheck` subcommand; no need to redeclare it here.
    expose:
      - "8080"
    # Measured, not guessed: see docs/sizing.md for the study these come from.
    # Two cores is the first quota that behaves rather than a capacity figure.
    # A quota is enforced by freezing the process for part of every scheduling
    # window, so at one core the server sat at three quarters of it while
    # delivering a 1.3 second median. Raising this above two buys lower latency
    # and no extra capacity, because the server never uses past about 1.5.
    # Memory is the dial worth turning with population: the floor is ~17 MB,
    # each connection adds ~144 KB, and the 1024-connection cap means
    # connection load alone cannot exceed ~166 MB. 512M suits a deployment
    # running up to that cap; 256M is ample for a friend group.
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          memory: 128M

  caddy:
    <<: *hardened
    # Binding 80 and 443 is the one capability Caddy keeps.
    cap_add:
      - NET_BIND_SERVICE
    # Scratch for the trust-store install of Caddy's local CA; Let's Encrypt never needs it.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    # Pinned to an exact release and its digest, so a repointed tag cannot
    # change what a fresh pull runs; check hub.docker.com/_/caddy/tags for newer patches.
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"       # ACME HTTP-01 challenge and plain-HTTP redirect
      - "443:443"     # HTTPS
      - "443:443/udp" # HTTP/3 (QUIC)
    environment:
      SLIMM_API_DOMAIN: ${SLIMM_API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # ACME account + issued certificates, must persist
      - caddy_config:/config
    healthcheck:
      # Caddy's local admin API, enabled by default and bound to localhost
      # inside the container - a reachable 2019 means Caddy has loaded a config.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  litestream:
    <<: *hardened
    # /data belongs to the server's user, and root without CAP_DAC_OVERRIDE cannot write there.
    user: "65532:65532"
    # Held on 0.3.x deliberately: 0.5 replaced the replica format (WAL segments
    # became LTX), so moving is a migration. See deploy/README.md.
    image: litestream/litestream:0.3.14@sha256:c5a1e1b01916b3a110f6600820ef176d048d9b9c2411ef0a680de0caa68934a5
    # Disabled by default - this whole service only starts when the
    # "litestream" profile is enabled (see deploy/.env.example).
    profiles:
      - litestream
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - slimm_data:/data
    environment:
      # Litestream reads these two exact variable names natively.
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    # No config file: endpoint and region ride as query parameters on the replica
    # URL, and 0.3.x auto-enables force-path-style whenever `endpoint` is set.
    command: >
      replicate /data/slimm.db
      "s3://${LITESTREAM_S3_BUCKET}/${LITESTREAM_S3_PATH:-slimm}?endpoint=${LITESTREAM_S3_ENDPOINT}&region=${LITESTREAM_S3_REGION:-auto}"

  web:
    <<: *hardened
    # nginx keeps its pid and temp files here.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    # Opt-in (COMPOSE_PROFILES=web); pinned by the same SLIMM_VERSION as the server, routed from your proxy: deploy/README.md.
    image: ghcr.io/slim-m-org/slim-m-web:${SLIMM_VERSION:-latest}
    profiles:
      - web
    restart: unless-stopped
    labels:
      # A host running Watchtower with label-enable follows this tag, as it does the server's.
      com.centurylinklabs.watchtower.enable: "true"
    expose:
      - "8080"

volumes:
  slimm_data:   # the embedded SQLite database
  caddy_data:   # Caddy's ACME account and issued certificates
  caddy_config: # Caddy's runtime config cache
