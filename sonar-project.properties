#
# SonarQube Cloud analysis scope, read by the CI-mode scan in
# .github/workflows/sonar.yml.
#
# Excluded: generated code (the fix is the generator, never the file), build
# output, the sqlx cache, and design/web, the React mirror of the design system
# for claude.ai/design, which never ships. Migrations are excluded too: sonar
# reads them with its Oracle PL/SQL rules, which do not apply to SQLite, and a
# migration on main can never be edited to satisfy one anyway.

sonar.projectKey=Slim-m-org_slim-m
sonar.organization=slim-m-org
sonar.projectName=slim-m
sonar.sourceEncoding=UTF-8

# Tests are scanned under test rules rather than counted as product code.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=\
  client/packages/*/test/**,\
  crates/*/tests/**,\
  scripts/lib/test_*.py,\
  **/*_test.go

# linux-portal-probe and scripts/research are standalone research tools run by hand, never shipped.
sonar.exclusions=\
  client/packages/*/test/**,\
  crates/*/tests/**,\
  scripts/lib/test_*.py,\
  **/*_test.go,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/generated_plugin_registrant.*,\
  **/build/**,\
  **/.dart_tool/**,\
  **/node_modules/**,\
  target/**,\
  .sqlx/**,\
  crates/slimm-server/migrations/**,\
  **/verification-metadata.xml,\
  design/**,\
  scripts/linux-portal-probe/**,\
  scripts/research/**

# Generated code and release-note data repeating their shape are not a maintenance signal.
sonar.cpd.exclusions=**/*.g.dart,\
  client/packages/app/lib/src/whats_new/whats_new_content*.dart

# Coverage is not reported yet, so the gate's coverage-on-new-code condition
# would fail every pull request; excluding everything from coverage leaves it
# with nothing to measure until coverage reports are wired in and this goes.
sonar.coverage.exclusions=**/*
# Developer scripts take their paths from the command line by design; the rule reads every such argument as an attacker.
sonar.issue.ignore.multicriteria.cli1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.cli1.resourceKey=scripts/**/*.py
# The e2e harness reads the X11 socket directory under /tmp to find a nested compositor display; it never writes there.
sonar.issue.ignore.multicriteria=cli1,x11
sonar.issue.ignore.multicriteria.x11.ruleKey=python:S5443
sonar.issue.ignore.multicriteria.x11.resourceKey=scripts/lib/e2e_*.py
