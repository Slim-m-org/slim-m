# Dart native pub workspace (no third-party monorepo manager).
# Each package resolves against this shared workspace.
name: slim_m_workspace
# release-please tracks the client version here; explicit so the first release is 0.1.0.
version: 0.112.1
publish_to: none
environment:
  sdk: ^3.10.0
# Workspace root only: livekit_client pins device_info_plus, capping win32 below file_picker's need; drop on livekit 13.x.
dependency_overrides:
  device_info_plus: ^13.2.0
  # Fork adds resetDesktopSources; see docs/dependencies.md. livekit_client needs it hosted, so it is an override.
  flutter_webrtc:
    git:
      url: https://github.com/Slim-m-org/flutter-webrtc.git
      ref: bd33c8e8b59a9d5c0c76dca0fcf2f11151f60fe3
workspace:
  - packages/api
  - packages/slimm_test_support
  - packages/design_system
  - packages/data
  - packages/platform
  - packages/rtc
  - packages/voice_canvas
  - packages/app
# Encrypted local database engine; see docs/decisions/0042-encrypt-local-database.md.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
