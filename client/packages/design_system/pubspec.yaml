name: slimm_design_system
description: slim-m design tokens, theme, and icon wrappers.
publish_to: none
resolution: workspace
environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"
dependencies:
  flutter:
    sdk: flutter
  # Lucide is the icon set of record, reached only through AppIcons.
  lucide_icons_flutter: ^3.0.0
  flutter_svg: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  slimm_test_support:
flutter:
  assets:
    - assets/brand_logos/spotify.svg
    - assets/brand_logos/discord.svg
  # Bundled because IBM Plex is rarely installed on Linux or Windows and the mono fallback is proportional.
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexMono-Medium.ttf
          weight: 500
