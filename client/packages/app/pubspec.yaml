name: slimm_app
description: slim-m client application shell.
publish_to: none
# Feeds CFBundleShortVersionString/CFBundleVersion; kept in lockstep by an extra-files marker, not a component - see CLAUDE.md.
version: 0.97.0 # x-release-please-version
resolution: workspace
environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"
dependencies:
  # Pure-Dart zip decode/encode for bulk emoji import; see
  # emoji_bulk_plan.dart and docs/dependencies.md.
  archive: ^4.2.0
  # Cross-platform including Linux (its own GStreamer plugin, not a bundled
  # native compile) and lets a caller set iOS's .ambient session category -
  # see notification_sound.dart and docs/dependencies.md.
  audioplayers: ^6.8.1
  # Ambient, so a hard-reset floor measures against a test's fake clock rather than real wall time.
  clock: ^1.1.0
  # OS drag-and-drop of files onto the composer and the emoji import card;
  # see docs/dependencies.md.
  desktop_drop: ^0.7.1
  emojis: ^3.2.0
  # Pinned exactly, not a caret. `^12.0.0` matches no version at all (a caret
  # without a prerelease excludes every prerelease), and `^12.0.0-beta.7` would
  # float onto later betas, which have broken each other three times already.
  file_picker: 12.0.0-beta.7
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  # The device's own IANA zone name for the notification schedule; see
  # docs/dependencies.md. Covers Android, iOS, macOS, Windows and Linux.
  flutter_timezone: ^5.1.0
  go_router: ^14.0.0
  # Inline video playback: the only cross-platform player covering desktop
  # Linux (`video_player` stops at Android/iOS/macOS/web). `media_kit_video`
  # renders the frame; `media_kit_libs_video` is a no-op marker on Linux
  # (that platform's libmpv is a system package, not bundled - see
  # packaging/rpm/slim-m-client.spec's own Requires) and a real bundled
  # library everywhere else. See `attachment_video_source.dart`.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  slimm_api:
  slimm_data:
  slimm_design_system:
  slimm_platform:
  slimm_rtc:
  slimm_voice_canvas:
  # Ed25519 verify for the signed update manifest; already resolved via slimm_platform.
  cryptography: ^2.9.0
  http: ^1.2.0
  # 10.x, not 9.x: file_picker 12 requires win32 6, so the whole tree moves
  # off win32 5 and the old hold on 9.x no longer resolves.
  package_info_plus: ^10.2.1
  path: ^1.9.0
  path_provider: ^2.1.0
  # The TOTP enrolment QR (decision 0048); pure Dart, no platform channel. See docs/dependencies.md.
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.0
  # Frameless/drag/resize/minimize-hide and off-screen-geometry validation;
  # see docs/decisions/0012-desktop-window-shell.md and docs/dependencies.md.
  screen_retriever: ^0.2.2
  # The tray icon and its context menu; same publisher family as window_manager.
  tray_manager: ^0.5.3
  # Already resolved transitively; direct so composer_clipboard_image_web.dart can import it.
  web: ^1.1.0
  window_manager: ^0.5.2
  app_links: ^7.2.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  gal: ^2.3.3
dev_dependencies:
  # Only ever imported from test/; production app code reaches drift through slimm_data.
  drift: ^2.20.0
  fake_async: ^1.3.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  # A checked-in copy of the repo-root `assets/audio/notifications/` (see its
  # own generate.py), not a symlink: a `../../../` pubspec path bundles
  # nothing (Flutter drops an asset path outside the package silently), and a
  # git symlink checks out as a small text file on a Windows clone without
  # `core.symlinks` set - Flutter then bundles that text file as the "sound".
  # assets/audio/test_client_bundle.py keeps this copy byte-identical to the
  # canonical source; see docs/os_backlog/windows_backlog.md.
  assets:
    - assets/audio/notifications/call_ring.wav
    - assets/audio/notifications/direct_message.wav
    - assets/audio/notifications/error.wav
    - assets/audio/notifications/group_message.wav
    - assets/audio/notifications/member_join.wav
    - assets/audio/notifications/member_leave.wav
    - assets/audio/notifications/mention.wav
    # A checked-in copy of packaging/linux/icons/, same reason as above: this
    # one was a symlink too, with the identical Windows checkout trap.
    - assets/icons/tray_icon.png
