# SPDX-License-Identifier: LicenseRef-PolyForm-Noncommercial-1.0.0
name: slimm_platform
description: "Platform-facing seams: key storage, shortcuts, and context menus."
publish_to: none
resolution: workspace
environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"
dependencies:
  slimm_api:
  cryptography: ^2.9.0
  device_info_plus: ^13.2.0
  # MPRIS for rich presence; linux only, and web never compiles it (now_playing.dart).
  dbus: ^0.7.14
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  flutter_secure_storage: ^10.3.1
  # Biometrics with passcode fallback; android, ios, macos and windows only (docs/dependencies.md).
  local_auth: ^3.0.1
  path: ^1.9.0
  path_provider: ^2.1.0
  # The browser clipboard write in clipboard_image_writer_web.dart; web only.
  web: ^1.1.0
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
# Registers CallNotificationPlugin (android/); see call_notifications.dart.
flutter:
  plugin:
    platforms:
      android:
        package: top.npcserver.slimm.platform
        pluginClass: CallNotificationPlugin
