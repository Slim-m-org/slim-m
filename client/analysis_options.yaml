# Analyzer options for every package in this workspace.
#
# Options resolve by nearest enclosing directory, so one file here covers all
# seven packages. A package that needs extra rules adds its own file that starts
# with `include: ../../analysis_options.yaml`.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - unawaited_futures
