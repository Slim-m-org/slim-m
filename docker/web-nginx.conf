# Serves the slim-m web bundle. Served at / and also at /app/, because the
# live host's Traefik strips /app but a plain `docker run` does not.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        rewrite ^/app/(.*)$ /$1 last;
    }

    # The entry points and the build id must always revalidate: they are what tells a browser which bundle is current.
    location ~ ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/web-security-headers.conf;
    }

    location = / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/web-security-headers.conf;
    }

    # Reached only through the ?v=<sha> that flutter_bootstrap.js carries, so a new build is a new URL.
    location = /main.dart.js {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/web-security-headers.conf;
    }

    # Everything else has no version in its URL (canvaskit included, its path is the same across engines), so it revalidates on ETag.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/web-security-headers.conf;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
}
