# Included from every location in web-nginx.conf, because a location that sets any add_header drops the server-level ones.
#
# script-src stays 'self' plus wasm-unsafe-eval (CanvasKit compiles wasm); nothing here allows inline or eval'd script.
# style-src needs 'unsafe-inline' because Flutter writes style attributes at runtime.
# connect-src is scheme-wide https/wss because the client talks to whichever server the member signs in to, plus loopback for a local server.
# frame-src is the YouTube inline player only (youtube_inline_player_web.dart).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: data: https: wss: http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
